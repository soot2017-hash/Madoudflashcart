<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6b5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<title>فلش‌کارت لغات انگلیسی</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--ac:#1d6b5a;--acx:#fff;--bd:#dcdad2;--bad:#b3402f;--sf:#ece9df;--ok:#2f9e6e}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#232321;--tx:#eeede8;--mut:#9a988f;--ac:#4fb59d;--acx:#10231e;--bd:#3a3a36;--bad:#e07a68;--sf:#2c2c29;--ok:#4fb59d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.7;font-size:16px;padding:env(safe-area-inset-top,0px) 0 220px}
main{max-width:600px;margin:0 auto;padding:12px 14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:1.1rem;margin:0;flex:1}
h3{margin:0 0 8px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
input,textarea,select{width:100%;min-height:50px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
select{padding:0 10px}
.en{direction:ltr;text-align:left}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
.btn{min-height:50px;padding:8px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn.d{color:var(--bad)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row>*{flex:1}
.ib{width:46px;height:46px;border:0;background:var(--sf);border-radius:12px;font-size:1.1rem;cursor:pointer;color:var(--tx);flex:none}
.hint{font-size:.82rem;color:var(--mut);margin-top:8px}
.mut{color:var(--mut);font-size:.85rem}
.ipa{direction:ltr;color:var(--mut);min-height:1.2em}
.w{font-size:2rem;font-weight:800;direction:ltr;text-align:center;word-break:break-word}
.warn{background:color-mix(in srgb,#d98a1f 16%,var(--card));border:1px solid #d98a1f;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:.9rem}
.fc{min-height:240px;display:flex;flex-direction:column;align-items:center;padding:20px;cursor:pointer;text-align:center}
.fc.top{justify-content:flex-start;align-items:stretch;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{padding:2px 12px;border-radius:14px;font-size:.85rem;border:1px solid;background:var(--card)}
.pg{margin-top:14px;text-align:right;border:1px solid var(--bd);border-right:5px solid var(--c);border-radius:14px;padding:8px 12px;background:color-mix(in srgb,var(--c) 7%,var(--card))}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ph b{color:var(--c);font-size:1.05rem}
.cnt{margin-inline-start:auto;font-size:.75rem;color:var(--mut)}
.ps{font-size:.9rem;color:var(--mut);border-bottom:1px dashed var(--bd);padding-bottom:6px;margin-bottom:4px}
.sn{display:flex;gap:10px;padding:6px 0;align-items:flex-start;direction:ltr}
.sn input{width:26px;min-height:26px;flex:none;margin-top:3px;accent-color:var(--ac)}
.nm{min-width:24px;height:24px;border-radius:50%;background:var(--sf);font-size:.8rem;display:flex;align-items:center;justify-content:center;flex:none;margin-top:3px}
.sb{flex:1;direction:ltr;text-align:left}
.df{font-size:1.05rem}
.ex{color:var(--mut);font-style:italic}
.fa{direction:rtl;text-align:right;color:var(--ok);font-size:.95rem;margin-top:4px;padding:4px 8px;border-right:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card));border-radius:6px}
.sa{font-size:.9rem;margin-top:2px}
.s1 b{color:var(--ok)}.s2 b{color:var(--bad)}
.day{padding:0;overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:center;min-height:64px;padding:12px 14px;cursor:pointer}
.dh b{font-size:1.05rem}
.dw{padding:0 12px 12px}
.wi{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:52px;padding:8px 12px;margin-top:6px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer;text-align:right}
.wi b{direction:ltr}
.it{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it .t{flex:1;min-height:52px;cursor:pointer;padding:4px 0}
.it b{direction:ltr;display:block}
.it small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#act{max-width:600px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}
#act:empty{display:none}
#act .btn{flex:1;min-height:52px}
#act .rates{display:flex;gap:4px;width:100%}
#act .rates .btn{flex:1;padding:6px 4px;font-size:.85rem;min-height:46px;color:#fff;border:none}
#nav{max-width:600px;margin:0 auto;display:flex;gap:4px}
#nav button{flex:1;min-height:54px;border:0;background:none;color:var(--mut);font:inherit;font-size:.76rem;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
#nav button span{font-size:1.25rem;line-height:1.2}
#nav button.on{color:var(--ac);background:var(--sf);font-weight:700}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:600px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(190px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:20;font-size:.9rem;max-width:92vw;text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.btn:active,.ib:active{transform:scale(.97)}}
.pr{font-size:.92rem;margin-top:3px;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--ac) 10%,var(--card))}
.pb{color:var(--ac);font-weight:800}
.fm{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--bd)}
.fm .btn{min-height:40px;padding:2px 12px}
.hero{background:linear-gradient(135deg,#1d6b5a,#2f9e6e);color:#fff;border:none;border-radius:18px;padding:18px;margin-bottom:12px;text-align:center}
.hero .big{font-size:2.2rem;font-weight:800;margin:4px 0}
.hero .btn{margin-top:12px;background:#fff;color:#1d6b5a;border:none;width:100%;font-weight:700}
.hero.empty{background:linear-gradient(135deg,#8a8a80,#6b6a64)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0;margin-bottom:10px}
.tabs button{padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap;flex:none}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.hide-fa .fa{display:none!important}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;background:var(--sf);font-size:.8rem;color:var(--mut);margin-right:6px}
.gchip{display:inline-block;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac);font-weight:700;font-size:.78rem;border-radius:8px;padding:1px 8px;margin-inline-end:4px;vertical-align:middle}
.exwrap{margin-top:4px}
.exbtn{background:none;border:0;padding:2px 6px;color:var(--mut);font:inherit;font-size:.8rem;cursor:pointer;border-bottom:1px dashed var(--bd)}
.exwrap.show .exbtn{color:var(--ac)}
.exhide{display:none}
.exwrap.show .ex{display:block}
</style>
</head>
<body>
<main>
 <div class="top"><h1>📚 فلش‌کارت لغات</h1><span class="badge" id="olchip" hidden>📴 آفلاین</span><button class="ib" id="mn" aria-label="منو">⋮</button></div>
 <div id="view"></div>
</main>
<div id="dock">
 <div id="act"></div>
 <nav id="nav">
  <button data-t="study"><span>🎴</span>مرور</button>
  <button data-t="add"><span>➕</span>افزودن</button>
  <button data-t="spell"><span>✍️</span>املا</button>
  <button data-t="list"><span>🗂️</span>کارت‌ها</button>
 </nav>
</div>
<div id="sh" class="shade" hidden></div>
<div id="toast" hidden></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   CONSTANTS & VARIABLES
   ═══════════════════════════════════════════════════════════════ */
const KEY='fc_cards_v2';
const KEY_OLD='fc_cards_v1';
const APP_URL=location.origin+location.pathname;
const DAY=86400000;
const POS=[
 ['noun','اسم','#3b82c4'],['verb','فعل','#2f9e6e'],['adjective','صفت','#d98a1f'],
 ['adverb','قید','#8b5cc4'],['phrasal verb','فعل عبارتی','#c4478b'],
 ['phrase','عبارت','#3a9aa8'],['idiom','اصطلاح','#b0623a'],
 ['preposition','حرف اضافه','#6b7a8f'],['conjunction','حرف ربط','#7a8a3a'],
 ['pronoun','ضمیر','#a0522d'],['determiner','حرف تعریف','#5f7a95'],
 ['exclamation','ندا','#d0443f'],['other','سایر','#888888']
];
const POSMAP={adj:'adjective',adv:'adverb',n:'noun',v:'verb',interjection:'exclamation'};
const npos=p=>{p=String(p||'').toLowerCase().trim();p=POSMAP[p]||p;return POS.some(x=>x[0]===p)?p:'other'};
const pinfo=p=>POS.find(x=>x[0]===p)||POS[POS.length-1];
const fa=p=>pinfo(p)[1];
const pcol=p=>pinfo(p)[2];

const PROV=[
 {id:'gq',name:'Groq',       url:'https://api.groq.com/openai/v1/chat/completions', model:'llama-3.3-70b-versatile'},
 {id:'gm',name:'Gemini',     url:'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions', model:'gemini-2.0-flash'},
 {id:'or',name:'OpenRouter', url:'https://openrouter.ai/api/v1/chat/completions', model:'meta-llama/llama-3.3-70b-instruct:free'},
 {id:'mi',name:'Mistral',    url:'https://api.mistral.ai/v1/chat/completions', model:'mistral-small-latest'},
 {id:'ds',name:'DeepSeek',   url:'https://api.deepseek.com/chat/completions', model:'deepseek-chat'},
 {id:'cl',name:'Claude',     url:'https://api.anthropic.com/v1/messages', model:'claude-3-5-haiku-20241022',anthropic:true}
];
const keyGet=id=>{try{return localStorage.getItem('fc_k_'+id)||''}catch(e){return ''}};
const keySet=(id,k)=>{try{localStorage.setItem('fc_k_'+id,k)}catch(e){}};

const norm=w=>String(w||'').trim().replace(/\s+/g,' ');
const arr=a=>Array.isArray(a)?a.slice(0,5).map(x=>String(x).trim()).filter(Boolean):[];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const uid=()=>'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const normFam=a=>(Array.isArray(a)?a:[]).map(f=>typeof f==='string'?{w:f.trim(),pos:''}:{w:String((f&&f.w)||'').trim(),pos:String((f&&f.pos)||'').trim()}).filter(f=>f.w&&f.w.length<40).slice(0,8);
const famStr=a=>(a||[]).map(f=>f.w+(f.pos?' ('+f.pos+')':'')).join(', ');
const parseFam=t=>normFam(String(t||'').split(/[,،;]+/).map(x=>{const m=x.trim().match(/^(.+?)\s*\((.+?)\)$/);return m?{w:m[1].trim(),pos:m[2].trim()}:{w:x.trim(),pos:''}}).filter(f=>f.w));
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const dfa=t=>{try{return new Date(t).toLocaleDateString('fa-IR',{weekday:'long',month:'long',day:'numeric'})}catch(e){return ''}};
const O1=['','یکم','دوم','سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم','سیزدهم','چهاردهم','پانزدهم','شانزدهم','هفدهم','هجدهم','نوزدهم'];
const ord=n=>n<20?O1[n]:n===20?'بیستم':n<30?'بیست و '+O1[n-20]:n===30?'سی‌ام':'سی و '+O1[n-30];
const dayName=n=>'روز '+(n>39?n:ord(n));
const today0=()=>dayStart(Date.now());
const isDue=c=>(c.due||0)<=today0()+DAY;

let cards=[];
let tb='study', day=null, idx=0, flip=false, startAt=0;
let openD=new Set(), showFa=false;
let smode='days', sessKey=null, sessIds=[], sessRated={};
let sp=null;
let dr=null;
let wv='',sugg=[],sw='',sipa='',sfam=[];
let listTab='all';
let toastT;

function toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||2200)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cards))}catch(e){}}
const findCard=(w,exId)=>cards.find(x=>x.id!==exId&&x.w.toLowerCase()===norm(w).toLowerCase());

function normSenses(list){
 return (list||[]).map(s=>({
   pos:npos(s.pos), d:norm(s.d), e:norm(s.e), p:norm(s.p), g:norm(s.g),
   syn:arr(s.syn), ant:arr(s.ant), prep:arr(s.prep)
 })).filter(s=>s.d);
}
function blankCard(w){
 return { id:uid(), w:norm(w), t:Date.now(), ipa:'', reps:0, interval:1, ease:2.5, due:today0(), last:null, fam:[], senses:[] };
}

function addSenses(w,list,ipa,fam,sm2){
 let c=findCard(w),n=0;
 if(!c){c=blankCard(w);if(sm2){c.reps=sm2.reps||0;c.interval=sm2.interval||1;c.ease=sm2.ease||2.5;c.due=sm2.due||today0();c.last=sm2.last||null}cards.push(c)}
 if(ipa&&!c.ipa)c.ipa=norm(ipa);
 if(fam&&fam.length&&!(c.fam||[]).length)c.fam=normFam(fam).filter(f=>f.w.toLowerCase()!==c.w.toLowerCase());
 normSenses(list).forEach(s=>{if(!c.senses.some(x=>x.d===s.d)){c.senses.push(s);n++}});
 if(!c.senses.length)cards=cards.filter(x=>x!==c);
 save();return n;
}

function applySM2(c,q){
 if(q<3){ c.reps=0; c.interval=1; } 
 else {
   if(c.reps===0) c.interval=1;
   else if(c.reps===1) c.interval=6;
   else c.interval=Math.round(c.interval*c.ease);
   c.reps+=1;
 }
 c.ease=Math.max(1.3, c.ease + (0.1-(5-q)*(0.08+(5-q)*0.02)));
 c.last=Date.now();
 c.due=today0() + c.interval*DAY;
 save();
}

function load(){
 let raw=null;
 try{raw=localStorage.getItem(KEY)||localStorage.getItem(KEY_OLD)}catch(e){}
 if(!raw&&window.__SEED)raw=JSON.stringify(window.__SEED);
 let o=[];try{o=JSON.parse(raw||'[]')}catch(e){}
 o.forEach(c=>{
  if(!c||!c.w)return;
  const list=c.senses||[{pos:c.pos,d:c.d,e:c.e,p:c.p}];
  let t=+c.t||parseInt(String(c.id||'').slice(1,9),36)||Date.now();
  if(t>Date.now()+DAY)t=Date.now();
  const reps=+c.reps ?? (+c.n||0);
  const card={
    id:c.id||uid(), w:norm(c.w), t, ipa:c.ipa||'',
    reps: reps||0, interval: +c.interval||1, ease: +c.ease||2.5, due: +c.due||today0(), last: c.last||null,
    fam:normFam(c.fam), senses:normSenses(list)
  };
  const ex=cards.find(x=>x.w.toLowerCase()===card.w.toLowerCase());
  if(ex){
    card.senses.forEach(s=>{if(!ex.senses.some(y=>y.d===s.d))ex.senses.push(s)});
    ex.t=Math.min(ex.t,t);
    ex.reps=Math.max(ex.reps,card.reps);
    ex.due=Math.min(ex.due,card.due);
    if(!(ex.fam||[]).length)ex.fam=card.fam;
    if(!ex.ipa)ex.ipa=card.ipa;
  } else cards.push(card);
 });
 if(!raw)save();
}

const group=ss=>{const m={};ss.forEach((s,i)=>{const p=npos(s.pos);(m[p]=m[p]||[]).push({s,i})});return POS.map(x=>x[0]).filter(p=>m[p]).map(p=>[p,m[p]])};
const sumP=a=>a.map(x=>x.s.p).filter(Boolean).join('، ');
const summ=c=>c.senses.length+' معنی · '+group(c.senses).map(g=>fa(g[0])).join('، ');
const hasFa=c=>(c.senses||[]).some(s=>s.p&&s.p.trim());
const tagRow=(cls,label,a)=>a&&a.length?'<div class="sa '+cls+'" dir="rtl"><b>'+label+':</b> <span dir="ltr">'+esc(a.join(', '))+'</span></div>':'';
const PREPW=new Set('in on at of for to with about from by into onto over under up down out off away back through along around across against between among after before during without within upon toward towards beyond behind beside near past per via despite except inside outside above below beneath underneath throughout till until since'.split(' '));
const boldPrep=t=>esc(t).split(' ').map(w=>PREPW.has(w.toLowerCase().replace(/[^a-z]/g,''))?'<b class="pb">'+w+'</b>':w).join(' ');
const prepRow=a=>a&&a.length?'<div class="pr" dir="rtl"><b>حرف اضافه:</b> <span dir="ltr">'+a.map(boldPrep).join(' · ')+'</span></div>':'';

function gh(ss,chk){
 return group(ss).map(([p,a])=>'<div class="pg" style="--c:'+pcol(p)+'"><div class="ph"><b>'+fa(p)+'</b><span class="cnt">'+p+' · '+a.length+' معنی</span></div>'+(sumP(a)?'<div class="ps">'+esc(sumP(a))+'</div>':'')+
  a.map(({s,i},k)=>{
   const body='<div class="sb"><div class="df">'+(s.g?'<span class="gchip" dir="ltr">'+esc(s.g)+'</span> ':'')+esc(s.d)+'</div>'+(s.e?'<div class="exwrap"><button class="exbtn" type="button">💬 مثال ▸</button><div class="ex exhide">'+esc(s.e)+'</div></div>':'')+(s.p?'<div class="fa">'+esc(s.p)+'</div>':'')+prepRow(s.prep)+tagRow('s1','هم‌معنی',s.syn)+tagRow('s2','متضاد',s.ant)+'</div>';
   return chk?'<label class="sn"><input type="checkbox" data-i="'+i+'"'+(s.on?' checked':'')+'><span class="nm">'+(k+1)+'</span>'+body+'</label>':'<div class="sn"><span class="nm">'+(k+1)+'</span>'+body+'</div>';
  }).join('')+'</div>').join('');
}
function days(){
 if(!cards.length)return [];
 const base=Math.min(...cards.map(c=>dayStart(c.t))),m={};
 cards.forEach(c=>{const n=Math.round((dayStart(c.t)-base)/DAY)+1;(m[n]=m[n]||[]).push(c)});
 return Object.keys(m).map(Number).sort((a,b)=>a-b).map(n=>{const cs=m[n].sort((a,b)=>a.t-b.t);return{n,cs,ts:dayStart(cs[0].t)}});
}

function speak(w){
 if(!('speechSynthesis' in window))return toast('صدا پشتیبانی نمی‌شود');
 try{const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}

const PROMPT=w=>'Give the meanings of the English word or phrase "'+w+'" in the style of a learner dictionary such as the Longman Dictionary of Contemporary English. Write every definition and example yourself in simple English; do not copy any dictionary text. Return ONLY a JSON object: {"ipa":"IPA pronunciation of the whole input","family":[{"w":"another word from the same word family","pos":"its part of speech"}],"senses":[{"pos":"one of: noun, verb, adjective, adverb, phrasal verb, phrase, idiom, preposition, conjunction, pronoun, determiner, exclamation","d":"definition","e":"one example sentence","syn":["up to 4 synonyms"],"ant":["up to 3 antonyms, or empty array"],"prep":["patterns showing the preposition that must follow this word, e.g. depend on sb/sth, interested in doing sth; empty array if none"]}]}. Give up to 12 senses across all parts of speech. In family give up to 6 other members of the word family (for example decide, decision, decisive, decisively), or an empty array. No markdown.';
const PASTEQ=(w,t)=>'The user copied these entries from a learner dictionary for personal study, for the word "'+w+'". Convert them into a JSON object {"ipa":"pronunciation if present in the text, else empty string","senses":[{"pos":"one of: noun, verb, adjective, adverb, phrasal verb, phrase, idiom, preposition, conjunction, pronoun, determiner, exclamation","d":"the definition, close to the text","e":"one example from the text, or empty string","syn":[],"ant":[],"prep":["dependent preposition patterns if shown in the text, e.g. depend on sth; otherwise empty array"]}]}. Use only information present in the text; do not add meanings. Return ONLY the JSON object, no markdown.\n\nTEXT:\n'+t;
function pj(t){
 t=String(t||'').replace(/```[a-z]*\n?|```/gi,'');
 const cands=[t.indexOf('{'),t.indexOf('[')].filter(x=>x>=0);
 if(!cands.length)throw 0;
 const i=Math.min(...cands);const k=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
 if(k<i)throw 0;
 return JSON.parse(t.slice(i,k+1));
}

const POSES='noun|verb|adjective|adverb|phrasal verb|phrase|idiom|preposition|conjunction|pronoun|determiner|exclamation';
function parseLmText(t,w){
 t=String(t||'');const cut=t.search(/\bword of the day\b/i);if(cut>0)t=t.slice(0,cut);if(!t.trim())return {ipa:'',list:[]};
 const ipaM=t.match(/\/[^/\n]{1,60}\//);
 const lines=t.split(/\n/).map(x=>x.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const list=[];let pos='';
 const tailRx=w?new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*(of|for|to|with|away|on|from|in|about|between|upon|doing|sb|sth|that|whether|up|down|out|off|over|against|into|through)?\\s*$','i'):null;
 lines.forEach(L=>{
  if(/iaw\.|cmd\.push|googletag|window\.|function|THESAURUS|thesaurus/.test(L))return;
  L=L.replace(/^[\u2192\u25ba]/,'');
  if(/^(From Longman|Related topics|Word family|Explore|More results|Quizzes|Vocabulary|Topics|advertisement|Picture|Contents|Synonyms|see thesaurus|View thesaurus|collocations|Exercises|Advertisements|Copyright|About|Browse|Grammar|Click on the pictures|Verb table)/i.test(L))return;
  const pm=L.match(new RegExp('('+POSES+')\\s*$','i'));
  if(pm&&(L.length<60||L.includes('/')))pos=pm[1].toLowerCase();
  if(L.includes('\u25cf')||L.length<4)return;
  if(/[\u2192\u25ba]/.test(L))return;
  const num=L.match(/^(\d{1,2})\s*([[.,)\]]?)\s*(.*)$/);
  let work=(num&&num[3])?num[3]:L;
  if(tailRx&&tailRx.test(work)&&work.length<34&&work.toLowerCase().slice(0,w.length).toLowerCase()===w.toLowerCase()){
   const last=list[list.length-1];const tp=work.toLowerCase();
   if(last&&!last.prep.includes(tp))last.prep.push(tp.charAt(0).toUpperCase()+tp.slice(1));
   return;
  }
  if(/\.$/.test(work)&&work.length>25){
   let e=(tailRx?work.replace(tailRx,''):work).replace(/[.;]+$/,'').trim();
   e=e.split(/Grammar |Click on the pictures|Verb table/)[0].trim();
   const last=list[list.length-1];
   if(last){if(!last.e)last.e=e;else if(e.length>last.e.length&&e.length>40)last.e=e}
   return;
  }
  if(/Grammar|Click on the pictures|Verb table/.test(work))return;
  let d=(tailRx?work.replace(tailRx,''):work).replace(/[[\]()]/g,' ').replace(/\b[A-Z]{2,}\b/g,' ').replace(/\u25cf/g,' ').replace(/\d+/g,' ').replace(/\s+/g,' ').trim().replace(/^[^a-zA-Z]+/,'');
  let g=/(countable|uncountable|singular|plural|usually passive|no passive|not usually before noun|transitive|intransitive|spoken|written|intransitive|especially)[,\s]*/i;
  d=d.replace(g,'').replace(g,'').trim();
  if(d.length>220||/Grammar|Click on the pictures/.test(d))return;
  if(pos&&d.length>18&&/\s/.test(d)&&/^[a-z]/.test(d))list.push({pos,d,e:'',syn:[],ant:[],prep:[]});
 });
 const seen=new Set();
 return {ipa:ipaM?ipaM[0]:'',list:list.filter(s=>!seen.has(s.d)&&seen.add(s.d))};
}

const SPTOP=['animals','food','travel','school','weather','health','sports','music','nature','technology','family','work','city','house','shopping'];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const blankWord=(txt,w)=>String(txt||'').replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),'____');
function meaningOf(c){const s0=(c.senses||[])[0];if(s0&&s0.d)return '('+(s0.pos||'')+') '+blankWord(s0.d,c.w);const p=c.senses.map(x=>x.p).filter(Boolean)[0];return p||''}
async function onlineWords(n){
 try{
  let j=null;
  for(const t of shuffle(SPTOP).slice(0,6)){
   try{j=await fetchJSON('https://api.datamuse.com/words?topics='+t+'&max=80');if(j&&j.length)break}catch(e){}
  }
  if(!j)return [];
  const pool=shuffle(j.map(x=>x.word).filter(x=>/^[a-z]{4,10}$/.test(x))).slice(0,n+6);
  const got=await Promise.all(pool.map(async w=>{
   try{
    const ee=await fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+w);
    const e=(Array.isArray(ee)?ee[0]:null)||{};
    const ip=e.phonetic||((e.phonetics||[]).find(x=>x.text)||{}).text||'';
    const defs=((e.meanings||[])[0]||{}).definitions;
    const m=defs&&defs[0]?defs[0].definition:'';
    if(!m)return null;
    return {w,ipa:ip,meaning:blankWord(m,w)};
   }catch(x){return null}
  }));
  return got.filter(Boolean).slice(0,n);
 }catch(e){return []}
}
async function startSpell(mode){
 let items=[];
 if(mode==='online'){
  toast('در حال گرفتن کلمه…',2500);
  items=await onlineWords(8);
  if(!items.length)return toast('کلمه‌ای در دسترس نیست؛ اتصال را بررسی کنید یا حالت «کلمات ذخیره‌شده» را امتحان کنید',4000);
 }else{
  if(!cards.length)return toast('اول چند لغت ذخیره کنید');
  items=shuffle(cards).slice(0,10).map(c=>({w:c.w,ipa:c.ipa||'',meaning:meaningOf(c)}));
 }
 sp={mode,items,i:0,ok:0,tot:0,r:null,h:0};
 spell();
 if(mode!=='meaning')speak(items[0].w);
}

 }
 const it=sp.items[sp.i],r=sp.r,len=it.w.length;

 const speakBtn='<button class="ib" id="pl" style="width:84px;height:84px;border-radius:50%;font-size:2rem;margin:0 auto" aria-label="تلفظ">🔊</button>';
 let q;

 else if(sp.mode==='meaning')q='<div class="mut">معنی را بخوانید و کلمه را بنویسید</div><div dir="auto" style="font-size:1.15rem;margin:10px 0">'+esc(it.meaning)+'</div><div class="mut">'+len+' حرف'+hintTxt+'</div>';
 else q=speakBtn+'<div dir="auto" style="margin:10px 0">'+esc(it.meaning)+'</div><div class="mut">'+len+' حرف'+hintTxt+'</div>';
 v.innerHTML='<div class="row" style="margin:0 0 6px;align-items:center"><button class="btn" id="ex" style="flex:none;min-height:40px">✕ خروج</button><span class="mut" style="flex:1;text-align:center">'+(sp.i+1)+' / '+sp.items.length+'</span></div>'+
 '<div class="box" style="text-align:center">'+q+'<input id="ans" class="en" style="margin-top:12px;text-align:center;font-size:1.3rem" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"'+(r?' disabled value="'+esc(r.a)+'"':'')+'>'+
 (r?'<div style="margin-top:12px;font-weight:700;color:'+(r.ok?'var(--ok)':'var(--bad)')+'">'+(r.ok?'✓ درست':'✗ نادرست')+'</div><div class="w" style="font-size:1.6rem">'+esc(it.w)+'</div>'+(it.ipa?'<div class="ipa">'+esc(it.ipa)+'</div>':'')+'<button class="btn" id="pl2" style="margin-top:8px">🔊 تلفظ</button>':'')+'</div>';
 $('#ex').onclick=()=>{sp=null;spell()};
 if($('#pl'))$('#pl').onclick=()=>speak(it.w);
 if($('#pl2'))$('#pl2').onclick=()=>speak(it.w);
 if(r){
  A.innerHTML='<button class="btn p" id="nx2">'+(sp.i<sp.items.length-1?'بعدی ←':'پایان')+'</button>';
  $('#nx2').onclick=()=>{sp.i++;sp.r=null;sp.h=0;spell();if(sp.i<sp.items.length&&sp.mode!=='meaning')speak(sp.items[sp.i].w);scrollTo(0,0)};
 }else{

  $('#ck').onclick=ck;$('#ans').onkeydown=e=>{if(e.key==='Enter')ck()};
  $('#hn').onclick=()=>{const t=$('#ans').value;sp.h=1;spell();$('#ans').value=t;$('#ans').focus()};
  $('#ans').focus();
 }
}

function csvRows(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}

function backupJSON(){
 return JSON.stringify(cards.map(c=>({
  w:c.w, ipa:c.ipa, fam:c.fam||[], senses:c.senses,
  reps:c.reps||0, interval:c.interval||1, ease:c.ease||2.5, due:c.due, last:c.last
 })));
}

function importText(t){
 let n=0;
 if(t[0]==='['||t[0]==='{'){
  const a=JSON.parse(t);
  (Array.isArray(a)?a:[a]).forEach(c=>{
   if(!c||!c.w)return;
   const sm2={reps:c.reps||0, interval:c.interval||1, ease:c.ease||2.5, due:c.due, last:c.last};
   n+=addSenses(String(c.w),Array.isArray(c.senses)?c.senses:[c],c.ipa,c.fam,sm2);
  });
  return n;
 }
 let rows=csvRows(t);
 if(rows[0]&&/^word$/i.test((rows[0][0]||'').trim()))rows=rows.slice(1);
 const g={},order=[];
 rows.forEach(r=>{
  const w=(r[0]||'').trim();if(!w)return;
  if(!g[w]){g[w]=[];order.push(w)}
  g[w].push({pos:(r[1]||'').trim(),d:(r[2]||'').trim(),e:(r[3]||'').trim(),p:(r[4]||'').trim(),
   syn:(r[5]||'').split(';').map(x=>x.trim()).filter(Boolean),
   ant:(r[6]||'').split(';').map(x=>x.trim()).filter(Boolean),
   prep:(r[7]||'').split(';').map(x=>x.trim()).filter(Boolean)});
 });
 order.forEach(w=>{n+=addSenses(w,g[w])});
 return n;
}

function importSheet(){
 sheet('<h3>وارد کردن کارت‌ها</h3><textarea id="io" class="en" placeholder="متن CSV یا JSON را بچسبانید"></textarea><div class="row"><button class="btn" id="cl">انصراف</button><button class="btn p" id="go">وارد کن</button></div><div id="im" class="hint"></div>');

  catch(e){$('#im').textContent='فرمت معتبر نیست';}
 };
}

 $('#lq').oninput=e=>{const q=e.target.value.trim().toLowerCase();v.querySelectorAll('.it').forEach(x=>x.hidden=!!q&&!x.dataset.q.includes(q))};

  }).join('')+

  PROV.forEach(p=>keySet(p.id,$('#k_'+p.id).value.trim()));
  const box=$('#ktst');box.innerHTML='در حال تست…';
  const results=[];
  for(const p of PROV){
   const k=keyGet(p.id);
   if(!k){results.push('<div style="color:var(--mut)">'+p.name+': کلید خالی</div>');continue}
   try{
    const txt=await askAI(p,k,'Reply with exactly: OK');
    results.push('<div style="color:var(--ok)">✓ '+p.name+'</div>');
   }catch(e){
    results.push('<div style="color:var(--bad)">✗ '+p.name+': '+esc(String(e.message||e).slice(0,120))+'</div>');
   }
  }
  box.innerHTML=results.join('');
 };
}
