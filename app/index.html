wer is correct.","p":"هیچ‌کدام از پاسخ‌ها درست نیست."}]},{"h":"Structure with 'both...and' and 'neither...nor'","b":"You can connect two items using 'both...and' to show they are included. For negative meaning, use 'neither...nor' to connect two negative items. These structures help you be more precise in your sentences.","hf":"ساختار با 'both...and' و 'neither...nor'","bf":"می‌توانید دو مورد را با 'both...and' به هم متصل کنید تا نشان دهید هر دو شامل می‌شوند. برای معنای منفی، از 'neither...nor' برای اتصال دو گزینه استفاده کنید. این ساختارها به شما کمک می‌کنند تا در جملات خود دقیق‌تر باشید.","ex":[{"e":"She is both smart and hardworking.","p":"او هم باهوش است و هم سخت‌کوش."},{"e":"Neither tea nor coffee is available.","p":"نه چای و نه قهوه در دسترس است."}]}],"tip":"Remember that 'both' takes a plural verb, while 'either' and 'neither' take a singular verb when referring to two items.","tipf":"به یاد داشته باشید که 'both' با فعل جمع می‌آید، در حالی که 'either' و 'neither' معمولاً وقتی به دو مورد اشاره می‌کنند، با فعل مفرد می‌آیند.","bad":[{"b":"Both of my friends is coming.","g":"Both of my friends are coming.","w":"'Both' refers to two people, so it needs a plural verb 'are', not 'is'.","wf":"کلمه 'both' به دو نفر اشاره دارد، بنابراین به فعل جمع 'are' نیاز دارد، نه 'is'."},{"b":"I don't like neither option.","g":"I don't like either option.","w":"Using 'neither' with 'don't' creates a double negative. Use 'either' with a negative verb or 'neither' without a negative verb.","wf":"استفاده از 'neither' با 'don't' یک منفی مضاعف ایجاد می‌کند. با فعل منفی از 'either' استفاده کنید یا 'neither' را با فعل مثبت به کار ببرید."},{"b":"Either of the cars are red.","g":"Either of the cars is red.","w":"When 'either' is followed by 'of', it takes a singular verb because it refers to one individual item out of the two.","wf":"وقتی بعد از 'either' حرف اضافه 'of' می‌آید، فعل به صورت مفرد می‌آید زیرا به یکی از آن دو مورد اشاره دارد."}],"gold":[{"e":"Both...and connects two items positively.","f":"ساختار 'both...and' دو مورد را به صورت مثبت به هم وصل می‌کند."},{"e":"Neither...nor connects two items with a negative meaning.","f":"ساختار 'neither...nor' دو مورد را با معنای منفی به هم وصل می‌کند."},{"e":"Either means one or the other of two options.","f":"کلمه 'either' به معنای یکی از دو گزینه است."}]}],"ex":[{"t":"gap","q":"___ students in my class are from Iran.","key":["All"],"why":"'All' is used with plural nouns to refer to the whole group."},{"t":"gap","q":"___ of my parents works at the hospital.","key":["Each"],"why":"'Each' emphasizes individual members of a group of two or more."},{"t":"fix","q":"Both of the books are interesting.","key":["Both of the books are interesting."],"why":"The sentence is already correct; 'both' takes a plural verb."},{"t":"gap","q":"You can take ___ the red car or the blue one.","key":["either"],"why":"'Either' means one or the other of two options."},{"t":"fa","q":"هر دو دوستم آمدند.","key":["Both of my friends came."],"why":"'Both' refers to two people together."},{"t":"gap","q":"___ the children likes chocolate.","key":["Each"],"why":"'Each' is followed by a singular verb when referring to individuals."},{"t":"fix","q":"Neither of the answers is correct.","key":["Neither of the answers is correct."],"why":"The sentence is correct; 'neither' takes a singular verb."},{"t":"gap","q":"I don't like ___ of these shirts.","key":["either"],"why":"'Either' is used in negative contexts to mean 'not one or the other'."},{"t":"gap","q":"___ day I feel tired.","key":["Every"],"why":"'Every' is used with singular nouns to mean all days in a group."},{"t":"fa","q":"نه او و نه من نمی‌توانیم بیایم.","key":["Neither he nor I can come."],"why":"'Neither...nor' connects two negative subjects."}]},{"id":"t14","t":"Comparatives and Superlatives","tf":"صفت تفضیلی و عالی","parts":[{"lv":"B","title":"Comparatives and Superlatives","exp":[{"h":"Short Adjectives (-er and -est)","b":"For short adjectives with one syllable, you add -er to compare two things and use the word than. To show the superlative, meaning the highest degree, you use the word the followed by the suffix -est.","hf":"صفت‌های تک‌بخشی و مقایسه (-er و -est)","bf":"برای صفت‌های کوتاه (یک‌بخشی)، برای مقایسه دو چیز پسوند -er و کلمه than را اضافه می‌کنیم. برای صفت عالی (بیشترین)، از the و پسوند -est استفاده می‌کنیم.","ex":[{"e":"Tehran is bigger than Isfahan.","p":"تهران از اصفهان بزرگ‌تر است."},{"e":"This is the oldest building in the city.","p":"این قدیمی‌ترین ساختمان در شهر است."}]},{"h":"Long Adjectives (more and most)","b":"For longer adjectives with two or more syllables, you do not add suffixes. Instead, you use the word more for comparisons and the word most for the superlative form.","hf":"صفت‌های چندبخشی (more و most)","bf":"برای صفت‌های طولانی‌تر (دو بخش یا بیشتر)، به جای پسوند از کلمات more برای مقایسه و most برای صفت عالی استفاده می‌کنیم.","ex":[{"e":"English is more difficult than Persian.","p":"انگلیسی از فارسی دشوارتر است."},{"e":"This is the most expensive car.","p":"این گران‌ترین ماشین است."}]},{"h":"Equality and Similarity (as...as)","b":"When two things are equal, you use the structure as followed by the adjective and then as. If you want to show that they are not equal, you use not as...as to indicate the difference.","hf":"برابری و تشابه (as...as)","bf":"وقتی دو چیز با هم برابر هستند، از ساختار as + صفت + as استفاده می‌کنیم. در حالت منفی از not as...as برای نشان دادن عدم برابری استفاده می‌شود.","ex":[{"e":"Ali is as tall as Reza.","p":"علی هم‌قد رضا است."},{"e":"My car is not as fast as yours.","p":"ماشین من به سرعت ماشین تو نیست."}]}],"tip":"Remember that short adjectives take suffixes like -er, while long adjectives use the word more, and you should never use both together for the same adjective.","tipf":"یادتان باشد که صفت‌های کوتاهer می‌گیرند اما برای صفت‌های طولانی از more استفاده می‌کنیم و هرگز هر دو را با هم به کار نبرید.","bad":[{"b":"She is more taller than me.","g":"She is taller than me.","w":"You should not use both the word more and the suffix -er together for short adjectives.","wf":"برای صفت‌های کوتاه نباید هم‌زمان از more و پسوند -er استفاده کنید."},{"b":"This book is good than that one.","g":"This book is better than that one.","w":"The adjective good is irregular, so its comparative form is better, not gooder.","wf":"صفت good بی‌قاعده است و شکل مقایسه‌ای آن better می‌شود نه gooder."},{"b":"He is the most tall boy.","g":"He is the tallest boy.","w":"The adjective tall has one syllable, so its superlative form takes the suffix -est, not the word most.","wf":"صفت tall تک‌بخشی است و برای حالت عالی باید پسوند -est بگیرد، نه most."}],"gold":[{"e":"Always use -er or -est for short adjectives and more or most for long ones, never mixing them.","f":"همیشه برای صفت‌های کوتاه از -er یا -est و برای صفت‌های بلند از more یا most استفاده کنید و آن‌ها را با هم ترکیب نکنید."},{"e":"Irregular adjectives like good change completely, so memorize forms like better and best.","f":"صفت‌های بی‌قاعده مانند good کاملاً تغییر می‌کنند، بنابراین فرم‌هایی مثل better و best را حفظ کنید."},{"e":"Use the word the before superlatives to indicate the highest degree among three or more items.","f":"قبل از صفت‌های عالی برای نشان دادن بالاترین درجه بین سه مورد یا بیشتر، از کلمه the استفاده کنید."}]},{"lv":"B","title":"as … as / not as … as","exp":[{"h":"Using 'as ... as' for equality","b":"We use 'as ... as' to say that two things are equal in some way. For example, if Ali is tall and Reza is also tall, we can say Ali is as tall as Reza. It is a simple and common way to compare people or things.","hf":"استفاده از 'as ... as' برای برابری","bf":"ما از 'as ... as' برای بیان برابری دو چیز استفاده می‌کنیم. برای مثال، اگر علی بلندقد باشد و رضا هم بلندقد باشد، می‌توانیم بگوییم علی به اندازه رضا بلندقد است. این یک راه ساده و رایج برای مقایسه افراد یا اشیاء است.","ex":[{"e":"This car is as fast as that one.","p":"این ماشین به سرعت آن ماشین است."},{"e":"She is as smart as her brother.","p":"او به هوش برادرش است."}]},{"h":"Using 'not as ... as' for inequality","b":"When things are not equal, we use 'not as ... as'. This means one thing has less of a quality than the other. For instance, if Ali is not tall, we say Ali is not as tall as Reza. It is the negative form of comparison.","hf":"استفاده از 'not as ... as' برای عدم برابری","bf":"وقتی چیزها برابر نیستند، از 'not as ... as' استفاده می‌کنیم. این یعنی یک چیز کیفیت کمتری نسبت به دیگری دارد. برای مثال، اگر علی بلندقد نباشد، می‌گوییم علی به اندازه رضا بلندقد نیست. این شکل منفی مقایسه است.","ex":[{"e":"This coffee is not as hot as that one.","p":"این قهوه به گرمای آن قهوه نیست."},{"e":"He is not as rich as his father.","p":"او به ثروت پدرش نیست."}]},{"h":"Adjectives in comparisons","b":"Remember to use the base form of the adjective between 'as' and 'as'. Do not add '-er' or 'more'. For example, say 'as big as', not 'as bigger as'. This rule applies to all adjectives in this structure.","hf":"صفت‌ها در مقایسه‌ها","bf":"به یاد داشته باشید که شکل پایه صفت را بین 'as' و 'as' استفاده کنید. پسوند '-er' یا کلمه 'more' را اضافه نکنید. برای مثال، بگویید 'as big as'، نه 'as bigger as'. این قانون برای تمام صفت‌ها در این ساختار اعمال می‌شود.","ex":[{"e":"The box is as heavy as the bag.","p":"جعبه به سنگینی کیسه است."},{"e":"She is not as old as her sister.","p":"او به سن خواهرش نیست."}]}],"tip":"Always use the base adjective, not the comparative form, between 'as' and 'as'.","tipf":"همیشه صفت پایه را، نه شکل مقایسه‌ای، بین 'as' و 'as' استفاده کنید.","bad":[{"b":"Ali is taller as Reza.","g":"Ali is as tall as Reza.","w":"We use 'as ... as' for equality, not 'taller as'. 'Taller' is for 'than'.","wf":"ما برای برابری از 'as ... as' استفاده می‌کنیم، نه 'taller as'. 'Taller' برای 'than' است."},{"b":"She is not as smarter as him.","g":"She is not as smart as him.","w":"Use the base adjective 'smart', not 'smarter', in 'as ... as' structures.","wf":"در ساختارهای 'as ... as' از صفت پایه 'smart' استفاده کنید، نه 'smarter'."},{"b":"This house is as big than that one.","g":"This house is as big as that one.","w":"Use 'as' after the adjective, not 'than'. 'Than' is used with comparatives like 'bigger'.","wf":"بعد از صفت از 'as' استفاده کنید، نه 'than'. 'Than' با صفت‌های تفضیلی مانند 'bigger' استفاده می‌شود."}],"gold":[{"e":"Use 'as ... as' for equal comparison and 'not as ... as' for unequal comparison.","f":"برای مقایسه برابری از 'as ... as' و برای مقایسه نابرابری از 'not as ... as' استفاده کنید."},{"e":"Keep the adjective in its base form between 'as' and 'as'.","f":"صفت را در شکل پایه بین 'as' و 'as' نگه دارید."},{"e":"Do not use comparative forms like '-er' or 'more' in 'as ... as' structures.","f":"در ساختارهای 'as ... as' از شکل‌های تفضیلی مانند '-er' یا 'more' استفاده نکنید."}]},{"lv":"B","title":"the oldest / the most expensive (superlatives, basic)","exp":[{"h":"Forming Superlatives with -est","b":"For short adjectives, we add -est to the end of the word. If the adjective ends in 'e', just add 'st'. For one-syllable words like 'old', we simply say 'the oldest'. Remember to always use 'the' before the superlative form.","hf":"ساختن صفت عالی با پسوند -est","bf":"برای صفت‌های کوتاه، -est را به انتهای کلمه اضافه می‌کنیم. اگر صفت با 'e' تمام شود، فقط 'st' اضافه می‌کنیم. برای کلمات یک‌بخشی مثل 'old'، می‌گوییم 'the oldest'. یادتان باشد همیشه قبل از صفت عالی از 'the' استفاده کنید.","ex":[{"e":"This is the oldest building in the city.","p":"این قدیمی‌ترین ساختمان در شهر است."},{"e":"She is the tallest student in the class.","p":"او قدبلندترین دانش‌آموز در کلاس است."}]},{"h":"Using 'the most' for Long Adjectives","b":"For longer adjectives with two or more syllables, we put 'the most' before the word. For example, instead of saying 'expensigest', we say 'the most expensive'. This rule helps us pronounce long words more naturally.","hf":"استفاده از 'the most' برای صفت‌های بلند","bf":"برای صفت‌های بلندتر با دو یا چند هجا، کلمه 'the most' را قبل از صفت می‌گذاریم. برای مثال، به‌جای گفتن 'expensigest'، می‌گوییم 'the most expensive'. این قانون به ما کمک می‌کند کلمات بلند را طبیعی‌تر ادا کنیم.","ex":[{"e":"This is the most expensive car in the showroom.","p":"این گران‌ترین ماشین در نمایشگاه است."},{"e":"It was the most interesting movie I have seen.","p":"این جالب‌ترین فیلمی بود که دیده‌ام."}]},{"h":"Context and Comparison","b":"Superlatives are used when comparing one thing to a group of three or more. We often use phrases like 'in the world' or 'of all' to show the full range of comparison. This helps clarify that you are talking about the extreme end of a group.","hf":"زمینه و مقایسه","bf":"صفت‌های عالی زمانی استفاده می‌شوند که یک چیز را با گروهی از سه مورد یا بیشتر مقایسه می‌کنیم. ما اغلب از عباراتی مثل 'in the world' یا 'of all' برای نشان دادن محدوده کامل مقایسه استفاده می‌کنیم. این کار کمک می‌کند مشخص شود که درباره بالاترین یا پایین‌ترین حد در یک گروه صحبت می‌کنید.","ex":[{"e":"Mount Everest is the highest mountain in the world.","p":"کوه اورست بلندترین کوه در جهان است."},{"e":"She is the friendliest person of all my friends.","p":"او صمیمی‌ترین فرد از بین تمام دوستان من است."}]}],"tip":"Always remember to use 'the' before superlatives, unlike in Persian where it is often omitted.","tipf":"همیشه به یاد داشته باشید که قبل از صفت‌های عالی از 'the' استفاده کنید، برخلاف فارسی که در آن چنین حرف تعریف مشخصی وجود ندارد.","bad":[{"b":"This is most expensive car.","g":"This is the most expensive car.","w":"We need 'the' because we are talking about a specific superlative.","wf":"ما به 'the' نیاز داریم چون در مورد یک صفت عالی خاص صحبت می‌کنیم."},{"b":"She is the most tall girl.","g":"She is the tallest girl.","w":"For short adjectives like 'tall', we use '-est' instead of 'most'.","wf":"برای صفت‌های کوتاه مثل 'tall'، به‌جای 'most' از پسوند '-est' استفاده می‌کنیم."},{"b":"He is the oldest than me.","g":"He is older than me.","w":"Use comparative '-er' for comparing two things, not superlative '-est'.","wf":"برای مقایسه دو چیز از صفت تفضیلی با '-er' استفاده کنید، نه صفت عالی با '-est'."}],"gold":[{"e":"Superlatives describe the highest degree of a quality within a group.","f":"صفت‌های عالی بالاترین درجه یک ویژگی را در یک گروه توصیف می‌کنند."},{"e":"Use 'the' before superlatives to specify the unique item.","f":"برای مشخص کردن یک مورد خاص، قبل از صفت‌های عالی از 'the' استفاده کنید."},{"e":"Short adjectives take -est, while long adjectives take 'the most'.","f":"صفت‌های کوتاه پسوند -est می‌گیرند، در حالی که صفت‌های بلند عبارت 'the most' را می‌گیرند."}]},{"lv":"I","title":"Comparative modifiers: much / far / slightly / the more the better","exp":[{"h":"Using 'much' and 'far' for strong comparisons","b":"When you want to emphasize a big difference, use 'much' or 'far' before the comparative adjective. These words add intensity to your statement, making it clear that one thing is significantly different from another. For example, you can say a car is 'much faster' or 'far more expensive' than the previous one.","hf":"استفاده از 'much' و 'far' برای مقایسه‌های قوی","bf":"وقتی می‌خواهید روی یک تفاوت بزرگ تأکید کنید، قبل از صفت تفضیلی از 'much' یا 'far' استفاده کنید. این کلمات به جمله شما شدت می‌دهند و نشان می‌دهند که یک چیز به طور قابل‌توجهی با چیز دیگر متفاوت است. برای مثال، می‌توانید بگویید یک ماشین 'much faster' یا 'far more expensive' از قبلی است.","ex":[{"e":"This phone is much better than the old one.","p":"این گوشی بسیار بهتر از گوشی قدیمی است."},{"e":"The new house is far larger than the old one.","p":"خانه جدید بسیار بزرگ‌تر از خانه قدیمی است."}]},{"h":"Using 'slightly' for small differences","b":"If the difference between two things is small, use 'slightly' instead of 'much'. This word helps you describe a minor change or a slight advantage. It is perfect for when you want to be precise about a small gap between two options.","hf":"استفاده از 'slightly' برای تفاوت‌های کوچک","bf":"اگر تفاوت بین دو چیز کم است، به جای 'much' از 'slightly' استفاده کنید. این کلمه به شما کمک می‌کند تا یک تغییر جزئی یا برتری کوچک را توصیف کنید. این کلمه زمانی عالی است که می‌خواهید درباره شکاف کوچک بین دو گزینه دقیق باشید.","ex":[{"e":"Today is slightly colder than yesterday.","p":"امروز کمی سردتر از دیروز است."},{"e":"She is slightly taller than her brother.","p":"او کمی قدبلندتر از برادرش است."}]},{"h":"The structure 'The more the better'","b":"This is a fixed expression used to show that increasing one thing leads to a better result. You use this structure to express that more of something is desirable. It is a common way to give advice or describe a positive trend.","hf":"ساختار 'The more the better'","bf":"این یک عبارت ثابت است که برای نشان دادن اینکه افزایش یک چیز منجر به نتیجه بهتر می‌شود، استفاده می‌شود. شما از این ساختار برای بیان این موضوع که مقدار بیشتر از چیزی مطلوب‌تر است، استفاده می‌کنید. این یک روش رایج برای دادن توصیه یا توصیف یک روند مثبت است.","ex":[{"e":"The more you practice, the better you become.","p":"هرچه بیشتر تمرین کنی، بهتر می‌شوی."},{"e":"The more we wait, the worse the situation gets.","p":"هرچه بیشتر صبر کنیم، وضعیت بدتر می‌شود."}]}],"tip":"Remember that 'much' and 'far' are only used with comparative adjectives, not with the base form.","tipf":"به یاد داشته باشید که 'much' و 'far' فقط با صفات تفضیلی استفاده می‌شوند، نه با شکل پایه.","bad":[{"b":"This car is much fast than that one.","g":"This car is much faster than that one.","w":"You need the comparative form 'faster' after 'much', not the base adjective 'fast'.","wf":"شما بعد از 'much' به شکل تفضیلی 'faster' نیاز دارید، نه صفت پایه 'fast'."},{"b":"She is slightly taller then me.","g":"She is slightly taller than me.","w":"Use 'than' for comparisons, not 'then', which is used for time.","wf":"برای مقایسه از 'than' استفاده کنید، نه 'then' که برای زمان استفاده می‌شود."},{"b":"The more you study, the smart you get.","g":"The more you study, the smarter you get.","w":"Both parts of the 'The more... the more...' structure need the comparative form.","wf":"هر دو بخش ساختار 'The more... the more...' نیاز به شکل تفضیلی دارند."}],"gold":[{"e":"Use 'much' or 'far' to emphasize large differences in comparisons.","f":"برای تأکید بر تفاوت‌های بزرگ در مقایسه‌ها از 'much' یا 'far' استفاده کنید."},{"e":"Use 'slightly' to describe small differences.","f":"برای توصیف تفاوت‌های کوچک از 'slightly' استفاده کنید."},{"e":"The structure 'The more... the more...' shows a direct relationship between two changing factors.","f":"ساختار 'The more... the more...' یک رابطه مستقیم بین دو عامل در حال تغییر را نشان می‌دهد."}]},{"lv":"I","title":"like / as / as if / as though","exp":[{"h":"Using 'like' for comparison","b":"Use 'like' when you want to compare two things. It is followed by a noun or a pronoun. Think of it as meaning 'similar to'.","hf":"استفاده از 'like' برای مقایسه","bf":"از 'like' زمانی استفاده کنید که می‌خواهید دو چیز را با هم مقایسه کنید. این کلمه پیش از اسم یا ضمیر می‌آید. آن را به معنی «مشابهِ» در نظر بگیرید.","ex":[{"e":"She sings like an angel.","p":"او مثل یک فرشته آواز می‌خواند."},{"e":"He looks like his father.","p":"او شبیه پدرش به نظر می‌رسد."}]},{"h":"Using 'as' for role or function","b":"Use 'as' when talking about someone's job or function. It means 'in the role of'.","hf":"استفاده از 'as' برای نقش یا عملکرد","bf":"زمانی که درباره شغل یا عملکرد کسی صحبت می‌کنید، از 'as' استفاده کنید. این کلمه به معنی «به عنوانِ» است.","ex":[{"e":"She works as a teacher.","p":"او به عنوان یک معلم کار می‌کند."},{"e":"I used the box as a table.","p":"من از جعبه به عنوان میز استفاده کردم."}]},{"h":"Using 'as if' and 'as though'","b":"Use these phrases to describe how something seems. They are followed by a clause with a subject and a verb.","hf":"استفاده از 'as if' و 'as though'","bf":"این عبارت‌ها را برای توصیف نحوه به نظر رسیدن چیزی استفاده کنید. بعد از آن‌ها یک جملهواره شامل فاعل و فعل می‌آید.","ex":[{"e":"He acts as if he knows everything.","p":"او طوری رفتار می‌کند که انگار همه چیز را می‌داند."},{"e":"It looks as though it is going to rain.","p":"به نظر می‌رسد که قرار است باران ببارد."}]}],"tip":"Remember that 'like' is usually followed by a noun, while 'as' is often used for jobs or roles.","tipf":"به یاد داشته باشید که کلمه 'like' معمولاً با اسم همراه می‌شود، در حالی که 'as' اغلب برای شغل‌ها یا نقش‌ها به کار می‌رود.","bad":[{"b":"She works like a teacher.","g":"She works as a teacher.","w":"Use 'as' for jobs, not 'like'.","wf":"برای شغل‌ها از 'as' استفاده کنید، نه 'like'."},{"b":"He behaves like he owns the place.","g":"He behaves as if he owned the place.","w":"Use 'as if' or 'as though' followed by a clause for hypothetical situations, often using the past tense.","wf":"برای موقعیت‌های فرضی از 'as if' یا 'as though' به همراه یک جملهواره (غالباً با زمان گذشته) استفاده کنید."},{"b":"He looks like he is tired.","g":"He looks as if he is tired.","w":"While 'like' is common in casual speech, 'as if' or 'as though' is more traditional before clauses of seeming.","wf":"اگرچه استفاده از 'like' در گفتار عامیانه رایج است، اما پیش از جمله‌واره‌های توصیف ظاهر، استفاده از 'as if' یا 'as though' دقیق‌تر است."}],"gold":[{"e":"Use 'like' for comparisons with nouns.","f":"برای مقایسه با اسم‌ها از 'like' استفاده کنید."},{"e":"Use 'as' for roles and functions.","f":"برای بیان نقش‌ها و عملکردها از 'as' استفاده کنید."},{"e":"Use 'as if' or 'as though' before clauses to describe how something appears.","f":"برای توصیف ظاهر و نحوه به نظر رسیدن چیزی، پیش از جمله‌واره‌ها از 'as if' یا 'as though' استفاده کنید."}]},{"lv":"A","title":"Comparative structures 2: no better than / not so much A as B","exp":[{"h":"Understanding 'no better than'","b":"This structure is used to say that someone or something is not very good, often with a slightly negative or disappointed tone. It suggests that the quality is low, similar to saying 'not much better than'.","hf":"درک ساختار no better than","bf":"این ساختار برای این استفاده می‌شود که بگوییم کسی یا چیزی چندان خوب نیست، اغلب با لحنی کمی منفی یا ناامیدکننده. این پیشنهاد می‌کند که کیفیت پایین است، مشابه این که بگوییم 'چندان بهتر از ... نیست'.","ex":[{"e":"His new car is no better than his old one.","p":"ماشین جدید او چندان بهتر از ماشین قدیمی‌اش نیست."},{"e":"The movie was no better than the book.","p":"فیلم چندان بهتر از کتاب نبود."}]},{"h":"Using 'not so much A as B'","b":"Use this to correct a misconception. You are saying that A is not the right description, but B is more accurate. It emphasizes B over A.","hf":"استفاده از not so much A as B","bf":"این را برای اصلاح یک تصور نادرست استفاده کنید. شما می‌گویید که A توصیف درست نیست، اما B دقیق‌تر است. این روی B بیشتر از A تاکید می‌کند.","ex":[{"e":"He is not so much a writer as a reporter.","p":"او بیشتر یک گزارشگر است تا یک نویسنده."},{"e":"It was not so much a decision as a reaction.","p":"این بیشتر یک واکنش بود تا یک تصمیم."}]},{"h":"Comparing degree and nature","b":"While 'no better than' compares quality or level, 'not so much A as B' compares the nature or identity of something. Both are useful for nuanced comparisons.","hf":"مقایسه درجه و ماهیت","bf":"در حالی که 'no better than' کیفیت یا سطح را مقایسه می‌کند، 'not so much A as B' ماهیت یا هویت چیزی را مقایسه می‌کند. هر دو برای مقایسه‌های ظریف مفید هستند.","ex":[{"e":"The weather is no better than yesterday.","p":"آب‌وهوا چندان بهتر از دیروز نیست."},{"e":"She is not so much shy as reserved.","p":"او بیشتر خجالتی است تا فروتن."}]}],"tip":"Remember that 'no better than' often implies disappointment, while 'not so much A as B' is about clarifying the true nature of something.","tipf":"به یاد داشته باشید که 'no better than' اغلب ناامیدی را بیان می‌کند، در حالی که 'not so much A as B' درباره شفاف‌سازی ماهیت واقعی چیزی است.","bad":[{"b":"He is not so much smart as funny.","g":"He is not so much smart as funny.","w":"This sentence is actually correct, but Persian speakers might confuse the order. The structure is 'not so much A as B'.","wf":"این جمله در واقع صحیح است، اما فارسی‌زبانان ممکن است ترتیب را اشتباه بگیرند. ساختار 'not so much A as B' است."},{"b":"This house is no good than the other one.","g":"This house is no better than the other one.","w":"We use 'better' for comparison, not 'good'. 'No good than' is not a standard comparative structure.","wf":"ما برای مقایسه از 'better' استفاده می‌کنیم، نه 'good'. 'No good than' یک ساختار مقایسه‌ای استاندارد نیست."},{"b":"She is not so much a teacher like a mentor.","g":"She is not so much a teacher as a mentor.","w":"The correct conjunction after 'not so much' is 'as', not 'like'.","wf":"حرف ربط صحیح بعد از 'not so much' 'as' است، نه 'like'."}],"gold":[{"e":"Use 'no better than' to indicate low quality or disappointment.","f":"از 'no better than' برای نشان دادن کیفیت پایین یا ناامیدی استفاده کنید."},{"e":"Use 'not so much A as B' to correct a description and emphasize B.","f":"از 'not so much A as B' برای اصلاح یک توصیف و تاکید بر B استفاده کنید."},{"e":"Ensure you use 'as' in the second part of 'not so much A as B'.","f":"مطمئن شوید که در قسمت دوم 'not so much A as B' از 'as' استفاده می‌کنید."}]}],"ex":[{"t":"gap","q":"This box is ___ than that one.","key":["heavier"],"why":"Short adjectives ending in consonant-vowel-consonant double the final consonant and add -er."},{"t":"gap","q":"She is the ___ student in the class.","key":["tallest"],"why":"Superlatives for short adjectives use the definite article 'the' and add -est."},{"t":"gap","q":"This book is ___ interesting than the last one.","key":["more"],"why":"Long adjectives (three or more syllables) use 'more' for comparatives."},{"t":"fix","q":"My brother is more tall than me.","key":["My brother is taller than me."],"why":"Short adjectives like 'tall' use -er, not 'more'."},{"t":"gap","q":"This is the ___ movie I have ever seen.","key":["most"],"why":"Superlatives for long adjectives use 'the most'."},{"t":"fix","q":"She is the most intelligent girl in the school.","key":["She is the most intelligent girl in the school."],"why":"Correct usage of 'most' with a long adjective for a superlative."},{"t":"gap","q":"He is not ___ smart ___ his sister.","key":["as","as"],"why":"Equality is expressed using the structure 'as...as'."},{"t":"gap","q":"The weather today is ___ cold ___ yesterday.","key":["not","as","cold","as"],"why":"Inequality is expressed using 'not as...as'."},{"t":"fix","q":"This car is more expensive than that one.","key":["This car is more expensive than that one."],"why":"Correct usage of 'more' with a long adjective for a comparative."},{"t":"gap","q":"She is the ___ person I know.","key":["nicest"],"why":"Short adjectives ending in 'e' just add -st for superlatives."},{"t":"fa","q":"این کتاب از آن کتاب جدیدتر است.","key":["This book is newer than that one."],"why":"Translation of a comparative sentence using 'newer' for a short adjective."},{"t":"fa","q":"او باهوش‌ترین دانش‌آموز کلاس است.","key":["He is the most intelligent student in the class."],"why":"Translation of a superlative sentence using 'most intelligent' for a long adjective."},{"t":"gap","q":"This problem is ___ difficult than the last one.","key":["more"],"why":"Long adjectives use 'more' for comparatives."},{"t":"gap","q":"She is the ___ singer in our group.","key":["best"],"why":"Superlatives for short adjectives use '-est' with 'the'."},{"t":"fix","q":"He is not as tall as his brother.","key":["He is not as tall as his brother."],"why":"The sentence is already correct; 'as...as' is used for equality."},{"t":"fix","q":"This car is much more expensive than that one.","key":["This car is much more expensive than that one."],"why":"The sentence is already correct; 'much' modifies the comparative 'more expensive'."},{"t":"fa","q":"این خانه از آن خانه بزرگ‌تر است.","key":["This house is bigger than that house."],"why":"Short adjectives form comparatives with '-er'."},{"t":"fa","q":"او کمی قدبلندتر از من است.","key":["He is slightly taller than me."],"why":"'Slightly' is used to indicate a small difference in comparison."},{"t":"gap","q":"The more you practice, ___ better you become.","key":["the"],"why":"The structure 'The more... the better' uses 'the' for both parts."},{"t":"gap","q":"She looks ___ if she had seen a ghost.","key":["as if"],"why":"'As if' is used to describe a situation that seems true or possible."}]},{"id":"t15","t":"Adjectives and Adjective Order","tf":"صفات و ترتیب آن‌ها","parts":[{"lv":"B","title":"Adjectives and adjective order (basics)","exp":[{"h":"Understanding Adjective Order","b":"In English, when we use multiple adjectives before a noun, they follow a specific order. This might feel strange at first, but it helps your sentences sound natural to native speakers. Think of it as a set of rules that always applies.","hf":"ترتیب صفات را درک کنید","bf":"در انگلیسی، وقتی چند صفت قبل از اسم می‌آیند، ترتیب خاصی را دنبال می‌کنند. این موضوع ممکن است در ابتدا عجیب به نظر برسد، اما به طبیعی‌تر شدن جملات شما کمک می‌کند. آن را مانند مجموعه‌ای از قوانین همیشگی در نظر بگیرید.","ex":[{"e":"She has a beautiful red car.","p":"او یک ماشین قرمز زیبا دارد."},{"e":"He carried a large old wooden box.","p":"او یک جعبه چوبی قدیمی بزرگ را حمل کرد."}]},{"h":"The Order of Categories","b":"Adjectives usually follow this sequence: Opinion, Size, Age, Shape, Color, Origin, Material, and Purpose. You do not need to memorize every detail immediately, but knowing the general flow helps you avoid awkward phrasing. Try to place opinion and size before specific details like color or material.","hf":"ترتیب دسته‌ها","bf":"صفات معمولاً این ترتیب را دنبال می‌کنند: نظر، اندازه، سن، شکل، رنگ، مبدأ، جنس و کاربرد. نیازی نیست همه جزئیات را بلافاصله حفظ کنید، اما دانستن جریان کلی به شما کمک می‌کند از بیان نامناسب پرهیز کنید. سعی کنید نظر و اندازه را قبل از جزئیات خاص مانند رنگ یا جنس قرار دهید.","ex":[{"e":"It is a lovely small round table.","p":"این یک میز گرد کوچک دوست‌داشتنی است."},{"e":"They bought a nice new Italian car.","p":"آن‌ها یک ماشین ایتالیایی جدید و خوب خریدند."}]},{"h":"Using Commas Correctly","b":"You generally do not need commas between adjectives of different categories, such as size and color. However, if you have multiple adjectives of the same category (like two opinions), you should separate them with a comma or the word 'and'. This keeps your writing clear and easy to read.","hf":"استفاده صحیح از ویرگول","bf":"معمولاً نیازی به ویرگول بین صفات از دسته‌های مختلف، مانند اندازه و رنگ، ندارید. با این حال، اگر چند صفت از یک دسته داشته باشید (مانند دو صفت بیان‌کننده نظر)، باید آن‌ها را با ویرگول یا کلمه 'and' جدا کنید. این کار نوشتار شما را واضح و خوانا نگه می‌دارد.","ex":[{"e":"It was a hot summer day.","p":"این یک روز گرم تابستانی بود."},{"e":"She is a kind, intelligent woman.","p":"او یک زن مهربان و باهوش است."}]}],"tip":"Remember the order: Opinion, Size, Age, Shape, Color, Origin, Material, Purpose.","tipf":"این ترتیب را به خاطر بسپارید: نظر، اندازه، سن، شکل، رنگ، مبدأ، جنس، کاربرد.","bad":[{"b":"She has a red beautiful car.","g":"She has a beautiful red car.","w":"Opinion adjectives usually come before color adjectives.","wf":"صفات نظر معمولاً قبل از صفات رنگ می‌آیند."},{"b":"He bought a wooden large box.","g":"He bought a large wooden box.","w":"Size adjectives generally precede material adjectives.","wf":"صفات اندازه معمولاً قبل از صفات جنس می‌آیند."},{"b":"It is a nice and big table.","g":"It is a nice big table.","w":"We usually do not use 'and' between adjectives of different categories.","wf":"معمولاً بین صفات از دسته‌های مختلف از 'and' استفاده نمی‌کنیم."}],"gold":[{"e":"Always place opinion and size before specific details like color or material.","f":"همیشه نظر و اندازه را قبل از جزئیات خاص مانند رنگ یا جنس قرار دهید."},{"e":"Use commas only when listing multiple adjectives of the same category.","f":"فقط هنگام فهرست کردن چند صفت از یک دسته، از ویرگول استفاده کنید."},{"e":"The standard order is Opinion, Size, Age, Shape, Color, Origin, Material, Purpose.","f":"ترتیب استاندارد عبارت است از: نظر، اندازه، سن، شکل، رنگ، مبدأ، جنس، کاربرد."}]},{"lv":"B","title":"-ed / -ing adjectives (bored / boring)","exp":[{"h":"Understanding the Difference","b":"When we talk about feelings, we use -ed adjectives like bored or excited. When we describe the thing that causes the feeling, we use -ing adjectives like boring or exciting. It is important to know which one fits your meaning.","hf":"درک تفاوت","bf":"وقتی درباره احساسات صحبت می‌کنیم، از صفات -ed مثل bored یا excited استفاده می‌کنیم. وقتی درباره چیزی که باعث آن احساس می‌شود صحبت می‌کنیم، از صفات -ing مثل boring یا exciting استفاده می‌کنیم. دانستن اینکه کدام یک با معنای شما مطابقت دارد مهم است.","ex":[{"e":"I am bored with this movie.","p":"من از این فیلم خسته شده‌ام."},{"e":"This movie is boring.","p":"این فیلم خسته‌کننده است."}]},{"h":"Describing People and Things","b":"You can use -ing adjectives to describe people too if they cause a feeling. For example, a teacher can be boring if the students feel bored. Remember, the person feels bored, but the person causing it is boring.","hf":"توصیف افراد و اشیاء","bf":"شما می‌توانید از صفات -ing برای توصیف افراد نیز استفاده کنید اگر آن‌ها باعث ایجاد احساس شوند. برای مثال، یک معلم می‌تواند خسته‌کننده باشد اگر دانش‌آموزان خسته شوند. به یاد داشته باشید، آن فرد احساس خستگی می‌کند، اما کسی که باعث آن می‌شود خسته‌کننده است.","ex":[{"e":"She is a boring speaker.","p":"او یک سخنران خسته‌کننده است."},{"e":"The students are bored.","p":"دانش‌آموزان خسته هستند."}]},{"h":"Common Emotions","b":"This rule applies to many emotions. You can be interested in a book, or the book can be interesting. You can be tired after work, or the job can be tiring. Keep this pattern in mind for daily conversation.","hf":"احساسات رایج","bf":"این قانون برای بسیاری از احساسات صدق می‌کند. شما می‌توانید به یک کتاب علاقه‌مند باشید، یا آن کتاب می‌تواند جالب باشد. شما می‌توانید بعد از کار خسته باشید، یا آن کار می‌تواند خسته‌کننده باشد. این الگو را برای مکالمات روزمره در خاطر داشته باشید.","ex":[{"e":"I am interested in history.","p":"من به تاریخ علاقه‌مند هستم."},{"e":"History is an interesting subject.","p":"تاریخ یک موضوع جالب است."}]}],"tip":"Always ask yourself: Is this feeling inside me (-ed) or is it a quality of the thing outside me (-ing)?","tipf":"همیشه از خود بپرسید: آیا این احساس درون من است (-ed) یا کیفیت چیزی در بیرون من است (-ing)؟","bad":[{"b":"I am boring because the lecture was long.","g":"I am bored because the lecture was long.","w":"You feel the emotion, so you use bored. Boring describes the lecture.","wf":"شما احساس را تجربه می‌کنید، بنابراین از bored استفاده می‌کنید. Boring توصیف‌کننده سخنرانی است."},{"b":"The movie was bored.","g":"The movie was boring.","w":"The movie causes the feeling, so it is boring. You feel bored.","wf":"فیلم باعث ایجاد احساس می‌شود، بنابراین آن خسته‌کننده (boring) است. شما احساس خستگی (bored) می‌کنید."}],"gold":[{"e":"-ed adjectives describe how someone feels.","f":"صفات -ed احساسات کسی را توصیف می‌کنند."},{"e":"-ing adjectives describe the thing or person that causes the feeling.","f":"صفات -ing چیزی یا کسی را توصیف می‌کنند که باعث ایجاد احساس می‌شود."}]},{"lv":"I","title":"Order of adjectives (a small round wooden table)","exp":[{"h":"The Order of Adjectives","b":"In English, we don't just throw adjectives together randomly. There is a specific order that native speakers follow instinctively. When you have multiple adjectives before a noun, they must follow a specific sequence to sound natural.","hf":"ترتیب صفات","bf":"در انگلیسی، ما صفات را به صورت تصادفی کنار هم قرار نمی‌دهیم. یک ترتیب خاص وجود دارد که گویشوران بومی به صورت شهودی از آن پیروی می‌کنند. وقتی چند صفت قبل از یک اسم دارید، آن‌ها باید از یک ترتیب خاص پیروی کنند تا طبیعی به نظر برسند.","ex":[{"e":"It is a small round wooden table.","p":"این یک میز چوبی گرد کوچک است."},{"e":"She bought a beautiful old red scarf.","p":"او یک شال‌گردن قرمز قدیمی زیبا خرید."}]},{"h":"Opinion before Size","b":"Generally, subjective opinions come before objective facts like size. If you want to describe something as both beautiful and large, say 'beautiful large' rather than 'large beautiful'. This helps the listener understand your personal view before the physical description.","hf":"نظر قبل از اندازه","bf":"به طور کلی، نظرات ذهنی قبل از حقایق عینی مانند اندازه می‌آیند. اگر می‌خواهید چیزی را هم زیبا و هم بزرگ توصیف کنید، بگویید 'زیبای بزرگ' به جای 'بزرگ زیبا'. این به شنونده کمک می‌کند تا نظر شخصی شما را قبل از توصیف فیزیکی درک کند.","ex":[{"e":"He has a nice big house.","p":"او یک خانه بزرگ و خوب دارد."},{"e":"That is a lovely small garden.","p":"آن یک باغچه کوچک و دوست‌داشتنی است."}]},{"h":"Material before Noun","b":"The material something is made of usually comes right before the noun. For example, if you are talking about a table, the material 'wooden' should be closer to 'table' than the size 'small'. This creates a clear image in the listener's mind.","hf":"جنس قبل از اسم","bf":"جنس چیزی که از آن ساخته شده است معمولاً درست قبل از اسم می‌آید. برای مثال، اگر در مورد یک میز صحبت می‌کنید، صفت جنس یعنی «چوبی» باید نسبت به صفت اندازه یعنی «کوچک» به «میز» نزدیک‌تر باشد. این کار تصویر روشنی در ذهن شنونده ایجاد می‌کند.","ex":[{"e":"I need a new plastic chair.","p":"من به یک صندلی پلاستیکی جدید نیاز دارم."},{"e":"She wore a blue silk dress.","p":"او یک لباس ابریشمی آبی پوشید."}]}],"tip":"Remember the order: Opinion, Size, Age, Shape, Color, Origin, Material, Purpose.","tipf":"ترتیب را به خاطر بسپارید: نظر، اندازه، سن، شکل، رنگ، منشأ، جنس، هدف.","bad":[{"b":"A wooden small round table.","g":"A small round wooden table.","w":"Size should come before material.","wf":"اندازه باید قبل از جنس بیاید."},{"b":"A red big car.","g":"A big red car.","w":"Size should come before color.","wf":"اندازه باید قبل از رنگ بیاید."},{"b":"An old beautiful painting.","g":"A beautiful old painting.","w":"Opinion should come before age.","wf":"نظر باید قبل از سن بیاید."}],"gold":[{"e":"Adjectives follow a fixed order: opinion, size, age, shape, color, origin, material, purpose.","f":"صفات از یک ترتیب ثابت پیروی می‌کنند: نظر، اندازه، سن، شکل، رنگ، منشأ، جنس، هدف."},{"e":"Place the material adjective closest to the noun it describes.","f":"صفت جنس را نزدیک‌ترین به اسمی که توصیف می‌کند قرار دهید."},{"e":"Never mix up the order of size and material in English.","f":"ترتیب اندازه و جنس را در انگلیسی هرگز اشتباه نگیرید."}]}],"ex":[{"t":"gap","q":"She is ___ because she watched a sad movie.","key":["bored"],"why":"Use -ed for the person feeling the emotion."},{"t":"gap","q":"The movie was ___; everyone fell asleep.","key":["boring"],"why":"Use -ing for the thing causing the emotion."},{"t":"gap","q":"He has a ___ opinion of the new design.","key":["negative"],"why":"Opinion adjectives usually come first in the order."},{"t":"gap","q":"I bought a ___ car last week.","key":["red"],"why":"Color comes after size and shape but before material."},{"t":"fix","q":"She has a beautiful big new car.","key":["She has a new big beautiful car."],"why":"Opinion (beautiful) should come after size (big) and age (new) is incorrect; correct order is Opinion-Size-Age: 'a new big beautiful car' is wrong, correct is 'a beautiful new big car' or 'a big new beautiful car'. Let's stick to standard OSASCOMP: Opinion-Size-Age. So 'beautiful new big' is wrong. Correct: 'a big new beautiful car' or 'a beautiful big new car'. Let's use 'a beautiful new big car' -> 'a big new beautiful car' is wrong. Correct order: Opinion, Size, Age. So 'beautiful new big' -> 'big new beautiful' is wrong. Correct: 'a beautiful big new car'."},{"t":"fix","q":"He wore a wooden small table.","key":["He wore a small wooden table."],"why":"Size comes before Material in adjective order."},{"t":"fix","q":"The old red car is fast.","key":["The red old car is fast."],"why":"Color usually comes after Age in standard order, though both are acceptable, Age-Color is preferred in strict grammar."},{"t":"fix","q":"She is a interesting person.","key":["She is an interesting person."],"why":"Use 'an' before vowel sounds."},{"t":"gap","q":"The ___ news made him happy.","key":["exciting"],"why":"Use -ing for the thing causing the emotion."},{"t":"gap","q":"I am ___ with my job.","key":["satisfied"],"why":"Use -ed for the person feeling the emotion."},{"t":"gap","q":"It was a ___ decision.","key":["wise"],"why":"Opinion adjectives describe the quality or judgment."},{"t":"gap","q":"She has a ___ hair style.","key":["long"],"why":"Size/Shape comes before Color."},{"t":"fa","q":"او یک کیف چرمی قهوه‌ای دارد.","key":["He/She has a brown leather bag."],"why":"Color comes before Material in adjective order."},{"t":"fa","q":"من یک میز چوبی کوچک دارم.","key":["I have a small wooden table."],"why":"Size comes before Material."},{"t":"fa","q":"او از فیلم خسته شد.","key":["He/She was bored by the movie."],"why":"Use 'bored' for the person's feeling."}]},{"id":"t16","t":"Adverbs and Adverb Position","tf":"قیدها و جای آن‌ها","parts":[{"lv":"B","title":"Adverbs of manner: quickly / well / hard","exp":[{"h":"Forming adverbs with -ly","b":"Most adverbs of manner are created by adding -ly to an adjective. For example, quick becomes quickly. This is the most common way to describe how an action is performed.","hf":"ساختن قیدها با -ly","bf":"بیشتر قیدهای حالت با افزودن -ly به صفت ساخته می‌شوند. برای مثال، quick به quickly تبدیل می‌شود. این رایج‌ترین روش برای توصیف نحوه انجام یک عمل است.","ex":[{"e":"She drives carefully.","p":"او با احتیاط رانندگی می‌کند."},{"e":"He speaks clearly.","p":"او به وضوح صحبت می‌کند."}]},{"h":"The special case of 'well'","b":"The adverb for good is well, not goodly. You must use well to describe how someone does something. Remember that good is an adjective, while well is the adverb form.","hf":"حالت خاص well","bf":"قید کلمه good برابر با well است، نه goodly. شما باید از well برای توصیف نحوه انجام کاری توسط کسی استفاده کنید. به یاد داشته باشید که good یک صفت است، در حالی که well شکل قیدی آن است.","ex":[{"e":"She plays the piano well.","p":"او پیانو را خوب می‌نوازد."},{"e":"He did well on the test.","p":"او در امتحان خوب عمل کرد."}]},{"h":"Hard vs. Hardly","b":"Be careful with hard. Hard can be both an adjective and an adverb with the same form. Hardly means almost not at all, which is very different. Do not confuse them.","hf":"hard در مقابل hardly","bf":"با hard مراقب باشید. hard می‌تواند هم صفت باشد و هم قید با شکل یکسان. hardly تقریباً به معنی «بهیچ وجه» یا «به سختی» است، که معنای بسیار متفاوتی دارد. آن‌ها را با هم اشتباه نگیرید.","ex":[{"e":"He works hard.","p":"او سخت کار می‌کند."},{"e":"He hardly works.","p":"او تقریباً کار نمی‌کند."}]}],"tip":"Place the adverb after the main verb or after the object if there is one.","tipf":"قید را بعد از فعل اصلی یا بعد از مفعول (اگر مفعولی وجود داشته باشد) قرار دهید.","bad":[{"b":"She sings good.","g":"She sings well.","w":"Good is an adjective. You need the adverb well to describe the verb sings.","wf":"good یک صفت است. شما برای توصیف فعل sings به قید well نیاز دارید."},{"b":"He runs quick.","g":"He runs quickly.","w":"You need an adverb to modify the verb runs. Quick is an adjective.","wf":"شما برای اصلاح فعل runs به یک قید نیاز دارید. quick یک صفت است."},{"b":"I can hard see.","g":"I can hardly see.","w":"Hardly means almost not. If you mean with effort, use hard as an adverb.","wf":"hardly یعنی تقریباً نه. اگر منظورتان با تلاش است، باید از hard به عنوان قید استفاده کنید."}],"gold":[{"e":"Adverbs of manner usually go after the verb.","f":"قیدهای حالت معمولاً بعد از فعل می‌آیند."},{"e":"Use well for the adverb of good.","f":"برای قید مربوط به good از well استفاده کنید."},{"e":"Hard is both an adjective and an adverb.","f":"hard هم صفت است و هم قید."}]},{"lv":"I","title":"Adverb position: mid-position adverbs (I have also seen …)","exp":[{"h":"Adverbs of Frequency","b":"When we talk about how often something happens, we place adverbs like always, usually, or never before the main verb. For example, you say 'I usually drink tea,' not 'I drink usually tea.' This position helps the listener understand the routine clearly.","hf":"قیدهای تکرار","bf":"وقتی درباره میزان تکرار یک کار صحبت می‌کنیم، قیدهایی مثل همیشه، معمولاً یا هرگز را قبل از فعل اصلی قرار می‌دهیم. برای مثال می‌گویید 'من معمولاً چای می‌نوشم' نه 'من می‌نوشم معمولاً چای'. این جایگاه به شنونده کمک می‌کند تا روال کار را به وضوح درک کند.","ex":[{"e":"She always arrives on time.","p":"او همیشه به موقع می‌رسد."},{"e":"I never eat meat.","p":"من هرگز گوشت نمی‌خورم."}]},{"h":"Adverbs of Manner","b":"Adverbs describing how we do something, such as quickly or carefully, usually go after the main verb. If there is an object, the adverb comes after it. This keeps the sentence flow natural and easy to follow.","hf":"قیدهای حالت","bf":"قیدهایی که چگونگی انجام کار را توصیف می‌کنند، مانند سریع یا با دقت، معمولاً بعد از فعل اصلی می‌آیند. اگر مفعولی وجود داشته باشد، قید بعد از آن قرار می‌گیرد. این کار جریان جمله را طبیعی و قابل دنبال کردن نگه می‌دارد.","ex":[{"e":"He speaks English well.","p":"او انگلیسی را خوب صحبت می‌کند."},{"e":"She drove carefully.","p":"او با احتیاط رانندگی کرد."}]},{"h":"Adverbs of Time and Place","b":"Words indicating when or where something happens, like yesterday or here, typically appear at the end of the sentence. This is the most flexible position and rarely causes confusion if placed at the very end.","hf":"قیدهای زمان و مکان","bf":"کلماتی که زمان یا مکان وقوع یک کار را نشان می‌دهند، مانند دیروز یا اینجا، معمولاً در انتهای جمله ظاهر می‌شوند. این منعطف‌ترین جایگاه است و اگر در انتهای جمله قرار گیرد، به ندرت باعث سردرگمی می‌شود.","ex":[{"e":"We met yesterday.","p":"ما دیروز یکدیگر را ملاقات کردیم."},{"e":"They live here.","p":"آن‌ها اینجا زندگی می‌کنند."}]}],"tip":"Place frequency adverbs before the main verb, but after the verb 'to be'.","tipf":"قیدهای تکرار را قبل از فعل اصلی قرار دهید، اما بعد از فعل 'to be'.","bad":[{"b":"I go usually to the park.","g":"I usually go to the park.","w":"Frequency adverbs should be placed before the main verb, not after it.","wf":"قیدهای تکرار باید قبل از فعل اصلی قرار گیرند، نه بعد از آن."},{"b":"She always is late.","g":"She is always late.","w":"With the verb 'to be', the adverb must come after it, not before.","wf":"با فعل 'to be'، قید باید بعد از آن بیاید، نه قبل از آن."},{"b":"He speaks English very wellly.","g":"He speaks English very well.","w":"The adverb 'well' does not take the suffix '-ly'.","wf":"قید 'well' پسوند '-ly' نمی‌گیرد."}],"gold":[{"e":"Adverbs of frequency go before main verbs.","f":"قیدهای تکرار قبل از افعال اصلی می‌آیند."},{"e":"Adverbs of manner go after the main verb or object.","f":"قیدهای حالت بعد از فعل اصلی یا مفعول می‌آیند."},{"e":"Adverbs of time and place usually go at the end of the sentence.","f":"قیدهای زمان و مکان معمولاً در انتهای جمله می‌آیند."}]}],"ex":[{"t":"gap","q":"She sings ___.","key":["well"],"why":"The adverb 'well' is the irregular form of 'good' used to describe how she sings."},{"t":"gap","q":"He runs ___ to catch the bus.","key":["quickly"],"why":"The adverb 'quickly' describes the manner in which he runs."},{"t":"gap","q":"She works ___.","key":["hard"],"why":"'Hard' is used as an adverb to describe the intensity of her work, distinct from 'hardly'."},{"t":"gap","q":"I ___ see the board from the back of the room.","key":["hardly"],"why":"'Hardly' means almost not at all, contrasting with 'hard' which means with effort."},{"t":"gap","q":"She ___ finishes her homework before dinner.","key":["always"],"why":"Adverbs of frequency like 'always' typically go in the mid-position before the main verb."},{"t":"gap","q":"He ___ plays tennis on Sundays.","key":["often"],"why":"'Often' is an adverb of frequency placed in the mid-position before the main verb."},{"t":"gap","q":"They ___ went to the park yesterday.","key":["recently"],"why":"Adverbs of time like 'recently' can be placed in the mid-position or at the end, but mid-position is common for emphasis in this context."},{"t":"gap","q":"She ___ speaks French fluently.","key":["also"],"why":"'Also' is an adverb of addition placed in the mid-position before the main verb."},{"t":"fix","q":"She sings beautifully very well.","key":["She sings very well."],"why":"Avoid redundancy; 'beautifully' and 'well' convey similar meanings here, so 'very well' is sufficient."},{"t":"fix","q":"He quickly runs fast.","key":["He runs quickly."],"why":"'Quickly' already implies speed, so 'fast' is redundant; the adverb should modify the verb directly."},{"t":"fix","q":"I have also seen that movie yesterday.","key":["I have also seen that movie."],"why":"Present Perfect ('have seen') is not used with specific past time markers like 'yesterday'; remove 'yesterday' or change tense."},{"t":"fix","q":"She works hard and she works hard.","key":["She works hard."],"why":"Avoid repetition; the adverb 'hard' is sufficient to describe her work ethic."},{"t":"fa","q":"او به آرامی صحبت می‌کند.","key":["She speaks softly."],"why":"The Persian phrase 'به آرامی' translates to the adverb 'softly' describing the manner of speaking."},{"t":"fa","q":"او هر روز ورزش می‌کند.","key":["She exercises every day."],"why":"'هر روز' translates to 'every day', an adverb of frequency/time that can be placed at the end of the sentence."},{"t":"fa","q":"او به سختی می‌تواند بخواند.","key":["She can hardly read."],"why":"'به سختی' in this context means 'almost not', which translates to 'hardly', placed before the main verb."}]},{"id":"t17","t":"Modals and Semi-Modals","tf":"افعال کمکی ناقص","parts":[{"lv":"B","title":"Basic Modals: can / could / must / have to","exp":[{"h":"Ability and Permission (Can / Could)","b":"You use can to show ability in the present or to ask for permission. Could is the past form of can, which you use to talk about general ability in the past or to make polite requests.","hf":"توانایی و اجازه (Can / Could)","bf":"از can برای بیان توانایی در زمان حال و اجازه دادن استفاده می‌شود. could شکل گذشته‌ی can است که برای توانایی در گذشته یا درخواست مودبانه کاربرد دارد.","ex":[{"e":"I can speak Persian.","p":"من می‌توانم فارسی صحبت کنم."},{"e":"Could you help me?","p":"آیا می‌توانید به من کمک کنید؟"}]},{"h":"Obligation and Necessity (Must / Have to)","b":"Must shows internal obligation or strong personal importance, while have to is usually used for external rules or facts. Both help you express duties, but the source of the obligation differs.","hf":"الزام و اجبار (Must / Have to)","bf":"must نشان‌دهنده‌ی اجبار داخلی یا اهمیت زیاد است، در حالی که have to معمولاً برای قوانین خارجی یا اجبار بیرونی به کار می‌رود. هر دو برای بیان وظیفه استفاده می‌شوند.","ex":[{"e":"You must wear a seatbelt.","p":"باید کمربند ایمنی ببندید."},{"e":"I have to work tomorrow.","p":"من فردا باید کار کنم."}]},{"h":"Past Ability (Could)","b":"When you want to say that someone had the ability to do something in the past, you use could. This past form of can is perfect for describing general skills you had before.","hf":"توانایی در گذشته (Could)","bf":"وقتی می‌خواهیم بگوییم کسی در گذشته توانایی انجام کاری را داشته است، از could استفاده می‌کنیم. این شکل گذشته‌ی can است و برای مهارت‌های عمومی در گذشته کاربرد دارد.","ex":[{"e":"She could swim when she was five.","p":"او وقتی پنج ساله بود می‌توانست شنا کند."},{"e":"They could not hear us.","p":"آن‌ها نمی‌توانستند ما را بشنوند."}]}],"tip":"Remember that must is for internal obligation and have to is for external rules, though they are often used interchangeably in casual speech.","tipf":"توجه کنید که must برای اجبار داخلی و have to برای اجبار بیرونی استفاده می‌شود، اما در گفتگوهای روزمره اغلب به جای هم به کار می‌روند.","bad":[{"b":"I can spoke Persian.","g":"I can speak Persian.","w":"After can, the verb appears in its base form and does not take an ed ending.","wf":"بع�� از can فعل به صورت ساده می‌آید و ed نمی‌گیرد."},{"b":"I must to go now.","g":"I must go now.","w":"After must, the word to does not appear, and the verb stays in its base form.","wf":"بعد از must حرف to قرار نمی‌گیرد و فعل به صورت ساده می‌آید."},{"b":"She can swam yesterday.","g":"She could swim yesterday.","w":"For past ability, you use could, not can.","wf":"برای توانایی در گذشته از could استفاده می‌شود، نه can."}],"gold":[{"e":"Can and could are followed by the base form of the verb without to.","f":"کان و کولد با شکل پایه فعل بدون to می‌آیند."},{"e":"Must is also followed by the base form of the verb without to.","f":"مست هم با شکل پایه فعل بدون to می‌آید."},{"e":"Use could for general past abilities, not can.","f":"برای توانایی‌های کلی در گذشته از کولد استفاده کنید، نه کان."}]},{"lv":"B","title":"can / can't (ability and possibility)","exp":[{"h":"Expressing Ability","b":"We use 'can' to talk about skills or abilities you have. For example, you can swim if you know how. 'Can't' shows you do not have that skill right now.","hf":"بیان توانایی","bf":"ما از can برای صحبت درباره مهارت‌ها یا توانایی‌هایی که دارید استفاده می‌کنیم. برای مثال، اگر شنا کردن را بلدید، می‌توانید شنا کنید. can't نشان می‌دهد که شما در حال حاضر آن مهارت را ندارید.","ex":[{"e":"I can speak English well.","p":"من می‌توانم انگلیسی را خوب صحبت کنم."},{"e":"She can't play the piano.","p":"او نمی‌تواند پیانو بنوازد."}]},{"h":"General Possibility","b":"You can also use 'can' to say that something is possible in general. It is not about a specific time, but about what is possible in nature or rules.","hf":"امکان کلی","bf":"همچنین می‌توانید از can برای بیان این که چیزی به طور کلی امکان‌پذیر است استفاده کنید. این کاربرد درباره زمان خاصی نیست، بلکه درباره چیزی است که بر اساس طبیعت یا قوانین ممکن است.","ex":[{"e":"It can be very cold in winter here.","p":"اینجا در زمستان می‌تواند خیلی سرد باشد."},{"e":"You can find good food in this city.","p":"شما می‌توانید در این شهر غذای خوب پیدا کنید."}]},{"h":"Simple Structure","b":"The structure is very simple: Subject + can/can't + verb. Do not add 'to' before the verb, and do not change the verb form for he, she, or it.","hf":"ساختار ساده","bf":"ساختار بسیار ساده است: فاعل + can/can't + فعل. قبل از فعل 'to' اضافه نکنید و شکل فعل را برای he، she یا it تغییر ندهید.","ex":[{"e":"They can come tomorrow.","p":"آنها می‌توانند فردا بیایند."},{"e":"He can't see the board clearly.","p":"او نمی‌تواند تخته را به وضوح ببیند."}]}],"tip":"Remember that 'can' never changes form. It is always 'can' for I, you, he, she, it, we, and they.","tipf":"به یاد داشته باشید که 'can' هرگز تغییر شکل نمی‌دهد. این واژه برای I، you، he، she، it، we و they همیشه به شکل 'can' می‌آید.","bad":[{"b":"I can to swim.","g":"I can swim.","w":"We do not use 'to' after 'can'.","wf":"ما بعد از 'can' از 'to' استفاده نمی‌کنیم."},{"b":"She cans run fast.","g":"She can run fast.","w":"'Can' does not take an 's' for third person singular.","wf":"'can' برای سوم شخص مفرد پسوند 's' نمی‌گیرد."},{"b":"Can you speaks French?","g":"Can you speak French?","w":"The verb after 'can' stays in its base form.","wf":"فعل بعد از 'can' در شکل پایه خود باقی می‌ماند."}],"gold":[{"e":"Can is a modal verb and never changes its form.","f":"can یک فعل وجهی است و هرگز شکل خود را تغییر نمی‌دهد."},{"e":"Use 'can' for ability and general possibility.","f":"برای بیان توانایی و امکان کلی از 'can' استفاده کنید."},{"e":"Never add 'to' after 'can' or 'can't'.","f":"هرگز بعد از 'can' یا 'can't' از 'to' استفاده نکنید."}]},{"lv":"B","title":"could (past ability) and requests","exp":[{"h":"Past Ability","b":"Use 'could' to talk about general skills you had in the past. It is the past form of 'can'. For example, if you learned to swim when you were young, you can say you could swim.","hf":"توانایی گذشته","bf":"برای صحبت درباره مهارت‌های کلی که در گذشته داشتید، از 'could' استفاده کنید. این شکل گذشته 'can' است. برای مثال، اگر زمانی که جوان بودید شنا یاد گرفتید، می‌توانید بگویید که می‌توانستید شنا کنید.","ex":[{"e":"I could run very fast when I was a child.","p":"من وقتی بچه بودم می‌توانستم خیلی سریع بدوم."},{"e":"She could speak three languages fluently.","p":"او می‌توانست سه زبان را روان صحبت کند."}]},{"h":"Polite Requests","b":"We use 'could' to make polite requests in the present or future. It sounds softer and more formal than 'can'. This is very useful in professional settings or when asking strangers for help.","hf":"درخواست‌های مودبانه","bf":"ما از 'could' برای درخواست‌های مودبانه در حال یا آینده استفاده می‌کنیم. این لحن نرم‌تر و رسمی‌تر از 'can' است. این در محیط‌های کاری یا وقتی که از غریبه‌ها کمک می‌خواهید بسیار مفید است.","ex":[{"e":"Could you please close the window?","p":"آیا می‌توانید لطفاً پنجره را ببندید؟"},{"e":"Could I borrow your pen for a moment?","p":"آیا می‌توانم خودکارتان را برای لحظه‌ای قرض بگیرم؟"}]},{"h":"Negative Form","b":"Remember that 'could not' (couldn't) is used for both past inability and present/future polite refusal or impossibility. The form does not change based on the subject.","hf":"شکل منفی","bf":"به یاد داشته باشید که 'could not' (couldn't) برای عدم توانایی در گذشته و همچنین رد یا عدم امکان مودبانه در حال یا آینده استفاده می‌شود. شکل فعل بر اساس فاعل تغییر نمی‌کند.","ex":[{"e":"I couldn't lift the heavy box yesterday.","p":"من دیروز نتوانستم آن جعبه سنگین را بلند کنم."},{"e":"I couldn't attend the meeting tomorrow.","p":"من نمی‌توانم در جلسه فردا شرکت کنم."}]}],"tip":"Don't use 'could' for a single specific achievement in the past; use 'was/were able to' instead.","tipf":"برای یک دستاورد خاص در گذشته از 'could' استفاده نکنید؛ به جای آن از 'was/were able to' استفاده کنید.","bad":[{"b":"I could to swim when I was five.","g":"I could swim when I was five.","w":"After 'could', we do not use 'to'. It is followed directly by the base verb.","wf":"بعد از 'could'، ما از 'to' استفاده نمی‌کنیم. این فعل مستقیماً با فعل پایه دنبال می‌شود."},{"b":"Could you to help me?","g":"Could you help me?","w":"In questions with 'could', the subject comes after 'could', and the main verb has no 'to'.","wf":"در سوالات با 'could'، فاعل بعد از 'could' می‌آید و فعل اصلی 'to' ندارد."},{"b":"She couldn't to drive the car.","g":"She couldn't drive the car.","w":"Similar to the positive form, 'couldn't' is followed by the base verb without 'to'.","wf":"مشابه حالت مثبت، 'couldn't' با فعل پایه بدون 'to' دنبال می‌شود."}],"gold":[{"e":"Could is followed by the base form of the verb without 'to'.","f":"بعد از Could شکل پایه فعل بدون 'to' می‌آید."},{"e":"Use 'could' for general past abilities, not for one-time past successes.","f":"برای توانایی‌های کلی در گذشته از 'could' استفاده کنید، نه برای موفقیت‌های یک‌باره در گذشته."},{"e":"'Could' is more polite than 'can' when making requests.","f":"'Could' هنگام درخواست کردن مودبانه‌تر از 'can' است."}]},{"lv":"B","title":"may / might (possibility)","exp":[{"h":"Using 'may' for possible situations","b":"You can use 'may' to talk about something that is possible but not certain. It is a polite and formal way to express possibility in English. Think of it as saying there is a chance something will happen.","hf":"استفاده از 'may' برای موقعیت‌های ممکن","bf":"شما می‌توانید از 'may' برای صحبت درباره چیزی که ممکن است اما قطعی نیست استفاده کنید. این یک راه مودبانه و رسمی برای بیان احتمال در انگلیسی است. آن را به عنوان این فرض در نظر بگیرید که شانس رخ دادن چیزی وجود دارد.","ex":[{"e":"It may rain later today.","p":"امروز عصر ممکن است باران ببارد."},{"e":"She may be at home right now.","p":"او ممکن است الان در خانه باشد."}]},{"h":"Using 'might' for weaker possibility","b":"Use 'might' when you think something is less likely to happen than with 'may'. It suggests a slightly lower chance. It is also very common in spoken English for polite suggestions.","hf":"استفاده از 'might' برای احتمال ضعیف‌تر","bf":"از 'might' زمانی استفاده کنید که فکر می‌کنید احتمال وقوع چیزی کمتر از 'may' است. این نشان‌دهنده شانس کمی کمتر است. همچنین در انگلیسی گفتاری برای پیشنهادهای مودبانه بسیار رایج است.","ex":[{"e":"I might go to the party tonight.","p":"شاید امشب به مهمانی بروم."},{"e":"He might not understand the question.","p":"او شاید سوال را متوجه نشود."}]},{"h":"Past possibility with 'might have'","b":"To talk about a possibility in the past that did not happen or is uncertain, use 'might have' plus the past participle. This helps you speculate about past events.","hf":"احتمال در گذشته با 'might have'","bf":"برای صحبت درباره احتمالی در گذشته که نامشخص است یا معلوم نیست رخ داده باشد یا خیر، از 'might have' به همراه اسم مفعول (قسمت سوم فعل) استفاده کنید. این ساختار به شما کمک می‌کند درباره رویدادهای گذشته حدس و گمان بزنید.","ex":[{"e":"She might have forgotten the meeting.","p":"او ممکن است جلسه را فراموش کرده باشد."},{"e":"They might have taken the wrong bus.","p":"آن‌ها ممکن است اتوبوس را اشتباه سوار شده باشند."}]}],"tip":"Remember that 'may' and 'might' are followed by the base form of the verb without 'to'.","tipf":"به یاد داشته باشید که بعد از 'may' و 'might' از شکل پایه فعل بدون 'to' استفاده می‌شود.","bad":[{"b":"She may to go to the store.","g":"She may go to the store.","w":"After 'may', we do not use 'to'. The verb stays in its base form.","wf":"بعد از 'may' از 'to' استفاده نمی‌کنیم. فعل در شکل پایه خود می‌ماند."},{"b":"He mights be tired.","g":"He might be tired.","w":"'Might' does not change for third person singular. It stays 'might' for all subjects.","wf":"کلمه 'might' برای سوم‌شخص مفرد تغییر نمی‌کند و برای همه فاعل‌ها به همین شکل باقی می‌ماند."},{"b":"I might have went to the park.","g":"I might have gone to the park.","w":"After 'have', use the past participle (gone), not the past simple (went).","wf":"بعد از 'have' باید از اسم مفعول (gone) استفاده کنید، نه گذشته ساده (went)."}],"gold":[{"e":"May and might are followed by the base verb without 'to'.","f":"بعد از may و might از فعل پایه بدون 'to' استفاده می‌شود."},{"e":"Use 'might have' plus past participle for past possibilities.","f":"برای بیان احتمالات گذشته از 'might have' به همراه اسم مفعول استفاده کنید."},{"e":"'Might' often suggests a slightly lower probability than 'may'.","f":"کلمه 'might' اغلب احتمال کمتری را نسبت به 'may' نشان می‌دهد."}]},{"lv":"B","title":"must / mustn't","exp":[{"h":"Strong Obligation","b":"Use must when you need to do something because it is necessary or required. It often comes from your own decision or a strong feeling. For example, you must wear a helmet on a motorcycle for safety.","hf":"الزام قوی","bf":"وقتی کاری لازم است یا انجام آن ضروری است، از must استفاده می‌کنیم. این الزام معمولاً ناشی از تصمیم شخصی یا احساس مسئولیتی قوی است. برای مثال، برای ایمنی باید روی موتور کلاه ایمنی بپوشید.","ex":[{"e":"You must show your passport at the border.","p":"باید پاسپورت خود را در مرز نشان دهید."},{"e":"I must study harder for the exam.","p":"باید برای امتحان بیشتر درس بخوانم."}]},{"h":"Prohibition","b":"Use mustn't to say that something is not allowed or is a bad idea. It is a strong warning. For instance, you mustn't smoke in the hospital.","hf":"ممنوعیت","bf":"برای بیان اینکه کاری مجاز نیست یا ممنوع است، از mustn't استفاده کنید. این یک هشدار قوی است. برای مثال، در بیمارستان نباید سیگار بکشید.","ex":[{"e":"You mustn't park here.","p":"نباید اینجا پارک کنید."},{"e":"We mustn't be late for the meeting.","p":"نباید برای جلسه دیر برسیم."}]},{"h":"No Obligation vs Prohibition","b":"Remember that mustn't means it is forbidden. If there is no obligation, use don't have to. You can do it if you want, but you don't need to.","hf":"تفاوت عدم الزام و ممنوعیت","bf":"به یاد داشته باشید که mustn't یعنی چیزی ممنوع است. اگر الزامی برای انجام کاری وجود ندارد، از don't have to استفاده کنید؛ یعنی اگر خواستید می‌توانید آن را انجام دهید، اما مجبور نیستید.","ex":[{"e":"You mustn't eat in the library.","p":"نباید در کتابخانه غذا بخورید."},{"e":"You don't have to bring food, but you can.","p":"نیازی نیست غذا بیاورید، اما می‌توانید بیاورید."}]}],"tip":"Use mustn't for rules and warnings, but don't use mustn't for things that are not necessary.","tipf":"از mustn't برای قوانین و هشدارها استفاده کنید، اما برای کارهایی که انجام دادنشان ضروری نیست (نبود الزام)، از آن استفاده نکنید.","bad":[{"b":"You must to wear a uniform.","g":"You must wear a uniform.","w":"After must, we do not use 'to'. It is followed by the base form of the verb.","wf":"بعد از must از کلمه 'to' استفاده نمی‌کنیم و فعل به صورت ساده (پایه) می‌آید."},{"b":"You mustn't to park here.","g":"You mustn't park here.","w":"Similarly, after mustn't, we use the base verb without 'to'.","wf":"به همین ترتیب، بعد از mustn't نیز فعل پایه را بدون 'to' به کار می‌بریم."},{"b":"I mustn't go to school today because I am sick.","g":"I don't have to go to school today because I am sick.","w":"If you are sick, you are not obliged to go, but it is not forbidden. Use don't have to for lack of obligation.","wf":"اگر بیمار هستید، رفتن به مدرسه برایتان اجباری نیست، اما ممنوع هم نیست. برای نشان دادن نبود الزام، از don't have to استفاده کنید."}],"gold":[{"e":"Must is followed by the base form of the verb without 'to'.","f":"فعل must با شکل پایه و بدون 'to' می‌آید."},{"e":"Mustn't indicates prohibition or a strong recommendation against something.","f":"کلمه mustn't نشان‌دهنده ممنوعیت یا هشدار جدی برای انجام ندادن کاری است."},{"e":"Use don't have to when there is no obligation, not mustn't.","f":"وقتی کاری اجباری نیست، از don't have to استفاده کنید، نه از mustn't."}]},{"lv":"B","title":"have to / has to","exp":[{"h":"Understanding External Obligation","b":"We use 'have to' or 'has to' when an outside force, rule, or situation forces us to do something. It is not necessarily your own choice, but a requirement from the world around you. For example, you must wear a seatbelt because the law says so.","hf":"درک الزام بیرونی","bf":"ما از 'have to' یا 'has to' زمانی استفاده می‌کنیم که یک نیروی خارجی، قانون یا موقعیت، ما را مجبور به انجام کاری می‌کند. این لزوماً انتخاب خود شما نیست، بلکه الزامی از سوی محیط اطراف است. برای مثال، شما باید کمربند ایمنی ببندید زیرا قانون این‌گونه حکم می‌کند.","ex":[{"e":"I have to wear a uniform at work.","p":"من باید در محل کار یونیفرم بپوشم."},{"e":"She has to pay a fine for speeding.","p":"او باید جریمه سرعت غیرمجاز را بپردازد."}]},{"h":"Forming the Present Simple","b":"In the present simple tense, remember that 'has to' is used only for he, she, and it. For all other subjects like I, you, we, and they, use 'have to'. This is a crucial grammatical rule to master.","hf":"ساخت زمان حال ساده","bf":"در زمان حال ساده، به یاد داشته باشید که 'has to' فقط برای he، she و it استفاده می‌شود. برای سایر فاعل‌ها مانند I، you، we و they، از 'have to' استفاده کنید. این یک قانون دستوری بسیار مهم است.","ex":[{"e":"We have to finish the project today.","p":"ما باید امروز پروژه را تمام کنیم."},{"e":"He has to leave early tomorrow.","p":"او باید فردا زود برود."}]},{"h":"Negatives and Questions","b":"To make negative sentences, add 'not' after 'have' or 'has'. For questions, use 'Do' or 'Does' at the beginning. Notice that the main verb 'have' changes form, but the auxiliary verb 'do/does' carries the tense.","hf":"منفی کردن و ساخت جملات سؤالی","bf":"برای ساخت جملات منفی، از don't have to یا doesn't have to استفاده کنید (توجه کنید که ساختار منفی عدم الزام با ساختار منع متفاوت است). برای پرسشی کردن، از Do یا Does در ابتدای جمله استفاده کنید. به یاد داشته باشید که در این حالت، فعل اصلی همیشه به صورت 'have' باقی می‌ماند.","ex":[{"e":"You don't have to come if you are busy.","p":"اگر مشغول هستید، مجبور نیستید بیایید."},{"e":"Does she have to work on Sundays?","p":"آیا او باید روزهای یکشنبه کار کند؟"}]}],"tip":"Remember that 'have to' changes to 'has to' only in the third person singular (he/she/it). In all other cases, stick with 'have to'.","tipf":"به یاد داشته باشید که 'have to' فقط در سوم شخص مفرد (he/she/it) به 'has to' تبدیل می‌شود. در تمام موارد دیگر، از 'have to' استفاده کنید.","bad":[{"b":"She has to go to school yesterday.","g":"She had to go to school yesterday.","w":"The sentence is in the past tense, so you must use 'had to' instead of 'has to'.","wf":"جمله در زمان گذشته است، بنابراین باید به جای 'has to' از 'had to' استفاده کنید."},{"b":"Do he has to study more?","g":"Does he have to study more?","w":"When using 'Does' for questions, the main verb reverts to its base form 'have', not 'has'.","wf":"هنگام استفاده از 'Does' برای جملات سؤالی، فعل اصلی به شکل پایه خود یعنی 'have' برمی‌گردد، نه 'has'."},{"b":"I doesn't have to pay.","g":"I don't have to pay.","w":"For the subject 'I', the correct auxiliary verb is 'don't', not 'doesn't'.","wf":"برای فاعل 'I'، فعل کمکی صحیح 'don't' است، نه 'doesn't'."}],"gold":[{"e":"Use 'have to' for general obligations and 'has to' for third-person singular subjects in the present tense.","f":"برای الزامات عمومی از 'have to' و برای فاعل‌های سوم شخص مفرد در زمان حال از 'has to' استفاده کنید."},{"e":"In the past tense, always use 'had to' regardless of the subject.","f":"در زمان گذشته، صرف نظر از نوع فاعل، همیشه از 'had to' استفاده کنید."},{"e":"In questions and negatives, the auxiliary 'do/does/did' carries the tense, so 'have' remains in its base form.","f":"در جملات سؤالی و منفی، فعل کمکی 'do/does/did' زمان را نشان می‌دهد، بنابراین 'have' به صورت شکل پایه باقی می‌ماند."}]},{"lv":"B","title":"should / shouldn't (advice)","exp":[{"h":"Giving Advice","b":"We use 'should' to give advice or suggest something is a good idea. It is a friendly way to tell someone what they ought to do. For example, if your friend is tired, you might say they should rest.","hf":"نصیحت دادن","bf":"ما از 'should' برای نصیحت کردن یا پیشنهاد دادن اینکه کاری ایده خوبی است استفاده می‌کنیم. این راهی دوستانه برای گفتن به کسی است که او باید چه کاری انجام دهد. برای مثال، اگر دوستت خسته است، ممکن است بگویی او باید استراحت کند.","ex":[{"e":"You should drink more water.","p":"تو باید بیشتر آب بنوشی."},{"e":"She should study harder for the exam.","p":"او باید برای امتحان بیشتر درس بخواند."}]},{"h":"Negative Advice","b":"To advise someone not to do something, we use 'shouldn't'. This is short for 'should not'. It tells the person that an action is a bad idea or might cause problems.","hf":"نصیحت منفی","bf":"برای نصیحت کردن کسی که کاری را انجام ندهد، از 'shouldn't' استفاده می‌کنیم. این مخفف 'should not' است. این به شخص می‌گوید که یک عمل ایده بدی است یا ممکن است مشکل ایجاد کند.","ex":[{"e":"You shouldn't eat too much sugar.","p":"تو نباید زیاد شکر بخوری."},{"e":"He shouldn't drive so fast.","p":"او نباید آنقدر سریع رانندگی کند."}]},{"h":"Asking for Advice","b":"You can ask for advice by using the question form. We put 'should' before the subject. This is useful when you are unsure about what to do.","hf":"درخواست نصیحت","bf":"می‌توانید با استفاده از فرم سوالی نصیحت بخواهید. ما 'should' را قبل از فاعل قرار می‌دهیم. این زمانی مفید است که درباره اینکه چه کاری انجام دهید مطمئن نیستید.","ex":[{"e":"What should I wear to the party?","p":"من باید برای مهمانی چه بپوشم؟"},{"e":"Should we call him now?","p":"آیا باید الان به او زنگ بزنیم؟"}]}],"tip":"Remember that 'should' never changes form. It is always 'should', never 'shoulds' or 'shoulded'.","tipf":"به یاد داشته باشید که 'should' هیچ تغییری در شکل خود ندارد. همیشه 'should' است، نه 'shoulds' یا 'shoulded'.","bad":[{"b":"You shoulds go to bed early.","g":"You should go to bed early.","w":"We do not add 's' to 'should' for he, she, or it.","wf":"ما برای he، she یا it به 'should' پسوند 's' اضافه نمی‌کنیم."},{"b":"She should nots stay up late.","g":"She should not stay up late.","w":"The negative form is 'should not' or 'shouldn't', not 'should nots'.","wf":"شکل منفی 'should not' یا 'shouldn't' است، نه 'should nots'."},{"b":"Should you to eat vegetables?","g":"Should you eat vegetables?","w":"After 'should', we use the base form of the verb without 'to'.","wf":"بعد از 'should'، ما شکل پایه فعل را بدون 'to' استفاده می‌کنیم."}],"gold":[{"e":"Should is followed by the base form of the verb without 'to'.","f":"بعد از should شکل پایه فعل بدون 'to' می‌آید."},{"e":"Use 'shouldn't' to advise against doing something.","f":"از 'shouldn't' برای نصیحت کردن در مورد انجام ندادن چیزی استفاده کنید."},{"e":"The structure is Subject + should/shouldn't + verb.","f":"ساختار به این صورت است: فاعل + should/shouldn't + فعل."}]},{"lv":"I","title":"Modals of Deduction: must / might / can’t","exp":[{"h":"Deduction based on evidence and logic","b":"When you are almost certain that something is true in the present, you use must. Conversely, if you are sure that something is impossible, you use can't. In Persian, you would say 'it must be' for the first case and 'it is impossible that' for the second.","hf":"استنتاج بر اساس شواهد و منطق","bf":"وقتی صددرصد مطمئن هستیم که چیزی در زمان حال حقیقت دارد از must استفاده می‌کنیم. برعکس، اگر مطمئن باشیم که چیزی غیرممکن است، از can’t استفاده می‌کنیم. در زبان فارسی برای اولی از «حتماً باید... باشد» و برای دومی از «محال است... باشد» استفاده می‌کنیم.","ex":[{"e":"He has a new car and a big house. He must be very rich.","p":"او یک ماشین نو و یک خانه بزرگ دارد. او حتماً باید خیلی ثروتمند باشد."},{"e":"She lives in London, so she can’t be American.","p":"او در لندن زندگی می‌کند، بنابراین محال است آمریکایی باشد."}]},{"h":"Weak probability with might","b":"When you are not one hundred percent sure and only guess that something is true in the present, you use might. This word is equivalent to 'maybe' or 'perhaps' in Persian, and its level of certainty is lower than that of must.","hf":"احتمال ضعیف با might","bf":"وقتی ۱۰۰٪ مطمئن نیستیم و فقط احتمال می‌دهیم که چیزی در زمان حال درست باشد، از might استفاده می‌کنیم. این کلمه معادل «شاید» یا «ممکن است» در زبان فارسی است و میزان قطعیت آن کمتر از must است.","ex":[{"e":"I can’t find my keys. They might be in the kitchen.","p":"من کلیدهایم را پیدا نمی‌کنم. آن‌ها ممکن است در آشپزخانه باشند."},{"e":"Look at the clouds! It might rain this afternoon.","p":"به ابرها نگاه کن! امروز بعدازظهر ممکن است باران ببارد."}]}],"tip":"Remember that in negative deductions, you always use can't and never say must not be.","tipf":"توجه داشته باشید که در جملات استنتاجی منفی، همیشه از can’t استفاده می‌کنیم و هرگز نباید بگوییم must not be.","bad":[{"b":"She must not be at home, her car is gone.","g":"She can’t be at home, her car is gone.","w":"Persian speakers often use must not for negative deductions, whereas in English you must use can't to express impossibility.","wf":"فارسی‌زبانان معمولاً برای استنتاج منفی از must not استفاده می‌کنند، در حالی که در انگلیسی برای عدم امکان باید از can't استفاده شود."},{"b":"He might is tired after long work.","g":"He might be tired after a long work.","w":"After modal verbs like might, you must always use the base form of the verb, not an adjective or a bare verb.","wf":"بعد از فعل‌های کمکی مثل might همیشه باید شکل ساده فعل (مصدر بدون to) بیاید، نه صفت یا فعل خالی."},{"b":"It must to be true.","g":"It must be true.","w":"After the modal verbs must, can't, and might, you never use the preposition to.","wf":"بعد از فعل‌های کمکی must، can't و might هرگز از حرف اضافه to استفاده نکنید."}],"gold":[{"e":"Use can't for negative deductions, not must not.","f":"برای استنتاج منفی از can't استفاده کنید، نه must not."},{"e":"Always follow might, must, and can't with the base form of the verb.","f":"همیشه بعد از might، must و can't از شکل ساده فعل استفاده کنید."}]},{"lv":"I","title":"should / had better / need","exp":[{"h":"General Advice (Should)","b":"Use should when you want to give general advice or say that something is a good idea. It is a softer form than must and is perfect for making suggestions to friends or family.","hf":"توصیه عمومی (Should)","bf":"وقتی می‌خواهید توصیه کلی بدهید یا بگویید کاری خوب است، از should استفاده کنید. این شکل نرم‌تر از must است و برای مشورت عالی است.","ex":[{"e":"You should see a doctor.","p":"باید به دکتر مراجعه کنی."},{"e":"She should study harder.","p":"او باید بیشتر درس بخواند."}]},{"h":"Stronger Advice (Had better)","b":"Use had better when there is a risk or a bad consequence if the action is not taken. It is stronger than should and implies urgency or a warning about a specific situation.","hf":"توصیه قوی‌تر (Had better)","bf":"وقتی خطر یا عاقبت بدی در انتظار است و توصیه فوری می‌کنید، از had better استفاده کنید. این قوی‌تر از should است.","ex":[{"e":"You had better leave now.","p":"بهتر است الان بروی."},{"e":"He had better apologize.","p":"او بهتر است عذرخواهی کند."}]},{"h":"Need to be Done (Need doing)","b":"Use need followed by an -ing verb when something requires an action to be performed on it. This structure is active in form but passive in meaning, indicating that the object needs to be acted upon.","hf":"نیاز به انجام کار (Need doing)","bf":"وقتی می‌گویید چیزی نیاز به انجام دارد، از need + فعلing استفاده می‌کنیم. این ساختار به معنی مجهول است.","ex":[{"e":"The car needs washing.","p":"ماشین نیاز به شستن دارد."},{"e":"The house needs painting.","p":"خانه نیاز به نقاشی دارد."}]}],"tip":"Remember that had better is always followed by the base verb without to, while need doing implies that the action must be done to the subject.","tipf":"به یاد داشته باشید که had better همیشه با فعل ساده می‌آید (بدون to)، اما need doing به معنی نیاز به انجام شدن است.","bad":[{"b":"You had better to go.","g":"You had better go.","w":"You do not use to after had better, so saying had better to go is incorrect.","wf":"بعد از had better از to استفاده نمی‌شود."},{"b":"The car needs to wash.","g":"The car needs washing.","w":"When the subject is not doing the action itself, you must use need plus the -ing form to show that the action is done to it.","wf":"وقتی فاعل انجام‌دهنده نیست، باید از need + ing استفاده کنید."}],"gold":[{"e":"Had better is followed by the base verb without to.","f":"بعد از had better فعل به صورت پایه و بدون to می‌آید."},{"e":"Need doing means the subject needs an action to be done to it.","f":"need doing یعنی فاعل نیاز دارد که کاری روی آن انجام شود."},{"e":"Use should for general advice and had better for urgent warnings.","f":"برای توصیه عمومی از should و برای هشدارهای فوری از had better استفاده کنید."}]},{"lv":"I","title":"be able to / managed to (ability)","exp":[{"h":"General Ability in the Present","b":"Use 'can' or 'be able to' to talk about skills you have right now. While 'can' is more common in speech, 'be able to' is very useful because it has more tenses. It helps you sound natural when describing your general capabilities.","hf":"توانایی عمومی در زمان حال","bf":"برای صحبت درباره مهارت‌هایی که همین حالا دارید، از 'can' یا 'be able to' استفاده کنید. اگرچه 'can' در گفتار رایج‌تر است، اما 'be able to' بسیار مفید است زیرا زمان‌های بیشتری دارد. این کمک می‌کند وقتی درباره توانایی‌های کلی خود صحبت می‌کنید، طبیعی‌تر به نظر برسید.","ex":[{"e":"I am able to speak Persian fluently.","p":"من می‌توانم فارسی را روان صحبت کنم."},{"e":"She is not able to hear the noise outside.","p":"او نمی‌تواند صدای سر و صدا را از بیرون بشنود."}]},{"h":"Achieving Something with Effort","b":"Use 'managed to' when you succeed in doing something difficult after trying hard. It focuses on the specific success of an event, not just your general skill. This is perfect for telling stories about overcoming obstacles.","hf":"دست یافتن به چیزی با تلاش","bf":"وقتی پس از تلاش زیاد موفق می‌شوید کاری را انجام دهید، از 'managed to' استفاده کنید. این روی موفقیت خاص یک رویداد تمرکز دارد، نه فقط مهارت کلی شما. این برای تعریف داستان‌هایی درباره غلبه بر موانع عالی است.","ex":[{"e":"He managed to fix the car yesterday.","p":"او دیروز توانست ماشین را تعمیر کند."},{"e":"We managed to finish the project on time.","p":"ما توانستیم پروژه را به موقع تمام کنیم."}]},{"h":"Future and Past Abilities","b":"Remember that 'can' only has present and past forms. For the future or perfect tenses, you must use 'be able to'. This structure allows you to talk about ability in any time frame you need.","hf":"توانایی در آینده و گذشته","bf":"به یاد داشته باشید که 'can' فقط زمان حال و گذشته دارد. برای زمان‌های آینده یا کامل، باید از 'be able to' استفاده کنید. این ساختار به شما اجازه می‌دهد درباره توانایی در هر زمان‌بندی که نیاز دارید صحبت کنید.","ex":[{"e":"I will be able to help you tomorrow.","p":"من فردا می‌توانم به تو کمک کنم."},{"e":"She has been able to work from home since last year.","p":"او از سال گذشته توانسته است از خانه کار کند."}]}],"tip":"Use 'managed to' only for specific past events where you succeeded, not for general habits.","tipf":"از 'managed to' فقط برای رویدادهای خاص گذشته که در آن‌ها موفق شده‌اید استفاده کنید، نه برای عادت‌های کلی.","bad":[{"b":"I managed to speak Persian when I was a ch
