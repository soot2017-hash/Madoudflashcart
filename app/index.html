iting, use hedging adverbs like largely, tend to, and somewhat instead of absolute words like definitely or always.","tipf":"در نگارش آکادمیک، به جای استفاده از کلمات قطعی مثل definitely یا always، از قیدهای تعدیل‌کننده مانند largely, tend to و somewhat بهره ببرید.","bad":[{"b":"This is definitely the worst economic crisis in history.","g":"This is arguably one of the most severe economic crises in recent history.","w":"Using absolute words like definitely in general statements is unprofessional; you should soften them with arguably or one of.","wf":"استفاده از کلمات قطعی مانند definitely در ادشاهای کلی غیرحرفه‌ای است و باید با arguably یا one of تعدیل شود."},{"b":"I think this method is wrong.","g":"This method would appear to have certain limitations.","w":"Expressing personal opinion with I think is not recommended in formal academic texts; it is better to use hedging verbs.","wf":"بیان نظر شخصی با I think در متون رسمی آکادمیک توصیه نمی‌شود؛ بهتر است از افعال احتیاطی استفاده کنید."},{"b":"Maybe the data shows a mistake.","g":"It is possible that the data indicates an anomaly.","w":"Using informal words like Maybe lowers the level of your writing; instead, use It is possible.","wf":"استفاده از واژه‌های غیررسمی مانند Maybe سطح نگارش شما را پایین می‌آورد؛ به جای آن از It is possible استفاده کنید."}],"gold":[{"e":"Always soften your claims to sound more objective and professional.","f":"همیشه ادعاهای خود را تعدیل کنید تا حرفه‌ای‌تر و عینی‌تر به نظر برسید."},{"e":"Prefer passive structures in formal writing to maintain distance from your opinion.","f":"در نگارش رسمی برای حفظ فاصله از نظر شخصی خود از ساختارهای مجهول استفاده کنید."},{"e":"Avoid absolute words like definitely in general statements.","f":"از کلمات قطعی مانند definitely در جملات کلی پرهیز کنید."},{"e":"Use It is possible instead of Maybe for a more formal tone.","f":"به جای Maybe از It is possible برای لحن رسمی‌تر استفاده کنید."}]},{"lv":"A","title":"Hedging and precision: arguably / to some extent / broadly","exp":[{"h":"Using 'arguably' for strong but debatable claims","b":"Use 'arguably' when you want to say something is very likely true, but you know some people might disagree. It adds a polite tone to your argument. This is perfect for academic writing or professional discussions.","hf":"استفاده از 'arguably' برای ادعاهای قوی اما قابل بحث","bf":"از 'arguably' زمانی استفاده کنید که می‌خواهید بگویید چیزی به احتمال زیاد درست است، اما می‌دانید برخی ممکن است مخالفت کنند. این عبارت لحن محترمانه‌ای به استدلال شما می‌دهد. این برای نوشتار آکادمیک یا بحث‌های حرفه‌ای عالی است.","ex":[{"e":"This is arguably the best solution for our problem.","p":"این احتمالاً بهترین راه‌حل برای مشکل ماست."},{"e":"She is arguably the most talented player on the team.","p":"او احتمالاً بااستعدادترین بازیکن تیم است."}]},{"h":"Softening statements with 'to some extent'","b":"When you want to agree but not completely, use 'to some extent'. It shows that your statement is partially true. This helps avoid sounding too absolute or aggressive.","hf":"نرم کردن جملات با 'to some extent'","bf":"وقتی می‌خواهید موافقت کنید اما نه کاملاً، از 'to some extent' استفاده کنید. این نشان می‌دهد که بیان شما تا حدی درست است. این کمک می‌کند تا بیش از حد قطعی یا تهاجمی به نظر نرسید.","ex":[{"e":"The plan is effective to some extent.","p":"این طرح تا حدی مؤثر است."},{"e":"I agree with your point to some extent.","p":"من تا حدی با نظر شما موافقم."}]},{"h":"Generalizing with 'broadly'","b":"Use 'broadly' when describing a general trend or rule that has exceptions. It means 'in general' or 'mostly'. This is useful when you don't need to be 100% precise.","hf":"عمومیت بخشیدن با 'broadly'","bf":"از 'broadly' زمانی استفاده کنید که یک روند کلی یا قانون را توصیف می‌کنید که استثناهایی دارد. این به معنای 'به طور کلی' یا 'بیشتر' است. این زمانی مفید است که نیاز ندارید ۱۰۰٪ دقیق باشید.","ex":[{"e":"The results are broadly consistent with our expectations.","p":"نتایج به طور کلی با انتظارات ما همخوانی دارد."},{"e":"Broadly speaking, the economy is improving.","p":"به طور کلی، اقتصاد در حال بهبود است."}]}],"tip":"Always place these hedging words before the main verb or after the verb 'to be' to sound natural.","tipf":"همیشه این کلمات احتیاطی را قبل از فعل اصلی یا بعد از فعل 'to be' قرار دهید تا طبیعی به نظر برسید.","bad":[{"b":"This is arguably the best solution.","g":"This is arguably the best solution.","w":"The word 'arguably' is correctly placed here. A common mistake is placing it after the adjective, e.g., 'This is the best solution arguably.'","wf":"کلمه 'arguably' اینجا به درستی قرار داده شده است. یک اشتباه رایج این است که آن را بعد از صفت قرار دهند، مثلاً 'This is the best solution arguably.'"},{"b":"I agree to some extent with you.","g":"I agree with you to some extent.","w":"While understandable, it is more natural to place 'to some extent' at the end of the clause or after the verb phrase it modifies.","wf":"اگرچه قابل درک است، اما طبیعی‌تر است که 'to some extent' را در انتهای عبارت یا بعد از عبارت فعلی که آن را تغییر می‌دهد قرار دهید."},{"b":"Broadly the results are good.","g":"Broadly speaking, the results are good.","w":"Using 'broadly' alone at the start can sound abrupt. 'Broadly speaking' is the standard idiomatic phrase for introducing a generalization.","wf":"استفاده از 'broadly' به تنهایی در ابتدا می‌تواند ناگهانی به نظر برسد. 'Broadly speaking' عبارت اصطلاحی استاندارد برای معرفی یک عمومیت است."}],"gold":[{"e":"Use hedging to show academic humility and precision.","f":"از احتیاط (hedging) برای نشان دادن فروتنی و دقت آکادمیک استفاده کنید."},{"e":"'Arguably' implies that a strong argument exists for the statement.","f":"کلمه 'arguably' نشان می‌دهد که یک استدلال قوی برای این ادعا وجود دارد."},{"e":"'To some extent' allows for partial agreement without full commitment.","f":"عبارت 'To some extent' امکان موافقت جزئی را بدون تعهد کامل فراهم می‌کند."}]}],"ex":[{"t":"gap","q":"The results ___ suggest a correlation between the two variables.","key":["may"],"why":"Modal verbs like may are common hedging devices to express possibility in academic writing."},{"t":"gap","q":"It is ___ that the company should consider these factors.","key":["crucial"],"why":"Adjectives like crucial are often used in formal register to emphasize importance with hedging."},{"t":"fix","q":"The data seems to indicate that the hypothesis is correct.","key":["The data seem to indicate that the hypothesis is correct."],"why":"In formal academic English, 'data' is often treated as a plural noun requiring 'seem'."},{"t":"gap","q":"We ___ believe that further research is needed.","key":["tentatively"],"why":"Adverbs like tentatively soften the statement, indicating a cautious stance typical of hedging."},{"t":"fa","q":"به نظر می‌رسد که این روش کارآمدتر است.","key":["It appears that this method is more effective."],"why":"'Appears' is a standard hedging verb used to soften claims in formal contexts."},{"t":"gap","q":"The study ___ likely to produce significant results.","key":["is"],"why":"Using 'is likely to' is a common formal structure for expressing probability."},{"t":"fix","q":"I think that we should change the protocol.","key":["It is suggested that we change the protocol."],"why":"Changing 'I think' to passive or impersonal structures elevates the register for professional emails."},{"t":"gap","q":"The findings ___ appear to support the initial theory.","key":["appear"],"why":"Verbs like appear help hedge claims by suggesting evidence rather than absolute fact."},{"t":"fa","q":"احتمالاً این تغییرات نیاز به بررسی بیشتر دارند.","key":["These changes may require further review."],"why":"'May' is a appropriate modal verb for hedging in formal English to express possibility."},{"t":"gap","q":"It is ___ that we proceed with caution.","key":["advisable"],"why":"Adjectives like advisable are used in formal register to suggest recommendations softly."},{"t":"fix","q":"The manager believes that the project is on track.","key":["It is believed by the manager that the project is on track."],"why":"Passive voice is often used in formal writing to reduce the personal focus and increase objectivity."},{"t":"gap","q":"The evidence ___ points to a decline in performance.","key":["appears"],"why":"Using 'appears' instead of 'points' adds a layer of hedging appropriate for academic discussion."},{"t":"gap","q":"The results ___ suggest a strong correlation between the two variables.","key":["arguably"],"why":"'Arguably' is used to introduce a strong but debatable claim."},{"t":"gap","q":"The theory holds ___ true in most practical scenarios.","key":["broadly"],"why":"'Broadly' is used to generalize a statement without claiming it is universally true."},{"t":"gap","q":"We should proceed with caution, ___ to some extent.","key":["to some extent"],"why":"'To some extent' softens a statement by acknowledging partial validity."},{"t":"gap","q":"It is ___ that the new policy will require further review.","key":["arguably"],"why":"'Arguably' fits here to suggest a debatable but significant claim about the policy."},{"t":"fix","q":"The data clearly proves that the hypothesis is correct.","key":["The data suggests that the hypothesis is likely correct."],"why":"Hedging replaces absolute terms like 'clearly proves' with softer verbs like 'suggests' and adds 'likely' to reduce certainty."},{"t":"fix","q":"I think that the project is definitely going to fail.","key":["It appears that the project may fail."],"why":"Formal hedging replaces informal 'I think' and absolute 'definitely' with 'It appears' and 'may'."}]},{"id":"t41","t":"Ellipsis and Substitution","tf":"حذف و جانشینی","parts":[{"lv":"A","title":"Ellipsis and Substitution","exp":[{"h":"Using so and neither","b":"You can use so with a helping verb to agree with a positive statement, or neither or nor to agree with a negative one. This structure helps you avoid repeating words in your conversation.","hf":"استفاده از so و neither","bf":"برای تأیید یک جمله مثبت، از so به همراه فعل کمکی استفاده کنید. برای تأیید یک جمله منفی، از neither یا nor استفاده کنید. این ساختار از تکرار کلمات جلوگیری می‌کند.","ex":[{"e":"I like coffee. - So do I.","p":"من قهوه دوست دارم. - من هم."},{"e":"I don't like tea. - Neither do I.","p":"من چای دوست ندارم. - من هم نه."}]},{"h":"Omitting verbs in comparisons","b":"In comparisons using than or as, you can leave out the verb to make your sentence shorter. This works well when the verb has already been mentioned in the first part of the sentence.","hf":"حذف فعل در جملات مقایسه‌ای","bf":"در جملات مقایسه‌ای با than یا as، می‌توانیم افعال را حذف کنیم تا جمله کوتاه‌تر شود. این کار زمانی انجام می‌شود که فعل در بخش اول جمله ذکر شده باشد.","ex":[{"e":"She runs faster than I (do).","p":"او سریع‌تر از من می‌دود."},{"e":"I can swim better than he (can).","p":"من بهتر از او شنا می‌کنم."}]},{"h":"Substitution with one/ones and so","b":"Use one or ones to avoid repeating nouns, and use so for verb phrases. This is a great way to refer to things that have already been mentioned.","hf":"جایگزینی با one/ones و so","bf":"برای جلوگیری از تکرار اسم‌ها از one/ones و برای جملات فعلی از so استفاده کنید. این روش برای اشاره به چیزهای قبلاً ذکر شده عالی است.","ex":[{"e":"I need a pen. Do you have one?","p":"من به خودکار نیاز دارم. آیا یکی داری؟"},{"e":"I think she is coming. - I hope so.","p":"فکر می‌کنم او می‌آید. - امیدوارم چنین باشد."}]}],"tip":"In everyday conversations, omitting verbs makes your speech flow more naturally.","tipf":"در گفتگوهای روزمره، حذف افعال باعث روان‌تر شدن صحبت می‌شود.","bad":[{"b":"I like coffee. - So am I.","g":"I like coffee. - So do I.","w":"You must use do for regular verbs, not am.","wf":"برای فعل معمولی باید از do استفاده کنیم، نه am."},{"b":"She doesn't like tea. - Neither do I.","g":"She doesn't like tea. - Neither do I. (or: Nor do I)","w":"If the first sentence is negative, neither or nor is correct, but the helping verb must match the second subject.","wf":"اگر جمله اول منفی است، neither/nor درست است، اما فعل کمکی باید با فاعل دوم هماهنگ باشد."},{"b":"I like apples more than he.","g":"I like apples more than he (does).","w":"In formal comparisons, the second subject must be completed with the helping verb or omitted.","wf":"در مقایسه رسمی، فاعل دوم باید با فعل کمکی کامل شود یا حذف شود."}],"gold":[{"e":"Always match the helping verb in so or neither to the subject of the second clause.","f":"همیشه فعل کمکی در so یا neither را با فاعل بخش دوم مطابقت دهید."},{"e":"Use one or ones only for countable nouns to avoid repetition.","f":"برای جلوگیری از تکرار، فقط برای اسم‌های قابل شمارش از one یا ones استفاده کنید."},{"e":"Ensure the tense of the helping verb matches the tense of the original statement.","f":"مطمئن شوید که زمان فعل کمکی با زمان جمله اصلی مطابقت دارد."}]},{"lv":"A","title":"Ellipsis 2: reduced infinitives, so / not as substitutes","exp":[{"h":"Reduced infinitives after perception verbs","b":"When you use verbs like see, hear, or watch, you can drop the word 'to' before the next verb. This makes your speech sound more natural and fluent. It is a common pattern in everyday English conversation.","hf":"حذف مصدر با (bare infinitives) پس از افعال ادراکی","bf":"وقتی از افعالی مانند see، hear یا watch استفاده می‌کنید، می‌توانید کلمه 'to' را قبل از فعل بعدی حذف کنید. این کار گفتار شما را طبیعی‌تر و روان‌تر می‌کند. این یک الگوی رایج در مکالمات روزمره انگلیسی است.","ex":[{"e":"I saw him leave the house.","p":"من دیدم که او از خانه خارج شد."},{"e":"Did you hear her sing?","p":"آیا شنیدی که او آواز خواند؟"}]},{"h":"Using 'so' and 'not' as substitutes","b":"You can use 'so' to avoid repeating a positive statement, and 'not' for a negative one. This helps you speak more concisely. It is very useful in short responses.","hf":"استفاده از 'so' و 'not' به عنوان جایگزین","bf":"شما می‌توانید از 'so' برای جلوگیری از تکرار یک جمله مثبت و از 'not' برای یک جمله منفی استفاده کنید. این به شما کمک می‌کند مختصرتر صحبت کنید. این برای پاسخ‌های کوتاه بسیار مفید است.","ex":[{"e":"I think so.","p":"من فکر می‌کنم همین طور است."},{"e":"I hope not.","p":"امیدوارم اینطور نباشد."}]},{"h":"Ellipsis in coordinate clauses","b":"In sentences with 'and' or 'but', you can omit repeated words to avoid redundancy. This creates a smoother flow. It is a key feature of advanced English style.","hf":"حذف کلمات در جملات هم‌پایه","bf":"در جملاتی که با 'and' یا 'but' متصل می‌شوند، می‌توانید کلمات تکراری را حذف کنید تا از حشو و تکرار جلوگیری شود. این باعث روان‌تر شدن کلام می‌شود و ویژگی مهمی در نگارش طبیعی انگلیسی است.","ex":[{"e":"She can sing and (can) dance.","p":"او می‌تواند بخواند و برقصد."},{"e":"He is tired but (is) happy.","p":"او خسته است اما خوشحال است."}]}],"tip":"Always ensure the missing words can be clearly understood from the context to avoid confusion.","tipf":"همیشه مطمئن شوید که کلمات حذف‌شده برای جلوگیری از ابهام، به‌خوبی از طریق بافت جمله قابل درک هستند.","bad":[{"b":"I saw him to leave.","g":"I saw him leave.","w":"After perception verbs like 'see', we use the bare infinitive without 'to'.","wf":"پس از افعال ادراکی مانند 'see'، از مصدر بدون 'to' استفاده می‌شود."},{"b":"I think not so.","g":"I don't think so. / I think not.","w":"The standard negative form uses 'not' with the auxiliary verb or directly after 'think', not 'not so'.","wf":"شکل منفی استاندارد از 'not' همراه با فعل کمکی یا مستقیماً بعد از 'think' استفاده می‌کند، نه عبارت نادرست 'not so'."},{"b":"She can sing and she can dance.","g":"She can sing and dance.","w":"Repeating the subject and modal verb is unnecessary and less natural in this context.","wf":"تکرار فاعل و فعل کمکی در این زمینه غیرضروری و کمتر طبیعی است."}],"gold":[{"e":"Use bare infinitives after verbs of perception.","f":"از مصدر بدون 'to' پس از افعال ادراکی استفاده کنید."},{"e":"Use 'so' for positive substitution and 'not' for negative substitution.","f":"از 'so' برای جایگزینی مثبت و از 'not' برای جایگزینی منفی استفاده کنید."},{"e":"Omit repeated words in coordinate structures for brevity.","f":"برای اختصار، کلمات تکراری را در ساختارهای هم‌پایه حذف کنید."}]}],"ex":[{"t":"gap","q":"I like coffee, and my sister ___ too.","key":["does"],"why":"Use 'does' to substitute for 'likes' in positive sentences with 'so'."},{"t":"gap","q":"I don't like coffee, and my sister ___.","key":["doesn't either"],"why":"Use 'neither' or 'not either' to agree with a negative statement."},{"t":"fix","q":"She is taller than me is.","key":["She is taller than I am."],"why":"In formal comparisons, use the subject pronoun and the verb 'am' or 'is' if omitted in informal speech."},{"t":"gap","q":"I bought a new car, and he bought ___ one.","key":["a"],"why":"Use 'one' to substitute for a singular countable noun previously mentioned."},{"t":"fa","q":"من یک کتاب می‌خوانم و او هم یک کتاب می‌خواند.","key":["I am reading a book, and he is reading one too."],"why":"Use 'one' to avoid repeating the singular noun 'book'."},{"t":"gap","q":"The red shoes are nice, but I prefer the blue ___.","key":["ones"],"why":"Use 'ones' to substitute for plural countable nouns."},{"t":"fix","q":"He runs faster than I runs.","key":["He runs faster than I do."],"why":"Use 'do' to substitute for the verb 'runs' in comparisons to avoid repetition."},{"t":"gap","q":"Are you going to the party? - Yes, I ___.","key":["am"],"why":"Use the auxiliary verb 'am' to substitute for 'am going' in short answers."},{"t":"fa","q":"او دو تا سیب دارد و من دو تا سیب دارم.","key":["He has two apples, and I have two ones."],"why":"Use 'ones' to substitute for the plural noun 'apples'."},{"t":"gap","q":"I think it will rain, and I think she ___ too.","key":["does"],"why":"Use 'does' to substitute for 'thinks' in positive agreement."},{"t":"fix","q":"She likes apples more than I like oranges.","key":["She likes apples more than I do."],"why":"Use 'do' to substitute for 'like' to avoid repetition in comparisons."},{"t":"gap","q":"I have many friends, and she has ___ too.","key":["many"],"why":"Use 'many' to substitute for the quantifier 'many' in positive agreement."},{"t":"gap","q":"I expected him to arrive early, but he didn't ___.","key":["so"],"why":"Using 'so' to substitute for a positive clause in coordinate structures."},{"t":"gap","q":"She didn't finish the report, and neither ___ her colleague.","key":["did"],"why":"Using 'neither' with an inverted auxiliary verb for negative agreement."},{"t":"fix","q":"I saw him enter the room and I heard he leave.","key":["I saw him enter the room and I heard him leave."],"why":"Using the bare infinitive after perception verbs like 'see' and 'hear'."},{"t":"gap","q":"The weather was cold, but it wasn't as cold ___ yesterday.","key":["as"],"why":"Using 'as' in comparative structures for equality."},{"t":"fa","q":"من فکر می‌کنم او درست می‌گوید.","key":["I think so."],"why":"Using 'so' as a substitute for a positive clause after verbs of thinking."},{"t":"gap","q":"She has a red bag, and I have a blue ___.","key":["one"],"why":"Using 'one' as a substitute for a singular countable noun."},{"t":"fix","q":"He is not as tall as me is.","key":["He is not as tall as I am."],"why":"Using the correct pronoun and verb in formal comparisons."},{"t":"fa","q":"او نه تنها خواند، بلکه نوشت هم کرد.","key":["She not only read but wrote too."],"why":"Using 'not only... but also' structure with ellipsis of repeated verbs."}]},{"id":"t42","t":"Nominalization","tf":"اسمی‌سازی","parts":[{"lv":"A","title":"Nominalization","exp":[{"h":"Turning verbs into nouns for a formal tone","b":"In advanced and academic English, we often change verbs into nouns to make sentences more formal and concise. This shift helps focus on the idea or event itself rather than the person doing the action.","hf":"تبدیل افعال به اسم برای ساختار رسمی","bf":"در انگلیسی پیشرفته و آکادمیک، اغلب افعال را به اسم تبدیل می‌کنیم تا جمله رسمی‌تر و فشرده‌تر شود. این کار به متمرکز شدن روی «ایده یا رویداد» به‌ جای «انجام‌دهنده کار» کمک می‌کند.","ex":[{"e":"We analyzed the data carefully. -> Our careful analysis of the data was useful.","p":"ما داده‌ها را با دقت تحلیل کردیم. -> تحلیل دقیق داده‌های ما مفید بود."},{"e":"They decided to expand the factory. -> Their decision to expand the factory surprised us.","p":"آن‌ها تصمیم گرفتند کارخانه را توسعه دهند. -> تصمیم آن‌ها برای توسعه کارخانه ما را شگفت‌زده کرد."}]},{"h":"Using nouns in research reports","b":"In academic texts, using nouns instead of verbs makes sentences sound more objective. In this style, the human subject is usually removed or connected with prepositions like 'of'.","hf":"استفاده از اسم‌سازها در گزارش‌های پژوهشی","bf":"در متون دانشگاهی، استفاده از اسم‌ها به جای افعال باعث می‌شود جملات عینی‌تر (Objective) به نظر برسند. در این حالت، فاعل انسانی معمولاً حذف می‌شود یا با حروف اضافه مناسب مانند 'of' به اسم متصل می‌گردد.","ex":[{"e":"The government failed to act. -> The failure to act resulted in a crisis.","p":"دولت در اقدام کردن ناکام ماند. -> ناکامی در اقدام به یک بحران انجامید."},{"e":"The temperature increased rapidly. -> A rapid increase in temperature was observed.","p":"دما به سرعت افزایش یافت. -> افزایش سریعی در دما مشاهده شد."}]}],"tip":"Instead of building long sentences with regular verbs, try turning processes into nouns using suffixes like -tion, -ment, and -ance to make your writing style more academic.","tipf":"به جای ساختن جملات طولانی با فعل‌های معمولی، سعی کنید فرآیندها را با پسوندهایی مثل -tion، -ment و -ance به اسم تبدیل کنید تا سبک نگارش شما آکادمیک‌تر شود.","bad":[{"b":"The investigate of the crime took two weeks.","g":"The investigation of the crime took two weeks.","w":"Using the verb form instead of the noun form for investigate is incorrect because the correct noun suffix is -tion.","wf":"برای اسم‌ساز کردن فعل investigate، پسوند صحیح -tion است و استفاده از شکل فعلی به جای اسم اشتباه است."},{"b":"We need to make a decide about our project.","g":"We need to make a decision about our project.","w":"Decide must be converted to the noun decision, especially when it follows the verb make.","wf":"فعل decide باید به اسم decision تبدیل شود؛ به‌ویژه وقتی بعد از فعل make می‌آید."},{"b":"His arrive to the conference was delayed.","g":"His arrival at the conference was delayed.","w":"The noun for the verb arrive is arrival, not arrive used as a noun.","wf":"اسمِ فعل arrive کلمه arrival است، نه arrive به صورت اسم‌گونه."}],"gold":[{"e":"Always check if a verb can be turned into a noun with -tion or -ment to sound more professional.","f":"همیشه بررسی کنید که آیا می‌توان فعل را با پسوند -tion یا -ment به اسم تبدیل کرد تا حرفه‌ای‌تر به نظر برسد."},{"e":"Use nouns to make your writing sound more objective and less personal.","f":"از اسم‌ها استفاده کنید تا نوشته‌تان عینی‌تر و کمتر شخصی به نظر برسد."},{"e":"Remember that nouns like decision and arrival are the correct forms, not the base verbs.","f":"به یاد داشته باشید که decision و arrival شکل‌های صحیح هستند، نه افعال پایه."}]},{"lv":"A","title":"Nominalization in academic writing (advanced)","exp":[{"h":"Turning Verbs into Nouns","b":"In academic writing, we often change action words (verbs) into nouns to sound more formal. This process is called nominalization. It helps make your text more concise and objective by focusing on the concept rather than the person doing the action.","hf":"تبدیل افعال به اسم‌ها","bf":"در نوشتار آکادمیک، ما اغلب کلمات عمل (افعال) را به اسم تبدیل می‌کنیم تا لحن رسمی‌تری داشته باشیم. این فرآیند «اسمی‌سازی» نامیده می‌شود. این کار با تمرکز بر مفهوم به جای فردی که آن عمل را انجام می‌دهد، به مختصرتر و عینی‌تر شدن متن شما کمک می‌کند.","ex":[{"e":"The company expanded rapidly.","p":"شرکت به سرعت گسترش یافت."},{"e":"The rapid expansion of the company was notable.","p":"گسترش سریع شرکت قابل توجه بود."}]},{"h":"Using Nominalizations as Subjects","b":"Nominalized phrases often serve as the subject of a sentence. This structure allows you to pack more information into a single clause without using long verb phrases. It creates a denser, more sophisticated academic tone.","hf":"استفاده از اسمی‌سازی‌ها به عنوان فاعل","bf":"عبارات اسمی‌سازی‌شده اغلب به عنوان فاعل جمله عمل می‌کنند. این ساختار به شما اجازه می‌دهد اطلاعات بیشتری را در یک بند بدون استفاده از عبارات فعلی طولانی بگنجانید. این کار لحن آکادمیک متراکم‌تر و پیشرفته‌تری ایجاد می‌کند.","ex":[{"e":"They analyzed the data carefully.","p":"آنان داده‌ها را با دقت تحلیل کردند."},{"e":"The careful analysis of the data revealed key trends.","p":"تحلیل دقیق داده‌ها روندهای کلیدی را آشکار کرد."}]},{"h":"Nominalization with Prepositions","b":"When you nominalize a verb, you often need to add prepositions to connect it to other parts of the sentence. Common prepositions include 'of', 'on', 'in', and 'about'. These prepositions link the new noun to its object or complement.","hf":"اسمی‌سازی با حروف اضافه","bf":"هنگامی که یک فعل را اسمی‌سازی می‌کنید، اغلب لازم است حروف اضافه‌ای را برای اتصال آن به سایر بخش‌های جمله اضافه کنید. حروف اضافه رایج عبارتند از of، on، in و about. این حروف اضافه اسم جدید را به مفعول یا متمم آن متصل می‌کنند.","ex":[{"e":"She decided to accept the offer.","p":"او تصمیم گرفت پیشنهاد را بپذیرد."},{"e":"Her decision to accept the offer was surprising.","p":"تصمیم او برای پذیرش پیشنهاد تعجب‌برانگیز بود."}]}],"tip":"Try to identify verbs in your draft and convert them to nouns to see if the sentence becomes more formal.","tipf":"سعی کنید افعال را در پیش‌نویس خود شناسایی کنید و آن‌ها را به اسم تبدیل کنید تا ببینید آیا جمله رسمی‌تر می‌شود یا خیر.","bad":[{"b":"The expansion rapidly the company.","g":"The company expanded rapidly.","w":"Nominalization changes the structure. You cannot just move the noun to the subject position without adjusting the verb and adverb.","wf":"اسمی‌سازی ساختار جمله را تغییر می‌دهد. شما نمی‌توانید صرفاً بدون تنظیم فعل و قید، اسم را به جایگاه فاعل منتقل کنید."},{"b":"The analysis of data by them was good.","g":"Their analysis of the data was good.","w":"While grammatically possible, using 'by them' after a nominalized verb can be clunky. It is often better to use a possessive adjective like 'their' for smoother flow.","wf":"اگرچه از نظر دستوری ممکن است، اما استفاده از by them پس از یک فعل اسمی‌سازی‌شده می‌تواند ناخوشایند باشد. برای روانی بیشتر متن، معمولاً استفاده از صفت ملکی مانند their بهتر است."},{"b":"They made a decision that they would go.","g":"They decided to go.","w":"This is not a nominalization error per se, but it shows a failure to use the nominal form 'decision' effectively. The nominalized version would be 'Their decision to go was final.'","wf":"این ذاتاً یک خطای اسمی‌سازی نیست، اما نشان‌دهنده عدم استفاده مؤثر از شکل اسمی decision است. نسخه اسمی‌سازی‌شده مناسب‌تر به‌صورت Their decision to go was final خواهد بود."}],"gold":[{"e":"Nominalization shifts focus from the actor to the action or concept.","f":"اسمی‌سازی تمرکز را از انجام‌دهنده کار به عمل یا مفهوم منتقل می‌کند."},{"e":"Use prepositions like 'of' to connect nominalized verbs to their objects.","f":"از حروف اضافه‌ای مانند of برای اتصال افعال اسمی‌سازی‌شده به مفعول‌هایشان استفاده کنید."},{"e":"Nominalization creates a more objective and formal academic tone.","f":"اسمی‌سازی، لحنی آکادمیک، عینی‌تر و رسمی‌تر ایجاد می‌کند."}]}],"ex":[{"t":"gap","q":"The ___ of the experiment was surprising.","key":["result"],"why":"Turning the verb 'result' into the noun 'result' creates a formal subject."},{"t":"gap","q":"We observed a significant ___ in temperature.","key":["increase"],"why":"The verb 'increase' becomes the noun 'increase' to serve as the object."},{"t":"fix","q":"The researcher analyze the data carefully.","key":["The researcher analyzed the data carefully."],"why":"Change the verb 'analyze' to the noun 'analysis' for a more formal tone: 'The researcher performed an analysis of the data carefully.'"},{"t":"gap","q":"There was a complete ___ of the old system.","key":["replacement"],"why":"The verb 'replace' becomes the noun 'replacement' to describe the action as a concept."},{"t":"gap","q":"The ___ of the policy took several months.","key":["implementation"],"why":"The verb 'implement' becomes the noun 'implementation' to act as the subject."},{"t":"fix","q":"They make a decision about the budget.","key":["They made a decision about the budget."],"why":"While 'make a decision' is correct, nominalization often prefers 'They reached a decision' or 'The decision was made'. However, for this exercise, we focus on the noun form: 'They reached a decision about the budget.'"},{"t":"gap","q":"The ___ of the project was delayed.","key":["completion"],"why":"The verb 'complete' becomes the noun 'completion' to serve as the subject."},{"t":"fix","q":"The team compare the results.","key":["The team compared the results."],"why":"Change the verb 'compare' to the noun 'comparison' for a formal report: 'The team conducted a comparison of the results.'"},{"t":"gap","q":"We need a detailed ___ of the problem.","key":["analysis"],"why":"The verb 'analyze' becomes the noun 'analysis' to function as the object."},{"t":"gap","q":"The ___ of the study was published.","key":["publication"],"why":"The verb 'publish' becomes the noun 'publication' to act as the subject."},{"t":"fix","q":"She decide to leave early.","key":["She made a decision to leave early."],"why":"Nominalize 'decide' to 'decision' for a more formal tone: 'She made a decision to leave early.'"},{"t":"fa","q":"تحلیل داده‌ها زمان‌بر بود.","key":["The analysis of the data was time-consuming."],"why":"Translate the verb 'analyze' into the noun 'analysis' for a formal academic tone."},{"t":"gap","q":"The ___ of the data revealed a clear trend.","key":["analysis"],"why":"Nominalization: turning the verb 'analyze' into the noun 'analysis' to serve as the subject."},{"t":"gap","q":"We conducted a thorough ___ of the results.","key":["examination"],"why":"Nominalization: using the noun 'examination' instead of the verb 'examine' for a formal tone."},{"t":"fix","q":"The researcher decided to publish the findings.","key":["The researcher's decision to publish the findings was significant."],"why":"Nominalization: converting the verb 'decided' into the noun 'decision' to shift focus to the action itself."},{"t":"gap","q":"There was a rapid ___ in the population.","key":["growth"],"why":"Nominalization: using the noun 'growth' derived from the verb 'grow'."},{"t":"fix","q":"The team worked on the design of the bridge.","key":["The team's work on the design of the bridge was impressive."],"why":"Nominalization: turning the verb 'worked' into the noun 'work' to act as the subject."},{"t":"gap","q":"The ___ of the new software was successful.","key":["implementation"],"why":"Nominalization: using the noun 'implementation' from the verb 'implement'."},{"t":"fa","q":"تصمیم‌گیری دشوار بود.","key":["The decision-making process was difficult."],"why":"Nominalization: translating the Persian verb phrase into an English noun phrase 'decision-making' for academic style."},{"t":"gap","q":"The ___ of the experiment required patience.","key":["execution"],"why":"Nominalization: using the noun 'execution' derived from the verb 'execute'."}]},{"id":"t43","t":"Word Order and Adverb Position","tf":"ترتیب کلمات و جای قید","parts":[{"lv":"A","title":"Word Order and Adverb Position","exp":[{"h":"Position of Single Adverbs","b":"You should place single adverbs like usually or always before the main verb but after any helping verbs such as be or have. This structure is very common in English and helps you express habits or frequency naturally.","hf":"قیدهای تکی (مانند usually, always)","bf":"این قیدها معمولاً قبل از فعل اصلی و بعد از فعل کمکی (مانند be, have, can) قرار می‌گیرند. این ساختار در انگلیسی بسیار رایج است و برای بیان تکرار یا عادت استفاده می‌شود.","ex":[{"e":"I usually wake up early.","p":"من معمولاً زود بیدار می‌شوم."},{"e":"She is always late.","p":"او همیشه دیر می‌رسد."}]},{"h":"Splitting Infinitives","b":"In modern English, it is perfectly acceptable to put an adverb between the helping verb and the main verb. You can use this pattern to add extra emphasis to the adverb, making your point clearer.","hf":"جدا کردن افعال دو کلمه‌ای (Split Infinitives)","bf":"در انگلیسی مدرن، قرار دادن قید بین فعل کمکی و فعل اصلی کاملاً پذیرفته شده و رایج است. این کار برای تأکید بیشتر بر قید استفاده می‌شود.","ex":[{"e":"I really want to go.","p":"من واقعاً می‌خواهم بروم."},{"e":"She has completely finished the work.","p":"او کاملاً کار را تمام کرده است."}]},{"h":"Adverbs at the Start of Sentences","b":"Adverbs that show time or place, like yesterday or here, can go at the beginning of your sentence to grab attention. This position is useful for connecting to previous ideas or highlighting when or where something happens.","hf":"قیدهای موقعیتی در ابتدای جمله","bf":"قیدهایی که زمان یا مکان را نشان می‌دهند (مثل yesterday, here) می‌توانند در ابتدای جمله بیایند تا توجه را جلب کنند. این جایگاه برای ایجاد ارتباط با جمله قبل یا تأکید بر زمان/مکان استفاده می‌شود.","ex":[{"e":"Yesterday, we went to the park.","p":"دیروز، ما به پارک رفتیم."},{"e":"Here comes the bus.","p":"اتوبوس می‌آید."}]}],"tip":"Try to place frequency adverbs like usually before the main verb and after any helping verbs.","tipf":"سعی کنید قیدهای تکرار (مثل usually) را قبل از فعل اصلی و بعد از فعل کمکی قرار دهید.","bad":[{"b":"I wake up usually early.","g":"I usually wake up early.","w":"The adverb usually should come before the main verb wake up, not after it.","wf":"قید usually باید قبل از فعل اصلی wake up بیاید، نه بعد از آن."},{"b":"She is late always.","g":"She is always late.","w":"The adverb always should be placed before the adjective late and after the helping verb is.","wf":"قید always باید قبل از صفت late و بعد از فعل کمکی is قرار گیرد."},{"b":"I want to really go.","g":"I really want to go.","w":"While splitting the verb is common in modern English, placing the adverb before the helping verb want is more natural and frequent.","wf":"اگرچه جدا کردن فعل در انگلیسی مدرن رایج است، اما قرار دادن قید قبل از فعل کمکی (want) طبیعی‌تر و رایج‌تر است."}],"gold":[{"e":"Always put frequency adverbs before the main verb.","f":"همیشه قیدهای تکرار را قبل از فعل اصلی قرار دهید."},{"e":"You can split infinitives for emphasis in modern English.","f":"شما می‌توانید برای تأکید افعال را در انگلیسی مدرن جدا کنید."},{"e":"Start sentences with time or place adverbs to emphasize them.","f":"جمله‌ها را با قیدهای زمان یا مکان شروع کنید تا بر آن‌ها تأکید کنید."}]}],"ex":[{"t":"gap","q":"She ___ goes to school every day.","key":["always"],"why":"Adverbs of frequency like 'always' typically go before the main verb in positive sentences."},{"t":"gap","q":"___ yesterday, I saw a famous actor.","key":["Yesterday"],"why":"Adverbs of time can be placed at the start of a sentence for emphasis."},{"t":"fix","q":"She is quickly running to the bus.","key":["She is running quickly to the bus."],"why":"Adverbs of manner usually go after the main verb or at the end of the clause."},{"t":"gap","q":"He decided ___ to study harder.","key":["to"],"why":"This tests splitting the infinitive 'to study' by placing an adverb between 'to' and the verb."},{"t":"fa","q":"او معمولاً صبح زود بیدار می‌شود.","key":["He usually wakes up early."],"why":"Adverbs of frequency go before the main verb, and time adverbs go at the end."},{"t":"gap","q":"The team played ___ yesterday.","key":["well"],"why":"Adverbs of manner describing how something is done go after the verb."},{"t":"fix","q":"She always is late for class.","key":["She is always late for class."],"why":"With the verb 'to be', adverbs of frequency go after the verb."},{"t":"gap","q":"___, I don't agree with you.","key":["Honestly"],"why":"Sentence adverbs like 'honestly' often appear at the beginning of a sentence."},{"t":"fa","q":"او هرگز قهوه نمی‌خورد.","key":["He never drinks coffee."],"why":"Adverbs of frequency like 'never' go before the main verb."},{"t":"gap","q":"I want ___ to travel more.","key":["to"],"why":"This tests the split infinitive structure 'want to travel' with an implied adverb position or just the infinitive marker."},{"t":"fix","q":"He spoke very clearly the teacher.","key":["He spoke very clearly to the teacher."],"why":"Adverbs of manner usually precede the object or go at the end of the sentence."},{"t":"gap","q":"They ___ finished the project.","key":["have"],"why":"This tests the position of adverbs with auxiliary verbs, though 'have' is the auxiliary here, the adverb 'already' would go between 'have' and 'finished'."},{"t":"gap","q":"He ___ arrives at 9 AM.","key":["always"],"why":"Adverbs of frequency like 'always' typically go before the main verb in simple present tense."},{"t":"gap","q":"___, I think we should wait.","key":["Anyway"],"why":"Sentence adverbs like 'Anyway' are often placed at the beginning to transition topics or summarize."},{"t":"fix","q":"She is happily singing a song.","key":["She is singing a song happily."],"why":"While split infinitives are acceptable, adverbs of manner usually sound more natural at the end of the clause in this context."},{"t":"fix","q":"Yesterday, I have seen him.","key":["Yesterday, I saw him."],"why":"Specific past time markers like 'yesterday' require the Simple Past tense, not Present Perfect."},{"t":"fa","q":"او هرگز دیر نمی‌رسد.","key":["He never arrives late."],"why":"The adverb 'never' is placed before the main verb 'arrives' in affirmative sentences."},{"t":"fa","q":"شما معمولاً چه می‌کنید؟","key":["What do you usually do?"],"why":"The adverb 'usually' is placed after the auxiliary verb 'do' and before the main verb 'do'."},{"t":"gap","q":"I want to ___ to travel more.","key":["go"],"why":"This tests the split infinitive concept where the adverb 'more' is placed after the verb 'to travel'."},{"t":"gap","q":"They ___ have finished the work.","key":["already"],"why":"Adverbs like 'already' are placed between the auxiliary verb 'have' and the past participle 'finished'."}]}];

const POSES='noun|verb|adjective|adverb|phrasal verb|phrase|idiom|preposition|conjunction|pronoun|determiner|exclamation';
function parseLmText(t,w){
 t=String(t||'');const cut=t.search(/\bword of the day\b/i);if(cut>0)t=t.slice(0,cut);if(!t.trim())return {ipa:'',list:[]};
 const ipaM=t.match(/\/[^/\n]{1,60}\//);
 const lines=t.split(/\n/).map(x=>x.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const list=[];let pos='';
 const tailRx=w?new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*(of|for|to|with|away|on|from|in|about|between|upon|doing|sb|sth|that|whether|up|down|out|off|over|against|into|through)?\\s*$','i'):null;
 lines.forEach(L=>{
  if(/iaw\.|cmd\.push|googletag|window\.|function|THESAURUS|thesaurus/.test(L))return;
  L=L.replace(/^[\u2192\u25ba]/,'');
  if(/^(From Longman|Related topics|Word family|Explore|More results|Quizzes|Vocabulary|Topics|advertisement|Picture|Contents|Synonyms|see thesaurus|View thesaurus|collocations|Exercises|Advertisements|Copyright|About|Browse|Grammar|Click on the pictures|Verb table)/i.test(L))return;
  const pm=L.match(new RegExp('('+POSES+')\\s*$','i'));
  if(pm&&(L.length<60||L.includes('/')))pos=pm[1].toLowerCase();
  if(L.includes('\u25cf')||L.length<4)return;
  if(/[\u2192\u25ba]/.test(L))return;
  const num=L.match(/^(\d{1,2})\s*([[.,)\]]?)\s*(.*)$/);
  let work=(num&&num[3])?num[3]:L;
  if(tailRx&&tailRx.test(work)&&work.length<34&&work.toLowerCase().slice(0,w.length).toLowerCase()===w.toLowerCase()){
   const last=list[list.length-1];const tp=work.toLowerCase();
   if(last&&!last.prep.includes(tp))last.prep.push(tp.charAt(0).toUpperCase()+tp.slice(1));
   return;
  }
  if(/\.$/.test(work)&&work.length>25){
   let e=(tailRx?work.replace(tailRx,''):work).replace(/[.;]+$/,'').trim();
   e=e.split(/Grammar |Click on the pictures|Verb table/)[0].trim();
   const last=list[list.length-1];
   if(last){if(!last.e)last.e=e;else if(e.length>last.e.length&&e.length>40)last.e=e}
   return;
  }
  if(/Grammar|Click on the pictures|Verb table/.test(work))return;
  let d=(tailRx?work.replace(tailRx,''):work).replace(/[[\]()]/g,' ').replace(/\b[A-Z]{2,}\b/g,' ').replace(/\u25cf/g,' ').replace(/\d+/g,' ').replace(/\s+/g,' ').trim().replace(/^[^a-zA-Z]+/,'');
  let g=/(countable|uncountable|singular|plural|usually passive|no passive|not usually before noun|transitive|intransitive|spoken|written|intransitive|especially)[,\s]*/i;
  d=d.replace(g,'').replace(g,'').trim();
  if(d.length>220||/Grammar|Click on the pictures/.test(d))return;
  if(pos&&d.length>18&&/\s/.test(d)&&/^[a-z]/.test(d))list.push({pos,d,e:'',syn:[],ant:[],prep:[]});
 });
 const seen=new Set();
 return {ipa:ipaM?ipaM[0]:'',list:list.filter(s=>!seen.has(s.d)&&seen.add(s.d))};
}

function srcFromUrl(t){
 const s=String(t||'');
 if(/ldoceonline\.com/i.test(s))return 'Longman';
 if(/dictionary\.cambridge\.org/i.test(s))return 'Cambridge';
 if(/wordwebonline\.com/i.test(s))return 'WordWeb';
 if(/wiktionary\.org/i.test(s))return 'ویکیشنری';
 return '';
}

const SPTOP=['animals','food','travel','school','weather','health','sports','music','nature','technology','family','work','city','house','shopping'];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const blankWord=(txt,w)=>String(txt||'').replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),'____');
function meaningOf(c){const s0=(c.senses||[])[0];if(s0&&s0.d)return '('+(s0.pos||'')+') '+blankWord(s0.d,c.w);const p=c.senses.map(x=>x.p).filter(Boolean)[0];return p||''}
async function onlineWords(n){
 try{
  let j=null;
  for(const t of shuffle(SPTOP).slice(0,6)){
   try{j=await fetchJSON('https://api.datamuse.com/words?topics='+t+'&max=80');if(j&&j.length)break}catch(e){}
  }
  if(!j)return [];
  const pool=shuffle(j.map(x=>x.word).filter(x=>/^[a-z]{4,10}$/.test(x))).slice(0,n+6);
  const got=await Promise.all(pool.map(async w=>{
   try{
    const ee=await fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/'+w);
    const e=(Array.isArray(ee)?ee[0]:null)||{};
    const ip=e.phonetic||((e.phonetics||[]).find(x=>x.text)||{}).text||'';
    const defs=((e.meanings||[])[0]||{}).definitions;
    const m=defs&&defs[0]?defs[0].definition:'';
    if(!m)return null;
    return {w,ipa:ip,meaning:blankWord(m,w)};
   }catch(x){return null}
  }));
  return got.filter(Boolean).slice(0,n);
 }catch(e){return []}
}
async function startSpell(mode){

  toast('در حال گرفتن کلمه…',2500);
  items=await onlineWords(8);

 }else{
  if(!cards.length)return toast('اول چند لغت ذخیره کنید');
  items=shuffle(cards).slice(0,10).map(c=>({w:c.w,ipa:c.ipa||'',meaning:meaningOf(c)}));
 }
 sp={mode,items,i:0,ok:0,tot:0,r:null,h:0};
 spell();
 if(mode!=='meaning')speak(items[0].w);
}

function csvRows(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}

function backupJSON(){
 return JSON.stringify(cards.map(c=>({
  w:c.w, ipa:c.ipa, fam:c.fam||[], senses:c.senses, src:c.src||'', srcs:c.srcs||[],
  reps:c.reps||0, interval:c.interval||1, ease:c.ease||2.5, due:c.due, last:c.last
 })));
}

function importText(t,src){
 let n=0;
 if(t[0]==='['||t[0]==='{'){
  const a=JSON.parse(t);
  (Array.isArray(a)?a:[a]).forEach(c=>{
   if(!c||!c.w)return;
   const sm2={reps:c.reps||0, interval:c.interval||1, ease:c.ease||2.5, due:c.due, last:c.last};
   n+=addSenses(String(c.w),Array.isArray(c.senses)?c.senses:[c],c.ipa,c.fam,sm2,src);
  });
  return n;
 }
 let rows=csvRows(t);
 if(rows[0]&&/^word$/i.test((rows[0][0]||'').trim()))rows=rows.slice(1);
 const g={},order=[];
 rows.forEach(r=>{
  const w=(r[0]||'').trim();if(!w)return;
  if(!g[w]){g[w]=[];order.push(w)}
  g[w].push({pos:(r[1]||'').trim(),d:(r[2]||'').trim(),e:(r[3]||'').trim(),p:(r[4]||'').trim(),
   syn:(r[5]||'').split(';').map(x=>x.trim()).filter(Boolean),
   ant:(r[6]||'').split(';').map(x=>x.trim()).filter(Boolean),
   prep:(r[7]||'').split(';').map(x=>x.trim()).filter(Boolean)});
 });
 order.forEach(w=>{n+=addSenses(w,g[w],null,null,null,src)});
 return n;
}

function syncCfg(){try{return JSON.parse(localStorage.getItem('fc_sync')||'{}')||{}}catch(e){return {}}}
function syncSaveCfg(c){try{localStorage.setItem('fc_sync',JSON.stringify(c))}catch(e){}}
function syncHeaders(tok){return {'Authorization':'token '+tok,'Content-Type':'application/json','Accept':'application/vnd.github+json'}}
function syncBody(){return JSON.stringify({v:2,cards:cards,wait:waitL.slice(),at:Date.now()})}
async function syncCreateGist(tok){
 const r=await fetchTO('https://api.github.com/gists',{method:'POST',headers:syncHeaders(tok),body:JSON.stringify({description:'FlashCards sync',public:false,files:{'flashcards.json':{content:syncBody()}}})});
 if(!r.ok)throw new Error('HTTP '+r.status);
 const j=await r.json();
 const cfg=syncCfg();cfg.tok=tok;cfg.gid=j.id;syncSaveCfg(cfg);
 return j.id;
}
async function syncPush(tok,gid){
 const r=await fetchTO('https://api.github.com/gists/'+gid,{method:'PATCH',headers:syncHeaders(tok),body:JSON.stringify({files:{'flashcards.json':{content:syncBody()}}})});
 if(!r.ok)throw new Error('HTTP '+r.status);
 return true;
}
async function syncPull(tok,gid){
 const r=await fetchTO('https://api.github.com/gists/'+gid,{headers:syncHeaders(tok)});
 if(!r.ok)throw new Error('HTTP '+r.status);
 const j=await r.json();
 const f=j.files&&j.files['flashcards.json'];
 let content=f?f.content:null;
 if(content==null&&f&&f.raw_url){const rr=await fetchTO(f.raw_url);if(!rr.ok)throw new Error('HTTP '+rr.status);content=await rr.text()}
 if(!content)throw new Error('empty');
 return JSON.parse(content);
}
function syncMerge(d){
 let added=0,upd=0;
 const idx={};cards.forEach(c=>{const k=loose(c.w);if(k&&!idx[k])idx[k]=c});
 (d.cards||[]).forEach(rc=>{
  const k=loose(rc.w);if(!k)return;
  const c=idx[k];
  if(!c){cards.push(rc);idx[k]=rc;added++;return}
  upd++;
  const have={};c.senses.forEach(x=>{have[norm(x.d)]=1});
  (rc.senses||[]).forEach(x=>{if(x&&norm(x.d)&&!have[norm(x.d)])c.senses.push(x)});
  c.reps=Math.max(c.reps||0,rc.reps||0);
  c.interval=Math.max(c.interval||1,rc.interval||1);
  if((rc.due||0)>0&&(!c.due||c.due<=0))c.due=rc.due;
  else if((rc.due||0)>0&&(c.due||0)>0)c.due=Math.min(c.due,rc.due);
  if(!c.ipa&&rc.ipa)c.ipa=rc.ipa;
  if((!c.fam||!c.fam.length)&&(rc.fam||[]).length)c.fam=rc.fam.slice();
  if(rc.src&&!c.src)c.src=rc.src;
  const ss=(c.srcs||[]).slice();if(rc.src&&ss.indexOf(rc.src)<0)ss.push(rc.src);
  (rc.srcs||[]).forEach(x=>{if(ss.indexOf(x)<0)ss.push(x)});
  if(ss.length)c.srcs=ss;
 });
 let nw=0;
 try{
  const seen={};waitL.forEach(x=>{seen[loose(x)]=1});
  (d.wait||[]).forEach(x=>{const k=loose(x);if(k&&!seen[k]){waitL.push(x);seen[k]=1;nw++}});
  waitSave();waitBadge();
 }catch(e){}
 save();
 return {added:added,upd:upd,wait:nw};
}

async function genMoreEx(c){
 const defs=c.senses.slice(0,3).map((sg,k)=>(k+1)+'. '+(sg.d||'')).join('\n');
 const n=Math.min(3,c.senses.length);
 const exOld=[];c.senses.forEach(sg=>{if(sg.e)exOld.push(sg.e)});(c.xex||[]).forEach(x=>{if(x&&x.e)exOld.push(x.e)});
 const have=exOld.length?'\nExamples that ALREADY exist for this word (do NOT repeat or slightly rephrase any of them):\n'+exOld.map((x,k)=>(k+1)+'. '+x).join('\n'):'';
 const prompt='Word: "'+c.w+'"'+(c.ipa?' '+c.ipa:'')+'\nMeanings:\n'+defs+have+'\nWrite 2 NEW short natural English example sentences for EACH meaning number above ('+(2*n)+' sentences total). Every sentence must be different from all existing examples.\nReturn ONLY a JSON array (no markdown fences, no other text) of objects: {"e":"English sentence","p":"Persian translation of that sentence"}';
 const txt=await freeLLM(prompt,1600);
 const added=[];
 try{const arr=JSON.parse(String(txt).replace(/^```(json)?/,'').replace(/```$/,'').trim());
  (Array.isArray(arr)?arr:[]).forEach(x=>{if(x&&norm(x.e)&&!isFa(x.e)&&String(x.e).length>8)added.push({e:norm(x.e),p:norm(x.p||'')})});
 }catch(e){
  txt.split('\n').map(x=>x.trim()).filter(Boolean).forEach(ln=>{
   const pp=ln.split('|').map(x=>x.trim());
   if(pp.length&&/^\d+\s*[).\-]?$/.test(pp[0]))pp.shift();
   if(pp.length>=2&&pp[0]&&!isFa(pp[0])&&pp[0].length>8)added.push({e:pp[0],p:pp.slice(1).join(' ').trim()});
  });
 }
 const exSig=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
 const haveS=exOld.map(exSig);
 const seenNew=new Set();
 const uniq=added.filter(x=>{const s0=exSig(x.e);if(!s0||seenNew.has(s0))return false;seenNew.add(s0);return !haveS.some(h=>h===s0||(h.length>12&&s0.length>12&&(s0.indexOf(h)===0||h.indexOf(s0)===0)))});
 if(!uniq.length)throw new Error('dup');
 c.xex=(c.xex||[]).concat(uniq);
 return uniq.length;
}
