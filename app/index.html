ساده گذشته."}]},{"lv":"I","title":"Past Perfect Continuous","exp":[{"h":"Construction and Main Use","b":"You form the past perfect continuous with had been and the verb ending in -ing. You use this tense to describe an action that started before a specific moment in the past and continued up to or near that moment.","hf":"طریقه ساخت و کاربرد اصلی","bf":"زمان گذشته کامل استمراری با had been و فعل ing‌دار ساخته می‌شود. این زمان را برای کاری به کار می‌بریم که قبل از یک زمان مشخص در گذشته شروع شده و تا یا نزدیک آن زمان ادامه داشته است.","ex":[{"e":"I had been waiting for two hours when the bus finally arrived.","p":"وقتی بالاخره اتوبوس آمد، من دو ساعت بود که داشتم منتظر می‌ماندم."},{"e":"She had been working at the company for five years before it closed.","p":"او قبل از اینکه شرکت تعطیل شود، پنج سال آنجا کار می‌کرد."}]},{"h":"Difference from Past Continuous","b":"While the past continuous shows an action happening at a specific moment, the past perfect continuous emphasizes the duration of an action before another past event. You often use words like for and since to highlight this length of time.","hf":"تفاوت با گذشته استمراری","bf":"در گذشته استمراری، کار در یک لحظه از گذشته در جریان بود، اما در گذشته استمراری کامل، تاکید روی «مدت زمان» انجام یک کار قبل از کار دیگری در گذشته است. از کلماتی مثل for و since زیاد در این ساختار استفاده می‌کنیم.","ex":[{"e":"It had been raining all morning, so the streets were wet.","p":"تمام طول صبح باران باریده بود، بنابراین خیابان‌ها خیس بودند."},{"e":"He was tired because he had been running.","p":"او خسته بود چون دویده بود."}]}],"tip":"Use had + been + verb-ing when you want to show that an action was in progress for a specific period before another past event.","tipf":"هر وقت خواستید بگویید کاری برای مدت مشخصی قبل از یک اتفاق در گذشته در جریان بوده، از ساختار had + been + فعل با ing استفاده کنید.","bad":[{"b":"I was waiting for 2 hours when he came.","g":"I had been waiting for 2 hours when he came.","w":"You should use had been waiting instead of was waiting to show the duration of the action before another past event.","wf":"برای نشان دادن مدت زمان یک کار قبل از اتفاقی دیگر در گذشته، باید از had been waiting استفاده کنید نه was waiting."},{"b":"She had being studying English for three years.","g":"She had been studying English for three years.","w":"After had, you must use been, not the -ing form being.","wf":"بعد از had باید از been استفاده کنید، نه شکل ing‌دار یعنی being."}],"gold":[{"e":"Always remember that had is followed by been, not being.","f":"همیشه به یاد داشته باشید که had بعد از آن been می‌آید، نه being."},{"e":"Use this tense to emphasize how long an action lasted before something else happened in the past.","f":"از این زمان برای تأکید بر مدت زمان انجام یک کار قبل از وقوع اتفاق دیگری در گذشته استفاده کنید."},{"e":"The structure is always had been plus the verb with -ing.","f":"ساختار همیشه had been به همراه فعل با پسوند -ing است."}]},{"lv":"I","title":"Past Perfect Continuous (I had been doing)","exp":[{"h":"Understanding the Form","b":"To form this tense, you need the past tense of 'have' (had) plus 'been' and the verb ending in -ing. It looks like 'I had been working'. This structure is essential for showing duration before another past event.","hf":"درک ساختار","bf":"برای ساختن این زمان، باید از شکل گذشته فعل 'have' (had) به همراه 'been' و فعل اصلی با پسوند -ing استفاده کنید. این ساختار برای نشان دادن مدت زمانی که قبل از یک رویداد دیگر در گذشته ادامه داشته است، ضروری است.","ex":[{"e":"I had been waiting for an hour when the bus arrived.","p":"من یک ساعت منتظر بودم که اتوبوس رسید."},{"e":"She had been studying English for years before she moved to London.","p":"او سال‌ها بود که پیش از نقل مکان به لندن، انگلیسی می‌خواند."}]},{"h":"Using it for Duration","b":"We use this tense to emphasize how long an action continued up until a specific moment in the past. It highlights the process rather than just the completion.","hf":"استفاده برای بیان مدت زمان","bf":"ما از این زمان برای تأکید بر این استفاده می‌کنیم که یک عمل تا چه لحظه خاصی در گذشته ادامه داشته است. این زمان بیشتر بر فرآیند تمرکز دارد تا صرفاً تکمیل شدن آن.","ex":[{"e":"They had been arguing for hours before they finally stopped.","p":"آن‌ها ساعت‌ها بود که با هم بحث می‌کردند تا اینکه در نهایت متوقف شدند."},{"e":"He had been running when it started to rain.","p":"او در حال دویدن بود که باران شروع به باریدن کرد."}]},{"h":"Explaining Past Results","b":"You can use this tense to explain a result you saw in the past. The action in the past perfect continuous caused the situation you observed.","hf":"توضیح نتایج گذشته","bf":"شما می‌توانید از این زمان برای توضیح نتیجه‌ای که در گذشته دیده‌اید استفاده کنید. عملی که در گذشتهٔ کامل استمراری انجام شده، باعث ایجاد وضعیتی شده است که مشاهده کرده‌اید.","ex":[{"e":"Her eyes were red because she had been crying.","p":"چشم‌هایش قرمز بود چون گریه کرده بود."},{"e":"The ground was wet because it had been raining.","p":"زمین خیس بود چون باران می‌بارید."}]}],"tip":"Remember that 'had been' is followed by the -ing form of the main verb, not the past participle.","tipf":"به یاد داشته باشید که بعد از 'had been' باید از شکل -ing فعل اصلی استفاده کنید، نه اسم مفعول.","bad":[{"b":"I had been worked all day.","g":"I had been working all day.","w":"After 'been', you must use the -ing form, not the past tense or past participle.","wf":"بعد از 'been' باید از شکل -ing استفاده کنید، نه شکل گذشته یا اسم مفعول."},{"b":"I had been wait for an hour.","g":"I had been waiting for an hour.","w":"The verb 'wait' needs the -ing ending to form the continuous aspect correctly.","wf":"فعل 'wait' باید پسوند -ing بگیرد تا حالت استمراری به درستی ساخته شود."},{"b":"I was having been studying.","g":"I had been studying.","w":"Use 'had' for the past perfect, not 'was having'. The structure is fixed.","wf":"برای گذشتهٔ کامل از 'had' استفاده کنید، نه 'was having'. این ساختار ثابت است."}],"gold":[{"e":"Structure: Subject + had been + verb-ing.","f":"ساختار: فاعل + had been + فعل با پسوند -ing."},{"e":"Use it to show an action was ongoing before another past action.","f":"از آن برای نشان دادن عملی استفاده کنید که قبل از یک عمل دیگر در گذشته در حال انجام بوده است."},{"e":"It often explains a visible result in the past.","f":"این زمان اغلب یک نتیجهٔ قابل مشاهده در گذشته را توضیح می‌دهد."}]},{"lv":"A","title":"Narrative tenses review (past simple / continuous / perfect together)","exp":[{"h":"Setting the Scene with Past Continuous","b":"Use the past continuous to describe the background or ongoing action that was happening when something else occurred. It helps you paint a picture of the situation before the main event takes place.","hf":"ایجاد صحنه با گذشته استمراری","bf":"از گذشته استمراری برای توصیف پس‌زمینه یا عملی که در حال انجام بود، زمانی که اتفاق دیگری رخ داد، استفاده کنید. این به شما کمک می‌کند تصویری از وضعیت قبل از وقوع رویداد اصلی بکشید.","ex":[{"e":"I was walking home when it started to rain.","p":"من در حال پیاده‌روی به خانه بودم که باران شروع به باریدن کرد."},{"e":"While she was cooking, the phone rang.","p":"در حالی که او در حال آشپزی بود، تلفن زنگ خورد."}]},{"h":"Sequencing Events with Past Simple","b":"Use the past simple to list the main events in the order they happened. This tense moves the story forward and connects the key actions one after another.","hf":"ترتیب دادن رویدادها با گذشته ساده","bf":"از گذشته ساده برای فهرست کردن رویدادهای اصلی به ترتیب وقوع آن‌ها استفاده کنید. این زمان داستان را پیش می‌برد و اقدامات کلیدی را یکی پس از دیگری به هم متصل می‌کند.","ex":[{"e":"He opened the door and walked in.","p":"او در را باز کرد و وارد شد."},{"e":"She saw the cat and screamed.","p":"او گربه را دید و جیغ زد."}]},{"h":"Adding Context with Past Perfect","b":"Use the past perfect to show that one action happened before another past action. It clarifies the timeline by highlighting the earlier of the two past events.","hf":"افزودن زمینه با گذشته کامل","bf":"از گذشته کامل برای نشان دادن اینکه یک عمل قبل از یک عمل دیگر در گذشته رخ داده است، استفاده کنید. این با برجسته کردن رویداد قدیمی‌تر از دو رویداد گذشته، خط زمانی را شفاف می‌کند.","ex":[{"e":"When I arrived, the train had already left.","p":"وقتی من رسیدم، قطار قبلاً حرکت کرده بود."},{"e":"She had finished her homework before dinner.","p":"او قبل از شام تکالیفش را تمام کرده بود."}]}],"tip":"Remember that past continuous sets the scene, past simple tells what happened, and past perfect explains what happened before.","tipf":"به یاد داشته باشید که گذشته استمراری صحنه را می‌چیند، گذشته ساده می‌گوید چه اتفاقی افتاد، و گذشته کامل توضیح می‌دهد چه چیزی قبل از آن رخ داده بود.","bad":[{"b":"I was waiting for the bus when the rain started.","g":"I waited for the bus when it started to rain.","w":"Persian speakers often confuse past continuous and past simple when translating continuous actions like 'waiting' vs completed background states. A more natural contrast is using past simple for a simultaneous short action.","wf":"فارسی‌زبانان اغلب زمان‌های گذشته را هنگام ترجمه تداخل می‌دهند. استفاده از گذشته ساده برای رویدادهای کوتاه همزمان دقیق‌تر است."},{"b":"I had went to the store before he called.","g":"I had gone to the store before he called.","w":"The past participle of 'go' is 'gone', not 'went'. 'Went' is the past simple form.","wf":"اسم مفعول فعل 'go' کلمه 'gone' است، نه 'went'. کلمه 'went' شکل گذشته ساده است."},{"b":"She was knowing him for ten years when they met.","g":"She had known him for ten years when they met.","w":"Stative verbs like 'know' are rarely used in continuous forms. Also, since the knowing happened before the meeting, past perfect is needed.","hf":"افعال حالتی مانند 'know' به ندرت در حالت‌های استمراری استفاده می‌شوند. همچنین، از آنجا که آشنایی قبل از ملاقات رخ داده بود، گذشته کامل نیاز است.","wf":"افعال حالتی مانند 'know' به ندرت در حالت‌های استمراری استفاده می‌شوند. همچنین، از آنجا که آشنایی قبل از ملاقات رخ داده بود، گذشته کامل نیاز است."}],"gold":[{"e":"Use past continuous for background actions and past simple for main events.","f":"از گذشته استمراری برای اقدامات پس‌زمینه و گذشته ساده برای رویدادهای اصلی استفاده کنید."},{"e":"Use past perfect to show an action completed before another past action.","f":"از گذشته کامل برای نشان دادن عملی که قبل از یک عمل دیگر در گذشته کامل شده است، استفاده کنید."},{"e":"Past simple is the main tense for narrating a sequence of events.","f":"گذشته ساده زمان اصلی برای روایت توالی رویدادها است."}]}],"ex":[{"t":"gap","q":"I ___ happy yesterday.","key":["was"],"why":"Past Simple of 'be' for first person singular."},{"t":"gap","q":"They ___ not at home last night.","key":["were"],"why":"Past Simple negative of 'be' for plural subject."},{"t":"gap","q":"She ___ her homework an hour ago.","key":["finished"],"why":"Past Simple regular verb form."},{"t":"gap","q":"___ you see the movie?","key":["Did"],"why":"Past Simple question auxiliary for any subject."},{"t":"gap","q":"I ___ sleeping when you called.","key":["was"],"why":"Past Continuous form for first person singular."},{"t":"gap","q":"While I ___ cooking, the phone rang.","key":["was"],"why":"Past Continuous for an action in progress."},{"t":"fix","q":"She was went to the park.","key":["She went to the park."],"why":"Past Simple uses the past form of the verb, not 'was' + base verb."},{"t":"fix","q":"I was studying when he arrive.","key":["I was studying when he arrived."],"why":"The interrupting action in Past Simple takes the past form."},{"t":"fix","q":"By the time we arrived, they have left.","key":["By the time we arrived, they had left."],"why":"Past Perfect is used for the action that happened first."},{"t":"fa","q":"من دیروز به سینما رفتم.","key":["I went to the cinema yesterday."],"why":"Past Simple for a completed action in the past."},{"t":"fa","q":"وقتی باران شروع به باریدن کرد، من داشتم کتاب می‌خواندم.","key":["I was reading a book when it started to rain."],"why":"Past Continuous for the longer background action interrupted by Past Simple."},{"t":"fa","q":"او قبل از اینکه برسم، رفته بود.","key":["He had left before I arrived."],"why":"Past Perfect for the action completed before another past action."},{"t":"gap","q":"I ___ watching TV when the power went out.","key":["was"],"why":"Past Continuous: 'was' is used with I/he/she/it."},{"t":"fix","q":"She was sleep when I called.","key":["She was sleeping when I called."],"why":"Past Continuous: use the -ing form after 'was/were'."},{"t":"gap","q":"By the time we got to the station, the train ___.","key":["had left"],"why":"Past Perfect: use 'had + past participle' for an action before another past action."},{"t":"gap","q":"He ___ for two hours before he felt tired.","key":["had been running"],"why":"Past Perfect Continuous: use 'had been + -ing' to show duration before a past point."},{"t":"fix","q":"I had been waiting for an hour when the bus arrived.","key":["I had been waiting for an hour when the bus arrived."],"why":"Past Perfect Continuous: correct form for duration before a past event."},{"t":"gap","q":"She ___ to London three years ago.","key":["went"],"why":"Past Simple irregular verb: 'go' becomes 'went'."},{"t":"fa","q":"وقتی من رسیدم، او رفته بود خانه.","key":["When I arrived, he had gone home."],"why":"Past Perfect: 'had gone' shows the action happened before 'arrived'."},{"t":"gap","q":"While I ___ dinner, the phone rang.","key":["was cooking"],"why":"Past Continuous: 'was cooking' describes the background action interrupted by the phone."}]},{"id":"t06","t":"Questions and Auxiliary Verbs","tf":"سؤال‌سازی و فعل کمکی","parts":[{"lv":"B","title":"Questions with do / does / did","exp":[{"h":"Using do and does in the Present Simple","b":"We use do with I, you, we, and they, and does with he, she, and it. Remember to drop the -s from the main verb when you use does. This helps form questions like 'Do you like tea?' or 'Does she work here?'","hf":"استفاده از do و does در زمان حال ساده","bf":"ما از do با I، you، we و they و از does با he، she و it استفاده می‌کنیم. به یاد داشته باشید که وقتی از does استفاده می‌کنید، پسوند -s را از فعل اصلی حذف کنید. این کار به ساختن سوالاتی مانند 'Do you like tea?' یا 'Does she work here?' کمک می‌کند.","ex":[{"e":"Do you speak English?","p":"آیا انگلیسی صحبت می‌کنی؟"},{"e":"Does he live in London?","p":"آیا او در لندن زندگی می‌کند؟"}]},{"h":"Forming questions in the Past Simple","b":"For all subjects in the past, we simply use did. The main verb goes back to its base form because did already shows the past tense. For example, you say 'Did you go?' instead of 'Did you went?'","hf":"ساختن سوالات در زمان گذشته ساده","bf":"برای همه فاعل‌ها در زمان گذشته، به سادگی از did استفاده می‌کنیم. فعل اصلی به شکل پایه خود برمی‌گردد زیرا did خودش زمان گذشته را نشان می‌دهد. برای مثال، می‌گویید 'Did you go?' به جای 'Did you went؟'","ex":[{"e":"Did you see the movie?","p":"آیا فیلم را دیدی؟"},{"e":"Did they arrive on time?","p":"آیا آن‌ها به موقع رسیدند؟"}]},{"h":"Short answers with do/does/did","b":"When answering these questions, keep the answer short and simple. Use yes or no followed by the subject and the auxiliary verb. For example, if someone asks 'Do you like coffee?', you can reply 'Yes, I do' or 'No, I don't.'","hf":"پاسخ‌های کوتاه با do/does/did","bf":"هنگام پاسخ دادن به این سوالات، پاسخ را کوتاه و ساده نگه دارید. از yes یا no و به دنبال آن فاعل و فعل کمکی استفاده کنید. برای مثال، اگر کسی بپرسد 'Do you like coffee?'، می‌توانید پاسخ دهید 'Yes, I do' یا 'No, I don't.'","ex":[{"e":"Do you like pizza? Yes, I do.","p":"آیا پیتزا دوست داری؟ بله، دوست دارم."},{"e":"Did she call you? No, she didn't.","p":"آیا او به تو زنگ زد؟ نه، نزد."}]}],"tip":"Always check if the subject is third person singular (he, she, it) to decide between do and does in the present tense.","tipf":"همیشه بررسی کنید که آیا فاعل سوم شخص مفرد (he, she, it) است تا بین do و does در زمان حال یکی را انتخاب کنید.","bad":[{"b":"Does you like coffee?","g":"Do you like coffee?","w":"We use do with you, not does.","wf":"ما با you از do استفاده می‌کنیم، نه does."},{"b":"Did you went to school?","g":"Did you go to school?","w":"After did, use the base form of the verb, not the past form.","wf":"بعد از did، از شکل پایه فعل استفاده کنید، نه شکل گذشته."},{"b":"He don't like apples.","g":"He doesn't like apples.","w":"For he, she, or it in the present simple negative, use doesn't.","wf":"برای he، she یا it در منفی حال ساده، از doesn't استفاده کنید."}],"gold":[{"e":"Use do/does/did to form questions in simple tenses.","f":"برای ساختن سوالات در زمان‌های ساده از do/does/did استفاده کنید."},{"e":"Do not use the past form of the verb after did.","f":"بعد از did از شکل گذشته فعل استفاده نکنید."},{"e":"Does is used only with he, she, and it in the present simple.","f":"does فقط با he، she و it در حال ساده استفاده می‌شود."}]},{"lv":"B","title":"Who / What / Which / Whose (subject and object questions)","exp":[{"h":"Asking about People (Who)","b":"Use 'Who' when you want to know the identity of a person. It works for both subjects and objects in informal speech. Remember that 'Who' is the most common word we use for people in questions.","hf":"پرسیدن درباره افراد (Who)","bf":"وقتی می‌خواهید هویت یک فرد را بدانید، از 'Who' استفاده کنید. این کلمه هم برای فاعل و هم برای مفعول در گفتگوی غیررسمی کاربرد دارد. به یاد داشته باشید که 'Who' رایج‌ترین کلمه‌ای است که برای افراد در سوالات استفاده می‌کنیم.","ex":[{"e":"Who called you yesterday?","p":"دیروز چه کسی به تو زنگ زد؟"},{"e":"Who did you see at the park?","p":"در پارک چه کسی را دیدی؟"}]},{"h":"Asking about Things (What)","b":"Use 'What' to ask about objects, actions, or ideas. It is the standard word for non-human things. You can use it for both subjects and objects.","hf":"پرسیدن درباره اشیاء (What)","bf":"برای پرسیدن درباره اشیاء، کارها یا ایده‌ها از 'What' استفاده کنید. این کلمه استاندارد برای موارد غیرانسانی است. می‌توانید آن را هم برای فاعل و هم برای مفعول به کار ببرید.","ex":[{"e":"What happened last night?","p":"دیشب چه اتفاقی افتاد؟"},{"e":"What did you buy?","p":"چه چیزی خریدی؟"}]},{"h":"Choosing and Possession (Which / Whose)","b":"Use 'Which' when there is a limited choice, and 'Whose' to ask about ownership. These words help you be specific in your questions.","hf":"انتخاب و مالکیت (Which / Whose)","bf":"وقتی انتخاب محدودی وجود دارد از 'Which' و برای پرسیدن درباره مالکیت از 'Whose' استفاده کنید. این کلمات به شما کمک می‌کنند تا سوالات خود را دقیق‌تر بپرسید.","ex":[{"e":"Which color do you prefer?","p":"کدام رنگ را ترجیح می‌دهی؟"},{"e":"Whose bag is this?","p":"این کیف مال کیست؟"}]}],"tip":"In subject questions with 'Who' or 'What', do not use auxiliary verbs like 'do/does/did'; use them only for object questions.","tipf":"در سوالات فاعلی با 'Who' یا 'What'، از افعال کمکی مانند do/does/did استفاده نکنید؛ آن‌ها را فقط برای سوالات مفعولی به کار ببرید.","bad":[{"b":"Who did you went to the cinema with?","g":"Who did you go to the cinema with?","w":"Use 'did' with the base form of the verb, not the past tense.","wf":"از 'did' با شکل پایه فعل استفاده کنید، نه زمان گذشته."},{"b":"What is your name's?","g":"What is your name?","w":"Do not use possessive 's' with 'What' in this structure.","wf":"در این ساختار با 'What' از 's' مالکیت استفاده نکنید."}],"gold":[{"e":"Use 'Who' for people and 'What' for things.","f":"برای افراد از 'Who' و برای اشیاء از 'What' استفاده کنید."},{"e":"Use 'Whose' to ask about ownership.","f":"برای پرسیدن درباره مالکیت از 'Whose' استفاده کنید."}]},{"lv":"B","title":"Short answers and reply questions (So am I / Neither do I)","exp":[{"h":"Agreeing with positive statements","b":"When someone says something positive and you want to agree, use 'So' followed by the auxiliary verb and 'I'. This structure shows that the same situation applies to you as well.","hf":"موافقت با جملات مثبت","bf":"وقتی کسی جمله‌ای مثبت می‌گوید و شما می‌خواهید موافقت کنید، از 'So' به همراه فعل کمکی و 'I' استفاده کنید. این ساختار نشان می‌دهد که همان وضعیت برای شما نیز صدق می‌کند.","ex":[{"e":"I am happy.","p":"من خوشحالم."},{"e":"So am I.","p":"من هم."}]},{"h":"Agreeing with negative statements","b":"To agree with a negative statement, use 'Neither' or 'Nor' followed by the auxiliary verb and 'I'. This confirms that the negative situation also applies to you.","hf":"موافقت با جملات منفی","bf":"برای موافقت با یک جمله منفی، از 'Neither' یا 'Nor' به همراه فعل کمکی و 'I' استفاده کنید. این موضوع تأیید می‌کند که وضعیت منفی نیز برای شما صدق می‌کند.","ex":[{"e":"I don't like coffee.","p":"من قهوه دوست ندارم."},{"e":"Neither do I.","p":"من هم همین‌طور."}]},{"h":"Using the correct auxiliary verb","b":"Always match the auxiliary verb in your short answer to the one used in the original statement. If the statement uses 'do', use 'do'. If it uses 'be', use 'be'.","hf":"استفاده از فعل کمکی صحیح","bf":"همیشه فعل کمکی را در پاسخ کوتاه خود با فعل کمکی استفاده شده در جمله اصلی مطابقت دهید. اگر جمله از 'do' استفاده می‌کند، از 'do' استفاده کنید. اگر از 'be' استفاده می‌کند، از 'be' استفاده کنید.","ex":[{"e":"She plays tennis.","p":"او تنیس بازی می‌کند."},{"e":"So does she.","p":"او هم همین‌طور."}]}],"tip":"Remember that 'So' is for positive agreement and 'Neither' is for negative agreement. Never use 'So' with a negative statement.","tipf":"به یاد داشته باشید که 'So' برای موافقت مثبت و 'Neither' برای موافقت منفی است. هرگز از 'So' با جمله منفی استفاده نکنید.","bad":[{"b":"So do I.","g":"Neither do I.","w":"The original statement was negative, so we must use 'Neither', not 'So'.","wf":"جمله اصلی منفی بود، بنابراین باید از 'Neither' استفاده کنیم، نه 'So'."},{"b":"So am I.","g":"Neither am I.","w":"The original statement was negative, so we must use 'Neither', not 'So'.","wf":"جمله اصلی منفی بود، بنابراین باید از 'Neither' استفاده کنیم، نه 'So'."},{"b":"So likes she.","g":"So does she.","w":"The auxiliary verb 'does' is needed for third-person singular in present simple.","wf":"برای سوم‌شخص مفرد در حال ساده، به فعل کمکی 'does' نیاز است."}],"gold":[{"e":"Use 'So' + auxiliary + subject for positive agreement.","f":"برای موافقت مثبت از 'So' + فعل کمکی + فاعل استفاده کنید."},{"e":"Use 'Neither' + auxiliary + subject for negative agreement.","f":"برای موافقت منفی از 'Neither' + فعل کمکی + فاعل استفاده کنید."},{"e":"Match the auxiliary verb in the short answer to the one in the original statement.","f":"فعل کمکی در پاسخ کوتاه را با فعل کمکی در جمله اصلی مطابقت دهید."}]},{"lv":"I","title":"Questions and Auxiliary Verbs","exp":[{"h":"Questions from Subject and Object","b":"When you ask a question about the subject, you do not need an auxiliary verb and can use the question word directly. However, to ask about the object, you must use the correct auxiliary verb like do, does, or did to form the question properly.","hf":"سوالات از روی فاعل و مفعول","bf":"وقتی سوال از فاعل است، نیازی به فعل کمکی نیست و مستقیماً از کلمه پرسشی استفاده می‌شود. اما برای سوال از مفعول، باید از فعل کمکی مناسب (مانند do/does/did) استفاده کنیم.","ex":[{"e":"Who called you?","p":"چه کسی به تو زنگ زد؟"},{"e":"What did you buy?","p":"چه چیزی خریدی؟"}]},{"h":"Short Answers","b":"For short yes or no answers, use the auxiliary verb from the question along with the appropriate pronoun. This structure is very common and sounds natural in everyday conversation.","hf":"پاسخ‌های کوتاه","bf":"برای پاسخ کوتاه به سوالات بله/خیر، از فعل کمکی سوال و ضمیر مناسب استفاده کنید. این ساختار بسیار رایج و طبیعی است.","ex":[{"e":"Do you like tea? Yes, I do.","p":"چای دوست داری؟ بله، دوست دارم."},{"e":"Did she go? No, she didn't.","p":"او رفت؟ نه، نرفت."}]},{"h":"Question Tags","b":"Question tags are short phrases at the end of a sentence used to confirm or ask for agreement. If the main sentence is positive, the tag should be negative, and vice versa.","hf":"تگ‌های سوال (Question Tags)","bf":"تگ‌های سوال جملات کوتاهی در انتهای جمله هستند که برای تأیید یا پرسش استفاده می‌شوند. اگر جمله مثبت باشد، تگ منفی و برعکس.","ex":[{"e":"It is cold, isn't it?","p":"سرد است، نه؟"},{"e":"You don't smoke, do you?","p":"سیگار نمی‌کشی، نه؟"}]}],"tip":"Do not add an auxiliary verb when asking questions about the subject; just replace the subject with the question word.","tipf":"در سوالات از روی فاعل، فعل کمکی اضافه نکنید؛ فقط کلمه پرسشی را جایگزین فاعل کنید.","bad":[{"b":"Who did call you?","g":"Who called you?","w":"There is no need for an auxiliary verb like did when asking questions about the subject.","wf":"در سوالات از روی فاعل، نیازی به فعل کمکی like 'did' نیست."},{"b":"You like tea, do you?","g":"You like tea, don't you?","w":"Since the main sentence is positive, the question tag must be negative.","wf":"چون جمله اصلی مثبت است، تگ سوال باید منفی باشد."}],"gold":[{"e":"Always match the auxiliary verb in your short answer to the one used in the question.","f":"همیشه فعل کمکی در پاسخ کوتاه خود را با فعل کمکی سوال مطابقت دهید."},{"e":"Remember that positive statements take negative tags and negative statements take positive tags.","f":"به یاد داشته باشید که جملات مثبت تگ منفی و جملات منفی تگ مثبت می‌گیرند."},{"e":"Never use do, does, or did when the question word itself is the subject of the sentence.","f":"هرگز از do، does یا did استفاده نکنید وقتی کلمه پرسشی خود فاعل جمله است."}]},{"lv":"I","title":"Indirect questions (Do you know where …?)","exp":[{"h":"The Basic Structure","b":"When you ask an indirect question, you start with a polite phrase like 'Do you know' or 'Can you tell me'. The key rule is that the word order changes from question order to statement order. This makes your English sound much more natural and polite in daily conversations.","hf":"ساختار پایه","bf":"وقتی سوال غیرمستقیم می‌پرسید، با یک عبارت مودبانه مثل 'Do you know' یا 'Can you tell me' شروع می‌کنید. قانون کلیدی این است که ترتیب کلمات از ترتیب سوالی به ترتیب خبری تغییر می‌کند. این کار انگلیسی شما را در مکالمات روزمره بسیار طبیعی‌تر و مودبانه‌تر می‌کند.","ex":[{"e":"Do you know where the bank is?","p":"می‌دانی بانک کجاست؟"},{"e":"Can you tell me when the train leaves?","p":"می‌توانی بگویی قطار چه زمانی حرکت می‌کند؟"}]},{"h":"Using Yes/No Questions","b":"If the original question starts with Yes or No, you must add 'if' or 'whether' to the indirect question. This connects the two parts smoothly. Remember to keep the verb in the correct tense after 'if'.","hf":"استفاده از سوالات بله/خیر","bf":"اگر سوال اصلی با بله یا خیر شروع می‌شود، باید 'if' یا 'whether' را به سوال غیرمستقیم اضافه کنید. این دو بخش را به نرمی به هم متصل می‌کند. به یاد داشته باشید که فعل را بعد از 'if' در زمان درست نگه دارید.","ex":[{"e":"I wonder if she is coming.","p":"کنجکاو هستم که آیا او می‌آید یا نه."},{"e":"Do you know if the shop is open?","p":"می‌دانی که آیا فروشگاه باز است یا نه؟"}]},{"h":"Wh- Questions","b":"For questions starting with words like 'where', 'when', or 'how', keep the question word at the beginning of the clause. Do not use 'do' or 'does' in the second part. Just follow the question word with the subject and then the verb.","hf":"سوالات شروع‌شده با Wh-","bf":"برای سوالاتی که با کلماتی مثل 'where'، 'when' یا 'how' شروع می‌شوند، کلمه سوال را در ابتدای بخش دوم نگه دارید. در بخش دوم از 'do' یا 'does' استفاده نکنید. فقط بعد از کلمه سوال، فاعل و سپس فعل را بیاورید.","ex":[{"e":"Could you tell me how to get to the station?","p":"می‌توانید بگویید چطور به ایستگاه برسم؟"},{"e":"She asked me what time it was.","p":"او از من پرسید ساعت چند است."}]}],"tip":"Always remember that indirect questions are statements in disguise, so the verb comes after the subject, not before.","tipf":"همیشه به یاد داشته باشید که سوالات غیرمستقیم در واقع جملات خبری هستند، بنابراین فعل بعد از فاعل می‌آید، نه قبل از آن.","bad":[{"b":"Do you know where is the bank?","g":"Do you know where the bank is?","w":"In indirect questions, we do not invert the subject and verb. The word order should be subject + verb.","wf":"در سوالات غیرمستقیم، فاعل و فعل را جابجا نمی‌کنیم. ترتیب کلمات باید فاعل + فعل باشد."},{"b":"Do you know is the bank open?","g":"Do you know if the bank is open?","w":"For Yes/No questions, you need 'if' or 'whether'. You cannot just use the verb directly without a connector.","wf":"برای سوالات بله/خیر، نیاز به 'if' یا 'whether' دارید. نمی‌توانید فقط فعل را بدون حرف ربط استفاده کنید."},{"b":"Can you tell me where the bank is located at?","g":"Can you tell me where the bank is located?","w":"The word 'where' already implies location, so adding 'at' is redundant and incorrect in standard English.","wf":"کلمه 'where' خودش مفهوم مکان را می‌رساند، بنابراین اضافه کردن 'at' اضافی و در انگلیسی استاندارد نادرست است."}],"gold":[{"e":"Indirect questions follow the statement word order (Subject + Verb), not question order.","f":"سوالات غیرمستقیم از ترتیب کلمات جمله خبری (فاعل + فعل) پیروی می‌کنند، نه ترتیب سوالی."},{"e":"Use 'if' or 'whether' to introduce indirect Yes/No questions.","f":"برای معرفی سوالات غیرمستقیم بله/خیر از 'if' یا 'whether' استفاده کنید."},{"e":"Keep the question word (where, when, how) at the start of the clause.","f":"کلمه سوالی (where، when، how) را در ابتدای بخش جمله نگه دارید."}]},{"lv":"I","title":"Question tags (…, isn't it?)","exp":[{"h":"Basic Structure: Positive Statement, Negative Tag","b":"When the main statement is positive, we use a negative question tag. This creates a balanced rhythm in conversation. For example, if you say 'She is happy,' the tag becomes 'isn't she?' It invites confirmation from the listener.","hf":"ساختار پایه: جمله مثبت، دنباله منفی","bf":"وقتی جمله اصلی مثبت است، ما از دنباله پرسشی منفی استفاده می‌کنیم. این کار ریتم متعادلی در گفتگو ایجاد می‌کند. برای مثال، اگر بگویید «او خوشحال است»، دنباله به «مگر نه؟» تبدیل می‌شود. این کار تأیید را از شنونده درخواست می‌کند.","ex":[{"e":"You are a student, aren't you?","p":"تو دانش‌آموز هستی، مگه نه؟"},{"e":"She likes coffee, doesn't she?","p":"او قهوه دوست دارد، مگه نه؟"}]},{"h":"Negative Statement, Positive Tag","b":"If the main statement contains a negative word like 'not' or 'never', the question tag must be positive. This contrast helps emphasize the statement. For instance, 'He isn't coming' is followed by 'is he?' to check the fact.","hf":"جمله منفی، دنباله مثبت","bf":"اگر جمله اصلی کلمه منفی مانند 'not' یا 'never' دارد، دنباله پرسشی باید مثبت باشد. این تضاد به تأیید مطلب کمک می‌کند. برای مثال، جمله «او نمی‌آید» با «آیا می‌آید؟» یا «این‌طور نیست؟» دنبال می‌شود تا واقعیت بررسی شود.","ex":[{"e":"They don't live here, do they?","p":"آن‌ها اینجا زندگی نمی‌کنند، این‌طوره؟"},{"e":"It isn't raining, is it?","p":"باران نمی‌بارد، مگه نه؟"}]},{"h":"Special Case: 'I am'","b":"For the statement 'I am', the standard tag is 'aren't I?'. This is a unique exception in English grammar. You rarely hear 'amn't I'. So, always use 'aren't I' after 'I am'.","hf":"حالت خاص: 'I am'","bf":"برای جمله «I am»، دنباله استاندارد «aren't I» است. این یک استثنای خاص در دستور زبان انگلیسی است. شما به ندرت عبارت «amn't I» را می‌شنوید. بنابراین، همیشه بعد از «I am» از «aren't I» استفاده کنید.","ex":[{"e":"I am late, aren't I?","p":"من دیر کرده‌ام، مگه نه؟"},{"e":"I am right, aren't I?","p":"من حق دارم، مگه نه؟"}]}],"tip":"Always match the auxiliary verb in the tag with the one in the statement. If there is no auxiliary, use do/does/did.","tipf":"همیشه فعل کمکی در دنباله را با فعل کمکی در جمله مطابقت دهید. اگر فعل کمکی وجود ندارد، از do/does/did استفاده کنید.","bad":[{"b":"She is nice, is she?","g":"She is nice, isn't she?","w":"The statement is positive, so the tag must be negative.","wf":"جمله مثبت است، بنابراین دنباله باید منفی باشد."},{"b":"You don't like tea, don't you?","g":"You don't like tea, do you?","w":"The statement is negative, so the tag must be positive.","wf":"جمله منفی است، بنابراین دنباله باید مثبت باشد."},{"b":"I am happy, amn't I?","g":"I am happy, aren't I?","w":"The correct tag for 'I am' is 'aren't I', not 'amn't I'.","wf":"دنباله صحیح برای 'I am' عبارت 'aren't I' است، نه 'amn't I'."}],"gold":[{"e":"Positive statement + negative tag.","f":"جمله مثبت + دنباله منفی."},{"e":"Negative statement + positive tag.","f":"جمله منفی + دنباله مثبت."},{"e":"Use 'aren't I' for 'I am'.","f":"برای 'I am' از 'aren't I' استفاده کنید."}]},{"lv":"I","title":"So do I / Neither do I / I think so","exp":[{"h":"Agreeing with positive statements","b":"When someone says something positive and you want to agree, use 'So do I' or 'So am I'. This structure mirrors their statement but adds your own agreement. It is a natural way to show you share the same opinion or situation.","hf":"موافقت با جملات مثبت","bf":"وقتی کسی جمله‌ای مثبت می‌گوید و می‌خواهید موافقت کنید، از 'So do I' یا 'So am I' استفاده کنید. این ساختار بیان او را تکرار می‌کند اما موافقت شما را اضافه می‌کند. این راهی طبیعی برای نشان دادن این است که شما نظر یا وضعیت مشابهی دارید.","ex":[{"e":"I love Persian food.","p":"من غذای ایرانی را دوست دارم."},{"e":"So do I.","p":"من هم."}]},{"h":"Agreeing with negative statements","b":"To agree with a negative statement, use 'Neither do I' or 'Neither am I'. This confirms that you also share the negative situation or opinion. It is the standard way to say 'me too' in a negative context.","hf":"موافقت با جملات منفی","bf":"برای موافقت با یک جمله منفی، از 'Neither do I' یا 'Neither am I' استفاده کنید. این تأیید می‌کند که شما نیز وضعیت یا نظر منفی مشابهی دارید. این روش استاندارد برای گفتن 'من هم' در یک زمینه منفی است.","ex":[{"e":"I don't like coffee.","p":"من قهوه را دوست ندارم."},{"e":"Neither do I.","p":"من هم."}]},{"h":"Expressing opinion agreement","b":"When someone shares an opinion and you want to agree, you can say 'I think so'. This phrase is polite and clear. It shows that your thoughts align with theirs.","hf":"بیان موافقت با نظر","bf":"وقتی کسی نظری را به اشتراک می‌گذارد و می‌خواهید موافقت کنید، می‌توانید بگویید 'I think so'. این عبارت مودبانه و واضح است. این نشان می‌دهد که افکار شما با افکار او همسو است.","ex":[{"e":"It is going to rain today.","p":"امروز باران می‌بارد."},{"e":"I think so.","p":"من هم فکر می‌کنم."}]}],"tip":"Remember to match the auxiliary verb in your response to the verb in the original sentence. Use 'do' for simple present/past actions and 'am/is/are' for states or continuous actions.","tipf":"به یاد داشته باشید که فعل کمکی در پاسخ خود را با فعل در جمله اصلی مطابقت دهید. برای افعال ساده حال/گذشته از 'do' و برای حالت‌ها یا افعال مستمر از 'am/is/are' استفاده کنید.","bad":[{"b":"So I do.","g":"So do I.","w":"This structure is used to emphasize that something is true, not to agree with someone else. For agreement, the subject and auxiliary verb are swapped.","wf":"این ساختار برای تأکید بر اینکه چیزی درست است استفاده می‌شود، نه برای موافقت با کسی دیگر. برای موافقت، فاعل و فعل کمکی جابجا می‌شوند."},{"b":"Neither I do.","g":"Neither do I.","w":"The word order is incorrect. In negative agreement, the auxiliary verb comes before the subject.","wf":"ترتیب کلمات نادرست است. در موافقت منفی، فعل کمکی قبل از فاعل می‌آید."},{"b":"I think too.","g":"I think so.","w":"While 'I think too' is understandable, 'I think so' is the standard idiomatic expression for agreeing with an opinion or prediction.","wf":"اگرچه 'I think too' قابل فهم است، اما 'I think so' عبارت اصطلاحی استاندارد برای موافقت با یک نظر یا پیش‌بینی است."}],"gold":[{"e":"Use 'So + auxiliary + subject' for positive agreement.","f":"برای موافقت مثبت از 'So + فعل کمکی + فاعل' استفاده کنید."},{"e":"Use 'Neither/Nor + auxiliary + subject' for negative agreement.","f":"برای موافقت منفی از 'Neither/Nor + فعل کمکی + فاعل' استفاده کنید."},{"e":"Use 'I think so' to agree with an opinion or prediction.","f":"برای موافقت با یک نظر یا پیش‌بینی از 'I think so' استفاده کنید."}]}],"ex":[{"t":"gap","q":"___ you like coffee?","key":["Do"],"why":"Present Simple question with 'you' requires the auxiliary 'Do'."},{"t":"gap","q":"She ___ not like tea.","key":["does"],"why":"Present Simple negative with 'she' requires the auxiliary 'does'."},{"t":"gap","q":"___ they playing football now?","key":["Are"],"why":"Present Continuous question with 'they' requires the auxiliary 'Are'."},{"t":"gap","q":"He ___ to the party yesterday.","key":["went"],"why":"Past Simple statement uses the past form 'went' for 'go'."},{"t":"gap","q":"___ you see the movie?","key":["Did"],"why":"Past Simple question requires the auxiliary 'Did'."},{"t":"gap","q":"She ___ never been to London.","key":["has"],"why":"Present Perfect with 'she' requires the auxiliary 'has'."},{"t":"fix","q":"Does he likes apples?","key":["Does he like apples?"],"why":"In questions with 'Does', the main verb stays in base form."},{"t":"fix","q":"She don't know the answer.","key":["She doesn't know the answer."],"why":"Third person singular requires 'doesn't' instead of 'don't'."},{"t":"fix","q":"They are went to school.","key":["They went to school."],"why":"Past Simple uses the past verb form, not 'are' + past participle."},{"t":"fa","q":"آیا تو کتاب خوانده‌ای؟","key":["Have you read the book?"],"why":"Present Perfect question translates 'read' as 'have you read'."},{"t":"fa","q":"او به مدرسه نمی‌رود.","key":["He does not go to school."],"why":"Present Simple negative uses 'does not' + base verb."},{"t":"fa","q":"��یا او می‌آید؟","key":["Is he coming?"],"why":"Present Continuous question uses 'Is' + subject + verb-ing."},{"t":"gap","q":"___ you like pizza?","key":["Do"],"why":"Present Simple question with 'you' requires the auxiliary 'Do'."},{"t":"fix","q":"Does she likes coffee?","key":["Does she like coffee?"],"why":"After 'Does', the main verb returns to its base form, so 'likes' becomes 'like'."},{"t":"fa","q":"آیا او به پارک رفته است؟","key":["Has he gone to the park?"],"why":"Present Perfect question structure uses 'Has' + subject + past participle."}]},{"id":"t07","t":"Present Perfect","tf":"حال کامل","parts":[{"lv":"B","title":"Present Perfect (1)","exp":[{"h":"Structure and General Use","b":"You form this tense with have or has plus the past participle. You use it to talk about life experiences when the exact time does not matter.","hf":"ساختار و کاربرد کلی","bf":"این زمان از ساختار have یا has به همراه فعل گذشته (past participle) تشکیل شده است. برای صحبت درباره تجربه‌های زندگی که زمان دقیق آن‌ها مهم نیست استفاده می‌شود.","ex":[{"e":"I have visited London.","p":"من به لندن سفر کرده‌ام."},{"e":"She has seen this movie.","p":"او این فیلم را دیده است."}]},{"h":"Using just, already, and yet","b":"You use just for actions that happened recently. You use already for things that happened sooner than expected, and yet for things that have not happened yet in negative sentences and questions.","hf":"استفاده از just, already و yet","bf":"از just برای کارهایی که تازه انجام شده�� از already برای کارهایی که زودتر از انتظار انجام شده و از yet برای کارهایی که هنوز انجام نشده در جملات منفی و سوالی استفاده می‌کنیم.","ex":[{"e":"I have just finished my work.","p":"من تازه کارم را تمام کرده‌ام."},{"e":"Have you finished yet?","p":"آیا هنوز تمام کرده‌ای؟"}]},{"h":"Difference with Past Simple","b":"In the present perfect, the exact time of the event is not important. In the past simple, the time is specific, while the present perfect focuses on the result of the action.","hf":"تفاوت با Past Simple","bf":"در حال کامل زمان دقیق اتفاق مهم نیست، اما در گذشته ساده زمان مشخص است. حال کامل روی نتیجه فعل در حال تمرکز دارد.","ex":[{"e":"I have lost my keys.","p":"کلیدهایم را گم کرده‌ام (هنوز پیدایشان نکرده‌ام)."},{"e":"I lost my keys yesterday.","p":"کلیدهایم را دیروز گم کردم."}]}],"tip":"Memorize the third form of irregular verbs to avoid mistakes.","tipf":"برای افعال بی‌قاعد، شکل سوم آن‌ها را حفظ کنید.","bad":[{"b":"I have went to school.","g":"I have gone to school.","w":"go is irregular and its third form is gone.","wf":"فعل go بی‌قاعد است و شکل سوم آن gone است."},{"b":"She has already went home.","g":"She has already gone home.","w":"go is irregular and you must use gone.","wf":"فعل go بی‌قاعد است و باید از gone استفاده شود."},{"b":"I have not saw him.","g":"I have not seen him.","w":"see is irregular and its third form is seen.","wf":"فعل see بی‌قاعد است و شکل سوم آن seen است."}],"gold":[{"e":"Always remember that have or has must agree with the subject.","f":"همیشه به یاد داشته باشید که have یا has باید با فاعل مطابقت داشته باشد."},{"e":"Use the past participle form, not the past simple form, for regular verbs ending in e.","f":"برای افعال منظمی که با e پایان می‌یابند، شکل سوم را نه شکل گذشته ساده استفاده کنید."},{"e":"Never use a specific past time expression like yesterday with the present perfect.","f":"هرگز با حال کامل از قیدهای زمان مشخص گذشته مانند دیروز استفاده نکنید."}]},{"lv":"B","title":"Present Perfect (2): for / since","exp":[{"h":"Difference between for and since","b":"You use for to talk about the duration of an action, such as two hours or three years. Use since to indicate the starting point in time, like yesterday or 2020. Both work with the present perfect to show actions that started in the past and continue now.","hf":"تفاوت for و since در بیان بازه زمانی","bf":"برای گفتن مدت زمان (چند روز، چند سال) از for استفاده می‌کنیم. اما برای نشان دادن زمان شروع کار (دیروز، ساعت ۲) از since کمک می‌گیریم. این ساختارها با زمان حال کامل می‌آیند تا کارهایی را نشان دهند که از گذشته شروع شده و هنوز ادامه دارند.","ex":[{"e":"I have lived here for three years.","p":"من سه سال است که اینجا زندگی می‌کنم."},{"e":"I have lived here since 2021.","p":"من از سال ۲۰۲۱ اینجا زندگی می‌کنم."}]},{"h":"Using for for durations","b":"Place for before a period of time to show how long something has lasted. It answers the question how long. For example, you can say for a week or for a long time.","hf":"استفاده از for برای مدت زمان‌ها","bf":"کلمه for قبل از طول مدت زمان (یک ساعت، دو هفته، مدت طولانی) می‌آید. این کلمه به شما می‌گوید چه مقدار زمان سپری شده است.","ex":[{"e":"She has worked in this bank for five years.","p":"او پنج سال است که در این بانک کار می‌کند."},{"e":"We have waited for the bus for a long time.","p":"ما مدت زیادی است که منتظر اتوبوس هستیم."}]},{"h":"Using since for starting points","b":"Place since before a specific moment when the action began. It marks the beginning of the period. You might say since Monday or since last year.","hf":"استفاده از since برای نقطه شروع","bf":"کلمه since قبل از زمان دقیق شروع کار (دوشنبه، ماه مه، سال گذشته) قرار می‌گیرد. این کلمه مبدأ زمانی را مشخص می‌کند.","ex":[{"e":"He has been sick since Monday.","p":"او از روز دوشنبه بیمار است."},{"e":"They have known each other since childhood.","p":"آن‌ها از دوران کودکی یکدیگر را می‌شناسند."}]}],"tip":"Remember that for measures length of time, while since points to the start date.","tipf":"یادتان باشد در فارسی می‌گوییم «دارم می‌روم»، اما در انگلیسی برای کاری که از گذشته شروع شده و هنوز ادامه دارد، حتماً از Present Perfect (have/has + V3) همراه با for یا since استفاده کنید.","bad":[{"b":"I am here since three years.","g":"I have been here for three years.","w":"Persian speakers often use the simple present with since, but English requires the present perfect for ongoing actions.","wf":"فارسی‌زبانان اغلب زمان حال ساده یا استمراری را با since می‌آورند، در حالی که در انگلیسی باید از حال کامل استفاده کنید."},{"b":"She has studied English for Monday.","g":"She has studied English since Monday.","w":"You should use since for specific days or dates, not for, because since marks the starting point.","wf":"برای روزهای هفته و نقاط مشخص در گذشته باید از since استفاده کنید، نه for."},{"b":"He has working here since two months.","g":"He has worked here for two months.","w":"After for comes a duration, and the verb must be in the past participle form after have or has.","wf":"بعد از for باید بازه زمانی (مدت) بیاید و برای فعل پس از have/has باید از شکل سوم فعل (V3) استفاده شود."}],"gold":[{"e":"Use for with periods of time and since with specific starting points.","f":"بر بازه‌های زمانی از for و برای نقاط شروع از since استفاده کنید."},{"e":"Always use the present perfect tense with for and since.","f":"همیشه با for و since از زمان حال کامل استفاده کنید."},{"e":"Ensure the main verb is in its third form when using present perfect.","f":"مطمئن شوید فعل اصلی در شکل سوم باشد وقتی حال کامل استفاده می‌کنید."}]},{"lv":"B","title":"just / already / yet with the present perfect","exp":[{"h":"Understanding 'just' for recent actions","b":"Use 'just' to talk about something that happened a very short time ago. It emphasizes the immediate past and is always placed between 'have/has' and the past participle. Think of it as meaning 'a moment ago'.","hf":"درک کردن 'just' برای کارهای اخیراً انجام‌شده","bf":"از 'just' برای صحبت درباره کاری که بسیار کوتاه پیش اتفاق افتاده استفاده کنید. این واژه بر گذشته‌ی نزدیک تأکید دارد و همیشه بین 'have/has' و اسم مفعول قرار می‌گیرد. آن را به معنای 'همین الان' یا 'لحظاتی پیش' در نظر بگیرید.","ex":[{"e":"I have just finished my homework.","p":"من همین الان تکالیفم را تمام کرده‌ام."},{"e":"She has just arrived at the station.","p":"او تازه به ایستگاه رسیده است."}]},{"h":"Using 'already' for earlier than expected","b":"Use 'already' to say that something happened before now or before you expected it to happen. It often expresses surprise that an action is complete. It usually goes in the middle of the verb phrase.","hf":"استفاده از 'already' برای کارهایی زودتر از حد انتظار","bf":"از 'already' برای گفتن اینکه کاری قبل از زمان حال یا قبل از اینکه انتظارش را داشتید اتفاق افتاده استفاده کنید. این واژه اغلب تعجب از کامل شدن یک عمل را بیان می‌کند. آن معمولاً در وسط عبارت فعلی قرار می‌گیرد.","ex":[{"e":"We have already seen this movie.","p":"ما قبلاً این فیلم را دیده‌ایم."},{"e":"Have you already eaten lunch?","p":"آیا همین الان ناهار خورده‌ای؟"}]},{"h":"Using 'yet' in questions and negatives","b":"Use 'yet' in questions to ask if something has happened up to now, and in negative sentences to say it hasn't happened up to now. It usually comes at the end of the sentence.","hf":"استفاده از 'yet' در سوالات و جملات منفی","bf":"از 'yet' در جملات پرسشی برای پرسیدن اینکه آیا کاری تا این لحظه انجام شده است استفاده کنید، و در جملات منفی برای بیان اینکه کاری هنوز انجام نشده است. این واژه معمولاً در انتهای جمله می‌آید.","ex":[{"e":"Have you finished your report yet?","p":"آیا هنوز گزارشت را تمام کرده‌ای؟"},{"e":"I haven't called him yet.","p":"من هنوز به او زنگ نزده‌ام."}]}],"tip":"Remember that 'just' and 'already' usually go in the middle, while 'yet' goes at the end.","tipf":"به یاد داشته باشید که 'just' و 'already' معمولاً در وسط جمله می‌آیند، در حالی که 'yet' در انتهای آن قرار می‌گیرد.","bad":[{"b":"I have finished already my homework.","g":"I have already finished my homework.","w":"Adverbs like 'already' usually go between the auxiliary verb and the main verb, not at the end of the object.","wf":"قیدهایی مانند 'already' معمولاً بین فعل کمکی و فعل اصلی قرار می‌گیرند، نه بعد از مفعول."},{"b":"Have you yet eaten?","g":"Have you eaten yet?","w":"'Yet' is typically placed at the end of the sentence in questions, not in the middle.","wf":"واژه 'yet' در جملات پرسشی معمولاً در انتهای جمله قرار می‌گیرد، نه در وسط آن."},{"b":"She has just left a moment ago.","g":"She has just left.","w":"'Just' already implies 'a moment ago', so adding 'a moment ago' is redundant.","wf":"واژه 'just' خودش مفهوم 'لحظاتی پیش' را می‌رساند، بنابراین اضافه کردن عبارت 'a moment ago' حشو و اضافی است."}],"gold":[{"e":"Use 'just' for very recent past actions.","f":"از 'just' برای کارهایی که در گذشته‌ی بسیار نزدیک انجام شده‌اند استفاده کنید."},{"e":"Use 'already' for actions completed before now or earlier than expected.","f":"از 'already' برای کارهایی که قبل از زمان حال یا زودتر از انتظار کامل شده‌اند استفاده کنید."},{"e":"Use 'yet' in questions and negatives to ask about or state that something hasn't happened up to now.","f":"از 'yet' در جملات پرسشی و منفی استفاده کنید تا بپرسید یا بیان کنید که کاری تا این لحظه اتفاق نیافتده است."}]},{"lv":"B","title":"Have you ever …? (experience)","exp":[{"h":"The Structure of Present Perfect","b":"To talk about life experiences, we use the present perfect tense. This is formed with 'have' or 'has' plus the past participle of the verb. For most verbs, the past participle ends in -ed, but irregular verbs have unique forms you need to memorize.","hf":"ساختار حال کامل","bf":"برای صحبت درباره تجربیات زندگی، از زمان حال کامل استفاده می‌کنیم. این زمان با 'have' یا 'has' به همراه شکل سوم فعل (past participle) ساخته می‌شود. برای اکثر افعال، شکل سوم با -ed پایان می‌یابد، اما افعال بی‌قاعده شکل‌های خاص خود را دارند که باید آن‌ها را به خاطر بسپارید.","ex":[{"e":"I have visited Paris twice.","p":"من دو بار به پاریس سفر کرده‌ام."},{"e":"She has never eaten sushi.","p":"او هرگز سوشی نخورده است."}]},{"h":"Using 'Ever' and 'Never'","b":"We use 'ever' in questions to ask if something happened at any time in your life. We use 'never' to say that something did not happen at any time. 'Never' already means 'not ever', so we do not use 'not' with it.","hf":"استفاده از 'ever' و 'never'","bf":"ما از 'ever' در سوالات برای پرسیدن اینکه آیا چیزی در هر زمانی از زندگی شما رخ داده است استفاده می‌کنیم. ما از 'never' برای بیان اینکه چیزی در هیچ زمانی رخ نداده است استفاده می‌کنیم. کلمه 'never' خودش به معنی «هرگز نه» است، بنابراین با آن از 'not' استفاده نمی‌کنیم.","ex":[{"e":"Have you ever seen a ghost?","p":"آیا تا به حال روح دیده‌ای؟"},{"e":"I have never been to Japan.","p":"من هرگز به ژاپن نرفته‌ام."}]},{"h":"Answering Experience Questions","b":"When answering these questions, you can simply say 'Yes, I have' or 'No, I haven't'. If you want to add more detail, you can mention when it happened or how many times. Remember to use the correct auxiliary verb in your short answer.","hf":"پاسخ دادن به سوالات تجربی","bf":"هنگام پاسخ به این سوالات، می‌توانید به سادگی بگویید «بله، دارم» (بله، کرده‌ام) یا «خیر، ندارم» (خیر، نکرده‌ام). اگر می‌خواهید جزئیات بیشتری اضافه کنید، می‌توانید اشاره کنید که چه زمانی یا چند بار این اتفاق افتاده است. به یاد داشته باشید که در پاسخ کوتاه خود از فعل کمکی صحیح استفاده کنید.","ex":[{"e":"Have you read this book? Yes, I have.","p":"آیا این کتاب را خوانده‌ای؟ بله، خوانده‌ام."},{"e":"Have you met the boss? No, I haven't.","p":"آیا با مدیر ملاقات کرده‌ای؟ خیر، ملاقات نکرده‌ام."}]}],"tip":"Always check if the verb is regular or irregular. If it is irregular, make sure you use the correct past participle form, not the simple past form.","tipf":"همیشه بررسی کنید که فعل باقاعده است یا بی‌قاعده. اگر بی‌قاعده است، مطمئن شوید که شکل صحیح past participle را استفاده کرده‌اید، نه شکل simple past.","bad":[{"b":"I have went to London.","g":"I have gone to London.","w":"'Went' is the simple past form. The past participle of 'go' is 'gone'.","wf":"کلمه 'went' شکل simple past است. شکل past participle فعل 'go' کلمه 'gone' است."},{"b":"I have not never seen that movie.","g":"I have never seen that movie.","w":"Using 'not' and 'never' together creates a double negative. Since 'never' already implies negation, you only need one.","wf":"استفاده همزمان از 'not' و 'never' یک منفی مضاعف ایجاد می‌کند. از آنجا که 'never' خودش بار منفی دارد، فقط به یکی از آن‌ها نیاز دارید."},{"b":"Has you ever been to Iran?","g":"Have you ever been to Iran?","w":"The auxiliary verb must match the subject. For 'you', we use 'have', not 'has'.","wf":"فعل کمکی باید با فاعل مطابقت داشته باشد. برای 'you'، ما از 'have' استفاده می‌کنیم، نه 'has'."}],"gold":[{"e":"Use the present perfect to describe experiences without a specific time.","f":"از زمان حال کامل برای توصیف تجربیات بدون تعیین زمان مشخص استفاده کنید."},{"e":"Place 'never' between 'have/has' and the past participle.","f":"کلمه 'never' را بین 'have/has' و past participle قرار دهید."},{"e":"Use 'ever' only in questions or negative contexts to emphasize 'at any time'.","f":"از 'ever' در جملات پرسشی یا بافت‌های منفی برای تأکید بر 'در هر زمانی' استفاده کنید."}]},{"lv":"B","title":"been / gone and finished actions (present perfect basics)","exp":[{"h":"Using 'been' for completed visits","b":"Use 'have been' when you went to a place and have already returned home. It focuses on the experience of visiting that location. Think of it as a round trip that is now finished.","hf":"استفاده از 'been' برای بازدیدهای کامل شده","bf":"وقتی به جایی رفته‌اید و حالا به خانه برگشته‌اید، از 'have been' استفاده کنید. این روی تجربه بازدید از آن مکان تمرکز دارد. آن را به عنوان یک سفر رفت و برگشتی که تمام شده است در نظر بگیرید.","ex":[{"e":"I have been to Paris twice.","p":"من دو بار به پاریس رفته‌ام."},{"e":"She has been to London recently.","p":"او اخیراً به لندن رفته است."}]},{"h":"Using 'gone' for someone who is still away","b":"Use 'has gone' when someone traveled to a place and is still there now. They have not returned yet. This indicates their current location is not here.","hf":"استفاده از 'gone' برای کسی که هنوز دور است","bf":"وقتی کسی به جایی سفر کرده و هنوز آنجا است، از 'has gone' استفاده کنید. او هنوز برنگشته است. این نشان می‌دهد که مکان فعلی او اینجا نیست.","ex":[{"e":"John has gone to the bank.","p":"جان به بانک رفته است."},{"e":"They have gone to Italy for vacation.","p":"آن‌ها برای تعطیلات به ایتالیا رفته‌اند."}]},{"h":"Distinguishing results from actions","b":"The present perfect connects past actions to the present moment. 'Been' and 'gone' help show where someone is now based on their past movement. Use 'been' for experience and 'gone' for current absence.","hf":"تمایز نتایج از اقدامات","bf":"حال کامل اقدامات گذشته را به لحظه حال متصل می‌کند. 'been' و 'gone' کمک می‌کنند تا بر اساس حرکت گذشته‌شان نشان دهیم که کسی اکنون کجاست. برای تجربه از 'been' و برای غیبت فعلی از 'gone' استفاده کنید.","ex":[{"e":"I have been to that museum.","p":"من به آن موزه رفته‌ام."},{"e":"My sister has gone to work.","p":"خواهرم به سر کار رفته است."}]}],"tip":"Remember: 'been' means you visited and came back, while 'gone' means the person is still there.","tipf":"به یاد داشته باشید: 'been' یعنی شما بازدید کردید و برگشتید، در حالی که 'gone' یعنی شخص هنوز آنجا است.","bad":[{"b":"I have gone to Paris last year.","g":"I went to Paris last year.","w":"We use the simple past with specific past time markers like 'last year', not the present perfect with 'gone'.","wf":"برای نشانگرهای زمانی مشخص گذشته مانند «سال گذشته»، از گذشته ساده استفاده می‌کنیم، نه حال کامل با 'gone'."},{"b":"She has been to the office, so she is here now.","g":"She has gone to the office, so she is not here now.","w":"If she is still at the office, we use 'gone' and state she is not here. 'Been' implies she returned.","wf":"اگر او هنوز در دفتر است، از 'gone' استفاده می‌کنیم و بیان می‌کنیم که اینجا نیست. 'been' نشان می‌دهد که او برگشته است."},{"b":"Have you been to the cinema yesterday?","g":"Did you go to the cinema yesterday?","w":"With specific past time words like 'yesterday', we use the simple past, not the present perfect.","wf":"با کلمات زمان مشخص گذشته مانند «دیروز»، از زمان گذشته ساده استفاده می‌کنیم، نه حال کامل."}],"gold":[{"e":"Use 'have/has been' for life experiences and returned visits.","f":"برای تجربیات زندگی و بازدیدهای برگشتی از 'have/has been' استفاده کنید."},{"e":"Use 'have/has gone' for people who are currently at the destination.","f":"برای افرادی که در حال حاضر در مقصد هستند از 'have/has gone' استفاده کنید."},{"e":"Never use the present perfect with specific past time expressions like 'yesterday'.","f":"هرگز از زمان حال کامل با عبارات زمانی خاص گذشته مانند «دیروز» استفاده نکنید."}]},{"lv":"B","title":"for / since / How long have you …?","exp":[{"h":"Using 'for' to show duration","b":"We use 'for' to talk about a period of time. It answers the question 'how long?'. You can use it with years, months, days, or hours.","hf":"استفاده از 'for' برای نشان دادن مدت زمان","bf":"ما از 'for' برای صحبت درباره یک بازه زمانی استفاده می‌کنیم. این کلمه به سوال 'چند وقت؟' پاسخ می‌دهد. شما می‌توانید آن را با سال‌ها، ماه‌ها، روزها یا ساعت‌ها استفاده کنید.","ex":[{"e":"I have lived here for ten years.","p":"من ده سال است که اینجا زندگی می‌کنم."},{"e":"She waited for an hour.","p":"او یک ساعت صبر کرد."}]},{"h":"Using 'since' to show a starting point","b":"Use 'since' when you mention the exact point in time when something started. It connects the past to the present.","hf":"استفاده از 'since' برای نشان دادن نقطه شروع","bf":"وقتی نقطه دقیق زمانی که چیزی شروع شده است را ذکر می‌کنید، از 'since' استفاده کنید. این کلمه گذشته را به حال متصل می‌کند.","ex":[{"e":"I have known him since 2010.","p":"من از سال ۲۰۱۰ او را می‌شناسم."},{"e":"We have been friends since childhood.","p":"ما از کودکی دوست هستیم."}]},{"h":"Asking 'How long have you...?'","b":"This question helps you ask about the duration of an action. Use the present perfect tense to ask about actions that started in the past and continue now.","hf":"پرسیدن 'How long have you...?'","bf":"این سوال به شما کمک می‌کند درباره مدت زمان یک عمل بپرسید. برای پرسیدن درباره عمل‌هایی که در گذشته شروع شده و اکنون ادامه دارند، از زمان حال کامل استفاده کنید.","ex":[{"e":"How long have you studied English?","p":"چند وقت است که انگلیسی می‌خوانی؟"},{"e":"How long have you worked here?","p":"چند وقت است که اینجا کار می‌کنی؟"}]}],"tip":"Remember: 'for' is followed by a duration (a length of time), while 'since' is followed by a specific point in time.","tipf":"به یاد داشته باشید: بعد از 'for' یک مدت زمان (طول زمان) می‌آید، در حالی که بعد از 'since' یک نقطه خاص زمانی می‌آید.","bad":[{"b":"I have lived here since five years.","g":"I have lived here for five years.","w":"We use 'for' with a period of time, not 'since'.","wf":"ما با یک بازه زمانی از 'for' استفاده می‌کنیم، نه 'since'."},{"b":"I have known her since three days.","g":"I have known her for three days.","w":"'Since' needs a specific start point, like 'since Monday'.","wf":"کلمه 'since' به یک نقطه شروع خاص نیاز دارد، مثل 'since Monday'."},{"b":"How long do you live here?","g":"How long have you lived here?","w":"Use present perfect for actions continuing from past to present.","wf":"برای عمل‌هایی که از گذشته تا حال ادامه دارند، از زمان حال کامل استفاده کنید."}],"gold":[{"e":"Use 'for' with a duration and 'since' with a starting point.","f":"از 'for' با مدت زمان و از 'since' با نقطه شروع استفاده کنید."},{"e":"'How long' questions usually require the present perfect tense.","f":"سوالات 'How long' معمولاً به زمان حال کامل نیاز دارند."},{"e":"Both 'for' and 'since' indicate an action that started in the past and continues now.","f":"هم 'for' و هم 'since' نشان می‌دهند که عملی در گذشته شروع شده و همچنان ادامه دارد."}]},{"lv":"I","title":"Present Perfect Continuous (I have been doing)","exp":[{"h":"Understanding the Form","b":"To form this tense, you need the subject, 'have' or 'has', 'been', and the verb ending in '-ing'. For example, 'I have been studying' or 'She has been working'. It is very common to use 'have been' with 'I', 'you', 'we', and 'they', and 'has been' with 'he', 'she', or 'it'.","hf":"درک ساختار","bf":"برای ساختن این زمان، شما به فاعل، 'have' یا 'has'، 'been' و فعلی که به '-ing' ختم می‌شود نیاز دارید. برای مثال، 'I have been studying' یا 'She has been working'. استفاده از 'have been' با 'I', 'you', 'we' و 'they' و 'has been' با 'he', 'she' یا 'it' بسیار رایج است.","ex":[{"e":"I have been waiting for an hour.","p":"من یک ساعت است که منتظر هستم."},{"e":"They have been playing football all afternoon.","p":"آن‌ها تمام بعدازظهر فوتبال بازی کرده‌اند."}]},{"h":"Focusing on Duration","b":"We use this tense to emphasize how long an action has been happening. You often see words like 'for' or 'since' to show the time period. It highlights the continuous nature of the activity rather than just the fact that it happened.","hf":"تمرکز بر مدت زمان","bf":"ما از این زمان برای تأکید بر مدت زمانی که یک عمل ادامه داشته استفاده می‌کنیم. شما اغلب کلماتی مانند 'for' یا 'since' را می‌بینید که دوره زمانی را نشان می‌دهند. این زمان جنبه پیوسته فعالیت را برجسته می‌کند نه فقط واقعیت اینکه انجام شده است.","ex":[{"e":"She has been reading since morning.","p":"او از صبح در حال خواندن است."},{"e":"We have been living here for ten years.","p":"ما ده سال است که اینجا زندگی می‌کنیم."}]},{"h":"Recent Visible Results","b":"Sometimes we use this tense to explain a current situation caused by a recent activity. For instance, if you are tired, you might say you have been working hard. The focus is on the recent action that has a present effect.","hf":"نتایج قابل مشاهده اخیر","bf":"گاهی اوقات ما از این زمان برای توضیح یک وضعیت فعلی که ناشی از یک فعالیت اخیر است استفاده می‌کنیم. برای مثال، اگر خسته هستید، ممکن است بگویید که سخت کار کرده‌اید. تمرکز بر فعالیت اخیر است که اثری در حال حاضر دارد.","ex":[{"e":"Your eyes are red because you have been crying.","p":"چشم‌هایت قرمز است چون گریه کرده‌ای."},{"e":"He is out of breath because he has been running.","p":"او نفس‌نفس می‌زند چون دویده است."}]}],"tip":"Remember that 'have been' is used with I, you, we, and they, while 'has been' is used with he, she, and it.","tipf":"به یاد داشته باشید که 'have been' با I، you، we و they استفاده می‌شود، در حالی که 'has been' با he، she و it استفاده می‌شود.","bad":[{"b":"I have been study English for two years.","g":"I have been studying English for two years.","w":"After 'been', you must use the verb with '-ing', not the base form.","wf":"بعد از 'been' باید از فعل با '-ing' استفاده کنید، نه شکل پایه."},{"b":"She has been work here since 2020.","g":"She has been working here since 2020.","w":"The verb after 'has been' needs the '-ing' ending to show continuous action.","wf":"فعل بعد از 'has been' باید پسوند '-ing' داشته باشد تا عمل پیوسته را نشان دهد."},{"b":"We have been play tennis yesterday.","g":"We played tennis yesterday.","w":"Use Present Perfect Continuous for actions continuing to now or with present results, not for finished past times like 'yesterday'.","wf":"برای عمل‌هایی که تا حال ادامه داشته‌اند یا اثر حال دارند از حال کامل استمراری استفاده کنید، نه برای زمان‌های گذشته ساده مثل 'دیروز'."}],"gold":[{"e":"Use Present Perfect Continuous to talk about actions that started in the past and are still continuing or have just stopped with visible results.","f":"از حال کامل استمراری برای صحبت درباره عمل‌هایی استفاده کنید که در گذشته شروع شده‌اند و هنوز ادامه دارند یا تازه متوقف شده‌اند و نتایج قابل مشاهده دارند."},{"e":"The structure is Subject + have/has + been + Verb-ing.","f":"ساختار به این صورت است: فاعل + have/has + been + فعل-ing."},{"e":"Use 'for' with a period of time and 'since' with a starting point.","f":"از 'for' با یک بازه زمانی و از 'since' با یک نقطه شروع استفاده کنید."}]},{"lv":"I","title":"Present Perfect vs Past Simple (contrast)","exp":[{"h":"When does it happen?","b":"Use the Past Simple when you know exactly when the action happened. It is finished and done. Use the Present Perfect when the time is not important or not mentioned. Focus on the result now.","hf":"چه زمانی اتفاق افتاده است؟","bf":"وقتی می‌دانید عمل دقیقاً چه زمانی رخ داده است، از گذشته ساده استفاده کنید؛ تمام شده و رفته است. از حال کامل استفاده کنید وقتی زمان مهم نیست یا ذکر نشده است و روی نتیجه‌ی کنونی تمرکز دارید.","ex":[{"e":"I lost my keys yesterday.","p":"دیروز کلیدهایم را گم کردم."},{"e":"I have lost my keys.","p":"کلیدهایم را گم کرده‌ام (و هنوز ندارمشان)."}]},{"h":"Time words matter","b":"Look for time words. Words like 'yesterday', 'last week', or 'in 2010' mean Past Simple. Words like 'already', 'yet', 'ever', or 'never' usually go with Present Perfect. They connect the past to now.","hf":"کلمات زمان مهم هستند","bf":"به کلمات زمان دقت کنید. کلماتی مانند «دیروز»، «هفته گذشته» یا «در سال ۲۰۱۰» با گذشته ساده می‌آیند. کلماتی مانند «قبلاً»، «هنوز»، «تاکنون» یا «هرگز» معمولاً با حال کامل می‌آیند؛ زیرا گذشته را به زمان حال متصل می‌کنند.","ex":[{"e":"She arrived last night.","p":"او دیشب رسید."},{"e":"She has already arrived.","p":"او قبلاً (همین الان) رسیده است."}]},{"h":"Life experience","b":"If you talk about your life experience up to now, use Present Perfect. The exact date does not matter. If you tell a story about a specific time in the past, use Past Simple.","hf":"تجربه زندگی","bf":"اگر درباره تجربه‌های زندگی‌تان تا به امروز صحبت می‌کنید، از حال کامل استفاده کنید و تاریخ دقیق مهم نیست. اما اگر داستانی درباره زمان خاصی در گذشته تعریف می‌کنید، گذشته ساده را به کار ببرید.","ex":[{"e":"I have been to Paris twice.","p":"دو بار به پاریس رفته‌ام."},{"e":"I went to Paris in 2019.","p":"در سال ۲۰۱۹ به پاریس رفتم."}]}],"tip":"If you mention a finished time period like 'yesterday' or 'last year', always use Past Simple.","tipf":"اگر به یک بازه زمانی تمام‌شده مانند «دیروز» یا «سال گذشته» اشاره می‌کنید، همیشه از گذشته ساده استفاده کنید.","bad":[{"b":"I have seen that movie yesterday.","g":"I saw that movie yesterday.","w":"You cannot use Present Perfect with a specific finished time like 'yesterday'.","wf":"نمی‌توانید از حال کامل با یک زمان مشخص و تمام‌شده مانند «دیروز» استفاده کنید."},{"b":"Did you ever eat sushi?","g":"Have you ever eaten sushi?","w":"'Ever' asks about life experience up to now, so use Present Perfect.","wf":"واژه 'ever' درباره تجربه زندگی تا به امروز پرسش می‌کند، بنابراین باید از حال کامل استفاده کنید."}],"gold":[{"e":"Past Simple is for finished actions at a specific time.","f":"گذشته ساده برای کارهای تمام‌شده در زمانی مشخص است."},{"e":"Present Perfect connects the past to the present moment.","f":"حال کامل، گذشته را به لحظه حال متصل می‌کند."}]}],"ex":[{"t":"gap","q":"I ___ (see) that movie already.","key":["have seen"],"why":"Present Perfect is used for past actions with present relevance, using 'have/has' + past participle."},{"t":"gap","q":"She has ___ finished her homework.","key":["already"],"why":"'Already' is used in affirmative sentences to indicate that something has happened before now."},{"t":"gap","q":"Have you finished your work ___?","key":["yet"],"why":"'Yet' is used in questions and negative sentences to talk about something expected to happen."},{"t":"fix","q":"I have know him for ten years.","key":["I have known him for ten years."],"why":"The past participle of 'know' is 'known', not 'know'."},{"t":"gap","q":"They have lived here ___ 2010.","key":["since"],"why":"'Since' is used with a specific starting point in time."},{"t":"gap","q":"We have been friends ___ a long time.","key":["for"],"why":"'For' is used to indicate a duration of time."},{"t":"fix","q":"She has lived here since five years.","key":["She has lived here for five years."],"why":"'Since' is used with a point in time, while 'for' is used with a duration."},{"t":"gap","q":"He ___ (not/visit) his parents recently.","key":["has not visited"],"why":"Present Perfect negative form uses 'has not' + past participle."},{"t":"fix","q":"I have went to London last week.","key":["I went to London last week."],"why":"Use Past Simple with specific past time expressions like 'last week'."},{"t":"gap","q":"___ you ever ___ (be) to Iran?","key":["Have","been"],"why":"Present Perfect question structure: 'Have/Has' + subject + past participle."},{"t":"fa","q":"من این کتاب را قبلاً خوانده‌ام.","key":["I have already read this book."],"why":"Present Perfect with 'already' indicates a completed action relevant to the present."},{"t":"fa","q":"او از سال ۲۰۲۰ اینجا زندگی می‌کند.","key":["He has lived here since 2020."],"why":"Present Perfect Continuous or Simple can be used with 'since' for actions starting in the past and continuing."},{"t":"gap","q":"I have ___ (wait) for you for an hour.","key":["been waiting"],"why":"Present Perfect Continuous is used to emphasize the duration of an action that started in the past and continues to the present."},{"t":"fix","q":"She has gone to the shop, so she is not here now.","key":["She has gone to the shop, so she is not here now."],"why":"The original sentence is actually correct in standard usage where 'gone' implies she is still there; however, if the intent was to say she returned, it would be 'been'. Assuming the prompt implies a mistake in a typical learner context, a common error is using 'gone' when 'been' is meant for a completed visit. Let's adjust the 'fix' example to a clear error: 'She has gone to the shop and came back.' -> 'She has been to the shop and came back.' or 'She has been to the shop.' Let's use a clearer error: 'He has gone to Paris last year.' -> 'He went to Paris last year.' or 'He has been to Paris.' Let's stick to the 'been/gone' distinction. Error: 'She has gone to London and she is back now.' Correction: 'She has been to London and she is back now.'"},{"t":"fix","q":"She has gone to London and she is back now.","key":["She has been to London and she is back now."],"why":"Use 'been' for a completed visit where the person has returned, whereas 'gone' implies they are still there or on their way."},{"t":"fa","q":"آیا تا به حال شیرینی ایرانی خورده‌ای؟","key":["Have you ever eaten Iranian sweets?"],"why":"Use 'Have you ever...' to ask about life experience, followed by the past participle of the verb."}]},{"id":"t08","t":"Talking About the Future","tf":"گفتگو دربارهٔ آینده","parts":[{"lv":"B","title":"Future with going to","exp":[{"h":"Plans and intentions","b":"You use this structure when you have already decided to do something before you speak. It shows a more definite plan than using will.","hf":"برنامه‌ها و قصدها","bf":"وقتی قبل از صحبت کردن تصمیم گرفته‌اید کاری را انجام دهید، از این ساختار استفاده می‌کنیم. این نشان‌دهنده یک برنامه قطعی‌تر از will است.","ex":[{"e":"I am going to buy a new car.","p":"می‌خواهم یک ماشین جدید بخرم."},{"e":"She is going to study medicine.","p":"او قصد دارد پزشکی بخواند."}]},{"h":"Predictions based on evidence","b":"You use this when you can see something happening right now and are sure it will happen. It is based on what you can see or hear at the moment.","hf":"پیش‌بینی بر اساس شواهد","bf":"وقتی چیزی را همین الان می‌بینید و مطمئن هستید که اتفاق خواهد افتاد، از این ساختار استفاده می‌کنیم.","ex":[{"e":"Look at the clouds. It is going to rain.","p":"به ابرها نگاه کن. قرار است باران ببارد."},{"e":"He is going to fall.","p":"او قرار است بیفتد."}]}],"tip":"Remember to use is going to for he, she, or it, not is going.","tipf":"توجه کنید که برای سوم شخص (he/she/it) از is going to استفاده کنید، نه is going.","bad":[{"b":"I going to visit my grandmother.","g":"I am going to visit my grandmother.","w":"The verb to be (am) is missing.","wf":"فعل to be (am) فراموش شده است."},{"b":"She is going to studies English.","g":"She is going to study English.","w":"After to, you must use the base form of the verb, not the one with an s.","wf":"بعد از to باید شکل ساده فعل بیاید، نه s."}],"gold":[{"e":"Always include the correct form of to be (am, is, are) before going to.","f":"همیشه شکل درست فعل to be (am, is, are) را قبل از going to قرار دهید."},{"e":"The main verb after to is always in its base form without any endings.","f":"فعل اصلی بعد از to همیشه به شکل پایه و بدون پسوند است."},{"e":"Use is going to for he, she, and it.","f":"برای he، she و it از is going to استفاده کنید."}]},{"lv":"B","title":"Future with will","exp":[{"h":"Instant Decisions","b":"You use will when you make a decision at the moment of speaking. This means the action was not planned before you started talking.","hf":"تصمیم‌های آنی (همین الان تصمیم می‌گیریم)","bf":"وقتی همین الان و در لحظه صحبت کردن تصمیم می‌گیریم کاری را انجام دهیم، از will استفاده می‌کنیم. این کار از قبل برنامه‌ریزی نشده است.","ex":[{"e":"I'm cold. I will close the window.","p":"سردم است. پنجره را می‌بندم."},{"e":"The phone is ringing. I'll answer it.","p":"تلفن زنگ می‌زند. من جواب می‌دهم."}]},{"h":"Predictions Without Evidence","b":"You use will to guess or think about the future without specific proof. You often use words like think to show your opinion.","hf":"پیش‌بینی آینده (بدون مدرک مشخص)","bf":"وقتی فکر می‌کنیم یا حدس می‌زنیم در آینده اتفاقی می‌افتد، از will استفاده می‌کنیم. معمولاً از کلماتی مثل think استفاده می‌کنیم.","ex":[{"e":"I think it will rain tomorrow.","p":"فکر می‌کنم فردا باران ببارد."},{"e":"You will like this film.","p":"این فیلم را دوست خواهی داشت."}]},{"h":"Promises and Offers","b":"You use will to make promises, accept offers, or suggest doing something. This is its main other use in daily conversation.","hf":"قول دادن و پیشنهاد دادن","bf":"برای قول دادن به کسی، قبول کردن یا پیشنهاد دادن کاری، کاربرد اصلی دیگر will است.","ex":[{"e":"I will help you with your homework.","p":"در انجام تکالیفت به تو کمک خواهم کرد."},{"e":"I won't tell anyone your secret.","p":"راستت را به کسی نخواهم گفت."}]}],"tip":"Do not use will for plans you made before speaking; use going to for those instead.","tipf":"برای تصمیم‌های از پیش برنامه‌ریزی‌شده از will استفاده نکنید؛ برای آن‌ها going to به کار ببرید.","bad":[{"b":"I am go to the store now, I will buy milk.","g":"I will go to the store and buy milk.","w":"You should not use am go for instant decisions; will is the correct choice.","wf":"برای تصمیم آنی نباید از am go استفاده کنید، بلکه will صحیح است."},{"b":"Look at the clouds, it will rain.","g":"Look at the clouds, it is going to rain.","w":"Since you see black clouds, you have evidence, so you must use going to, not will.","wf":"چون ابرهای سیاه را می‌بینیم و مدرک داریم، باید از going to استفاده کنیم نه will."},{"b":"I will to help you.","g":"I will help you.","w":"After will, you must always use the base verb without to.","wf":"بعد از will همیشه باید فعل ساده بدون to بیاید."}],"gold":[{"e":"Use will for spontaneous choices made right now.","f":"برای انتخاب‌های خودمانی که همین الان انجام می‌دهید از will استفاده کنید."},{"e":"Use going to for plans you made before speaking.","f":"برای برنامه‌هایی که قبل از صحبت کردن ریخته بودید از going to استفاده کنید."},{"e":"Always follow will with the base form of the verb.","f":"همیشه بعد از will از شکل ساده فعل استفاده کنید."}]},{"lv":"B","title":"will / won't (decisions, promises, predictions)","exp":[{"h":"Making Spontaneous Decisions","b":"We use 'will' when we decide to do something at the moment of speaking. It is not a plan you made before; it is a sudden choice. For example, if the phone rings, you might say, 'I will answer it.'","hf":"تصمیم‌گیری‌های آنی و ناگهانی","bf":"ما زمانی از 'will' استفاده می‌کنیم که در لحظهٔ صحبت کردن تصمیمی می‌گیریم. این یک برنامهٔ از پیش‌تعیین‌شده نیست، بلکه یک انتخاب ناگهانی است. برای مثال، اگر تلفن زنگ بخورد، ممکن است بگویید: «الان جواب می‌دهم.»","ex":[{"e":"It's hot in here. I will open the window.","p":"اینجا گرم است. پنجره را باز می‌کنم."},{"e":"I'll have the chicken, please.","p":"من مرغ سفارش می‌دهم (می‌خورم)، لطفاً."}]},{"h":"Making Promises","b":"Use 'will' to promise that something will happen. It shows your intention to do something in the future. When you say 'I will call you,' you are giving your word.","hf":"قول دادن","bf":"برای قول دادن دربارهٔ اینکه اتفاقی رخ خواهد داد، از 'will' استفاده کنید. این نشان‌دهندهٔ قصد شما برای انجام کاری در آینده است. وقتی می‌گویید «بهت زنگ می‌زنم»، در واقع قول می‌دهید.","ex":[{"e":"I will never tell anyone your secret.","p":"من هرگز راز تو را به کسی نمی‌گویم."},{"e":"She will help you with your homework.","p":"او در انجام تکالیفت به تو کمک خواهد کرد."}]},{"h":"Predicting the Future","b":"We use 'will' to predict what we think will happen. We often use words like 'think', 'hope', or 'believe' with it. It is based on your opinion, not necessarily on evidence.","hf":"پیش‌بینی آینده","bf":"ما از 'will' برای پیش‌بینی چیزی که فکر می‌کنیم اتفاق می‌افتد استفاده می‌کنیم. اغلب کلماتی مانند 'فکر می‌کنم'، 'امیدوارم' یا 'باور دارم' را همراه با آن به کار می‌بریم. این پیش‌بینی بر اساس نظر شخصی شماست، نه لزوماً بر اساس مدرک و شواهد.","ex":[{"e":"I think it will rain tomorrow.","p":"فکر می‌کنم فردا باران ببارد."},{"e":"She will be a great doctor one day.","p":"او روزی پزشک بزرگی خواهد شد."}]}],"tip":"Remember that 'will' is followed by the base form of the verb without 'to'. For example, say 'I will go', not 'I will to go'.","tipf":"به یاد داشته باشید که فعل کمکی 'will' با شکل پایهٔ فعل و بدون 'to' می‌آید. برای مثال، بگویید «I will go» و نه «I will to go».","bad":[{"b":"I will to go to the park.","g":"I will go to the park.","w":"After 'will', we do not use 'to'. The verb stays in its base form.","wf":"بعد از 'will' از 'to' استفاده نمی‌کنیم. فعل در حالت پایهٔ خود می‌ماند."},{"b":"She wills help you.","g":"She will help you.","w":"'Will' does not change for he, she, or it. It is always 'will', never 'wills'.","wf":"کلمهٔ 'will' برای ضمایر he، she یا it تغییر نمی‌کند. این کلمه همیشه 'will' است و هرگز به شکل 'wills' نوشته نمی‌شود."},{"b":"I will not going to study.","g":"I will not go to study.","w":"After 'will not' (won't), use the base verb, not the -ing form.","wf":"بعد از 'will not' (won't)، از فعل پایه استفاده کنید، نه از شکل دارای -ing."}],"gold":[{"e":"Structure: Subject + will + base verb.","f":"ساختار: فاعل + will + شکل پایهٔ فعل."},{"e":"Negative: Subject + will not (won't) + base verb.","f":"منفی: فاعل + will not (won't) + شکل پایهٔ فعل."},{"e":"Question: Will + subject + base verb?","f":"سؤالی: Will + فاعل + شکل پایهٔ فعل؟"}]},{"lv":"B","title":"will vs going to","exp":[{"h":"Spontaneous Decisions","b":"Use 'will' when you decide to do something at the moment of speaking. It is perfect for offers, promises, or sudden choices. You did not plan this before.","hf":"تصمیمات لحظه‌ای","bf":"از 'will' زمانی استفاده کنید که در لحظه صحبت کردن تصمیم می‌گیرید کاری را انجام دهید. این برای پیشنهاد دادن، قول دادن یا انتخاب‌های ناگهانی عالی است. شما قبلاً این را برنامه‌ریزی نکرده بودید.","ex":[{"e":"I'll answer the phone.","p":"من تلفن را جواب می‌دهم."},{"e":"It's hot. I'll open the window.","p":"هوا گرم است. من پنجره را باز می‌کنم."}]},{"h":"Plans and Intentions","b":"Use 'going to' for plans you made before speaking. You have already thought about it and maybe even prepared for it. It shows your intention.","hf":"برنامه‌ها و نیت‌ها","bf":"از 'going to' برای برنامه‌هایی استفاده کنید که قبل از صحبت کردن آن‌ها را ریخته بودید. شما قبلاً درباره آن فکر کرده‌اید و شاید حتی برای آن آماده شده باشید. این نشان‌دهنده نیت شماست.","ex":[{"e":"I am going to visit my grandma tomorrow.","p":"فردا می‌خواهم به دیدن مادربزرگم بروم."},{"e":"We are going to buy a new car.","p":"ما قصد داریم یک ماشین جدید بخریم."}]},{"h":"Predictions with Evidence","b":"Use 'going to' when you can see something happening right now. You have physical evidence. Use 'will' for general beliefs or guesses about the future without current evidence.","hf":"پیش‌بینی‌ها با شواهد","bf":"از 'going to' زمانی استفاده کنید که چیزی را که همین الان در حال رخ دادن است می‌بینید. شما شواهد فیزیکی دارید. از 'will' برای باورهای کلی یا حدس‌های درباره آینده بدون شواهد فعلی استفاده کنید.","ex":[{"e":"Look at the clouds! It is going to rain.","p":"به ابرها نگاه کن! دارد باران می‌آید."},{"e":"I think he will win the race.","p":"فکر می‌کنم او در مسابقه برنده شود."}]}],"tip":"Remember: 'will' is often for sudden decisions, while 'going to' is for pre-existing plans.","tipf":"به یاد داشته باشید: 'will' اغلب برای تصمیمات ناگهانی است، در حالی که 'going to' برای برنامه‌های از قبل تعیین شده است.","bad":[{"b":"I will go to the cinema tonight because I bought the tickets.","g":"I am going to go to the cinema tonight because I bought the tickets.","w":"You used 'will' for a plan made before speaking (buying tickets). 'Going to' is better for pre-arranged plans.","wf":"شما برای برنامه‌ای که قبل از صحبت کردن انجام دادید (خرید بلیط) از 'will' استفاده کردید. برای برنامه‌های از قبل ترتیب داده شده 'going to' بهتر است."},{"b":"Look! The bus is coming. I will catch it.","g":"Look! The bus is coming. I am going to catch it.","w":"You see the bus right now, so you have evidence. 'Going to' is used for predictions based on present evidence.","wf":"شما همین الان اتوبوس را می‌بینید، پس شواهد دارید. برای پیش‌بینی‌های مبتنی بر شواهد حال حاضر از 'going to' استفاده می‌شود."},{"b":"I am going to call you later.","g":"I will call you later.","w":"This is a spontaneous offer or promise made at the moment of speaking. 'Will' is more natural here.","wf":"این یک پیشنهاد یا قول ناگهانی است که در لحظه صحبت کردن داده می‌شود. 'Will' اینجا طبیعی‌تر است."}],"gold":[{"e":"Use 'will' for instant decisions and 'going to' for prior plans.","f":"از 'will' برای تصمیمات آنی و از 'going to' برای برنامه‌های از قبل تعیین شده استفاده کنید."},{"e":"'Going to' is used for predictions based on visible evidence.","f":"'going to' برای پیش‌بینی‌هایی که بر اساس شواهد قابل مشاهده هستند استفاده می‌شود."},{"e":"'Will' is often used for promises and of
