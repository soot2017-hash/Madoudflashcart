fers.","f":"'will' اغلب برای قول‌ها و پیشنهادها استفاده می‌شود."}]},{"lv":"B","title":"be going to (plans and predictions)","exp":[{"h":"Making Plans with 'be going to'","b":"Use 'be going to' when you have already decided to do something in the future. It shows your intention or plan. For example, if you bought tickets, you are going to the cinema tonight.","hf":"برنامه‌ریزی با 'going to'","bf":"وقتی قبلاً تصمیم گرفته‌اید کاری را در آینده انجام دهید، از 'be going to' استفاده کنید. این ساختار قصد یا برنامه شما را نشان می‌دهد. برای مثال، اگر بلیت خریده‌اید، امشب به سینما می‌روید.","ex":[{"e":"I am going to study medicine.","p":"من قصد دارم پزشکی بخوانم."},{"e":"We are going to visit our grandparents tomorrow.","p":"ما فردا به دیدن پدربزرگ و مادربزرگمان خواهیم رفت."}]},{"h":"Predicting Based on Evidence","b":"Use 'be going to' for predictions when you can see something happening now. If you see dark clouds, you say it is going to rain. This is different from guessing.","hf":"پیش‌بینی بر اساس شواهد","bf":"برای پیش‌بینی، وقتی الان شواهدی می‌بینید که نشان می‌دهد اتفاقی در راه است، از 'be going to' استفاده کنید. اگر ابرهای تیره را می‌بینید، می‌گویید قرار است باران ببارد. این با حدس و گمان ساده متفاوت است.","ex":[{"e":"Look at the sky! It is going to rain.","p":"به آسمان نگاه کن! قرار است باران ببارد."},{"e":"He is going to fall because he is running too fast.","p":"او زمین خواهد خورد چون خیلی تند می‌دود."}]},{"h":"Structure and Negatives","b":"Remember to use the correct form of 'be' (am, is, are) before 'going to'. To make it negative, just add 'not' after 'be'. For example, 'I am not going to eat meat.'","hf":"ساختار و حالت منفی","bf":"به یاد داشته باشید که قبل از 'going to' شکل صحیح فعل 'be' (am, is, are) را به کار ببرید. برای منفی کردن، کافی است 'not' را بعد از فعل 'be' اضافه کنید. برای مثال: «من قرار نیست گوشت بخورم.»","ex":[{"e":"She is not going to come to the party.","p":"او قرار نیست به مهمانی بیاید."},{"e":"Are you going to buy a new car?","p":"آیا قرار است ماشین جدیدی بخری؟"}]}],"tip":"Always match the verb 'be' with the subject: I am, you are, he is.","tipf":"همیشه فعل 'be' را با فاعل مطابقت دهید: من هستم، تو هستی، او هست.","bad":[{"b":"I going to study tonight.","g":"I am going to study tonight.","w":"You must include the verb 'am' after 'I'.","wf":"باید فعل 'am' را بعد از 'I' قرار دهید."},{"b":"She going to study medicine.","g":"She is going to study medicine.","w":"A common error for Persian speakers is forgetting the verb 'is' before 'going to'.","wf":"یک خطای رایج برای فارسی‌زبانان فراموش کردن فعل 'is' قبل از 'going to' است."},{"b":"We are going to not eat dinner.","g":"We are not going to eat dinner.","w":"The 'not' comes immediately after 'are', not after 'going'.","wf":"کلمه 'not' بلافاصله بعد از 'are' می‌آید، نه بعد از 'going'."}],"gold":[{"e":"Use 'be going to' for plans made before the moment of speaking.","f":"از 'be going to' برای برنامه‌هایی که قبل از لحظه صحبت کردن ریخته شده‌اند استفاده کنید."},{"e":"Use 'be going to' for predictions based on present evidence.","f":"از 'be going to' برای پیش‌بینی‌های مبتنی بر شواهد حال استفاده کنید."}]},{"lv":"I","title":"Future Continuous & Future Perfect","exp":[{"h":"Future Continuous","b":"You use this structure for an action that will be in progress at a specific moment in the future. The focus is on the ongoing nature of the activity at that exact time.","hf":"آینده استمراری (will be doing)","bf":"این ساختار برای کاری استفاده می‌شود که در یک زمان مشخص در آینده در حال انجام خواهد بود. تمرکز بر ادامه‌دار بودن عمل در آن لحظه است.","ex":[{"e":"I will be waiting for you at 8 PM.","p":"ساعت ۸ در انتظار تو خواهم بود."},{"e":"She will be studying all evening.","p":"او تمام عصر در حال درس خواندن خواهد بود."}]},{"h":"Future Perfect","b":"You use this structure for an action that will be completed before a specific time in the future. The focus is on the finished state of the action relative to that deadline.","hf":"آینده کامل (will have done)","bf":"این ساختار برای کاری استفاده می‌شود که قبل از یک زمان مشخص در آینده تکمیل خواهد شد. تمرکز بر پایان یافتن عمل است.","ex":[{"e":"I will have finished the report by noon.","p":"تا ظهر گزارش را تمام کرده خواهم بود."},{"e":"They will have left by the time you arrive.","p":"وقتی تو می‌رسی، آن‌ها رفته خواهند بود."}]},{"h":"Difference in Focus","b":"Future continuous focuses on the process happening at that moment, while future perfect focuses on the completion of the task before that moment arrives.","hf":"تفاوت در تمرکز","bf":"آینده استمراری روی فرآیند کار در آن لحظه تمرکز دارد، در حالی که آینده کامل روی تکمیل شدن کار قبل از آن زمان تمرکز دارد.","ex":[{"e":"At 5 PM, I will be working.","p":"ساعت ۵، من در حال کار کردن خواهم بود."},{"e":"By 5 PM, I will have worked.","p":"تا ساعت ۵، من کارم را تمام کرده خواهم بود."}]}],"tip":"Remember to use at for the continuous form to mark the specific time, and by for the perfect form to indicate the deadline.","tipf":"برای آینده استمراری به کلمه 'at' و برای آینده کامل به 'by' توجه کنید.","bad":[{"b":"I will have waiting for you.","g":"I will be waiting for you.","w":"You should use the past participle after will have, not the ing form.","wf":"بعد از will have باید past participle بیاید، نه ing."},{"b":"I will be finish the work.","g":"I will finish the work.","w":"After will be you must use the ing form, or use will with the base verb instead.","wf":"بعد از will be باید ing بیاید یا باید از will ساده استفاده شود."}],"gold":[{"e":"Use future continuous to describe an action in progress at a specific future time.","f":"از آینده استمراری برای توصیف عملی که در زمان مشخصی در آینده در حال انجام است استفاده کنید."},{"e":"Use future perfect to describe an action that will be finished before a specific future time.","f":"از آینده کامل برای توصیف عملی که قبل از زمان مشخصی در آینده تمام خواهد شد استفاده کنید."},{"e":"Always pair will be with the ing form and will have with the past participle.","f":"همیشه will be را با شکل ing و will have را با فعل گذشته (past participle) جفت کنید."}]},{"lv":"I","title":"Future Continuous (I will be doing)","exp":[{"h":"Understanding the Form","b":"To build this tense, you simply combine 'will be' with the verb ending in '-ing'. It is a very straightforward structure that follows a consistent pattern for all subjects.","hf":"درک ساختار","bf":"برای ساختن این زمان، کافی است 'will be' را با فعلی که به '-ing' ختم می‌شود ترکیب کنید. این یک ساختار بسیار ساده است که الگوی ثابتی برای همه فاعل‌ها دارد.","ex":[{"e":"I will be working at 8 PM.","p":"من ساعت ۸ شب مشغول کار خواهم بود."},{"e":"She will be sleeping when you arrive.","p":"وقتی تو می‌رسی، او در حال خوابیدن خواهد بود."}]},{"h":"Using it for Actions in Progress","b":"We use this tense to describe an action that will be ongoing at a specific moment in the future. Imagine a point in time where the action is already happening and not finished yet.","hf":"استفاده برای اقدامات در حال انجام","bf":"ما از این زمان برای توصیف اقدامی استفاده می‌کنیم که در یک لحظه خاص در آینده در حال انجام خواهد بود. تصور کنید نقطه‌ای در زمان وجود دارد که اقدام از قبل شروع شده و هنوز تمام نشده است.","ex":[{"e":"At noon, we will be eating lunch.","p":"ظهر، ما در حال ناهار خوردن خواهیم بود."},{"e":"They will be traveling all day tomorrow.","p":"آن‌ها فردا تمام روز در حال سفر خواهند بود."}]},{"h":"Polite Inquiries about Plans","b":"You can also use this form to ask someone about their future plans in a soft, polite way. It sounds less demanding than asking 'What will you do?' because it assumes the plan already exists.","hf":"پرسش‌های مودبانه درباره برنامه‌ها","bf":"شما همچنین می‌توانید از این فرم برای پرسیدن درباره برنامه‌های آینده کسی به شکلی ملایم و مودبانه استفاده کنید. این لحن نسبت به پرسیدن «چه کاری انجام خواهی داد؟» کمتر دلبخواهی یا دستوری به نظر می‌رسد، زیرا فرض می‌کند که از قبل برنامه‌ای وجود دارد.","ex":[{"e":"Will you be using the car tonight?","p":"آیا امشب از ماشین استفاده خواهید کرد؟"},{"e":"What will you be doing this weekend?","p":"این آخر هفته چه کاری انجام خواهید داد؟"}]}],"tip":"Remember that 'will be' never changes for any subject, unlike present tense verbs.","tipf":"به یاد داشته باشید که عبارت 'will be' برخلاف افعال زمان حال، برای هیچ فاعلی تغییر نمی‌کند.","bad":[{"b":"I will be work at 8 PM.","g":"I will be working at 8 PM.","w":"You must add '-ing' to the main verb after 'will be'.","wf":"شما باید پس از 'will be' به فعل اصلی پسوند '-ing' اضافه کنید."},{"b":"She will be sleep when you arrive.","g":"She will be sleeping when you arrive.","w":"The verb needs the '-ing' form to show continuous action.","wf":"فعل برای نشان دادن عمل استمراری به شکل '-ing' نیاز دارد."},{"b":"I will be to go to the park.","g":"I will be going to the park.","w":"Do not use 'to' before the main verb in this structure.","wf":"در این ساختار از حرف اضافه 'to' قبل از فعل اصلی استفاده نکنید."}],"gold":[{"e":"The structure is always Subject + will be + Verb-ing.","f":"ساختار همیشه به صورت فاعل + will be + فعل همراه با ing است."},{"e":"Use this tense to visualize an action happening at a specific future time.","f":"از این زمان برای تجسم عملی که در زمان مشخصی در آینده در حال رخ دادن است، استفاده کنید."},{"e":"It implies the action will start before that future moment and continue through it.","f":"این حالت می‌رساند که آن عمل پیش از آن لحظه در آینده آغاز خواهد شد و در طول آن ادامه خواهد یافت."}]},{"lv":"I","title":"Future Perfect (I will have done)","exp":[{"h":"Understanding the Future Perfect","b":"The Future Perfect tense is used to describe an action that will be completed before a specific time in the future. It helps you talk about deadlines or milestones. You form it using 'will have' followed by the past participle of the verb.","hf":"درک زمان آیندهٔ کامل","bf":"زمان آیندهٔ کامل برای توصیف عملی استفاده می‌شود که قبل از زمانی مشخص در آینده تکمیل خواهد شد. این زمان به شما کمک می‌کند دربارهٔ مهلت‌ها یا نقاط عطف صحبت کنید. این ساختار را با استفاده از 'will have' و سپس اسم مفعول (قسمت سوم فعل) می‌سازید.","ex":[{"e":"By next year, I will have graduated.","p":"تا سال آینده، من فارغ‌التحصیل شده خواهم بود."},{"e":"She will have finished the report by 5 PM.","p":"او تا ساعت ۵ بعدازظهر گزارش را تمام کرده خواهد بود."}]},{"h":"Using 'By' and 'Before' with Future Perfect","b":"We often use words like 'by' or 'before' to indicate the deadline. 'By' means no later than that time. This tense focuses on the completion of the action, not the action itself.","hf":"استفاده از 'by' و 'before' با آیندهٔ کامل","bf":"ما اغلب برای نشان دادن مهلت از کلماتی مانند 'by' یا 'before' استفاده می‌کنیم. 'by' یعنی حداکثر تا آن زمان (دیرتر از آن نه). این زمان بر اتمام کار تمرکز دارد، نه خود آن عمل.","ex":[{"e":"By the time you arrive, we will have eaten dinner.","p":"تا زمانی که تو برسی، ما شام خورده خواهیم بود."},{"e":"Before Monday, they will have sold the house.","p":"پیش از دوشنبه، آن‌ها خانه را فروخته خواهند بود."}]},{"h":"Negative and Question Forms","b":"To make it negative, add 'not' after 'will'. For questions, move 'will' to the front. This structure is essential for asking about future completions. Remember to keep 'have' in its base form.","hf":"شکل‌های منفی و سؤالی","bf":"برای منفی کردن، 'not' را بعد از 'will' اضافه کنید. برای سؤالی کردن، 'will' را به ابتدای جمله ببرید. این ساختار برای پرسیدن دربارهٔ کارهایی که در آینده تکمیل می‌شوند ضروری است. به یاد داشته باشید که 'have' همیشه به شکل پایه باقی می‌ماند.","ex":[{"e":"Will you have finished the project by Friday?","p":"آیا تا جمعه پروژه را تمام کرده خواهی بود؟"},{"e":"I will not have saved enough money by December.","p":"من تا دسامبر پول کافی پس‌انداز نکرده خواهم بود."}]}],"tip":"Always use the past participle (third form) of the verb after 'have'.","tipf":"همیشه بعد از 'have' از اسم مفعول (شکل سوم فعل یا past participle) استفاده کنید.","bad":[{"b":"I will have finish the work tomorrow.","g":"I will have finished the work tomorrow.","w":"You need the past participle 'finished', not the base form 'finish'.","wf":"شما به اسم مفعول 'finished' نیاز دارید، نه شکل پایه 'finish'."},{"b":"Will you have doing the work?","g":"Will you have done the work?","w":"A common mistake is using a present participle like 'doing' instead of the past participle 'done' after 'have'.","wf":"یک اشتباه رایج استفاده از اسم فاعل مثل 'doing' به جای اسم مفعول 'done' بعد از 'have' است."},{"b":"She will has finished the task.","g":"She will have finished the task.","w":"After 'will', always use 'have', not 'has'.","wf":"بعد از 'will' همیشه از 'have' استفاده کنید، نه 'has'."}],"gold":[{"e":"Structure: Subject + will have + past participle.","f":"ساختار: فاعل + will have + اسم مفعول (قسمت سوم فعل)."},{"e":"Use Future Perfect for actions completed before a future point.","f":"از آیندهٔ کامل برای کارهایی استفاده کنید که قبل از نقطه‌ای در آینده تکمیل می‌شوند."},{"e":"The word 'have' never changes form in this tense.","f":"کلمهٔ 'have' در این زمان هرگز تغییر شکل نمی‌دهد و همیشه به همین صورت می‌آید."}]},{"lv":"A","title":"Future in the past: was going to / was to / would","exp":[{"h":"Was going to for planned actions","b":"Use 'was going to' when you talk about a plan you had in the past. It often suggests that the plan might not have happened. Think of it as a future intention viewed from a past moment.","hf":"was going to برای کارهای برنامه‌ریزی‌شده","bf":"وقتی درباره برنامه‌ای در گذشته صحبت می‌کنید، از 'was going to' استفاده کنید. این ساختار معمولاً نشان می‌دهد که شاید آن برنامه عملی نشده باشد. آن را به عنوان تصمیمی برای آینده در نظر بگیرید که از نگاهِ گذشته روایت می‌شود.","ex":[{"e":"I was going to call you yesterday.","p":"دیروز می‌خواستم بهت زنگ بزنم."},{"e":"She was going to travel to Paris.","p":"او می‌خواست به پاریس سفر کند."}]},{"h":"Was to for formal arrangements","b":"Use 'was to' for more formal plans or official arrangements in the past. It sounds a bit more serious than 'was going to'. It is often used in news or formal stories.","hf":"was to برای قرارها و برنامه‌های رسمی","bf":"برای برنامه‌های رسمی‌تر یا قرارهای کاری در گذشته از 'was to' استفاده کنید. این عبارت کمی جدی‌تر از 'was going to' به نظر می‌رسد و اغلب در اخبار یا متون رسمی به کار می‌رود.","ex":[{"e":"The president was to visit the school.","p":"رئیس‌جمهور قرار بود از مدرسه بازدید کند."},{"e":"They were to meet at noon.","p":"آن‌ها قرار بود ظهر با هم ملاقات کنند."}]},{"h":"Would for future in the past","b":"Use 'would' to describe a future event from a past perspective, especially in storytelling. It is very common in narrative writing to show what was expected to happen.","hf":"would برای آینده در گذشته","bf":"برای توصیف یک رویداد آینده از زاویه دید گذشته، به‌ویژه در داستان‌گویی، از 'would' استفاده کنید. این ساختار در متون روایی بسیار رایج است تا نشان دهد چه چیزی انتظار می‌رفته اتفاق بیفتد.","ex":[{"e":"He knew he would succeed.","p":"او می‌دانست که موفق خواهد شد."},{"e":"I knew it would rain that day.","p":"می‌دانستم که آن روز باران خواهد بارید."}]}],"tip":"Remember that 'was going to' often implies the plan didn't happen, while 'would' is more about expectation or prediction from the past.","tipf":"به یاد داشته باشید که 'was going to' اغلب نشان می‌دهد که آن برنامه انجام نشده است، در حالی که 'would' بیشتر به انتظار یا پیش‌بینی از گذشته اشاره دارد.","bad":[{"b":"I was going to call you yesterday, but I forget.","g":"I was going to call you yesterday, but I forgot.","w":"Use the past tense 'forgot' because the whole sentence is in the past.","wf":"از زمان گذشته 'forgot' استفاده کنید، زیرا کل جمله در زمان گذشته است."},{"b":"She was going to come, but she didn't came.","g":"She was going to come, but she didn't come.","w":"After 'didn't', use the base form of the verb, not the past form.","wf":"بعد از 'didn't' از شکل پایه فعل استفاده کنید، نه شکل گذشته آن."},{"b":"I would go to the party if I had time.","g":"I was going to go to the party if I had time.","w":"For a specific past plan that didn't happen, use 'was going to' instead of 'would'.","wf":"برای یک برنامه خاص در گذشته که انجام نشد، به جای 'would' از 'was going to' استفاده کنید."}],"gold":[{"e":"Use 'was going to' for personal plans in the past.","f":"از 'was going to' برای برنامه‌های شخصی در گذشته استفاده کنید."},{"e":"Use 'was to' for formal or official arrangements.","f":"از 'was to' برای قرارها یا برنامه‌های رسمی استفاده کنید."},{"e":"Use 'would' for predictions or expectations from the past.","f":"از 'would' برای پیش‌بینی‌ها یا انتظارات از زاویه دید گذشته استفاده کنید."}]}],"ex":[{"t":"gap","q":"Look at those dark clouds! It ___ rain.","key":["is going to"],"why":"Prediction based on present evidence (clouds) uses 'be going to'."},{"t":"gap","q":"I ___ call you later tonight.","key":["will"],"why":"Instant decision made at the moment of speaking uses 'will'."},{"t":"gap","q":"By the time you arrive, I ___ finished cooking.","key":["will have"],"why":"Future Perfect describes an action completed before a specific future time."},{"t":"fix","q":"I think she will winning the race.","key":["I think she will win the race."],"why":"After 'will', use the base form of the verb, not the -ing form."},{"t":"gap","q":"This time tomorrow, I ___ lying on the beach.","key":["will be"],"why":"Future Continuous describes an action in progress at a specific future time."},{"t":"fa","q":"من فردا صبح زود بیدار خواهم شد.","key":["I will be up early tomorrow morning."],"why":"Simple future prediction or fact about the future uses 'will'."},{"t":"gap","q":"We ___ to Paris next weekend.","key":["are going"],"why":"Fixed plan or intention for the future uses 'be going to'."},{"t":"fix","q":"She is going to goes to the cinema tonight.","key":["She is going to go to the cinema tonight."],"why":"After 'going to', use the base form of the verb."},{"t":"gap","q":"Don't worry, I ___ help you with your bags.","key":["will"],"why":"Offering to do something at the moment of speaking uses 'will'."},{"t":"fa","q":"آیا تو فردا عصر کار می‌کنی؟","key":["Will you be working tomorrow afternoon?"],"why":"Future Continuous is used to ask about actions in progress at a specific future time."},{"t":"gap","q":"By 2030, scientists ___ many new discoveries.","key":["will have made"],"why":"Future Perfect is used for actions that will be completed before a future date."},{"t":"fix","q":"I am going to meet him yesterday.","key":["I am going to meet him tomorrow."],"why":"'Going to' refers to the future, so the time expression must be future-oriented, not past."},{"t":"gap","q":"Look at the sky! It ___ rain soon.","key":["is going to"],"why":"Use 'be going to' for predictions based on present evidence."},{"t":"gap","q":"I promise I ___ not tell anyone your secret.","key":["will"],"why":"Use 'will' for promises."},{"t":"fix","q":"I am going to visit my grandmother next Sunday.","key":["I am going to visit my grandmother next Sunday."],"why":"The sentence is already correct; 'be going to' is used for planned future actions."},{"t":"gap","q":"By the time we get to the cinema, the movie ___ already started.","key":["will have"],"why":"Use Future Perfect for actions completed before a specific future time."},{"t":"fa","q":"من احتمالاً فردا نمی‌آیم.","key":["I probably won't come tomorrow."],"why":"Use 'will not' (won't) for predictions or decisions about the future."},{"t":"fix","q":"She will be working at this time tomorrow.","key":["She will be working at this time tomorrow."],"why":"The sentence is correct; Future Continuous describes an action in progress at a specific future time."},{"t":"gap","q":"I ___ have finished the report by 5 PM.","key":["will"],"why":"Future Perfect requires 'will have' + past participle."},{"t":"fa","q":"من قصد داشتم دیروز بیایم، اما سرم شلوغ بود.","key":["I was going to come yesterday, but I was busy."],"why":"Use 'was going to' for a future plan in the past that didn't happen."}]},{"id":"t09","t":"some / any / no and compounds","tf":"some و any و ترکیب‌های آن‌ها","parts":[{"lv":"B","title":"some / any","exp":[{"h":"Using 'some' in positive sentences","b":"We usually use 'some' in affirmative sentences when we talk about an unspecified amount or number of something. It is very common with both countable and uncountable nouns. For example, you can say 'I have some apples' or 'There is some water'.","hf":"استفاده از some در جملات مثبت","bf":"ما معمولاً در جملات مثبت از some برای بیان مقدار یا تعداد نامشخصی از چیزی استفاده می‌کنیم. این کلمه با اسامی قابل‌شمارش و غیرقابل‌شمارش بسیار رایج است. برای مثال می‌توانید بگویید 'من چند سیب دارم' یا 'آبی وجود دارد'.","ex":[{"e":"I need some milk for the cake.","p":"من برای کیک به مقداری شیر نیاز دارم."},{"e":"There are some books on the table.","p":"چند کتاب روی میز است."}]},{"h":"Using 'any' in questions and negatives","b":"In questions and negative sentences, we typically use 'any' instead of 'some'. This helps to indicate that the quantity is not specific or is zero. For instance, you ask 'Do you have any money?' or say 'I don't have any time'.","hf":"استفاده از any در سوالات و جملات منفی","bf":"در سوالات و جملات منفی، معمولاً به جای some از any استفاده می‌کنیم. این کار به ما کمک می‌کند تا نشان دهیم که مقدار مشخص نیست یا صفر است. برای مثال می‌پرسید 'آیا پولی داری؟' یا می‌گویید 'من هیچ وقتی ندارم'.","ex":[{"e":"Do you have any questions?","p":"آیا سوالی داری؟"},{"e":"I don't have any friends here.","p":"من اینجا هیچ دوستی ندارم."}]},{"h":"Using 'any' in positive sentences for emphasis","b":"You can also use 'any' in positive sentences to mean 'it doesn't matter which one'. This is often used with singular nouns to show that the choice is free. For example, 'You can take any book you like'.","hf":"استفاده از any در جملات مثبت برای تأکید","bf":"شما می‌توانید از any در جملات مثبت نیز به معنای 'فرقی نمی‌کند کدام' استفاده کنید. این حالت معمولاً با اسامی مفرد برای نشان دادن آزادی انتخاب به کار می‌رود. برای مثال: 'می‌توانی هر کتابی که دوست داری برداری'.","ex":[{"e":"You can call me any time.","p":"می‌توانی هر وقت که خواستی با من تماس بگیری."},{"e":"Any student can join the club.","p":"هر دانش‌آموزی می‌تواند به باشگاه بپیوندد."}]}],"tip":"Remember that 'some' is for positive statements and 'any' is for negatives and questions, but 'any' can be used in positives to mean 'no matter which'.","tipf":"به یاد داشته باش که some برای جملات مثبت و any برای منفی‌ها و سوالات استفاده می‌شود، اما any می‌تواند در جملات مثبت به معنای 'فرقی نمی‌کند کدام' به کار رود.","bad":[{"b":"I don't have some money.","g":"I don't have any money.","w":"In negative sentences, we use 'any' instead of 'some'.","wf":"در جملات منفی، به جای some از any استفاده می‌کنیم."},{"b":"Do you have some water?","g":"Do you have any water?","w":"In questions, we usually use 'any' unless we expect a 'yes' answer.","wf":"در سوالات، معمولاً از any استفاده می‌کنیم مگر اینکه انتظار پاسخ مثبت داشته باشیم."},{"b":"She has any apples.","g":"She has some apples.","w":"In positive sentences, we use 'some' for unspecified quantities.","wf":"در جملات مثبت، برای مقادیر نامشخص از some استفاده می‌کنیم."}],"gold":[{"e":"Use 'some' in positive sentences and 'any' in negatives and questions.","f":"از some در جملات مثبت و از any در جملات منفی و سوالی استفاده کنید."},{"e":"Use 'any' in positive sentences to mean 'it doesn't matter which one'.","f":"از any در جملات مثبت به معنای 'فرقی نمی‌کند کدام' استفاده کنید."},{"e":"'Some' is used with both countable and uncountable nouns in positive sentences.","f":"کلمه some در جملات مثبت هم با اسامی قابل‌شمارش و هم غیرقابل‌شمارش استفاده می‌شود."}]},{"lv":"B","title":"something / anything / nothing","exp":[{"h":"Using 'something' in positive sentences","b":"We use 'something' when we talk about an unspecified thing that exists or is happening. It is most common in affirmative statements where you expect the answer to be yes. Think of it as a general, non-specific object or idea.","hf":"استفاده از 'something' در جملات مثبت","bf":"ما از 'something' زمانی استفاده می‌کنیم که درباره یک چیز نامشخص که وجود دارد یا در حال وقوع است صحبت می‌کنیم. این کلمه بیشتر در جملات مثبت رایج است. آن را به عنوان یک شیء یا ایده عمومی و غیرمشخص در نظر بگیرید.","ex":[{"e":"I have something to tell you.","p":"من چیزی برای گفتن به تو دارم."},{"e":"She wants something to drink.","p":"او چیزی برای نوشیدن می‌خواهد."}]},{"h":"Using 'anything' in questions and negatives","b":"In questions and negative sentences, we usually choose 'anything' instead of 'something'. This reflects uncertainty about whether the thing exists or not. It covers all possible things in an open-ended way.","hf":"استفاده از 'anything' در سوالات و جملات منفی","bf":"در سوالات و جملات منفی، معمولاً به جای 'something' از 'anything' استفاده می‌کنیم. این نشان‌دهنده عدم قطعیت درباره وجود یا عدم وجود آن چیز است. این کلمه به شکلی باز و گسترده همه چیزهای ممکن را پوشش می‌دهد.","ex":[{"e":"Do you have anything to say?","p":"آیا چیزی برای گفتن داری؟"},{"e":"I don't have anything to eat.","p":"من چیزی برای خوردن ندارم."}]},{"h":"Using 'nothing' for total absence","b":"'Nothing' means 'not anything' or 'no thing'. It is used to express that there is absolutely nothing available or happening. Remember that 'nothing' itself is negative, so you don't need another 'not' in the sentence.","hf":"استفاده از 'nothing' برای عدم وجود کامل","bf":"کلمه 'nothing' به معنای 'هیچ‌چیز' است. برای بیان اینکه مطلقاً چیزی موجود یا در حال وقوع نیست استفاده می‌شود. به یاد داشته باشید که 'nothing' خودش منفی است، بنابراین نیازی به 'not' دیگر در جمله نیست.","ex":[{"e":"Nothing is impossible.","p":"هیچ‌چیز غیرممکن نیست."},{"e":"I found nothing in the box.","p":"من هیچ‌چیزی در جعبه پیدا نکردم."}]}],"tip":"Remember that 'something' is for positive contexts, 'anything' for questions/negatives, and 'nothing' means 'not anything'.","tipf":"به یاد داشته باشید که 'something' برای بافت‌های مثبت، 'anything' برای سوالات و جملات منفی، و 'nothing' به معنای 'هیچ‌چیز' است.","bad":[{"b":"I don't have something to eat.","g":"I don't have anything to eat.","w":"In negative sentences, we typically use 'anything' rather than 'something'.","wf":"در جملات منفی، معمولاً به جای 'something' از 'anything' استفاده می‌کنیم."},{"b":"I don't know nothing about it.","g":"I don't know anything about it.","w":"Using 'nothing' with 'don't' creates a double negative, which is incorrect in standard English.","wf":"استفاده از 'nothing' همراه با 'don't' یک منفی مضاعف ایجاد می‌کند که در انگلیسی استاندارد نادرست است."},{"b":"Is there something wrong?","g":"Is there anything wrong?","w":"In general questions where the answer is unknown, 'anything' is the standard choice.","wf":"در سوالات کلی که پاسخ ناشناخته است، 'anything' انتخاب استاندارد است."}],"gold":[{"e":"Use 'something' in affirmative sentences.","f":"از 'something' در جملات مثبت استفاده کنید."},{"e":"Use 'anything' in questions and negative sentences.","f":"از 'anything' در سوالات و جملات منفی استفاده کنید."},{"e":"'Nothing' means 'not anything' and stands alone as a negative subject.","f":"کلمه 'nothing' به معنای 'هیچ‌چیز' است و به عنوان یک فاعل منفی به تنهایی قرار می‌گیرد."}]},{"lv":"B","title":"nobody / no one / nothing","exp":[{"h":"Understanding Negative Pronouns","b":"In English, words like nobody, no one, and nothing act as the subject or object of a sentence. They are used to say that there is not a single person or thing in a specific situation. Remember that they are singular, so we use singular verbs with them.","hf":"درک ضمایر منفی","bf":"در انگلیسی، کلماتی مانند nobody، no one و nothing به عنوان فاعل یا مفعول یک جمله عمل می‌کنند. آن‌ها برای بیان این که هیچ فرد یا چیزی در یک موقعیت خاص وجود ندارد استفاده می‌شوند. به یاد داشته باشید که آن‌ها مفرد هستند، بنابراین با آن‌ها فعل مفرد به کار می‌رود.","ex":[{"e":"Nobody knows the answer.","p":"هیچ‌کس جواب را نمی‌داند."},{"e":"No one is home right now.","p":"الان هیچ‌کس در خانه نیست."}]},{"h":"Using Nothing for Objects","b":"When you want to talk about things rather than people, use nothing. It means that there is not anything. Like nobody, it takes a singular verb.","hf":"استفاده از nothing برای اشیاء","bf":"وقتی می‌خواهید به‌جای افراد درباره اشیاء صحبت کنید، از nothing استفاده کنید. این کلمه به معنای این است که چیزی وجود ندارد. مانند nobody، آن فعل مفرد می‌گیرد.","ex":[{"e":"There is nothing in the box.","p":"هیچ چیزی در جعبه نیست."},{"e":"I saw nothing outside.","p":"من بیرون هیچ چیزی ندیدم."}]},{"h":"Avoiding Double Negatives","b":"Persian often uses double negatives for emphasis, but in English, this is incorrect. If you use nobody or nothing, do not use 'not' again in the same clause. Just use the negative pronoun alone.","hf":"پرهیز از نفی مضاعف","bf":"فارسی اغلب برای تأکید از نفی مضاعف استفاده می‌کند، اما در انگلیسی این نادرست است. اگر از nobody یا nothing استفاده می‌کنید، 'not' را دوباره در همان بخش جمله به کار نبرید. فقط از خود ضمیر منفی به تنهایی استفاده کنید.","ex":[{"e":"Nobody called me today.","p":"امروز هیچ‌کس به من زنگ نزد."},{"e":"She has nothing to say.","p":"او چیزی برای گفتن ندارد."}]}],"tip":"Remember that 'nobody' and 'no one' are interchangeable, but 'nothing' is only for things. Always keep the verb singular.","tipf":"به یاد داشته باشید که 'nobody' و 'no one' قابل تعویض هستند، اما 'nothing' فقط برای اشیاء است. همیشه فعل را مفرد نگه دارید.","bad":[{"b":"Nobody didn't come to the party.","g":"Nobody came to the party.","w":"This is a double negative. In English, you don't need 'not' if you use 'nobody'.","wf":"این یک نفی مضاعف است. در انگلیسی، اگر از 'nobody' استفاده می‌کنید، نیازی به 'not' ندارید."},{"b":"Nothing aren't in the bag.","g":"There is nothing in the bag.","w":"'Nothing' is singular, so use 'is', not 'aren't'. Also, 'nothing' usually sounds more natural with the 'there is' structure.","wf":"کلمه 'Nothing' مفرد است، بنابراین از 'is' استفاده کنید، نه 'aren't'. همچنین، 'nothing' معمولاً با ساختار 'there is' طبیعی‌تر به نظر می‌رسد."},{"b":"No one doesn't like pizza.","g":"No one likes pizza.","w":"Again, avoid double negatives. 'No one' already makes the sentence negative.","wf":"دوباره، از نفی مضاعف پرهیز کنید. 'No one' خودش جمله را منفی می‌کند."}],"gold":[{"e":"Use nobody or no one for people and nothing for things.","f":"برای افراد از nobody یا no one و برای اشیاء از nothing استفاده کنید."},{"e":"Never use 'not' with nobody, no one, or nothing.","f":"هرگز از 'not' همراه با nobody، no one یا nothing استفاده نکنید."},{"e":"Always use a singular verb with these pronouns.","f":"همیشه با این ضمایر از فعل مفرد استفاده کنید."}]}],"ex":[{"t":"gap","q":"I have ___ apples in my bag.","key":["some"],"why":"Use 'some' in positive sentences to indicate an unspecified quantity."},{"t":"gap","q":"Do you have ___ money?","key":["any"],"why":"Use 'any' in questions to ask about the existence of something."},{"t":"gap","q":"There is ___ milk in the fridge.","key":["no"],"why":"Use 'no' to indicate the absence of something in a positive verb structure."},{"t":"fix","q":"I don't have any money.","key":["I have no money."],"why":"Avoid double negatives; use 'no' with a positive verb or 'any' with a negative verb."},{"t":"gap","q":"Is there ___ in the room?","key":["anything"],"why":"Use 'anything' in questions to ask about the existence of something unspecified."},{"t":"gap","q":"I saw ___ at the party.","key":["something"],"why":"Use 'something' in positive sentences to refer to an unspecified thing."},{"t":"fix","q":"Nobody didn't come to the meeting.","key":["Nobody came to the meeting."],"why":"Avoid double negatives; 'nobody' is already negative, so use a positive verb."},{"t":"gap","q":"___ is perfect.","key":["Nothing"],"why":"Use 'nothing' to mean 'not anything' or total absence."},{"t":"fa","q":"من هیچ کتابی ندارم.","key":["I have no books."],"why":"Translate 'هیچ' as 'no' with a positive verb to avoid double negatives."},{"t":"fix","q":"She didn't see anyone.","key":["She saw nobody."],"why":"Both forms are correct, but this exercise tests the ability to switch between 'didn't... anyone' and 'nobody'."}]},{"id":"t10","t":"Quantifiers: much / many / a little / a few / too / enough","tf":"کمیت‌سنجی","parts":[{"lv":"B","title":"much / many / a lot of","exp":[{"h":"Countable vs. Uncountable Nouns","b":"To choose correctly, you must first know if the noun is countable (you can count it, like apples) or uncountable (you cannot count it individually, like water). 'Many' goes with countable nouns, while 'much' is used for uncountable nouns. This distinction is the foundation of using these quantifiers correctly.","hf":"اسم‌های قابل شمارش و غیرقابل شمارش","bf":"برای انتخاب درست، باید ابتدا بدانید که اسم قابل شمارش است (می‌توانید آن را بشمارید، مثل سیب) یا غیرقابل شمارش (نمی‌توانید آن را به صورت تکی بشمارید، مثل آب). 'Many' با اسم‌های قابل شمارش می‌آید، در حالی که 'much' برای اسم‌های غیرقابل شمارش استفاده می‌شود. این تمایز پایه‌ی استفاده صحیح از این کمیت‌سنج‌ها است.","ex":[{"e":"How many books did you read?","p":"چند کتاب خواندی؟"},{"e":"How much water do you drink?","p":"چقدر آب می‌خوری؟"}]},{"h":"Using 'Many' and 'Much' in Questions and Negatives","b":"In everyday speech, we often use 'a lot of', but in formal writing or specific grammar exercises, 'many' and 'much' are preferred. 'Many' is used in questions and negative sentences with countable nouns. 'Much' follows the same pattern but is used with uncountable nouns. Remember that 'much' is less common in positive statements.","hf":"استفاده از 'many' و 'much' در سوالات و جملات منفی","bf":"در گفتگوی روزمره، ما اغلب از 'a lot of' استفاده می‌کنیم، اما در نوشتار رسمی یا تمرین‌های خاص گرامری، 'many' و 'much' ترجیح داده می‌شوند. 'Many' در سوالات و جملات منفی با اسم‌های قابل شمارش استفاده می‌شود. 'Much' همان الگو را دنبال می‌کند اما با اسم‌های غیرقابل شمارش به کار می‌رود. به یاد داشته باشید که 'much' در جملات مثبت کمتر رایج است.","ex":[{"e":"I don't have many friends here.","p":"من اینجا دوستان زیادی ندارم."},{"e":"There isn't much time left.","p":"زمان زیادی باقی نمانده است."}]},{"h":"The Versatile 'A lot of'","b":"'A lot of' is a safe and natural choice for both countable and uncountable nouns in positive sentences. It works well in both spoken and written English. Unlike 'much', which can sound formal or stiff in affirmative sentences, 'a lot of' sounds more natural and is widely accepted in most contexts.","hf":"'a lot of' چندمنظوره","bf":"'a lot of' یک انتخاب امن و طبیعی برای هر دو اسم قابل شمارش و غیرقابل شمارش در جملات مثبت است. آن در انگلیسی گفتاری و نوشتاری به خوبی کار می‌کند. برخلاف 'much' که می‌تواند در جملات مثبت رسمی یا خشک به نظر برسد، 'a lot of' طبیعی‌تر به نظر می‌رسد و در اکثر زمینه‌ها پذیرفته شده است.","ex":[{"e":"She has a lot of patience.","p":"او صبر زیادی دارد."},{"e":"We have a lot of work to do.","p":"ما کار زیادی برای انجام دادن داریم."}]}],"tip":"In positive sentences, prefer 'a lot of' over 'much' for a more natural sound.","tipf":"در جملات مثبت، برای داشتن آهنگی طبیعی‌تر، استفاده از 'a lot of' به جای 'much' ترجیح داده می‌شود.","bad":[{"b":"I have much books.","g":"I have many books.","w":"'Much' is used for uncountable nouns, but 'books' is countable. Use 'many' for countable nouns.","wf":"'much' برای اسم‌های غیرقابل شمارش استفاده می‌شود، اما 'books' قابل شمارش است. برای اسم‌های قابل شمارش از 'many' استفاده کنید."},{"b":"There are much apples on the table.","g":"There are many apples on the table.","w":"'Apples' is a countable noun, so you must use 'many', not 'much'.","wf":"'apples' یک اسم قابل شمارش است، بنابراین باید از 'many' استفاده کنید، نه 'much'."},{"b":"I don't have much friends.","g":"I don't have many friends.","w":"'Friends' is countable, so 'many' is the correct quantifier here, not 'much'.","wf":"'friends' قابل شمارش است، بنابراین 'many' کمیت‌سنج صحیح در اینجا است، نه 'much'."}],"gold":[{"e":"Use 'many' with countable nouns and 'much' with uncountable nouns.","f":"از 'many' با اسم‌های قابل شمارش و از 'much' با اسم‌های غیرقابل شمارش استفاده کنید."},{"e":"'A lot of' can be used with both countable and uncountable nouns in positive sentences.","f":"'a lot of' را می‌توان با هر دو اسم قابل شمارش و غیرقابل شمارش در جملات مثبت استفاده کرد."},{"e":"In negative sentences, 'many' and 'much' are commonly used.","f":"در جملات منفی، 'many' و 'much' به طور رایج استفاده می‌شوند."}]},{"lv":"B","title":"a little / a few","exp":[{"h":"Countable vs. Uncountable Nouns","b":"First, we need to know if the noun is countable or uncountable. Countable nouns can be numbered (like one apple, two apples), while uncountable nouns cannot be counted directly (like water, sugar, or time). This distinction is the key to choosing the right word.","hf":"اسم‌های قابل شمارش و غیرقابل شمارش","bf":"اول باید بدانیم که اسم قابل شمارش است یا غیرقابل شمارش. اسم‌های قابل شمارش را می‌توان شماره‌گذاری کرد (مثل یک سیب، دو سیب)، در حالی که اسم‌های غیرقابل شمارش را نمی‌توان مستقیماً شمارش کرد (مثل آب، شکر یا زمان). این تمایز کلید انتخاب کلمه درست است.","ex":[{"e":"I have a few friends in Tehran.","p":"من چند دوست در تهران دارم."},{"e":"I have a little time to talk.","p":"من کمی وقت برای صحبت دارم."}]},{"h":"Using 'A Few' with Countable Nouns","b":"Use 'a few' when you are talking about things you can count, such as books, cars, or people. It means a small number of something. Think of it as 'some' but emphasizing that the amount is small.","hf":"استفاده از 'a few' با اسم‌های قابل شمارش","bf":"وقتی درباره چیزهایی صحبت می‌کنید که می‌توانید بشمارید، مانند کتاب‌ها، ماشین‌ها یا افراد، از 'a few' استفاده کنید. این یعنی تعداد کمی از چیزی. آن را به عنوان 'برخی' در نظر بگیرید، اما با تأکید بر اینکه مقدار آن کم است.","ex":[{"e":"She has a few questions to ask.","p":"او چند سوال برای پرسیدن دارد."},{"e":"We need a few more chairs.","p":"ما به چند صندلی بیشتر نیاز داریم."}]},{"h":"Using 'A Little' with Uncountable Nouns","b":"Use 'a little' for substances or concepts that you cannot count individually, like water, money, or advice. It means a small amount of something. It is similar to 'some' but highlights the small quantity.","hf":"استفاده از 'a little' با اسم‌های غیرقابل شمارش","bf":"برای مواد یا مفاهیمی که نمی‌توانید به صورت جداگانه بشمارید، مانند آب، پول یا مشاوره، از 'a little' استفاده کنید. این یعنی مقدار کمی از چیزی. آن شبیه 'برخی' است اما کمیت کم را برجسته می‌کند.","ex":[{"e":"Add a little salt to the soup.","p":"کمی نمک به سوپ اضافه کنید."},{"e":"He has a little money left.","p":"او کمی پول باقی گذاشته است."}]}],"tip":"Remember: if you can put a number before it (like 'three'), use 'a few'. If you cannot count it, use 'a little'.","tipf":"به یاد داشته باشید: اگر می‌توانید قبل از آن یک عدد بگذارید (مثل 'سه')، از 'a few' استفاده کنید. اگر نمی‌توانید آن را بشمارید، از 'a little' استفاده کنید.","bad":[{"b":"I have a little friends.","g":"I have a few friends.","w":"'Friends' is a countable noun, so we must use 'a few', not 'a little'.","wf":"'دوستان' یک اسم قابل شمارش است، بنابراین باید از 'a few' استفاده کنیم، نه 'a little'."},{"b":"I need a few water.","g":"I need a little water.","w":"'Water' is an uncountable noun, so we must use 'a little', not 'a few'.","wf":"'آب' یک اسم غیرقابل شمارش است، بنابراین باید از 'a little' استفاده کنیم، نه 'a few'."},{"b":"She has a little books.","g":"She has a few books.","w":"'Books' is countable, so 'a few' is the correct choice.","wf":"'کتاب‌ها' قابل شمارش هستند، بنابراین 'a few' انتخاب درست است."}],"gold":[{"e":"Use 'a few' with plural countable nouns and 'a little' with uncountable nouns.","f":"از 'a few' با اسم‌های قابل شمارش جمع و از 'a little' با اسم‌های غیرقابل شمارش استفاده کنید."},{"e":"'A few' means a small number, while 'a little' means a small amount.","f":"'a few' به معنی تعداد کمی است، در حالی که 'a little' به معنی مقدار کمی است."},{"e":"Never use 'a few' with uncountable nouns like 'time' or 'advice'.","f":"هرگز از 'a few' با اسم‌های غیرقابل شمارش مانند 'زمان' یا 'مشاوره' استفاده نکنید."}]},{"lv":"B","title":"too / enough","exp":[{"h":"Using 'too' for excess","b":"We use 'too' when something is more than we want or need. It often has a negative meaning, like being too hot or too expensive. Think of it as 'excessively' in a way that causes a problem.","hf":"استفاده از 'too' برای بیان بیش‌ازحد بودن","bf":"ما از 'too' زمانی استفاده می‌کنیم که چیزی بیشتر از آنچه می‌خواهیم یا نیاز داریم باشد. این کلمه اغلب معنای منفی دارد، مانند خیلی داغ یا خیلی گران بودن. آن را به عنوان 'بیش از حد' در نظر بگیرید که باعث یک مشکل می‌شود.","ex":[{"e":"The coffee is too hot to drink.","p":"قهوه آن‌قدر داغ است که نمی‌توان آن را نوشید."},{"e":"She is too young to drive.","p":"او آن‌قدر جوان است که نمی‌تواند رانندگی کند."}]},{"h":"Using 'enough' for sufficiency","b":"We use 'enough' to say that something is sufficient or adequate. It usually comes after adjectives and adverbs. If you have enough money, you can buy what you need.","hf":"استفاده از 'enough' برای بیان کافی بودن","bf":"ما از 'enough' برای بیان اینکه چیزی کافی یا مناسب است استفاده می‌کنیم. این کلمه معمولاً بعد از صفت‌ها و قیدها می‌آید. اگر پول کافی داشته باشید، می‌توانید آنچه را که نیاز دارید بخرید.","ex":[{"e":"The water is not cold enough.","p":"آب به اندازه کافی سرد نیست."},{"e":"He runs fast enough to win the race.","p":"او به اندازه کافی سریع می‌دود تا در مسابقه برنده شود."}]},{"h":"Position of 'enough' with nouns","b":"When 'enough' modifies a noun, it comes before the noun. For example, we say 'enough time' or 'enough food'. This is different from how it works with adjectives.","hf":"موقعیت 'enough' همراه با اسامی","bf":"وقتی 'enough' یک اسم را توصیف می‌کند، قبل از اسم می‌آید. برای مثال، می‌گوییم 'enough time' یا 'enough food'. این با نحوه کار آن با صفت‌ها متفاوت است.","ex":[{"e":"Do we have enough chairs for everyone?","p":"آیا صندلی کافی برای همه داریم؟"},{"e":"I didn't have enough money to buy the book.","p":"من پول کافی برای خرید کتاب نداشتم."}]}],"tip":"Remember: 'too' goes before adjectives, while 'enough' goes after them when describing qualities.","tipf":"به یاد داشته باشید: 'too' قبل از صفت‌ها می‌آید، در حالی که 'enough' بعد از آن‌ها می‌آید وقتی که کیفیت‌ها را توصیف می‌کنیم.","bad":[{"b":"The tea is enough hot.","g":"The tea is hot enough.","w":"'Enough' should come after the adjective 'hot', not before it.","wf":"کلمه 'enough' باید بعد از صفت 'hot' بیاید، نه قبل از آن."},{"b":"She is too tall to not wear heels.","g":"She is too tall to wear heels.","w":"Using 'too' with a negative infinitive can be confusing; usually, 'too' implies a negative result directly.","wf":"استفاده از 'too' با مصدر منفی می‌تواند گیج‌کننده باشد؛ معمولاً 'too' نتیجه منفی را مستقیماً بیان می‌کند."},{"b":"I don't have enough money enough.","g":"I don't have enough money.","w":"Repeating 'enough' is redundant and incorrect in this structure.","wf":"تکرار 'enough' در این ساختار اضافی و نادرست است."}],"gold":[{"e":"'Too' is used with a negative result, while 'enough' indicates sufficiency.","f":"'too' برای نتیجه منفی استفاده می‌شود، در حالی که 'enough' نشان‌دهنده کافی بودن است."},{"e":"'Enough' comes after adjectives but before nouns.","f":"'enough' بعد از صفت‌ها اما قبل از اسامی می‌آید."},{"e":"Use 'too...to' to show that something is excessive to the point of preventing an action.","f":"از ساختار 'too...to' برای نشان دادن اینکه چیزی بیش از حد است تا حدی که از انجام یک عمل جلوگیری می‌کند، استفاده کنید."}]}],"ex":[{"t":"gap","q":"There isn't ___ sugar left in the jar.","key":["much"],"why":"Use 'much' with uncountable nouns in negative sentences."},{"t":"gap","q":"How ___ apples did you buy?","key":["many"],"why":"Use 'many' with countable nouns in questions."},{"t":"fix","q":"I have a little friends who live nearby.","key":["I have a few friends who live nearby."],"why":"'A few' is used with countable nouns like 'friends', while 'a little' is for uncountable nouns."},{"t":"gap","q":"She has ___ time to finish the project.","key":["a little"],"why":"Use 'a little' with uncountable nouns like 'time' to mean a small amount."},{"t":"gap","q":"The coffee is ___ hot to drink right now.","key":["too"],"why":"Use 'too' to indicate an excess that prevents an action."},{"t":"fa","q":"آیا آب کافی برای همه وجود دارد؟","key":["Is there enough water for everyone?"],"why":"Translate 'enough' with uncountable noun 'water' in a question structure."},{"t":"gap","q":"We don't have ___ money to buy that car.","key":["enough"],"why":"Use 'enough' after the noun it modifies to indicate sufficiency."},{"t":"fix","q":"He has too much work to do today.","key":["He has too much work to do today."],"why":"This sentence is already correct; 'much' is used correctly with the uncountable noun 'work' after 'too'."},{"t":"gap","q":"There are ___ books on the table.","key":["a few"],"why":"Use 'a few' with countable plural nouns like 'books'."},{"t":"fa","q":"او چند تا کتاب دارد.","key":["He has a few books."],"why":"Translate 'چند تا' (a few) with the countable noun 'books'."}]},{"id":"t11","t":"Articles: a / an / the","tf":"حروف تعریف","parts":[{"lv":"B","title":"Articles: a / an / the","exp":[{"h":"Using a or an for unknown things","b":"Use a or an when you mention something for the first time and the listener does not know what you are talking about. Choose a before a consonant sound and an before a vowel sound to make your speech flow naturally.","hf":"استفاده از a/an برای اشاره به یک چیز نامشخص","bf":"وقتی برای اولین بار درباره یک شیء صحبت می‌کنیم که شنونده آن را نمی‌شناسد، از a یا an استفاده می‌کنیم. a قبل از صدای صامت و an قبل از صدای مصوت به کار می‌رود.","ex":[{"e":"I saw a cat.","p":"من یک گربه دیدم."},{"e":"She is an engineer.","p":"او یک مهندس است."}]},{"h":"Using the for known things","b":"Use the when both you and the listener know which specific item you mean or if it has already been mentioned. This helps clarify that you are referring to a particular object rather than any random one.","hf":"استفاده از the برای اشاره به چیز شناخته شده","bf":"وق��ی هم گوینده و هم شنونده می‌دانند منظور کدام شیء است، یا قبلاً درباره آن صحبت شده، از the استفاده می‌کنیم.","ex":[{"e":"The cat was black.","p":"گربه سیاه بود."},{"e":"Open the window.","p":"پنجره را باز کن."}]},{"h":"Omitting articles for general concepts","b":"When talking about a whole group or concept in general, you usually do not need an article. This rule applies to plural nouns and uncountable nouns to show you are speaking broadly rather than about a specific instance.","hf":"حذف حرف تعریف برای مفاهیم کلی","bf":"وقتی درباره یک گروه کلی از اشیاء یا مفاهیم صحبت می‌کنیم و نه یک شیء خاص، معمولاً از هیچ حرف تعریفی استفاده نمی‌کنیم.","ex":[{"e":"Cats are friendly.","p":"گربه‌ها مهربان هستند."},{"e":"I love music.","p":"من عاشق موسیقی هستم."}]}],"tip":"Remember that Persian does not use articles, so focus on the sound of the word rather than the spelling to decide between a and an.","tipf":"در فارسی معمولاً حرف تعریف نداریم، پس به صدای کلمه دقت کنید: اگر با صدای مصوت شروع می‌شود an و اگر با صدای صامت شروع می‌شود a را به کار ببرید.","bad":[{"b":"I saw a cat. The cat was black.","g":"I saw a cat. It was black.","w":"You should use a pronoun instead of repeating the article if the object is already clear, unless you want to add special emphasis.","wf":"در جمله دوم بهتر است به جای تکرار the cat از ضمیر استفاده کنیم، مگر اینکه تاکید خاصی مد نظر باشد."},{"b":"I like the music.","g":"I like music.","w":"There is no need for an article when discussing music in a general sense, as it is an uncountable concept.","wf":"وقتی درباره موسیقی به طور کلی صحبت می‌کنیم، نیازی به the نیست."},{"b":"She is a engineer.","g":"She is an engineer.","w":"Since the word starts with a vowel sound, you must use an instead of a to maintain correct pronunciation.","wf":"چون engineer با صدای مصوت شروع می‌شود، باید از an استفاده کرد."}],"gold":[{"e":"Always check the sound of the following word, not just the first letter, to choose between a and an.","f":"همیشه به صدای کلمه بعدی توجه کنید، نه فقط به حرف اول، تا بین a و an انتخاب کنید."},{"e":"Use no article for general plural nouns and uncountable nouns to talk about things as a whole.","f":"برای صحبت درباره اشیاء به طور کلی از حرف تعریف استفاده نکنید."},{"e":"Use the only when the listener knows exactly which specific thing you are referring to.","f":"فقط زمانی از the استفاده کنید که شنونده دقیقاً بداند منظور شما کدام چیز خاص است."}]},{"lv":"I","title":"Articles 2: names of places, unique things, zero article","exp":[{"h":"Unique Things and the World","b":"When we talk about things that are one-of-a-kind, like the sun or the world, we always use 'the'. This is because there is only one of them in our context. It helps us know exactly which thing we are talking about.","hf":"چیزهای یگانه و جهان","bf":"وقتی درباره چیزهایی صحبت می‌کنیم که بی‌نظیر هستند، مثل خورشید یا جهان، همیشه از 'the' استفاده می‌کنیم. این به این دلیل است که فقط یکی از آن‌ها در دنیای ما وجود دارد. این کار به ما کمک می‌کند تا دقیقاً بدانیم درباره چه چیزی صحبت می‌کنیم.","ex":[{"e":"The sun is shining today.","p":"خورشید امروز می‌تابد."},{"e":"We live on the earth.","p":"ما روی زمین زندگی می‌کنیم."}]},{"h":"Cities and Countries","b":"For most cities and countries, we do not use any article. We just say the name. However, if the name includes words like 'Republic' or 'States', we use 'the'. This is a common pattern for political entities.","hf":"شهرها و کشورها","bf":"برای بیشتر شهرها و کشورها، ما از هیچ حرف تعریفی استفاده نمی‌کنیم و فقط نام آن‌ها را می‌آوریم. با این حال، اگر نام شامل کلماتی مانند 'جمهوری' یا 'ایالات' باشد، از 'the' استفاده می‌کنیم. این یک الگوی رایج برای نهادهای سیاسی است.","ex":[{"e":"I live in London.","p":"من در لندن زندگی می‌کنم."},{"e":"She travels to France often.","p":"او اغلب به فرانسه سفر می‌کند."}]},{"h":"Buildings and Public Places","b":"When we go to a place for its main purpose, like school or hospital, we often drop the article. This is called the zero article. It focuses on the function of the place rather than the building itself.","hf":"ساختمان‌ها و مکان‌های عمومی","bf":"وقتی به مکانی برای هدف اصلی آن می‌رویم، مثل مدرسه یا بیمارستان، اغلب حرف تعریف را حذف می‌کنیم. به این حالت حرف تعریف صفر می‌گویند. این حالت روی کاربرد آن مکان تمرکز دارد نه خود ساختمان.","ex":[{"e":"He is at school.","p":"او در مدرسه است."},{"e":"She is in hospital.","p":"او در بیمارستان است."}]}],"tip":"Remember that 'the' is for specific or unique things, while no article is used for general concepts or standard activities.","tipf":"به یاد داشته باشید که 'the' برای چیزهای خاص یا یگانه است، در حالی که برای مفاهیم کلی یا فعالیت‌های استاندارد از هیچ حرف تعریفی استفاده نمی‌شود.","bad":[{"b":"I go to the school every day.","g":"I go to school every day.","w":"When talking about attending school as a student, we usually omit 'the'.","wf":"وقتی درباره رفتن به مدرسه به عنوان دانش‌آموز صحبت می‌کنیم، معمولاً 'the' را حذف می‌کنیم."},{"b":"The Tehran is beautiful.","g":"Tehran is beautiful.","w":"Most city names do not take an article.","wf":"نام اکثر شهرها حرف تعریف نمی‌گیرد."}],"gold":[{"e":"Use 'the' for unique natural features like the sea or the sky.","f":"برای پدیده‌های طبیعی یگانه مثل دریا یا آسمان از 'the' استفاده کنید."},{"e":"Do not use articles with most country and city names.","f":"با نام اکثر کشورها و شهرها از حرف تعریف استفاده نکنید."}]},{"lv":"A","title":"Articles: advanced","exp":[{"h":"Using zero articles for general nouns","b":"When you talk about plural or uncountable nouns in a general sense, you do not use any article. This rule is very common in academic and general texts to express universal truths.","hf":"کاربرد حرف تعریف صفر برای اسم‌های عام","bf":"وقتی درباره اسم‌های جمع یا غیرقابل‌شمارش به صورت کلی صحبت می‌کنیم، از هیچ حرف تعریفی (حرف تعریف صفر) استفاده نمی‌کنیم. این قاعده در متون آکادمیک و عمومی برای بیان حقیقت‌های کلی بسیار رایج است.","ex":[{"e":"Water boils at 100 degrees Celsius.","p":"آب در دمای ۱۰۰ درجه سانتی‌گراد می‌جوشد."},{"e":"Children need a lot of sleep.","p":"کودکان به خواب زیادی نیاز دارند."}]},{"h":"Using 'the' with unique objects and specific concepts","b":"You use 'the' for things that have only one example in the environment or the world. Also, 'the' is mandatory before superlatives and nouns limited by an adjective or phrase.","hf":"حرف تعریف 'the' با اشیاء منحصربه‌فرد و مفاهیم خاص","bf":"از 'the' برای چیزهایی استفاده می‌شود که در محیط یا جهان فقط یک نمونه از آن‌ها وجود دارد. همچنین پیش از صفات عالی و اسامی که با صفت یا عبارت مضاف‌الیه محدود شده‌اند، حضور 'the' الزامی است.","ex":[{"e":"The sun rises in the east.","p":"خورشید از شرق طلوع می‌کند."},{"e":"This is the best book I have ever read.","p":"این بهترین کتابی است که تا به حال خوانده‌ام."}]},{"h":"Subtle differences in academic English","b":"In academic writing, choosing between a zero article and 'the' can change the meaning of your sentence. Uncountable or plural nouns appear generally without 'the', unless they refer to a specific or previously mentioned item.","hf":"تفاوت‌های ظریف در انگلیسی آکادمیک","bf":"در نگارش آکادمیک، انتخاب بین حرف تعریف صفر و 'the' می‌تواند معنای جمله را تغییر دهد. اسم‌های غیرقابل‌شمارش یا جمع در حالت کلی بدون 'the' می‌آیند، مگر اینکه به یک مورد خاص یا از پیش‌تعیین‌شده اشاره کنند.","ex":[{"e":"Language acquisition is a complex process.","p":"فرایند یادگیری زبان یک فرایند پیچیده است."},{"e":"The language acquisition of bilingual infants differs.","p":"فرایند اکتساب زبان در نوزادان دوزبانه متفاوت است."}]}],"tip":"Be careful with general nouns when translating from Persian to English; Persian often uses the definite article, but English uses the zero article in general contexts.","tipf":"در ترجمه از فارسی به انگلیسی، مراقب اسم‌های کلی باشید؛ فارسی اغلب از 'الف و لام' استفاده می‌کند اما انگلیسی در حالت کلی از حرف تعریف صفر بهره می‌برد.","bad":[{"b":"The education is important for everyone.","g":"Education is important for everyone.","w":"Uncountable or general nouns like education do not take an article when used in a general sense.","wf":"اسم‌های غیرقابل‌شمارش یا کلی (مانند education) در صورت کلی بودن حرف تعریف ندارند."},{"b":"She plays the tennis very well.","g":"She plays tennis very well.","w":"Names of sports and games never take the article 'the'.","wf":"نام ورزش‌ها و بازی‌ها هرگز حرف تعریف 'the' نمی‌گیرند."},{"b":"Sun is very bright today.","g":"The sun is very bright today.","w":"Unique celestial bodies like the sun always require the article 'the'.","wf":"اجرام آسمانی منحصربه‌فرد مثل خورشید همیشه به 'the' نیاز دارند."}],"gold":[{"e":"Use zero articles for general plural and uncountable nouns.","f":"برای اسم‌های جمع و غیرقابل‌شمارش کلی از حرف تعریف استفاده نکنید."},{"e":"Use 'the' for unique objects and superlatives.","f":"برای اشیاء منحصربه‌فرد و صفات عالی از 'the' استفاده کنید."},{"e":"Sports names never take 'the'.","f":"نام ورزش‌ها هرگز 'the' نمی‌گیرند."}]},{"lv":"A","title":"Articles 3: idiomatic and register-sensitive uses","exp":[{"h":"Generalizations and Abstract Concepts","b":"When we talk about things in general, not specific items, we use the definite article 'the' with singular nouns. This is common with abstract ideas like 'love', 'life', or 'nature'. In Persian, we often omit the article here, so remember to include 'the' in English to sound natural.","hf":"تعمیم‌ها و مفاهیم انتزاعی","bf":"وقتی درباره چیزها به طور کلی صحبت می‌کنیم، نه موارد خاص، از حرف تعریف 'the' با اسم‌های مفرد استفاده می‌کنیم. این با ایده‌های انتزاعی مانند 'عشق'، 'زندگی' یا 'طبیعت' رایج است. در فارسی ما اغلب اینجا حرف تعریف را حذف می‌کنیم، پس به یاد داشته باشید که برای طبیعی به نظر رسیدن در انگلیسی 'the' را اضافه کنید.","ex":[{"e":"The love of music brings joy to many.","p":"عشق به موسیقی شادی به بسیاری می‌بخشد."},{"e":"Life is full of unexpected surprises.","p":"زندگی پر از غافلگیری‌های غیرمنتظره است."}]},{"h":"Unique Institutions and Places","b":"We use 'the' for places where a specific activity happens, like school, prison, or church, when we focus on the activity rather than the building. Persian speakers often add 'the' unnecessarily here. Think of it as referring to the function of the place.","hf":"مؤسسات و مکان‌های منحصر به فرد","bf":"ما از 'the' برای مکان‌هایی که فعالیت خاصی در آن‌ها انجام می‌شود، مانند مدرسه، زندان یا کلیسا، استفاده می‌کنیم وقتی بر فعالیت تمرکز داریم نه ساختمان. فارسی‌زبانان اغلب اینجا 'the' را به طور بیهوده اضافه می‌کنند. آن را به عنوان ارجاع به عملکرد مکان در نظر بگیرید.","ex":[{"e":"He is in prison for theft.","p":"او به خاطر دزدی در زندان است."},{"e":"She goes to church every Sunday.","p":"او هر یکشنبه به کلیسا می‌رود."}]},{"h":"Geographical Exceptions","b":"Most countries do not take 'the', but groups of countries, rivers, and mountain ranges do. Persian learners often confuse these rules. Remember that singular countries like 'France' take no article, while 'the United States' does.","hf":"استثناهای جغرافیایی","bf":"اکثر کشورها 'the' نمی‌گیرند، اما گروه‌های کشورها، رودخانه‌ها و رشته‌کوه‌ها می‌گیرند. یادگیرندگان فارسی‌زبان اغلب این قوانین را اشتباه می‌گیرند. به یاد داشته باشید که کشورهای مفرد مانند 'فرانسه' هیچ حرف تعریفی نمی‌گیرند، در حالی که 'ایالات متحده' می‌گیرد.","ex":[{"e":"I am traveling to the Alps this summer.","p":"امسال به آلپ سفر می‌کنم."},{"e":"The Nile is the longest river in Africa.","p":"نیل طولانی‌ترین رودخانه در آفریقا است."}]}],"tip":"Always check if the noun refers to a specific unique entity or a general concept; context dictates the article choice.","tipf":"همیشه بررسی کنید که آیا اسم به یک موجودیت منحصر به فرد خاص اشاره می‌کند یا یک مفهوم کلی؛ زمینه انتخاب حرف تعریف را تعیین می‌کند.","bad":[{"b":"I go to the school to study.","g":"I go to school to study.","w":"We do not use 'the' when referring to the primary activity of the place.","wf":"ما وقتی به فعالیت اصلی مکان اشاره می‌کنیم از 'the' استفاده نمی‌کنیم."},{"b":"The life is beautiful.","g":"Life is beautiful.","w":"A common error for Persian speakers is adding 'the' before abstract nouns used in a general sense, whereas English uses zero article here.","wf":"یک خطای رایج برای فارسی‌زبانان اضافه کردن 'the' قبل از اسامی انتزاعی است که به معنای کلی استفاده می‌شوند، در حالی که انگلیسی در اینجا هیچ حرف تعریفی به کار نمی‌برد."},{"b":"She is in the hospital.","g":"She is in hospital.","w":"In British English, we omit 'the' when the person is a patient. In American English, 'the hospital' is common, but for learners, focusing on the activity rule is key.","wf":"در انگلیسی بریتانیایی، وقتی شخص بیمار است 'the' را حذف می‌کنیم. در انگلیسی آمریکایی، 'the hospital' رایج است، اما برای یادگیرندگان، تمرکز بر قانون فعالیت کلیدی است."}],"gold":[{"e":"Use 'the' for unique entities and general abstract concepts.","f":"از 'the' برای موجودیت‌های منحصر به فرد و مفاهیم انتزاعی عمومی استفاده کنید."},{"e":"Omit 'the' for institutions when referring to their primary purpose.","f":"هنگام اشاره به هدف اصلی مؤسسات، 'the' را حذف کنید."},{"e":"Use 'the' with plural countries, rivers, and mountain ranges.","f":"با کشورهای جمع، رودخانه‌ها و رشته‌کوه‌ها از 'the' استفاده کنید."}]}],"ex":[{"t":"gap","q":"I saw ___ elephant at the zoo.","key":["an"],"why":"Use 'an' before a singular countable noun starting with a vowel sound."},{"t":"gap","q":"___ sun rises in the east.","key":["The"],"why":"Use 'the' for unique objects that exist only once."},{"t":"fix","q":"She is an honest person.","key":["She is an honest person."],"why":"Correct usage of 'an' before a vowel sound in 'honest'."},{"t":"fa","q":"کتاب روی میز است.","key":["The book is on the table."],"why":"Use 'the' for specific, known objects in the context."},{"t":"gap","q":"___ water is essential for life.","key":["Water"],"why":"Omit articles for general concepts and uncountable nouns."},{"t":"gap","q":"He is ___ best player in the team.","key":["the"],"why":"Use 'the' with superlatives to specify a unique item."},{"t":"fix","q":"I need a advice.","key":["I need some advice."],"why":"'Advice' is uncountable, so use 'some' instead of 'a'."},{"t":"fa","q":"آدم‌ها موجودات اجتماعی هستند.","key":["Humans are social beings."],"why":"Omit articles for general plural nouns referring to a whole class."},{"t":"gap","q":"She has ___ university degree.","key":["a"],"why":"Use 'a' before 'university' because it starts with a consonant sound."},{"t":"gap","q":"___ life is full of surprises.","key":["Life"],"why":"Omit articles for general abstract concepts."},{"t":"fix","q":"The rich should help the poor.","key":["The rich should help the poor."],"why":"Correct usage of 'the' with adjectives to refer to a group of people."},{"t":"fa","q":"او به مدرسه می‌رود.","key":["She goes to school."],"why":"Omit articles for institutions when referring to their primary function."},{"t":"gap","q":"___ Pacific Ocean is the largest ocean in the world.","key":["The"],"why":"Geographical features like oceans and seas require the definite article 'the'."},{"t":"gap","q":"She is ___ honest woman.","key":["an"],"why":"The word 'honest' starts with a vowel sound, so we use 'an'."},{"t":"fix","q":"He is the best student in the class.","key":["He is the best student in the class."],"why":"Superlatives generally require the definite article 'the'."},{"t":"fix","q":"She has a university degree.","key":["She has a university degree."],"why":"'University' starts with a consonant sound /j/, so we use 'a', not 'an'."}]},{"id":"t12","t":"Nouns and Quantifiers","tf":"اسم‌ها و کمیت‌سنج‌ها","parts":[{"lv":"B","title":"Plural and Countable / Uncountable Nouns","exp":[{"h":"Countable Nouns","b":"You use countable nouns for things you can count, like apples or cars. These nouns have both singular and plural forms, so you can say one apple or two apples.","hf":"اسم‌های قابل شمارش (Countable Nouns)","bf":"برای چیزهایی که می‌توانیم آن‌ها را بشماریم از اسم‌های قابل شمارش استفاده می‌کنیم. این اسم‌ها می‌توانند مفرد (با a/an) یا جمع (با افزودن s/es/ies) باشند.","ex":[{"e":"I have a cat and two dogs.","p":"من یک گربه و دو سگ دارم."},{"e":"She bought three books.","p":"او سه کتاب خرید."}]},{"h":"Uncountable Nouns","b":"You use uncountable nouns for substances, liquids, or abstract ideas that you cannot count individually, such as water or advice. These nouns do not have a plural form and do not take a or an.","hf":"اسم‌های غیرقابل شمارش (Uncountable Nouns)","bf":"چیزهایی مانند مایعات، مواد غذایی ریز یا مفاهیم انتزاعی را نمی‌توانیم بشماریم. این اسم‌ها جمع بسته نمی‌شوند و پیش از آن‌ها از a/an استفاده نمی‌کنیم.","ex":[{"e":"I drink water every day.","p":"من هر روز آب می‌نوشم."},{"e":"We need some information.","p":"ما به مقداری اطلاعات نیاز داریم."}]},{"h":"Using some and any","b":"You use some with plural countable nouns and uncountable nouns in positive sentences. In negative sentences and questions, you should use any instead.","hf":"استفاده از some و any","bf":"برای اسم‌های قابل‌شمارش جمع و اسم‌های غیرقابل‌شمارش در جملات مثبت از some و در جملات منفی و سوالی از any استفاده می‌کنیم.","ex":[{"e":"I have some friends here.","p":"من اینجا چند (مقداری) دوست دارم."},{"e":"Do you have any money?","p":"آیا پولی داری؟"}]}],"tip":"Remember that words like water, milk, money, and information are uncountable and never take an s for plural.","tipf":"اسم‌هایی مثل water، milk، money و information در انگلیسی غیرقابل‌شمارش هستند و هرگز s جمع نمی‌گیرند.","bad":[{"b":"I need a water.","g":"I need some water.","w":"Water is uncountable, so you cannot say a water.","wf":"آب غیرقابل‌شمارش است و نمی‌توان پیش از آن a آورد."},{"b":"She has two informations.","g":"She has some information.","w":"The word information is uncountable, so it does not become informations.","wf":"کلمه information جمع بسته نمی‌شود."},{"b":"He has no moneys.","g":"He has no money.","w":"Money is uncountable, so you cannot say moneys.","wf":"money غیرقابل‌شمارش است و s جمع نمی‌گیرد."}],"gold":[{"e":"Uncountable nouns always take a singular verb.","f":"اسم‌های غیرقابل شمارش همیشه فعل مفرد می‌گیرند."},{"e":"You cannot use numbers directly with uncountable nouns; use a piece of or a glass of instead.","f":"نمی‌توانید اعداد را مستقیماً با اسم‌های غیرقابل شمارش استفاده کنید؛ به جای آن از piece of یا glass of استفاده کنید."},{"e":"Some is used in positive sentences, while any is used in negatives and questions.","f":"some در جملات مثبت و any در جملات منفی و سوالی استفاده می‌شود."}]},{"lv":"B","title":"much / many / a lot of","exp":[{"h":"Difference between Much and Many","b":"You use much for uncountable nouns like water or time, and many for countable nouns like apples or books. These words are usually found in negative and question sentences.","hf":"تفاوت Much و Many","bf":"از Much برای اسامی غیرقابل شمارش (مانند آب یا زمان) و از Many برای اسامی قابل شمارش (مانند سیب یا کتاب) استفاده می‌کنیم. این کلمات معمولاً در جملات منفی و سوالی به کار می‌روند.","ex":[{"e":"I don't have much time.","p":"من زمان زیادی ندارم."},{"e":"Do you have many books?","p":"آیا کتاب‌های زیادی داری؟"}]},{"h":"Using A lot of","b":"The phrase a lot of works for both countable and uncountable nouns and is very common in positive sentences. It is the simplest way to express a large amount.","hf":"استفاده از A lot of","bf":"عبارت a lot of ب��ای هر دو نوع اسم (قابل و غیرقابل) مناسب است و در جملات مثبت بسیار رایج است. این گزینه ساده‌ترین راه برای بیان مقدار زیاد است.","ex":[{"e":"There is a lot of water here.","p":"آب زیادی اینجا وجود دارد."},{"e":"She has a lot of friends.","p":"او دوستان زیادی دارد."}]}],"tip":"In positive sentences, use a lot of instead of much for a more natural sound.","tipf":"در جملات مثبت، به جای much از a lot of استفاده کنید چون طبیعی‌تر است.","bad":[{"b":"I have many water.","g":"I have much water.","w":"Water is uncountable, so you must use much with it.","wf":"آب غیرقابل شمارش است، پس باید از much استفاده شود."},{"b":"There are much cars.","g":"There are many cars.","w":"Cars are countable, so you must use many with them.","wf":"ماشین‌ها قابل شمارش هستند، پس باید از many استفاده شود."}],"gold":[{"e":"Use many with countable nouns and much with uncountable ones.","f":"از many برای اسامی قابل شمارش و از much برای اسامی غیرقابل شمارش استفاده کنید."},{"e":"A lot of is safe for both types in positive sentences.","f":"عبارت a lot of برای هر دو نوع اسم در جملات مثبت ایمن است."},{"e":"Avoid much in positive sentences as it sounds formal.","f":"از much در جملات مثبت پرهیز کنید زیرا رسمی به نظر می‌رسد."}]},{"lv":"I","title":"Countable and uncountable nouns (advanced)","exp":[{"h":"Understanding Mass Nouns","b":"Some nouns represent things we cannot count individually, like water or advice. We treat these as singular and do not add an 's' at the end. Think of them as a continuous substance rather than distinct items.","hf":"درک اسم‌های غیرشمارشی","bf":"برخی اسم‌ها چیزهایی را نشان می‌دهند که نمی‌توان آن‌ها را به صورت جداگانه شمرد، مانند آب یا توصیه. ما این‌ها را به عنوان مفرد در نظر می‌گیریم و انتهای آن‌ها 's' اضافه نمی‌کنیم. آن‌ها را به عنوان یک ماده پیوسته در نظر بگیرید، نه اقلام متمایز.","ex":[{"e":"I need some advice.","p":"من به مقداری راهنمایی نیاز دارم."},{"e":"She has much experience.","p":"او تجربه زیادی دارد."}]},{"h":"Using Quantifiers Correctly","b":"You cannot use 'many' with uncountable nouns; use 'much' instead. Similarly, 'few' is for countable nouns, while 'little' is for uncountable ones. Choosing the right word depends on whether you can count the noun.","hf":"استفاده صحیح از کمیت‌سنج‌ها","bf":"شما نمی‌توانید از 'many' با اسم‌های غیرشمارشی استفاده کنید؛ به جای آن از 'much' استفاده کنید. به همین ترتیب، 'few' برای اسم‌های شمارشی است، در حالی که 'little' برای اسم‌های غیرشمارشی است. انتخاب کلمه درست به این بستگی دارد که آیا می‌توانید اسم را بشمارید یا خیر.","ex":[{"e":"There is little time left.","p":"زمان کمی باقی مانده است."},{"e":"How much sugar do you want?","p":"چه مقدار شکر می‌خواهید؟"}]},{"h":"Partitives and Units","b":"To count uncountable nouns, we use phrases like 'a piece of' or 'a cup of'. These partitives allow us to specify a quantity of something that is otherwise uncountable. This is essential for precise communication.","hf":"واحد‌ها و بخش‌ها","bf":"برای شمردن اسم‌های غیرشمارشی، از عباراتی مانند 'a piece of' یا 'a cup of' استفاده می‌کنیم. این واحدهای اندازه‌گیری به ما اجازه می‌دهند مقدار خاصی از چیزی را که در غیر این صورت غیرقابل شمارش است مشخص کنیم. این کار برای ارتباط دقیق ضروری است.","ex":[{"e":"I received a piece of advice.","p":"من یک توصیه دریافت کردم."},{"e":"Could I have a glass of water?","p":"آیا می‌توانم یک لیوان آب داشته باشم؟"}]}],"tip":"Always check if the noun can be counted before choosing 'many' or 'much'.","tipf":"همیشه قبل از انتخاب 'many' یا 'much' بررسی کنید که آیا اسم قابل شمارش است یا خیر.","bad":[{"b":"I have many informations.","g":"I have much information.","w":"Information is uncountable, so we use 'much' instead of 'many' and do not add an 's'.","wf":"کلمه information غیرقابل شمارش است، بنابراین به جای 'many' از 'much' استفاده می‌کنیم و به آن 's' اضافه نمی‌کنیم."},{"b":"She gave me a good advice.","g":"She gave me some good advice.","w":"Advice is uncountable, so we cannot use the indefinite article 'a'. We use 'some' instead.","wf":"کلمه advice غیرقابل شمارش است، بنابراین نمی‌توانیم از حرف تعریف نامعین 'a' استفاده کنیم. به جای آن از 'some' استفاده می‌کنیم."},{"b":"There are few furniture in the room.","g":"There is little furniture in the room.","w":"Furniture is uncountable, so we use the singular verb 'is' and 'little' instead of 'few'.","wf":"کلمه furniture غیرقابل شمارش است، بنابراین به جای 'few' از فعل مفرد 'is' و 'little' استفاده می‌کنیم."}],"gold":[{"e":"Use 'much' with uncountable nouns in questions and negatives.","f":"از 'much' با اسم‌های غیرشمارشی در جملات سوالی و منفی استفاده کنید."},{"e":"Use 'many' with countable nouns in questions and negatives.","f":"از 'many' با اسم‌های شمارشی در جملات سوالی و منفی استفاده کنید."},{"e":"Use partitives like 'a piece of' to count uncountable nouns.","f":"از واحدهای جزئی مانند 'a piece of' برای شمردن اسم‌های غیرشمارشی استفاده کنید."}]}],"ex":[{"t":"gap","q":"I have three ___ in my bag.","key":["books"],"why":"Countable noun 'book' takes plural form 'books' after 'three'."},{"t":"gap","q":"There is some ___ in the bottle.","key":["water"],"why":"'Water' is uncountable, so it remains singular."},{"t":"gap","q":"Do you have any ___?","key":["milk"],"why":"'Milk' is uncountable and used with 'any' in questions."},{"t":"gap","q":"How ___ apples did you buy?","key":["many"],"why":"'Many' is used with countable nouns like 'apples'."},{"t":"gap","q":"How ___ sugar do you need?","key":["much"],"why":"'Much' is used with uncountable nouns like 'sugar'."},{"t":"gap","q":"She has a lot of ___ friends.","key":["close"],"why":"'A lot of' can be used with countable nouns like 'friends'."},{"t":"fix","q":"There are many furnitures in the room.","key":["There are many pieces of furniture in the room."],"why":"'Furniture' is uncountable, so we use 'pieces of' or just 'much furniture'."},{"t":"fix","q":"I don't have many time.","key":["I don't have much time."],"why":"'Time' is uncountable here, so we use 'much' instead of 'many'."},{"t":"fix","q":"She has a lot of informations.","key":["She has a lot of information."],"why":"'Information' is uncountable and does not take an 's'."},{"t":"fa","q":"آیا شما آب دارید؟","key":["Do you have any water?"],"why":"Translation of a question about an uncountable noun using 'any'."},{"t":"fa","q":"من خیلی وقت ندارم.","key":["I don't have much time."],"why":"Translation using 'much' for the uncountable noun 'time'."},{"t":"fa","q":"چند تا سیب خریدی؟","key":["How many apples did you buy?"],"why":"Translation using 'how many' for the countable noun 'apples'."},{"t":"gap","q":"I need to buy some ___ for the salad.","key":["lettuce"],"why":"Lettuce is an uncountable mass noun, so it does not take a plural -s."},{"t":"fix","q":"There are many informations on the website.","key":["There is a lot of information on the website."],"why":"Information is uncountable, so we use 'is' and 'a lot of' or 'much' instead of 'many'."},{"t":"fa","q":"آیا شیر دارید؟","key":["Do you have any milk?"],"why":"Milk is an uncountable noun, so we use 'any' in questions and the singular verb 'have'."}]},{"id":"t13","t":"all / every / each / both / either / neither","tf":"همه‌شمولی و دوتایی‌ها","parts":[{"lv":"B","title":"all / everybody / everything","exp":[{"h":"Using 'all' with plural nouns","b":"When you talk about every single person or thing in a group, use 'all' before a plural noun. It emphasizes the whole group together. Think of it as 'the entire group'.","hf":"استفاده از 'all' با اسامی جمع","bf":"وقتی درباره هر فرد یا چیز در یک گروه صحبت می‌کنید، قبل از اسم جمع از 'all' استفاده کنید. این کلمه کل گروه را تأکید می‌کند. آن را به عنوان 'کل گروه' در نظر بگیرید.","ex":[{"e":"All students passed the exam.","p":"همه دانش‌آموزان در امتحان قبول شدند."},{"e":"All the books are on the table.","p":"همه کتاب‌ها روی میز هستند."}]},{"h":"Using 'everybody' and 'everything'","b":"Use 'everybody' for people and 'everything' for things. These words are singular in grammar, so they take a singular verb. They mean 'everyone' and 'all things'.","hf":"استفاده از 'everybody' و 'everything'","bf":"برای افراد از 'everybody' و برای اشیاء از 'everything' استفاده کنید. این کلمات از نظر دستوری مفرد هستند، بنابراین با فعل مفرد می‌آیند. آن‌ها به معنی 'همه افراد' و 'همه چیز' هستند.","ex":[{"e":"Everybody is here today.","p":"همه امروز اینجا هستند."},{"e":"Everything looks beautiful.","p":"همه چیز زیبا به نظر می‌رسد."}]},{"h":"Difference between 'all' and 'every'","b":"'All' is used with plural nouns, while 'every' is used with singular nouns. 'All' refers to the group as a whole, whereas 'every' looks at individuals within the group. Both mean the same general idea.","hf":"تفاوت بین 'all' و 'every'","bf":"'All' با اسامی جمع استفاده می‌شود، در حالی که 'every' با اسامی مفرد استفاده می‌شود. 'All' به کل گروه اشاره دارد، در حالی که 'every' به افراد درون گروه نگاه می‌کند. هر دو معنی کلی یکسانی دارند.","ex":[{"e":"All days are equal.","p":"همه روزها برابر هستند."},{"e":"Every day is a new beginning.","p":"هر روز یک شروع جدید است."}]}],"tip":"Remember that 'everybody' and 'everything' are always singular, so use 'is' or 'has', not 'are' or 'have'.","tipf":"به یاد داشته باشید که 'everybody' و 'everything' همیشه مفرد هستند، بنابراین از 'is' یا 'has' استفاده کنید، نه 'are' یا 'have'.","bad":[{"b":"All students are pass the exam.","g":"All students passed the exam.","w":"Use the correct verb tense. 'Are pass' is incorrect; use simple past or present simple.","wf":"از زمان فعل صحیح استفاده کنید. 'Are pass' نادرست است؛ از گذشته ساده یا حال ساده استفاده کنید."},{"b":"Everybody have a book.","g":"Everybody has a book.","w":"'Everybody' is singular, so use 'has', not 'have'.","wf":"'Everybody' مفرد است، بنابراین از 'has' استفاده کنید، نه 'have'."},{"b":"All everything is ready.","g":"Everything is ready.","w":"Do not use 'all' and 'everything' together. Choose one.","wf":"از 'all' و 'everything' با هم استفاده نکنید. یکی را انتخاب کنید."}],"gold":[{"e":"All + plural noun + plural verb","f":"All + اسم جمع + فعل جمع"},{"e":"Everybody/Everything + singular verb","f":"Everybody/Everything + فعل مفرد"},{"e":"Every + singular noun + singular verb","f":"Every + اسم مفرد + فعل مفرد"}]},{"lv":"B","title":"each and every","exp":[{"h":"Understanding 'Each' for Individual Focus","b":"Use 'each' when you want to emphasize every single item or person individually, often looking at them one by one. It is perfect for highlighting specific details within a group. Think of it as pointing at everyone individually. This works well with singular nouns.","hf":"درک 'each' برای تمرکز بر تک‌تک موارد","bf":"از 'each' زمانی استفاده کنید که می‌خواهید هر یک از موارد یا افراد را به صورت جداگانه و تکی تأکید کنید. این کلمه برای برجسته کردن جزئیات خاص در یک گروه عالی است. آن را مانند اشاره کردن به هر فرد به صورت جداگانه در نظر بگیرید. این با اسامی مفرد به خوبی کار می‌کند.","ex":[{"e":"Each student received a certificate.","p":"هر دانش‌آموز یک گواهی دریافت کرد."},{"e":"Each room has a unique view.","p":"هر اتاق یک منظره منحصربه‌فرد دارد."}]},{"h":"Using 'Every' for General Groups","b":"Use 'every' to refer to all members of a group as a whole, emphasizing the collective total. It feels more general and inclusive than 'each'. It is very common in everyday speech to talk about habits or general truths. It implies 'all without exception'.","hf":"استفاده از 'every' برای گروه‌های کلی","bf":"از 'every' برای اشاره به تمام اعضای یک گروه به عنوان یک کل استفاده کنید که بر مجموع کلی تأکید دارد. این کلمه حس کلی‌تر و فراگیرتری نسبت به 'each' دارد. در گفتگوهای روزمره برای صحبت درباره عادت‌ها یا حقایق کلی بسیار رایج است و به معنای «همه بدون استثنا» است.","ex":[{"e":"Every day I go for a walk.","p":"هر روز پیاده‌روی می‌کنم."},{"e":"Every student passed the exam.","p":"همه دانش‌آموزان در امتحان قبول شدند."}]},{"h":"The Phrase 'Each and Every'","b":"You can combine these words into the phrase 'each and every' for extra emphasis. It stresses that absolutely no one or nothing is left out. It is stronger than using either word alone. Use it when you want to be very clear about inclusivity.","hf":"عبارت 'each and every'","bf":"می‌توانید این دو کلمه را با هم ترکیب کنید و عبارت 'each and every' را برای تأکید بیشتر بسازید. این عبارت تأکید می‌کند که مطلقاً هیچ‌کس یا هیچ‌چیزی جا نمانده است. این عبارت از استفاده‌ی هرکدام از کلمات به تنهایی قوی‌تر است و زمانی استفاده می‌شود که می‌خواهید شمول کامل را به وضوح نشان دهید.","ex":[{"e":"Each and every citizen has a right to vote.","p":"تک‌تک شهروندان حق رأی دارند."},{"e":"I thanked each and every guest.","p":"من از تک‌تک مهمانان تشکر کردم."}]}],"tip":"Remember that 'each' focuses on individuals, while 'every' focuses on the group as a whole.","tipf":"به یاد داشته باشید که 'each' بر افراد به صورت تکی تمرکز دارد، در حالی که 'every' بر گروه به عنوان یک کل تمرکز می‌کند.","bad":[{"b":"Each of the students are ready.","g":"Each of the students is ready.","w":"When 'each' is the subject, the verb must be singular because it focuses on one individual at a time.","wf":"وقتی 'each' فاعل است، فعل باید مفرد باشد زیرا روی یک فرد در هر زمان تمرکز دارد."},{"b":"Every of the books is interesting.","g":"Every book is interesting.","w":"We do not say 'every of'. We use 'every' directly before a noun, or 'each of' before a pronoun or noun phrase.","wf":"ما نمی‌گوییم 'every of'. ما 'every' را مستقیماً قبل از اسم به کار می‌بریم، یا از 'each of' قبل از ضمیر یا عبارت اسمی استفاده می‌کنیم."},{"b":"Each of them have a car.","g":"Each of them has a car.","w":"The subject 'each' is singular, so it takes a singular verb form like 'has', not 'have'.","wf":"فاعل 'each' مفرد است، بنابراین شکل فعل مفرد مانند 'has' را می‌گیرد، نه 'have'."}],"gold":[{"e":"Use 'each' for individual items and 'every' for the group as a whole.","f":"از 'each' برای موارد فردی و از 'every' برای گروه به عنوان یک کل استفاده کنید."},{"e":"'Each' is always followed by a singular noun or 'of' + plural noun/pronoun.","f":"بعد از 'each' همیشه یک اسم مفرد یا عبارت 'of' + اسم/ضمیر جمع می‌آید."},{"e":"'Every' is always followed by a singular noun.","f":"بعد از 'every' همیشه یک اسم مفرد می‌آید."}]},{"lv":"B","title":"both / either / neither","exp":[{"h":"Using 'both' for two items","b":"Use 'both' when you want to talk about two people or things together. It means 'the two of them' or 'all two'. Remember that 'both' is always followed by a plural verb because it refers to more than one item.","hf":"استفاده از 'both' برای دو مورد","bf":"وقتی می‌خواهید درباره دو نفر یا دو چیز با هم صحبت کنید، از 'both' استفاده کنید. این کلمه به معنای 'هر دو' است. به یاد داشته باشید که 'both' همیشه با فعل جمع می‌آید چون به بیش از یک مورد اشاره دارد.","ex":[{"e":"Both my parents are teachers.","p":"هر دو والدین من معلم هستند."},{"e":"I like both of these shirts.","p":"من هر دو تا از این پیراهن‌ها را دوست دارم."}]},{"h":"Choosing between two options with 'either' or 'neither'","b":"Use 'either' when you mean 'one or the other' of two things. Use 'neither' when you mean 'not one and not the other'. 'Either' is positive, while 'neither' is negative.","hf":"انتخاب بین دو گزینه با 'either' یا 'neither'","bf":"وقتی منظور شما 'یکی از دو چیز' است، از 'either' استفاده کنید. وقتی منظور شما 'نه این و نه آن' است، از 'neither' استفاده کنید. کلمه 'either' در جملات مثبت یا انتخابی به کار می‌رود، در حالی که 'neither' ذاتاً منفی است.","ex":[{"e":"You can take either bus.","p":"می‌توانید هر کدام از این دو اتوبوس را سوار شوید."},{"e":"Neither ans
