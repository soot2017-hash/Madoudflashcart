s, her, or their. You can use whose for both people and things.","hf":"مالکیت با whose","bf":"برای نشان دادن مالکیت در جمله‌های وصفی، به جای ضمایر ملکی (his, her, their) از whose استفاده می‌کنیم. این کلمه هم برای انسان و هم برای غیرانسان کاربرد دارد.","ex":[{"e":"I met a man whose car was stolen.","p":"مردی را ملاقات کردم که ماشینش دزدیده شده بود."},{"e":"She lives in a house whose roof is red.","p":"او در خانه‌ای زندگی می‌کند که سقفش قرمز است."}]}],"tip":"If the relative pronoun is the object of the clause, you can omit it, for example saying the book I bought instead of the book which I bought.","tipf":"در زبان انگلیسی، اگر ضمیر موصولی مفعول جمله باشد (مثل who/which/that)، می‌توانیم آن را حذف کنیم؛ مثلاً بگوییم the book I bought به جای the book which I bought.","bad":[{"b":"I saw the man who he helped me.","g":"I saw the man who helped me.","w":"You should not use a subject pronoun like he after the relative pronoun.","wf":"نباید بعد از ضمیر موصولی دوباره از ضمیر فاعلی (مثل he) استفاده کنید."},{"b":"This is the pen which it is expensive.","g":"This is the pen which is expensive.","w":"It is incorrect to use both which and it in the same extra clause.","wf":"استفاده همزمان از which و it در یک جمله اضافی و نادرست است."},{"b":"The girl whose her bag was lost cried.","g":"The girl whose bag was lost cried.","w":"Whose already indicates possession, so you do not need to add her after it.","wf":"کلمه whose خودش مالکیت می‌رساند و نیازی به آوردن her بعد از آن نیست."}],"gold":[{"e":"Always remember to omit the relative pronoun when it acts as the object.","f":"همیشه به خاطر بسپارید که وقتی ضمیر موصولی نقش مفعول را دارد، آن را حذف کنید."},{"e":"Use commas only for non-defining clauses where the information is extra.","f":"فقط برای جملات غیرتعریف‌کننده که اطلاعات اضافی هستند از ویرگول استفاده کنید."},{"e":"Use whose for both people and things to show possession.","f":"برای نشان دادن مالکیت برای انسان‌ها و اشیاء از whose استفاده کنید."}]},{"lv":"I","title":"Relative clauses 2: whose / whom / where; defining vs non-defining","exp":[{"h":"Using 'whose' for possession","b":"Use 'whose' to show that something belongs to the person or thing mentioned before. It works for both people and objects, making it very flexible. You can think of it as meaning 'of whom' or 'of which'.","hf":"استفاده از 'whose' برای مالکیت","bf":"برای نشان دادن اینکه چیزی متعلق به شخص یا چیز قبلی است، از 'whose' استفاده کنید. این کلمه برای افراد و اشیاء کاربرد دارد و بسیار انعطاف‌پذیر است. می‌توانید آن را به معنای 'که [فلانی/آن] ...' در نظر بگیرید.","ex":[{"e":"The man whose car was stolen called the police.","p":"مردی که ماشینش دزدیده شده بود با پلیس تماس گرفت."},{"e":"I live in a house whose windows are broken.","p":"من در خانه‌ای زندگی می‌کنم که پنجره‌هایش شکسته است."}]},{"h":"Using 'whom' for people","b":"Use 'whom' when the person is the object of the verb or preposition in the clause. It is more formal than 'who'. If you are unsure, try replacing it with 'him' or 'her'.","hf":"استفاده از 'whom' برای افراد","bf":"وقتی شخص مفعول فعل یا حرف اضافه در بند نسبی باشد، از 'whom' استفاده کنید. این کلمه رسمی‌تر از 'who' است. اگر مطمئن نیستید، سعی کنید ضمیر مفعولی مناسب (مانند him یا her) را در جمله واره جایگزین آن کنید.","ex":[{"e":"The woman whom I met yesterday is a doctor.","p":"زنی که دیروز ملاقاتش کردم پزشک است."},{"e":"He is the person whom you should trust.","p":"او کسی است که باید به او اعتماد کنید."}]},{"h":"Using 'where' for places","b":"Use 'where' to refer to a place. It replaces 'in which' or 'at which'. It is very common in both spoken and written English.","hf":"استفاده از 'where' برای مکان‌ها","bf":"برای اشاره به مکان از 'where' استفاده کنید. این کلمه جایگزین 'in which' یا 'at which' می‌شود. این ساختار در هر دو زبان گفتاری و نوشتاری انگلیسی بسیار رایج است.","ex":[{"e":"This is the city where I was born.","p":"این شهری است که در آن به دنیا آمدم."},{"e":"The restaurant where we ate was expensive.","p":"رستورانی که در آن غذا خوردیم گران بود."}]}],"tip":"Remember that 'whose' can be used for both people and things, so you don't need to switch to 'of which' for objects.","tipf":"به یاد داشته باشید که 'whose' را می‌توان برای افراد و اشیاء به کار برد، بنابراین برای اشیاء نیازی به استفاده از 'of which' نیست.","bad":[{"b":"The man who his car was stolen called the police.","g":"The man whose car was stolen called the police.","w":"Use 'whose' instead of 'who his' to show possession.","wf":"به جای 'who his' برای نشان دادن مالکیت از 'whose' استفاده کنید."},{"b":"The woman who I met yesterday is a doctor.","g":"The woman whom I met yesterday is a doctor.","w":"Use 'whom' when the person is the object of the verb.","wf":"وقتی شخص مفعول فعل است، استفاده از 'whom' دقیق‌تر و رسمی‌تر است."},{"b":"This is the city in which I was born in.","g":"This is the city where I was born.","w":"Use 'where' instead of 'in which ... in' to avoid redundancy.","wf":"برای جلوگیری از حشو و تکرار، به جای عبارت 'in which ... in' از 'where' استفاده کنید."}],"gold":[{"e":"Use 'whose' for possession of people or things.","f":"برای نشان دادن مالکیت افراد یا اشیاء از 'whose' استفاده کنید."},{"e":"Use 'whom' for people when they are the object.","f":"برای افراد هنگامی که نقش مفعول را دارند از 'whom' استفاده کنید."},{"e":"Use 'where' to refer to a place.","f":"برای اشاره به مکان از 'where' استفاده کنید."}]},{"lv":"I","title":"Reduced relative clauses (the man sitting next to me)","exp":[{"h":"Reduced Relative Clauses with Present Participles","b":"When a relative clause uses an active verb, you can often make it shorter by removing the relative pronoun and the 'be' verb. Instead of saying 'the man who is sitting', you can simply say 'the man sitting'. This makes your English sound more natural and fluent.","hf":"جمله‌های وصفی کوتاهشده با اسم‌فاعل (وجه وصفی حال)","bf":"وقتی که یک جمله وصفی با یک فعل معلوم ساخته شده است، اغلب می‌توانید با حذف ضمیر نسبی و فعل «be» آن را کوتاه‌تر کنید. به جای گفتن «مردی که نشسته است»، می‌توانید به سادگی بگویید «مرد نشسته». این کار باعث می‌شود انگلیسی شما طبیعی‌تر و روان‌تر به نظر برسد.","ex":[{"e":"The woman standing there is my sister.","p":"زنی که آنجا ایستاده است خواهر من است."},{"e":"I saw the boy playing football in the park.","p":"پسری را دیدم که در پارک فوتبال بازی می‌کرد."}]},{"h":"Reduced Relative Clauses with Past Participles","b":"If the relative clause has a passive meaning, use the past participle form of the verb. You remove the relative pronoun and the 'be' verb. For example, 'the book that was written by him' becomes 'the book written by him'. This is very common in formal and written English.","hf":"جمله‌های وصفی کوتاهشده با اسم مفعول (وجه وصفی گذشته)","bf":"اگر جمله وصفی معنای مجهول دارد، از شکل سوم فعل (اسم مفعول) استفاده کنید. ضمیر نسبی و فعل «be» را حذف می‌کنید. برای مثال، عبارت «کتابی که توسط او نوشته شده است» به «کتاب نوشته‌شده توسط او» تبدیل می‌شود. این ساختار در انگلیسی رسمی و نوشتاری بسیار رایج است.","ex":[{"e":"The cake baked by my mother was delicious.","p":"کیکی که توسط مادرم پخته شده بود، خوشمزه بود."},{"e":"These are the letters sent yesterday.","p":"این‌ها نامه‌هایی هستند که دیروز فرستاده شده‌اند."}]},{"h":"When to Use Reduced Clauses","b":"You can reduce relative clauses when the relative pronoun is the subject of the clause. This technique helps you avoid repetition and makes your sentences less wordy. It is a great way to improve your fluency and sound more like a native speaker.","hf":"چه زمانی از جمله‌های وصفی کوتاهشده استفاده کنیم","bf":"شما می‌توانید جمله‌های وصفی را زمانی کوتاه کنید که ضمیر نسبی فاعل آن جمله باشد. این تکنیک به شما کمک می‌کند از تکرار جلوگیری کنید و جملاتتان را از کلمات اضافه پاک کنید. این روشی عالی برای بهبود روانی کلام و شبیه‌تر شدن به یک گویندۀ بومی است.","ex":[{"e":"The people living in this house are nice.","p":"مردمی که در این خانه زندگی می‌کنند، آدم‌های خوبی هستند."},{"e":"The car parked outside belongs to John.","p":"ماشینی که بیرون پارک شده است متعلق به جان است."}]}],"tip":"Always check if the verb in the relative clause is active or passive before deciding which participle to use.","tipf":"همیشه پیش از تصمیم‌گیری درباره اینکه از چه نوع وجه وصفی‌ای استفاده کنید، بررسی کنید که آیا فعلِ موجود در جمله وصفی معلوم است یا مجهول.","bad":[{"b":"The man who sit next to me is my teacher.","g":"The man sitting next to me is my teacher.","w":"You cannot use the base form 'sit' directly after the noun. You need the present participle 'sitting' for active meaning.","wf":"شما نمی‌توانید شکل ساده فعل 'sit' را مستقیماً بعد از اسم به کار ببرید. برای معنای معلوم، به اسم‌فاعل یعنی 'sitting' نیاز دارید."},{"b":"The book wrote by him is interesting.","g":"The book written by him is interesting.","w":"For passive meaning, you must use the past participle 'written', not the base form 'wrote'.","wf":"برای ساختار مجهول، باید از اسم مفعول 'written' استفاده کنید، نه شکل گذشته ساده یعنی 'wrote'."},{"b":"The girl who is wearing a red dress is my friend.","g":"The girl wearing a red dress is my friend.","w":"While the original sentence is correct, reducing it removes 'who is' to make it more concise and natural.","wf":"اگرچه جمله اصلی درست است، اما با کوتاه کردن آن و حذف 'who is'، جمله خلاصه‌تر و طبیعی‌تر می‌شود."}],"gold":[{"e":"Active relative clauses become present participles (-ing).","f":"جمله‌های وصفی معلوم به اسم‌فاعل (پسوند -ing) تبدیل می‌شوند."},{"e":"Passive relative clauses become past participles (3rd form).","f":"جمله‌های وصفی مجهول به اسم مفعول (شکل سوم فعل) تبدیل می‌شوند."},{"e":"Remove the relative pronoun (who, which, that) and the verb 'be'.","f":"ضمیر نسبی (who، which، that) و فعل «be» را حذف کنید."}]},{"lv":"A","title":"Nominal relative clauses: what / whatever / whichever","exp":[{"h":"Using 'what' for things","b":"Use 'what' when you want to talk about a thing or an idea without specifying which one. It acts as both the question word and the object in the sentence. Think of it as 'the thing that'.","hf":"استفاده از 'what' برای اشیاء","bf":"وقتی می‌خواهید درباره یک چیز یا ایده صحبت کنید بدون اینکه مشخص کنید کدام است، از 'what' استفاده کنید. این کلمه هم نقش کلمه پرسشی و هم نقش مفعول را در جمله دارد. آن را به عنوان 'چیزی که' در نظر بگیرید.","ex":[{"e":"I know what you mean.","p":"می‌دانم منظور تو چیست."},{"e":"This is what I need.","p":"این چیزی است که نیاز دارم."}]},{"h":"Using 'whatever' for any thing","b":"Use 'whatever' to emphasize that it does not matter which thing it is. It suggests 'any thing at all' or 'no matter what'. It is stronger than 'what'.","hf":"استفاده از 'whatever' برای هر چیزی","bf":"از 'whatever' استفاده کنید تا تأکید کنید که مهم نیست آن چیز چیست. این کلمه به معنی 'هر چیزی' یا 'فرقی نمی‌کند چه' است. قوی‌تر از 'what' است.","ex":[{"e":"Do whatever you want.","p":"هر کاری که می‌خواهی بکن."},{"e":"Whatever happens, stay calm.","p":"هر اتفاقی بیفتد، آرام باش."}]},{"h":"Using 'whichever' for a choice","b":"Use 'whichever' when there is a limited set of options to choose from. It means 'any one from the available choices'. It is similar to 'whatever' but implies a selection.","hf":"استفاده از 'whichever' برای انتخاب","bf":"از 'whichever' استفاده کنید وقتی مجموعه محدودی از گزینه‌ها برای انتخاب وجود دارد. این کلمه به معنی 'هر کدام از گزینه‌های موجود' است. شبیه 'whatever' است اما انتخاب را نشان می‌دهد.","ex":[{"e":"Take whichever book you like.","p":"هر کتابی که دوست داری بردار."},{"e":"Whichever path you choose, it is fine.","p":"هر مسیری که انتخاب کنی، خوب است."}]}],"tip":"Remember that 'what' refers to a general thing, 'whatever' means 'any thing', and 'whichever' implies a choice from a group.","tipf":"به یاد داشته باشید که 'what' به یک چیز عمومی اشاره دارد، 'whatever' به معنی 'هر چیزی' است و 'whichever' انتخاب از یک گروه را نشان می‌دهد.","bad":[{"b":"I don't know what is the problem.","g":"I don't know what the problem is.","w":"In nominal relative clauses, the word order is subject-verb, not question order.","wf":"در جمله‌های موصولی اسمی، ترتیب کلمات فاعل-فعل است، نه ترتیب سوالی."},{"b":"Do whatever you thinks is right.","g":"Do whatever you think is right.","w":"The verb after 'whatever' agrees with the subject 'you', so use 'think' not 'thinks'.","wf":"فعل بعد از 'whatever' با فاعل 'you' مطابقت دارد، بنابراین از 'think' استفاده کنید نه 'thinks'."},{"b":"I don't know what should I do.","g":"I don't know what I should do.","w":"In nominal relative clauses, use subject-verb word order rather than question word order.","wf":"در جمله‌های موصولی اسمی، به جای ترتیب کلمات سوالی، از ترتیب فاعل-فعل استفاده کنید."}],"gold":[{"e":"Use 'what' for general things.","f":"از 'what' برای اشیاء عمومی استفاده کنید."},{"e":"Use 'whatever' for any thing at all.","f":"از 'whatever' برای هر چیزی استفاده کنید."},{"e":"Use 'whichever' when choosing from a set.","f":"از 'whichever' هنگام انتخاب از یک مجموعه استفاده کنید."}]},{"lv":"A","title":"Sentential relatives: which / who referring to whole clauses","exp":[{"h":"Using 'which' to refer to a whole previous sentence","b":"You can use 'which' to add information about an entire situation described in the previous clause. This is very common in written English to avoid repetition. It acts as a bridge between two ideas, showing a result or comment on the first part.","hf":"استفاده از 'which' برای اشاره به یک جمله کامل","bf":"شما می‌توانید از 'which' برای اضافه کردن اطلاعات درباره یک وضعیت کامل که در بخش قبلی جمله توصیف شده است استفاده کنید. این در انگلیسی نوشتاری بسیار رایج است تا از تکرار جلوگیری شود. این کلمه مانند پلی بین دو ایده عمل می‌کند و نتیجه یا نظری درباره بخش اول را نشان می‌دهد.","ex":[{"e":"He was late, which made everyone angry.","p":"او دیر رسید، که باعث عصبانی شدن همه شد."},{"e":"She didn't study, which was a mistake.","p":"او درس نخواند، که این یک اشتباه بود."}]},{"h":"Using 'who' to refer to a person mentioned in the previous clause","b":"When the previous clause mentions a specific person, you can use 'who' to add more details about that person. This works similarly to 'which' but focuses on the individual. It helps to connect descriptions smoothly.","hf":"استفاده از 'who' برای اشاره به شخصی که در جمله قبلی ذکر شده است","bf":"وقتی جمله قبلی درباره یک شخص خاص صحبت می‌کند، می‌توانید از 'who' برای افزودن جزئیات بیشتر درباره آن شخص استفاده کنید. این به همین شکل 'which' کار می‌کند اما روی فرد تمرکز دارد. این به اتصال روان توصیف‌ها کمک می‌کند.","ex":[{"e":"My brother, who lives in London, is a doctor.","p":"برادرم، که در لندن زندگی می‌کند، پزشک است."},{"e":"The teacher, who was very kind, helped us.","p":"معلم، که بسیار مهربان بود، به ما کمک کرد."}]},{"h":"Punctuation rules for non-defining relatives","b":"Remember to use commas when these relatives refer to whole sentences or add extra information. This is called a non-defining relative clause. The commas separate the extra information from the main sentence structure.","hf":"قواعد نشانه‌گذاری برای وابسته‌های غیرتعریفی","bf":"به یاد داشته باشید که وقتی این وابسته‌ها به کل جملات یا اطلاعات اضافی اشاره می‌کنند، از ویرگول استفاده کنید. به این جمله وابسته غیرتعریفی می‌گویند. ویرگول‌ها اطلاعات اضافی را از ساختار اصلی جمله جدا می‌کنند.","ex":[{"e":"It rained, which ruined our picnic.","p":"باران بارید، که پیک‌نیک ما را خراب کرد."},{"e":"Alice, who is my friend, called me.","p":"آلیس، که دوست من است، با من تماس گرفت."}]}],"tip":"Always use a comma before 'which' or 'who' when they refer to the whole previous sentence or add non-essential information about a person.","tipf":"همیشه قبل از 'which' یا 'who' وقتی که به کل جمله قبلی اشاره می‌کنند یا اطلاعات غیرضروری درباره یک شخص اضافه می‌کنند، از ویرگول استفاده کنید.","bad":[{"b":"He was late which made everyone angry.","g":"He was late, which made everyone angry.","w":"You need a comma before 'which' because it refers to the whole previous clause.","wf":"شما نیاز به یک ویرگول قبل از 'which' دارید زیرا به کل بخش قبلی جمله اشاره می‌کند."},{"b":"She didn't study, that was a mistake.","g":"She didn't study, which was a mistake.","w":"In non-defining clauses referring to a whole sentence, use 'which', not 'that'.","wf":"در جملات وابسته غیرتعریفی که به یک جمله کامل اشاره می‌کنند، از 'which' استفاده کنید، نه 'that'."},{"b":"My brother who lives in London is a doctor.","g":"My brother, who lives in London, is a doctor.","w":"If 'who' adds extra information about a known person, use commas.","wf":"اگر 'who' اطلاعات اضافی درباره یک شخص شناخته شده اضافه می‌کند، از ویرگول استفاده کنید."}],"gold":[{"e":"Use 'which' with a comma to comment on a whole previous clause.","f":"از 'which' با ویرگول برای نظر دادن درباره یک بخش قبلی کامل جمله استفاده کنید."},{"e":"Use 'who' with commas to add extra information about a specific person.","f":"از 'who' با ویرگول برای افزودن اطلاعات اضافی درباره یک شخص خاص استفاده کنید."},{"e":"Never use 'that' after a comma in this context.","f":"هرگز در این زمینه بعد از ویرگول از 'that' استفاده نکنید."}]}],"ex":[{"t":"gap","q":"The man ___ is standing there is my teacher.","key":["who"],"why":"Use 'who' for people as the subject of the relative clause."},{"t":"gap","q":"I lost the book ___ I bought yesterday.","key":["that"],"why":"Use 'that' or 'which' for things in defining relative clauses."},{"t":"gap","q":"The girl, ___ hair is long, is my sister.","key":["whose"],"why":"Use 'whose' to show possession for people."},{"t":"fix","q":"The car which is red is fast.","key":["The car, which is red, is fast."],"why":"Add commas for a non-defining clause providing extra information."},{"t":"gap","q":"This is the house ___ I was born.","key":["where"],"why":"Use 'where' for places when referring to location."},{"t":"fix","q":"My friend who lives in London is a doctor.","key":["My friend, who lives in London, is a doctor."],"why":"Add commas because 'lives in London' is non-defining (extra info)."},{"t":"gap","q":"The teacher ___ we admire is very kind.","key":["whom"],"why":"Use 'whom' for people as the object of the relative clause."},{"t":"gap","q":"I like the color ___ you chose.","key":["that"],"why":"Use 'that' for things in defining relative clauses."},{"t":"fix","q":"The boy which is playing football is my brother.","key":["The boy who is playing football is my brother."],"why":"Use 'who' for people, not 'which'."},{"t":"fa","q":"کتابی که من خواندم جالب بود.","key":["The book that I read was interesting."],"why":"Translate 'که' as 'that' or 'which' for things in a defining clause."},{"t":"fa","q":"دوستم که در لندن زندگی می‌کند، پزشک است.","key":["My friend, who lives in London, is a doctor."],"why":"Use commas and 'who' for non-defining information about a person."},{"t":"gap","q":"The woman ___ car was stolen called the police.","key":["whose"],"why":"Use 'whose' to indicate possession for the woman's car."},{"t":"gap","q":"The woman ___ is standing by the door is my aunt.","key":["who"],"why":"Use 'who' as the relative pronoun for the subject referring to a person."},{"t":"gap","q":"I have a friend ___ lives in Tokyo.","key":["who"],"why":"Use 'who' to refer to a person in a defining relative clause."},{"t":"fix","q":"The book which I bought is interesting.","key":["The book that I bought is interesting.","The book which I bought is interesting."],"why":"'That' is preferred over 'which' in defining relative clauses for objects, though 'which' is also acceptable."},{"t":"gap","q":"The man ___ car was stolen called the police.","key":["whose"],"why":"Use 'whose' to indicate possession for people."},{"t":"fa","q":"مردی که در پارک دو می‌زند، دوست من است.","key":["The man who is running in the park is my friend."],"why":"Translate the relative clause using 'who' for the person performing the action."},{"t":"gap","q":"This is the restaurant ___ we had dinner last night.","key":["where"],"why":"Use 'where' to refer to a place in a relative clause."},{"t":"fix","q":"My brother, who lives in New York, is a doctor.","key":["My brother, who lives in New York, is a doctor."],"why":"The sentence is already correct; 'who' is used for a non-defining clause referring to a person."},{"t":"gap","q":"The girl ___ is sitting there is my sister.","key":["who"],"why":"Use 'who' as the subject relative pronoun for a person."}]},{"id":"t23","t":"The Passive","tf":"مجهول","parts":[{"lv":"I","title":"The Passive (1)","exp":[{"h":"Forming the Passive","b":"To create a passive sentence, move the object of the active sentence to the beginning. Then use the verb to be followed by the past participle of the main verb. The tense of the original verb determines the form of to be.","hf":"طرز ساخت مجهول","bf":"برای ساختن جمله مجهول، مفعول جمله معلوم را به ابتدای جمله می آوریم و از فرمول فعل To Be به همراه اسم مفعول (Past Participle) استفاده می کنیم. زمان فعل اصلی تعیین کننده شکل فعل To Be است.","ex":[{"e":"English is spoken all over the world.","p":"در سراسر جهان انگلیسی صحبت می شود."},{"e":"The car was repaired yesterday.","p":"ماشین دیروز تعمیر شد."}]},{"h":"Using the preposition by","b":"Use by when you want to specify who or what performed the action. We often use the passive voice when the doer is not very important or is unknown.","hf":"استفاده از حرف اضافه by","bf":"اگر بخواهیم مشخص کنیم چه کسی یا چه چیزی کاری را انجام داده است، از حرف اضافه by استفاده می کنیم. معمولاً زمانی از مجهول استفاده می کنیم که کننده کار برای ما اهمیت زیادی ندارد یا ناشناخته است.","ex":[{"e":"This book was written by a famous author.","p":"این کتاب توسط یک نویسنده مشهور نوشته شده است."},{"e":"My bike was stolen last week.","p":"دوچرخه من هفته پیش دزدیده شد."}]},{"h":"Passive in different tenses","b":"You can make different tenses passive, such as simple present, simple past, and future. Simply change the helping verb to be to match the tense and add the past participle.","hf":"مجهول در زمان های مختلف","bf":"ما می توانیم زمان های مختلف (حال ساده، گذشته ساده، آینده و غیره) را مجهول کنیم. کافی است فعل کمکی be را به آن زمان ببریم و بعد از آن قسمت سوم فعل (p.p.) را بیاوریم.","ex":[{"e":"New houses are being built in our area.","p":"خانه های جدیدی در منطقه ما در حال ساخت هستند."},{"e":"The report will be finished tomorrow.","p":"گزارش فردا تمام خواهد شد."}]}],"tip":"Passive voice is used much more frequently in English than in Persian, especially when the doer is unclear.","tipf":"در زبان فارسی هم مجهول داریم، اما در انگلیسی مجهول کاربرد خیلی بیشتری دارد، مخصوصاً وقتی کننده کار مشخص نیست.","bad":[{"b":"English is speak all over the world.","g":"English is spoken all over the world.","w":"You must always use the past participle after to be, not the base form of the verb.","wf":"بعد از فعل To Be همیشه باید از قسمت سوم فعل (p.p) استفاده کنید، نه شکل ساده فعل."},{"b":"The window was break by Tom.","g":"The window was broken by Tom.","w":"The past participle of break is broken, not break.","wf":"قسمت سوم فعل break می شود broken، نه break."},{"b":"This letter write yesterday.","g":"This letter was written yesterday.","w":"You need the verb to be (was or were) to form the simple past passive.","wf":"برای ساختن مجهول گذشته ساده، حتماً به فعل To Be (was/were) نیاز دارید."}],"gold":[{"e":"Always ensure the verb to be agrees with the subject in number and tense.","f":"همیشه مطمئن شوید که فعل to be از نظر تعداد و زمان با فاعل مطابقت دارد."},{"e":"Remember that the past participle is essential for forming any passive construction.","f":"به یاد داشته باشید که قسمت سوم فعل برای ساخت هر نوع مجهول ضروری است."},{"e":"Use the passive voice when the focus is on the action rather than the doer.","f":"از حالت مجهول استفاده کنید وقتی تمرکز بر روی عمل است نه روی انجام دهنده."},{"e":"Check that the past participle matches the verb's irregular or regular pattern correctly.","f":"بررسی کنید که قسمت سوم فعل به درستی الگوی نامنظم یا منظم آن را دنبال می‌کند."}]},{"lv":"I","title":"The Passive (2): modals and gerunds","exp":[{"h":"Passive structure with modals","b":"To form the passive voice with modal verbs like must, should, or can, you use the formula modal plus be plus the past participle. This structure shows that the action is done to the subject rather than by it.","hf":"ساختار مجهول با افعال مدال","bf":"برای ساختن مجهول با افعال مدال (مثل must, should, can)، از فرمول 'مدال + be + اسم مفعول سوم' استفاده می‌کنیم. این ساختار نشان می‌دهد که کار روی فاعل انجام می‌شود، نه توسط او.","ex":[{"e":"The work must be done.","p":"باید کار انجام شود."},{"e":"The door should be locked.","p":"باید در قفل شود."}]},{"h":"Using being done for ongoing processes","b":"When you want to say that an action is currently happening, you use being plus the past participle. This is often used after modal verbs or to describe a current state.","hf":"استفاده از being done برای فرآیند جاری","bf":"وقتی می‌خواهیم بگوییم کاری در حال انجام شدن است (فرآیند جاری)، از 'being + اسم مفعول سوم' استفاده می‌کنیم. این معمولاً بعد از افعال مدال یا برای توصیف وضعیت فعلی به کار می‌رود.","ex":[{"e":"The road is being repaired.","p":"جاده در حال تعمیر است."},{"e":"The cake must be being baked.","p":"کیک باید در حال پختن باشد."}]},{"h":"Using been done for the past","b":"To refer to an action that has already been completed in the past, you use been plus the past participle. This structure is typically used after modal verbs or in perfect tenses.","hf":"استفاده از been done برای گذشته","bf":"برای اشاره به کاری که در گذشته انجام شده است (مجهول کامل)، از 'been + اسم مفعول سوم' استفاده می‌کنیم. این ساختار معمولاً بعد از افعال مدال یا در زمان‌های کامل به کار می‌رود.","ex":[{"e":"The letter has been sent.","p":"نامه ارسال شده است."},{"e":"The work must have been done.","p":"باید کار انجام شده باشد."}]}],"tip":"Remember that after modal verbs, always use the base form of be, not being or been, unless the tense of the sentence is different.","tipf":"به یاد داشته باشید که بعد از افعال مدال همیشه از شکل ساده 'be' استفاده کنید، نه 'being' یا 'been'، مگر اینکه زمان جمله متفاوت باشد.","bad":[{"b":"The work must done.","g":"The work must be done.","w":"The be verb is missing in the passive construction with the modal.","wf":"در مجهول با مدال، فعل 'be' فراموش شده است."},{"b":"The road is being repaireded.","g":"The road is being repaired.","w":"Repair is not an irregular verb and does not take ed; its third form is repaired.","wf":"فعل repair یک فعل منظم نیست و 'ed' نمی‌گیرد؛ شکل سوم آن 'repaired' است."},{"b":"The letter has been sented.","g":"The letter has been sent.","w":"Send is an irregular verb, and its third form is sent, not sended.","wf":"فعل send یک فعل بی‌قاعده است و شکل سوم آن 'sent' است، نه 'sended'."}],"gold":[{"e":"Always follow modal verbs with be plus the past participle for the passive voice.","f":"همیشه بعد از افعال مدال برای مجهول از be به همراه فعل سوم استفاده کنید."},{"e":"Use being plus the past participle to emphasize that an action is currently in progress.","f":"برای تأکید بر اینکه یک عمل در حال انجام است، از being به همراه فعل سوم استفاده کنید."},{"e":"Use been plus the past participle to indicate that an action has been completed.","f":"برای نشان دادن اینکه یک عمل انجام شده است، از been به همراه فعل سوم استفاده کنید."}]},{"lv":"I","title":"Passive 2: two objects, it is said that, by + agent","exp":[{"h":"Passive with Two Objects","b":"Some verbs in English, like give or send, can take two objects: a direct object (the thing) and an indirect object (the person). In the passive voice, you can choose which object becomes the subject. It is often clearer to make the person the subject, but both are grammatically correct.","hf":"مجهول با دو مفعول","bf":"برخی افعال در انگلیسی، مانند give یا send، می‌توانند دو مفعول داشته باشند: یک مفعول مستقیم (چیز) و یک مفعول غیرمستقیم (شخص). در حالت مجهول، می‌توانید انتخاب کنید که کدام مفعول به فاعل تبدیل شود. معمولاً طبیعی‌تر است که شخص را فاعل قرار دهید، اما هر دو از نظر دستوری صحیح هستند.","ex":[{"e":"They gave me a gift.","p":"آن‌ها به من یک هدیه دادند."},{"e":"A gift was given to me.","p":"یک هدیه به من داده شد."}]},{"h":"Using 'It is said that'","b":"We often use passive reporting verbs like 'say', 'believe', or 'think' with 'it' as a dummy subject. This structure is very common in news and formal writing. The pattern is 'It is + past participle + that + clause'. It allows you to report information without specifying who said it.","hf":"استفاده از 'It is said that'","bf":"ما اغلب از افعال گزارش‌دهنده مجهول مانند 'say'، 'believe' یا 'think' با 'it' به عنوان فاعل صوری استفاده می‌کنیم. این ساختار در اخبار و نوشتار رسمی بسیار رایج است. الگو به صورت 'It is + past participle + that + clause' است. این ساختار به شما اجازه می‌دهد اطلاعات را گزارش دهید بدون اینکه مشخص کنید چه کسی آن را گفته است.","ex":[{"e":"It is said that he is rich.","p":"گفته می‌شود که او ثروتمند است."},{"e":"It is believed that the project will succeed.","p":"باور بر این است که پروژه موفق خواهد شد."}]},{"h":"The Agent in Passive Sentences","b":"When you want to mention who performed the action, you use the preposition 'by'. This is called the agent. You only need to include the agent if it is important or unknown. If the agent is obvious, you can omit it to make the sentence more concise.","hf":"فاعل (انجام‌دهنده) در جملات مجهول","bf":"وقتی می‌خواهید اشاره کنید که چه کسی عمل را انجام داده است، از حرف اضافه 'by' استفاده می‌کنید. به این شخص یا چیز انجام‌دهنده، فاعل یا عامل می‌گویند. شما فقط زمانی نیاز دارید که فاعل را ذکر کنید که اطلاعات آن مهم یا جدید باشد. اگر فاعل واضح یا بی‌اهمیت است، می‌توانید آن را حذف کنید تا جمله مختصرتر شود.","ex":[{"e":"The book was written by J.K. Rowling.","p":"کتاب توسط جی.کی. رولینگ نوشته شد."},{"e":"The window was broken by the wind.","p":"پنجره توسط باد شکسته شد."}]}],"tip":"When using passive reporting verbs, remember that 'it' is the subject, so the verb must agree with 'it' (e.g., 'It is said', not 'They are said').","tipf":"هنگام استفاده از افعال گزارش‌دهنده مجهول، به یاد داشته باشید که 'it' فاعل است، بنابراین فعل باید با 'it' مطابقت داشته باشد (مثلاً 'It is said'، نه 'They are said').","bad":[{"b":"He was given a book by me.","g":"A book was given to him by me.","w":"While grammatically possible, Persian speakers often overuse the personal passive when the thing received is more important. The thing-focused passive is often more natural in English.","wf":"اگرچه از نظر دستوری ممکن است، اما فارسی‌زبانان اغلب وقتی مایلند روی شیء دریافت‌شده تمرکز کنند، از مجهول شخصی استفاده می‌کنند. در حالی که ساختار مجهولِ متمرکز بر شیء معمولاً در انگلیسی طبیعی‌تر به نظر می‌رسد."},{"b":"It is said that he is rich man.","g":"It is said that he is a rich man.","w":"In English, singular countable nouns usually need an article. 'Man' is a singular countable noun, so it needs 'a'.","wf":"در انگلیسی، اسامی شمارش‌پذیر مفرد معمولاً نیاز به حرف تعریف دارند. کلمه 'man' یک اسم شمارش‌پذیر مفرد است، بنابراین به حرف تعریف 'a' نیاز دارد."},{"b":"The cake was eaten by I.","g":"The cake was eaten by me.","w":"After the preposition 'by', you must use the object pronoun (me, him, her), not the subject pronoun (I, he, she).","wf":"بعد از حرف اضافه 'by'، باید از ضمایر مفعولی (me, him, her) استفاده کنید، نه ضمایر فاعلی (I, he, she)."}],"gold":[{"e":"Passive voice shifts focus from the doer to the receiver of the action.","f":"حالت مجهول، تمرکز را از انجام‌دهنده به دریافت‌کننده عمل منتقل می‌کند."},{"e":"Use 'by' to introduce the agent in a passive sentence.","f":"برای معرفی انجام‌دهنده عمل در جمله مجهول، از 'by' استفاده کنید."},{"e":"'It is said that' is a fixed structure for reporting general opinions.","f":"عبارت 'It is said that' یک ساختار ثابت برای گزارش دادن نظرات عمومی است."}]},{"lv":"A","title":"Passive with reporting verbs: it is said that / he is believed to","exp":[{"h":"Reporting Passive: It is said that","b":"When we want to report what people say about a general fact, we use 'It is said that'. This structure is very common in news and formal writing. It allows you to present information without specifying who said it.","hf":"مجهول با افعال گزارش: گفته می‌شود که","bf":"وقتی می‌خواهیم درباره یک واقعیت عمومی که مردم درباره آن صحبت می‌کنند گزارش دهیم، از 'It is said that' استفاده می‌کنیم. این ساختار در اخبار و نوشته‌های رسمی بسیار رایج است. به شما اجازه می‌دهد اطلاعات را بدون مشخص کردن گوینده ارائه دهید.","ex":[{"e":"It is said that the company is expanding.","p":"گفته می‌شود که شرکت در حال گسترش است."},{"e":"It is believed that he lives in London.","p":"باور بر این است که او در لندن زندگی می‌کند."}]},{"h":"Reporting Passive: He is believed to","b":"You can also use the structure 'Subject + is believed to + infinitive'. This is more direct and focuses on the person or thing being talked about. It is a more advanced and elegant way to report information.","hf":"مجهول با افعال گزارش: او باور می‌شود که","bf":"شما همچنین می‌توانید از ساختار 'Subject + is believed to + infinitive' استفاده کنید. این روش مستقیم‌تر است و روی فرد یا چیزی که درباره آن صحبت می‌شود تمرکز دارد. این یک روش پیشرفته‌تر و روان‌تر برای گزارش اطلاعات است.","ex":[{"e":"He is believed to be the best player.","p":"باور بر این است که او بهترین بازیکن است."},{"e":"The money is said to be hidden in the garden.","p":"گفته می‌شود که پول در باغ مخفی شده است."}]},{"h":"Common Reporting Verbs","b":"Besides 'said' and 'believed', we often use 'thought', 'known', and 'reported'. These verbs help us describe public opinion or general knowledge. They are all used in the same passive structure.","hf":"افعال گزارش رایج","bf":"علاوه بر 'said' و 'believed'، ما اغلب از 'thought'، 'known' و 'reported' استفاده می‌کنیم. این افعال به ما کمک می‌کنند تا نظر عمومی یا دانش عمومی را توصیف کنیم. همه آن‌ها در همین ساختار مجهول استفاده می‌شوند.","ex":[{"e":"She is thought to have left the country.","p":"فکر می‌شود که او کشور را ترک کرده است."},{"e":"The building is known to be very old.","p":"شناخته شده است که این ساختمان بسیار قدیمی است."}]}],"tip":"Remember to use the correct form of the infinitive (to be, to have been) depending on whether the action is current or in the past.","tipf":"به یاد داشته باشید که بسته به اینکه عمل مربوط به حال است یا گذشته، از شکل صحیح مصدر (to be، to have been) استفاده کنید.","bad":[{"b":"He is believed that he is rich.","g":"He is believed to be rich.","w":"After 'believed', we use the infinitive structure, not a 'that' clause when the subject is the person.","wf":"بعد از 'believed'، وقتی فاعل شخص است، از ساختار مصدری استفاده می‌کنیم، نه جملهواره با 'that'."},{"b":"It is said he is a good teacher.","g":"It is said that he is a good teacher.","w":"In formal English, 'that' is usually kept after 'said' in this structure, though it can be omitted in very informal speech.","wf":"در انگلیسی رسمی، معمولاً بعد از 'said' در این ساختار 'that' حفظ می‌شود، هرچند در گفتار بسیار غیررسمی می‌توان آن را حذف کرد."},{"b":"She is known to be working there.","g":"She is known to work there.","w":"We usually use the simple infinitive for general facts, not the continuous form.","wf":"ما معمولاً برای حقایق کلی از مصدر ساده استفاده می‌کنیم، نه شکل مستمر."}],"gold":[{"e":"Use 'It is said that' for general reports and 'He is said to' for specific subjects.","f":"برای گزارش‌های کلی از 'It is said that' و برای فاعل‌های خاص از 'He is said to' استفاده کنید."},{"e":"The verb 'believe' is often used to express opinion about someone's character or actions.","f":"فعل 'believe' اغلب برای بیان نظر درباره شخصیت یا اقدامات کسی استفاده می‌شود."},{"e":"Ensure the subject of the main clause matches the person being reported about.","f":"مطمئن شوید که فاعل جمله اصلی با شخصی که درباره او گزارش داده می‌شود مطابقت دارد."}]},{"lv":"A","title":"get-passive, need + -ing, be supposed to","exp":[{"h":"The 'Get' Passive for Changes of State","b":"We often use 'get' instead of 'be' in the passive voice to talk about events or changes of state, especially in informal speech. It sounds more dynamic and focuses on the result of an action rather than the action itself. For example, you might say 'He got fired' instead of 'He was fired'.","hf":"مجهول با 'get' برای تغییرات وضعیت","bf":"ما اغلب در گفتار غیررسمی به جای 'be' از 'get' در حالت مجهول استفاده می‌کنیم تا درباره رویدادها یا تغییرات وضعیت صحبت کنیم. این ساختار پویاتر به نظر می‌رسد و بر نتیجه یک عمل تمرکز دارد نه خود عمل. برای مثال، می‌توانید به جای 'او اخراج شد' (با be) بگویید 'او اخراج شد' (با get).","ex":[{"e":"She got promoted last week.","p":"او هفته گذشته ارتقا پیدا کرد."},{"e":"The window got broken during the storm.","p":"پنجره در طول طوفان شکست."}]},{"h":"Need + Gerund for Passive Meaning","b":"When you say something 'needs doing', it means it needs to be done by someone. This is a common way to express passive meaning without using the word 'by'. It is very useful for describing tasks or maintenance.","hf":"فعل Need + اسم مصدر (Gerund) برای معنای مجهول","bf":"وقتی می‌گویید چیزی 'نیاز به انجام دارد' (needs doing)، یعنی لازم است کسی آن را انجام دهد. این یک روش رایج برای بیان معنای مجهول بدون استفاده از کلمه 'توسط' است. این ساختار برای توصیف کارها یا تعمیرات و نگهداری بسیار مفید است.","ex":[{"e":"Your hair needs cutting.","p":"موهای تو نیاز به کوتاه شدن دارد."},{"e":"The house needs cleaning.","p":"خانه نیاز به تمیز شدن دارد."}]},{"h":"Be Supposed To for Expectations","b":"Use 'be supposed to' to talk about what is expected, required, or planned to happen. It can refer to rules, schedules, or general expectations. It is different from 'should' because it often implies an external rule or plan.","hf":"ساختار Be Supposed To برای انتظارات و الزامات","bf":"از 'be supposed to' برای صحبت درباره آنچه انتظار می‌رود، لازم است یا برنامه‌ریزی شده است استفاده کنید. این ساختار می‌تواند به قوانین، برنامه‌ها یا انتظارات عمومی اشاره داشته باشد. این با 'should' متفاوت است زیرا اغلب به یک قانون یا برنامه خارجی اشاره دارد.","ex":[{"e":"You are supposed to arrive on time.","p":"تو قرار است سر وقت برسی."},{"e":"The train is supposed to leave at 5 PM.","p":"قطار قرار است ساعت ۵ عصر حرکت کند."}]}],"tip":"Remember that 'get' passive is more informal than 'be' passive, and 'need + -ing' is a concise way to express passive necessity.","tipf":"به یاد داشته باشید که مجهول با 'get' غیررسمی‌تر از مجهول با 'be' است و ساختار 'need + -ing' راهی مختصر برای بیان ضرورت به شکل مجهول است.","bad":[{"b":"The car needs to wash.","g":"The car needs washing.","w":"After 'need', we use the gerund (-ing) for passive meaning, not the infinitive with 'to'.","wf":"بعد از 'need'، برای بیان معنای مجهول از اسم مصدر (-ing) استفاده می‌کنیم، نه از مصدر با 'to'."},{"b":"He got fired by his boss yesterday.","g":"He got fired yesterday.","w":"When using 'get' passive for sudden events, we often omit the 'by' phrase because the focus is purely on the result or event itself.","wf":"وقتی از مجهول 'get' برای رویدادها استفاده می‌کنیم، اغلب عبارت 'توسط' را حذف می‌کنیم تا تمرکز کاملاً روی خود رویداد یا نتیجه باشد."},{"b":"You suppose to call him.","g":"You are supposed to call him.","w":"The structure 'be supposed to' requires the verb 'to be' (am/is/are/was/were) before 'supposed'.","wf":"ساختار 'be supposed to' حتماً قبل از 'supposed' به فعل 'to be' (am/is/are/was/were) نیاز دارد."}],"gold":[{"e":"Use 'get' passive for informal, dynamic changes of state.","f":"از مجهول 'get' برای تغییرات وضعیت غیررسمی و پویا استفاده کنید."},{"e":"Use 'need + -ing' to mean 'needs to be done'.","f":"از ساختار 'need + -ing' به معنای 'نیاز به انجام شدن' استفاده کنید."},{"e":"Use 'be supposed to' for expectations, rules, or plans.","f":"از 'be supposed to' برای انتظارات، قوانین یا برنامه‌ها استفاده کنید."}]}],"ex":[{"t":"gap","q":"The letter ___ (write) by John yesterday.","key":["was written"],"why":"Past Simple passive: was/were + past participle."},{"t":"gap","q":"The cake ___ (eat) by the children.","key":["was eaten"],"why":"Past Simple passive: was/were + past participle."},{"t":"fix","q":"The book is write by her.","key":["The book is written by her."],"why":"Present Simple passive requires 'is/are' + past participle."},{"t":"gap","q":"The window ___ (break) by the ball.","key":["was broken"],"why":"Past Simple passive: was/were + past participle."},{"t":"fa","q":"نامه دیروز نوشته شد.","key":["The letter was written yesterday."],"why":"Past Simple passive translation."},{"t":"gap","q":"The room ___ (clean) every day.","key":["is cleaned"],"why":"Present Simple passive: is/are + past participle."},{"t":"fix","q":"The car has been repair by the mechanic.","key":["The car has been repaired by the mechanic."],"why":"Present Perfect passive requires 'has/have been' + past participle."},{"t":"gap","q":"The project must ___ (finish) by Friday.","key":["be finished"],"why":"Passive with modals: modal + be + past participle."},{"t":"fa","q":"این کار باید انجام شود.","key":["This work must be done."],"why":"Passive with modal 'must' translation."},{"t":"gap","q":"The house is ___ (build) right now.","key":["being built"],"why":"Present Continuous passive: is/are + being + past participle."},{"t":"gap","q":"I enjoy ___ (watch) by the audience.","key":["being watched"],"why":"Passive gerund after preposition/verb: being + past participle."},{"t":"fix","q":"The package has been deliver to my house.","key":["The package has been delivered to my house."],"why":"Present Perfect passive requires 'has/have been' + past participle."},{"t":"gap","q":"The new policy ___ (say) to have improved employee morale significantly.","key":["is said"],"why":"Reporting passive structure for present belief/opinion."},{"t":"gap","q":"She ___ (believe) to be the most talented musician in the orchestra.","key":["is believed"],"why":"Reporting passive structure for present belief."},{"t":"gap","q":"The bridge ___ (build) by a team of engineers last year.","key":["was built"],"why":"Standard passive with agent 'by' for past action."},{"t":"gap","q":"The manager gave the employee a bonus; the bonus ___ (give) to him.","key":["was given"],"why":"Passive with two objects: the second object becomes the subject."},{"t":"fix","q":"The window got broken by the wind.","key":["The window got broken by the wind."],"why":"Correct get-passive for a change of state; no error found, but verifying structure."},{"t":"fix","q":"This room needs painting.","key":["This room needs painting."],"why":"Correct use of 'need + gerund' for passive meaning."},{"t":"fa","q":"می‌گویند که او بسیار ثروتمند است.","key":["It is said that he is very wealthy."],"why":"Standard reporting passive translation."},{"t":"fa","q":"او باید به جلسه می‌رسید.","key":["He was supposed to arrive at the meeting."],"why":"Passive expectation structure 'be supposed to'."}]},{"id":"t24","t":"Reported Speech and Reporting Verbs","tf":"نقل قول","parts":[{"lv":"I","title":"Reported Speech","exp":[{"h":"Shifting Tenses in Reported Speech","b":"When the main verb is in the past, like said, the verbs inside the reported speech usually shift one step back. Simple present becomes simple past, and simple past becomes past perfect.","hf":"تغییر زمان‌ها در نقل قول (Backshift)","bf":"وقتی فعل جمله اصلی در زمان گذشته است (مثل said)، زمان فعل‌های داخل نقل قول معمولاً یک قدم به عقب می‌روند. حال ساده به گذشته ساده و گذشته ساده به گذشته کامل تبدیل می‌شود.","ex":[{"e":"He said, \"I am tired.\" -> He said that he was tired.","p":"او گفت: «من خسته‌ام.» -> او گفت که خسته است."},{"e":"She said, \"I bought a car.\" -> She said that she had bought a car.","p":"او گفت: «من یک ماشین خریدم.» -> او گفت که یک ماشین خریده بود."}]},{"h":"Difference Between Say and Tell","b":"After the verb tell, you must include the person you are speaking to, but after say, you do not use an object. Therefore, you always say tell me, but say to me.","hf":"تفاوت بین Say و Tell","bf":"بعد از فعل tell حتماً باید مفعول (شخصی که با او صحبت می‌شود) بیاید، اما بعد از say مفعول نمی‌آوریم. بنابراین همیشه می‌گوییم tell me اما say to me.","ex":[{"e":"He told me that he was busy.","p":"او به من گفت که مشغول است."},{"e":"He said that he was busy.","p":"او گفت که مشغول است."}]},{"h":"Changing Time and Place Adverbs","b":"In reported speech, time and place adverbs change according to the new context. The word today becomes that day, and tomorrow becomes the next day.","hf":"تغییر قیدهای زمان و مکان","bf":"در نقل قول غیرمستقیم، قیدهای زمان و مکان با توجه به موقعیت جدید تغییر می‌کنند. کلمه today به that day و tomorrow به the next day تبدیل می‌شوند.","ex":[{"e":"He said, \"I will call you today.\" -> He said he would call me that day.","p":"او گفت: «امروز به تو زنگ می‌زنم.» -> او گفت که آن روز به من زنگ خواهد زد."},{"e":"She said, \"I saw him here.\" -> She said she had seen him there.","p":"او گفت: «من او را اینجا دیدم.» -> او گفت که او را آنجا دیده است."}]}],"tip":"In reported speech, quotation marks are removed, and the word that is sometimes optional.","tipf":"در نقل قول غیرمستقیم، استفاده از علامت نقل قول (\" \") حذف می‌شود و گاهی آوردن کلمه that اختیاری است.","bad":[{"b":"He told to me that he was happy.","g":"He told me that he was happy.","w":"You should not use the preposition to after told.","wf":"بعد از told نباید حرف اضافه to بیاید."},{"b":"She said me a story.","g":"She told me a story.","w":"To address the person (the object), you must use told, not say.","wf":"برای گفتن به شخص (مفعول)، باید از told استفاده کنید نه say."},{"b":"He said that I am tired.","g":"He said that he was tired.","w":"The verb tense should not remain in the present, and the pronoun must change from I to he.","wf":"زمان فعل نباید حال بماند و ضمیر نیز باید از I به he تغییر کند."}],"gold":[{"e":"Always remember to shift the tense back when the reporting verb is in the past.","f":"همیشه به خاطر داشته باشید که وقتی فعل گزارش‌دهنده در گذشته است، زمان فعل را یک مرحله به عقب ببرید."},{"e":"Use tell with an object and say without one, or use say with to.","f":"از tell با مفعول و از say بدون مفعول استفاده کنید، یا از say با to استفاده کنید."},{"e":"Change time and place words like today to that day when reporting.","f":"کلمات زمان و مکان مثل امروز را به آن روز تغییر دهید وقتی گزارش می‌دهید."}]},{"lv":"I","title":"Reported speech 2: questions and commands","exp":[{"h":"Reporting Yes/No Questions","b":"When we report a yes/no question, we use 'if' or 'whether' to connect the clauses. Notice that the word order changes from question format to statement format, and we do not use 'do', 'does', or 'did' in the reported clause. This makes the sentence flow smoothly as a statement.","hf":"نقل قول سوالات بله/خیر","bf":"وقتی یک سوال بله/خیر را نقل قول می‌کنیم، از 'if' یا 'whether' برای اتصال بندها استفاده می‌کنیم. توجه کنید که ترتیب کلمات از حالت سوالی به حالت خبری تغییر می‌کند و در بند نقل‌شده از 'do'، 'does' یا 'did' استفاده نمی‌کنیم. این کار باعث می‌شود جمله به عنوان یک جمله خبری به روانی جریان یابد.","ex":[{"e":"She asked if I liked coffee.","p":"او پرسید که آیا من قهوه دوست دارم."},{"e":"He wondered whether we were coming.","p":"او تعجب کرد که آیا ما داریم می‌آییم یا نه."}]},{"h":"Reporting Wh- Questions","b":"For questions starting with words like 'what', 'where', or 'how', we keep the question word in the reported speech. The structure follows the pattern: subject + verb, just like a normal statement. It is important to remember that the auxiliary verbs change according to the tense shift rules.","hf":"نقل قول سوالات Wh-","bf":"برای سوالاتی که با کلماتی مانند 'what'، 'where' یا 'how' شروع می‌شوند، کلمه پرسشی را در نقل قول حفظ می‌کنیم. ساختار از الگوی فاعل + فعل پیروی می‌کند، درست مانند یک جمله خبری معمولی. مهم است به یاد داشته باشیم که افعال کمکی بر اساس قوانین تغییر زمان، تغییر می‌کنند.","ex":[{"e":"She asked where I lived.","p":"او پرسید که کجا زندگی می‌کنم."},{"e":"He asked how I knew the answer.","p":"او پرسید که چگونه جواب را می‌دانستم."}]},{"h":"Reporting Commands and Requests","b":"To report a command or request, we use the structure 'tell/ask + object + to + infinitive'. For negative commands, we simply add 'not' before the infinitive. This is much simpler than using 'that' clauses and is very common in daily conversation.","hf":"نقل قول دستورات و درخواست‌ها","bf":"برای نقل قول یک دستور یا درخواست، از ساختار 'tell/ask + مفعول + to + مصدر' استفاده می‌کنیم. برای دستورات منفی، کافی است 'not' را قبل از مصدر اضافه کنیم. این روش بسیار ساده‌تر از استفاده از بندهای 'that' است و در مکالمات روزمره بسیار رایج می‌باشد.","ex":[{"e":"She told me to sit down.","p":"او به من گفت بنشینم."},{"e":"He asked her not to be late.","p":"او از او خواست که دیر نکند."}]}],"tip":"Always check if the reporting verb is in the past tense; if so, the verb in the reported clause usually moves one step back in time.","tipf":"همیشه بررسی کنید که آیا فعل گزارش‌دهنده در زمان گذشته است یا خیر؛ اگر چنین است، فعلِ بندِ نقل‌شده معمولاً یک گام به گذشته برمی‌گردد.","bad":[{"b":"She asked did I like coffee.","g":"She asked if I liked coffee.","w":"We do not use auxiliary verbs like 'did' in reported questions.","wf":"ما در سوالات نقل‌قولی از افعال کمکی مانند 'did' استفاده نمی‌کنیم."},{"b":"He told me go to the store.","g":"He told me to go to the store.","w":"After 'tell' and 'ask', we need 'to' before the verb for commands.","wf":"بعد از 'tell' و 'ask'، برای دستورات به 'to' قبل از فعل نیاز داریم."},{"b":"She asked where is the station.","g":"She asked where the station was.","w":"The word order must be subject + verb, not question order.","wf":"ترتیب کلمات باید فاعل + فعل باشد، نه ترتیب سوالی."}],"gold":[{"e":"Use 'if' or 'whether' for yes/no questions in reported speech.","f":"برای سوالات بله/خیر در نقل قول از 'if' یا 'whether' استفاده کنید."},{"e":"Keep the question word for Wh- questions but change the word order to subject + verb.","f":"برای سوالات Wh- کلمه پرسشی را نگه دارید اما ترتیب کلمات را به فاعل + فعل تغییر دهید."},{"e":"Use 'to + infinitive' for positive commands and 'not to + infinitive' for negative commands.","f":"برای دستورات مثبت از 'to + مصدر' و برای دستورات منفی از 'not to + مصدر' استفاده کنید."}]},{"lv":"A","title":"Reporting Verbs and Complex Passives","exp":[{"h":"Reporting Verbs and Complex Passives","b":"In advanced English, we use passive structures like is believed or is said to express common beliefs or general opinions. This approach makes your writing sound more formal and objective compared to saying People believe that.","hf":"ساختار مجهول با افعال گزارش‌دهنده","bf":"در انگلیسی پیشرفته، برای بیان باور، گفته یا باور عمومی از ساختارهای مجهولی مانند 'is believed' یا 'is said' استفاده می‌شود. این ساختارها به جای استفاده از 'People believe that...' برای رسمی‌تر کردن متن کاربرد دارند.","ex":[{"e":"The president is believed to be ill.","p":"رئیس‌جمهور را مریض می‌دانند."},{"e":"The money is said to be hidden.","p":"می‌گویند پول مخفی شده است."}]},{"h":"Refuse and Advise Patterns in Passive","b":"Verbs such as refuse and advise can also appear in these passive structures. The key rule is that you must always follow these passive verbs with an infinitive using to.","hf":"الگوی Refuse و Advise در مجهول","bf":"افعالی مانند refuse (امتناع کردن) و advise (مشورت کردن) نیز می‌توانند در این ساختارها بیایند. نکته مهم این است که بعد از این افعال مجهول، همیشه از مصدر با to (to-infinitive) استفاده می‌شود.","ex":[{"e":"He refused to sign the document.","p":"او از امضای سند امتناع کرد."},{"e":"She is advised to rest.","p":"به او توصیه شده است که استراحت کند."}]},{"h":"Common Use in News and Reports","b":"These structures are very common in news and reports to share information without naming a specific source. This method allows the writer to appear neutral and unbiased.","hf":"کاربرد رایج در اخبار و گزارش‌ها","bf":"این ساختارها به ویژه در اخبار و متون خبری برای گزارش دادن اطلاعات بدون ذکر منبع قطعی بسیار رایج هستند. این روش به نویسنده اجازه می‌دهد تا بی‌طرف به نظر برسد.","ex":[{"e":"The deal is expected to fail.","p":"انتظار می‌رود که این معامله شکست بخورد."},{"e":"It is thought that prices will rise.","p":"این تصور می‌شود که قیمت‌ها افزایش خواهند یافت."}]}],"tip":"Remember that after passive reporting verbs like believe or say, you must always use to plus the main verb.","tipf":"به یاد داشته باشید که بعد از افعالی مثل believe یا say در حالت مجهول، همیشه از to + فعل اصلی استفاده کنید.","bad":[{"b":"He is believed that he is rich.","g":"He is believed to be rich.","w":"You should not use that in this structure; instead, use the infinitive with to.","wf":"در این ساختار نباید از that استفاده کرد، بلکه باید از مصدر با to استفاده شود."},{"b":"She is advised resting.","g":"She is advised to rest.","w":"After advise in the passive form, you must use the infinitive with to, not a gerund.","wf":"بعد از advise در حالت مجهول، باید از مصدر با to استفاده شود، نه gerund."},{"b":"The money is said being stolen.","g":"The money is said to have been stolen.","w":"To express the past, you need to use the perfect infinitive with to have plus the past participle.","wf":"برای بیان گذشته، باید از perfect infinitive (to have + p.p) استفاده کنید."}],"gold":[{"e":"Always use to plus the base verb after passive reporting verbs.","f":"همیشه بعد از افعال گزارش‌دهنده مجهول، to را به همراه فعل اصلی به کار ببرید."},{"e":"Never use that after these passive structures.","f":"هرگز بعد از این ساختارهای مجهول از that استفاده نکنید."},{"e":"Use to have plus the past participle to show past actions.","f":"برای نشان دادن اقدامات گذشته، از to have به همراه فعل گذشته سوم استفاده کنید."}]},{"lv":"A","title":"Reported speech 3: distancing (would / should / might)","exp":[{"h":"Using 'would' for past habits","b":"We use 'would' to talk about repeated actions in translucence of the past, similar to 'used to'. It helps us sound more natural when describing old routines in reported speech.","hf":"استفاده از 'would' برای عادات گذشته","bf":"ما از 'would' برای صحبت درباره کارهای تکراری در گذشته استفاده می‌کنیم، مشابه 'used to'. این به ما کمک می‌کند وقتی عادات گذشته را در نقل قول بیان می‌کنیم، طبیعی‌تر به نظر برسیم.","ex":[{"e":"She said she would play tennis every Sunday.","p":"او گفت که (هر) یکشنبه تنیس بازی می‌کرد."},{"e":"He told me he would always help his mother.","p":"او به من گفت که همیشه به مادرش کمک می‌کرد."}]},{"h":"Using 'should' for advice or obligation","b":"When reporting advice or duty, 'should' stays the same in reported speech. This is useful for sharing what someone advised or expected us to do.","hf":"استفاده از 'should' برای توصیه یا وظیفه","bf":"هنگام نقل قول توصیه یا وظیفه، کلمه 'should' تغییری نمی‌کند. این ساختار برای انتقال توصیه‌ها یا انتظارات دیگران مفید است.","ex":[{"e":"My boss said I should arrive early.","p":"رئیسم گفت که من باید زودتر برسم."},{"e":"She said he should study harder.","p":"او گفت که او باید بیشتر درس بخواند."}]},{"h":"Using 'might' for possibility","b":"If the original speaker was unsure, we use 'might' to show possibility in reported speech. It makes the statement less certain.","hf":"استفاده از 'might' برای احتمال","bf":"اگر گوینده اصلی مطمئن نبوده باشد، از 'might' برای نشان دادن احتمال در نقل قول استفاده می‌کنیم. این کار باعث می‌شود جمله قطعیکمتری داشته باشد.","ex":[{"e":"He said he might come to the party.","p":"او گفت که شاید به مهمانی بیاید."},{"e":"She said it might rain tomorrow.","p":"او گفت که شاید فردا باران ببارد."}]}],"tip":"Remember that 'would', 'should', and 'might' do not change form in reported speech, unlike other modals.","tipf":"به یاد داشته باشید که برخلاف سایر افعال وجهی، کلمات 'would'، 'should' و 'might' در نقل قول تغییر شکل نمی‌دهند.","bad":[{"b":"She said she would to play tennis.","g":"She said she would play tennis.","w":"We do not use 'to' after 'would'.","wf":"ما بعد از 'would' از 'to' استفاده نمی‌کنیم."},{"b":"He said he should to study harder.","g":"He said he should study harder.","w":"We do not use 'to' after 'should'.","wf":"ما بعد از 'should' از 'to' استفاده نمی‌کنیم."},{"b":"She said she might to come.","g":"She said she might come.","w":"We do not use 'to' after 'might'.","wf":"ما بعد از 'might' از 'to' استفاده نمی‌کنیم."}],"gold":[{"e":"Would, should, and might remain unchanged in reported speech.","f":"کلمات would، should و might در نقل قول بدون تغییر باقی می‌مانند."},{"e":"Use 'would' for past habits in reported speech.","f":"برای بیان عادات گذشته در نقل قول از 'would' استفاده کنید."},{"e":"Use 'might' to show uncertainty in reported speech.","f":"برای نشان دادن عدم قطعیت در نقل قول از 'might' استفاده کنید."}]}],"ex":[{"t":"gap","q":"She said she ___ to the party the night before.","key":["had gone"],"why":"Past Simple shifts to Past Perfect in reported speech when the reporting verb is in the past."},{"t":"gap","q":"He told me that he ___ come to the meeting.","key":["would"],"why":"'Will' changes to 'would' in reported speech."},{"t":"gap","q":"The teacher asked us to move ___ the front of the class.","key":["to"],"why":"'Here' changes to 'there' and 'to' is used for direction in reported speech."},{"t":"gap","q":"She told him that she ___ see him the next day.","key":["would"],"why":"'Will' becomes 'would' in reported speech."},{"t":"gap","q":"He said that he ___ not be able to attend the meeting.","key":["would"],"why":"'Can' changes to 'could' and 'will' changes to 'would' in reported speech."},{"t":"gap","q":"The manager advised us ___ submit the report by Friday.","key":["to"],"why":"The verb 'advise' is followed by an object and an infinitive with 'to'."},{"t":"fix","q":"She said me that she was tired.","key":["She told me that she was tired."],"why":"'Tell' requires an object (me), while 'say' does not."},{"t":"fix","q":"He refused that he would pay the bill.","key":["He refused to pay the bill."],"why":"'Refuse' is followed by an infinitive, not a that-clause."},{"t":"fix","q":"The decision was advised by the committee.","key":["The committee advised the decision."],"why":"'Advise' is not typically used in the passive voice with 'by' in this context; active voice is preferred."},{"t":"fa","q":"او گفت که فردا می‌آید.","key":["He said that he would come tomorrow."],"why":"'Tomorrow' changes to 'the next day' or 'the following day' in reported speech."},{"t":"fa","q":"معلم به ما گفت که ز��دتر بیاییم.","key":["The teacher told us to come earlier."],"why":"'Tell' is used with an object and an infinitive for instructions."},{"t":"fa","q":"او پیشنهاد کرد که ما زودتر برویم.","key":["He advised us to leave earlier."],"why":"'Advise' is followed by an object and an infinitive."},{"t":"gap","q":"The witness stated that he ___ the accident at 8 PM.","key":["saw"],"why":"Past simple 'saw' shifts to past perfect 'had seen' in reported speech, but 'saw' is also acceptable if the time is clear; however, standard rule shifts past simple to past perfect, so 'had seen' is the strict answer. Let's use 'had seen' for strict adherence to tense shifting rule."},{"t":"gap","q":"She asked me where I ___.","key":["was going"],"why":"Past continuous 'was going' remains past continuous in reported speech when the context is past."},{"t":"fix","q":"He told that he was tired.","key":["He told me that he was tired."],"why":"'Tell' requires an object (who was told), whereas 'say' does not."},{"t":"gap","q":"The doctor advised him ___ stop smoking.","key":["to"],"why":"The verb 'advise' is followed by an object and an infinitive with 'to'."},{"t":"fa","q":"او گفت که ممکن است باران ببارد.","key":["He said that it might rain."],"why":"Using 'might' to report possibility in the past."},{"t":"gap","q":"They refused ___ the bill.","key":["to pay"],"why":"The verb 'refuse' is followed by the infinitive with 'to'."},{"t":"fix","q":"She said me she was happy.","key":["She told me she was happy."],"why":"'Tell' is used with an object (me), while 'say' is used without one."},{"t":"fa","q":"معلم به ما گفت که فردا امتحان نداریم.","key":["The teacher told us that we didn't have an exam the next day."],"why":"Shifting present simple to past simple and 'tomorrow' to 'the next day'."}]},{"id":"t25","t":"Conditionals","tf":"جمله‌های شرطی","parts":[{"lv":"B","title":"if I do (first conditional, basic)","exp":[{"h":"Understanding the First Conditional","b":"We use the first conditional to talk about real and possible situations in the future. It connects a condition in the present with a result in the future. You will often use it to make plans or predict outcomes based on current actions.","hf":"درک شرطی نوع اول","bf":"ما از شرطی نوع اول برای صحبت درباره موقعیت‌های واقعی و ممکن در آینده استفاده می‌کنیم. این ساختار یک شرط در زمان حال را به یک نتیجه در آینده متصل می‌کند. شما اغلب از آن برای برنامه‌ریزی یا پیش‌بینی نتایج بر اساس کارهای فعلی استفاده می‌کنید.","ex":[{"e":"If it rains, I will stay home.","p":"اگر باران ببارد، در خانه می‌مانم."},{"e":"If you study hard, you will pass the exam.","p":"اگر سخت درس بخوانی، در امتحان قبول می‌شوی."}]},{"h":"The Structure: If + Present Simple","b":"The structure is simple: 'If' + subject + present simple verb, followed by 'will' + base verb. Remember that the 'if' clause uses the present tense, even though the meaning is future. This is a common point of confusion for learners.","hf":"ساختار: If + حال ساده","bf":"ساختار ساده است: If + فاعل + فعل حال ساده، و به دنبال آن will + فعل پایه. به یاد داشته باشید که عبارت شرطی (if clause) از زمان حال استفاده می‌کند، هرچند معنای آن آینده است. این یک نقطه سردرگمی رایج برای زبان‌آموزان است.","ex":[{"e":"If she calls, I will answer.","p":"اگر او تماس بگیرد، جواب می‌دهم."},{"e":"If we leave now, we will arrive on time.","p":"اگر الان حرکت کنیم، به موقع می‌رسیم."}]},{"h":"Using Commas and Word Order","b":"You can put the 'if' clause first or second. If it comes first, use a comma after it. If it comes second, you usually do not need a comma. Both orders are correct and natural in English.","hf":"استفاده از ویرگول و ترتیب کلمات","bf":"می‌توانید عبارت if را در اول یا دوم جمله بیاورید. اگر در ابتدا بیاید، بعد از آن از ویرگول استفاده کنید. اگر در دوم بیاید، معمولاً به ویرگول نیازی ندارید. هر دو ترتیب در زبان انگلیسی درست و طبیعی هستند.","ex":[{"e":"I will call you if I need help.","p":"اگر به کمک نیاز داشته باشم، به تو زنگ می‌زنم."},{"e":"If I need help, I will call you.","p":"اگر به کمک نیاز داشته باشم، به تو زنگ می‌زنم."}]}],"tip":"Do not use 'will' in the 'if' clause. Say 'If it rains' not 'If it will rain'.","tipf":"در عبارت دارای if از will استفاده نکنید. بگویید «If it rains» و نه «If it will rain».","bad":[{"b":"If it will rain, I will stay home.","g":"If it rains, I will stay home.","w":"We do not use 'will' in the if-clause. Use the present simple instead.","wf":"ما در عبارت شرطی (if-clause) از will استفاده نمی‌کنیم. به جای آن از حال ساده استفاده کنید."},{"b":"If you will study, you will pass.","g":"If you study, you will pass.","w":"The condition part must be in present simple, not future with 'will'.","wf":"بخش شرطی باید به زمان حال ساده باشد، نه آینده با will."},{"b":"I will go if I will have time.","g":"I will go if I have time.","w":"Avoid 'will' in both parts. The if-clause takes present simple.","wf":"از will در هر دو بخش استفاده نکنید. عبارت if زمان حال ساده می‌گیرد."}],"gold":[{"e":"If + present simple, will + base verb.","f":"If + حال ساده، will + فعل پایه."},{"e":"The if-clause describes the condition, and the main clause describes the result.","f":"عبارت if شرط را توصیف می‌کند و عبارت اصلی نتیجه را توصیف می‌کند."},{"e":"Use the first conditional for real possibilities in the future.","f":"از شرطی نوع اول برای امکان‌های واقعی در آینده استفاده کنید."}]},{"lv":"I","title":"Zero and First Conditional","exp":[{"h":"Zero Conditional for General Truths","b":"You use this structure to talk about facts that are always true, like laws of nature or scientific facts. Both parts of the sentence use the present simple tense to show that the result happens every time the condition is met.","hf":"شرطی نوع صفر (Zero Conditional) برای حقیقت‌های کلی","bf":"از این ساختار برای بیان قوانین طبیعت، حقیقت‌های علمی یا چیزهایی که همیشه درست هستند استفاده می‌کنیم. در هر دو بخش جمله از زمان حال ساده (Present Simple) بهره می‌بریم.","ex":[{"e":"If you heat ice, it melts.","p":"اگر یخ را حرارت دهید، آب می‌شود."},{"e":"Plants die if they don't get enough water.","p":"گیاهان می‌میرند اگر آب کافی دریافت نکنند."}]},{"h":"First Conditional for Real Future Possibilities","b":"You use this to describe a real possibility in the future and its likely result. You use the present simple in the if clause and will plus the base verb in the result clause to show what will happen.","hf":"شرطی نوع اول (First Conditional) برای آینده واقعی","bf":"برای صحبت درباره یک احتمال واقعی در آینده و نتیجه محتمل آن به کار می‌رود. در بخش 'if' از زمان حال ساده و در بخش نتیجه از 'will + فعل پایه' استفاده می‌کنیم.","ex":[{"e":"If it rains tomorrow, I will stay at home.","p":"اگر فردا باران ببارد، در خانه خواهم ماند."},{"e":"You will miss the train unless you hurry.","p":"اگر عجله نکنی، قطار را از دست خواهی داد."}]},{"h":"Using Imperatives and Unless","b":"You can use an imperative verb in the result clause instead of will to give a command, suggestion, or advice. The word unless means if not, so it already carries a negative meaning in the condition.","hf":"استفاده از امر (Imperative) در جمله شرطی","bf":"می‌توانیم در بخش نتیجه شرطی نوع اول، به جای 'will' از جمله امری برای دادن دستور، پیشنهاد یا توصیه استفاده کنیم. کلمه 'unless' نیز به معنای 'اگر... نه' (به جز اگر) کاربرد دارد.","ex":[{"e":"If you see Ali, tell him to call me.","p":"اگر علی را دیدی، به او بگو با من تماس بگیرد."},{"e":"Don't open the door unless you know who it is.","p":"در را باز نکن مگر اینکه بدانی چه کسی است."}]}],"tip":"Remember that in English, you never use will after if or unless; always use the present simple tense in the condition part.","tipf":"در زبان فارسی معمولاً در هر دو بخش جمله شرطی از زمان آینده یا حال استفاده می‌کنیم، اما در انگلیسی هرگز بعد از کلماتی مثل if و unless از will استفاده نکنید.","bad":[{"b":"If it will rain, I will stay home.","g":"If it rains, I will stay home.","w":"You should not use will after if in the first conditional; instead, use the present simple tense to show the condition.","wf":"بعد از کلمه if در شرطی نوع اول نباید از will استفاده کنید؛ بلکه از زمان حال ساده بهره ببرید."},{"b":"Unless you won't study, you will fail.","g":"Unless you study, you will fail.","w":"Since unless already means if not, you should not make the verb after it negative, as that would create a double negative.","wf":"کلمه unless خودش منفی است (یعنی اگر... نه)، بنابراین نباید فعل بعد از آن را منفی کنید."},{"b":"If you will see him, give him this.","g":"If you see him, give him this.","w":"Another common mistake is using will after if, but you should always use the present simple tense in that position.","wf":"باز هم اشتباه رایج استفاده از will بعد از if است. در این حالت از زمان حال ساده استفاده کنید."}],"gold":[{"e":"Never use will after if; always use the present simple tense in the condition clause.","f":"هرگز بعد از if از will استفاده نکنید؛ همیشه از زمان حال ساده در بخش شرط استفاده کنید."},{"e":"Unless means if not, so do not add a negative form to the verb that follows it.","f":"کلمه unless به معنای اگر... نه است، بنابراین فعل بعد از آن را منفی نکنید."},{"e":"Use the present simple in the if clause and will or an imperative in the result clause.","f":"از زمان حال ساده در بخش if و از will یا جمله امری در بخش نتیجه استفاده کنید."}]},{"lv":"I","title":"Second and Third Conditional","exp":[{"h":"Second Conditional","b":"You use the second conditional to talk about a present or future situation that is unlikely or imaginary. The structure is if plus the past simple in the condition clause, and would plus the base verb in the result clause. This helps you express a hypothetical scenario that is not currently true.","hf":"شرطی نوع دوم (آینده یا حال غیرمحتمل)","bf":"برای بیان موقعیتی در حال یا آینده که احتمال وقوع آن کم است یا تخیلی است، از ساختار If + Past Simple در بخش شرط و would + فعل ساده در بخش نتیجه استفاده می‌کنیم. این ساختار نشان‌دهنده یک فرض غیرواقع‌گرایانه در زمان حال یا آینده است.","ex":[{"e":"If I had money, I would buy a car.","p":"اگر پول داشتم، یک ماشین می‌خریدم."},{"e":"If she studied harder, she would pass the exam.","p":"اگر بیشتر درس می‌خواند، در امتحان قبول می‌شد."}]},{"h":"Third Conditional","b":"You use the third conditional to discuss a past situation that did not happen and its imagined result. The structure is if plus the past perfect in the condition clause, and would have plus the past participle in the result clause. This is often used to express regret or criticism about a past event.","hf":"شرطی نوع سوم (گذشته‌ی غیرمحتمل)","bf":"برای صحبت درباره موقعیتی در گذشته که اتفاق نیفتاده و نتیجه‌ی آن تغییر کرده بود، از If + Past Perfect در بخش شرط و would have + Past Participle در بخش نتیجه استفاده می‌کنیم. این ساختار معمولاً برای ابراز حسرت یا نقد یک رویداد گذشته به کار می‌رود.","ex":[{"e":"If I had known, I would have helped you.","p":"اگر می‌دانستم، به تو کمک می‌کردم."},{"e":"If they had left earlier, they would have caught the train.","p":"اگر زودتر رفته بودند، قطار را گرفته بودند."}]},{"h":"Time and Usage Difference","b":"The key difference is that the second conditional relates to the present or future, while the third relates to the past. In the second conditional, the verb is in the past simple but refers to now or later, whereas in the third conditional, the past perfect verb refers to the past. Understanding this time distinction is essential for expressing correct hypothetical meanings.","hf":"تفاوت زمانی و کاربرد","bf":"نکته کلیدی این است که نوع دوم مربوط به حال/آینده است و نوع سوم مربوط به گذشته. در نوع دوم فعل شرط Past Simple است اما معنی حال می‌ده��، در حالی که در نوع سوم فعل شرط Past Perfect است و معنی گذشته می‌دهد. این تمایز زمانی برای درک درست حسرت یا فرضیات ضروری است.","ex":[{"e":"If I were you, I would go.","p":"اگر جای تو بودم، می‌رفتم."},{"e":"If I had gone, I would have seen him.","p":"اگر رفته بودم، او را دیده بودم."}]}],"tip":"Remember that in the third conditional, you must always use have before the past participle; many learners forget this have.","tipf":"به یاد داشته باشید که در شرطی نوع سوم، همیشه از have قبل از قسمت سوم فعل (Past Participle) استفاده کنید؛ بسیاری از فارسی‌زبانان این have را فراموش می‌کنند.","bad":[{"b":"If I have money, I would buy a car.","g":"If I had money, I would buy a car.","w":"In the second conditional, the condition clause must use the past simple, not the present simple.","wf":"در شرطی نوع دوم، بخش شرط باید Past Simple باشد، نه Present Simple."},{"b":"If I knew, I would help you.","g":"If I had known, I would have helped you.","w":"When talking about an unreal past, you must use the past perfect in the condition and would have plus the past participle in the result.","wf":"وقتی درباره گذشته صحبت می‌کنیم که اتفاق نیفتاده، باید از Past Perfect در شرط و would have + P.P در نتیجه استفاده کنیم."},{"b":"If she would study, she would pass.","g":"If she studied, she would pass.","w":"You usually do not use would in the condition clause; you should use the past simple instead.","wf":"در بخش شرط (If clause) معمولاً از would استفاده نمی‌کنیم؛ باید از Past Simple استفاده شود."}],"gold":[{"e":"Use the past simple in the if-clause even though it refers to the present or future.","f":"از فعل گذشته ساده در بخش if استفاده کنید، حتی اگر به حال یا آینده اشاره دارد."},{"e":"Always include have in the third conditional result clause to form would have plus the past participle.","f":"همیشه have را در بخش نتیجه شرطی نوع سوم بگنجانید تا would have به همراه فعل گذشته سوم ساخته شود."},{"e":"Do not use would in the if-clause; reserve it for the result clause.","f":"از would در بخش if استفاده نکنید؛ آن را برای بخش نتیجه نگه دارید."}]},{"lv":"I","title":"unless / as long as / provided / in case","exp":[{"h":"Unless: The Negative Condition","b":"Think of 'unless' as 'if not'. It is used to introduce a condition that must not happen for the main result to occur. It is very common in everyday speech to express exceptions.","hf":"مگر اینکه: شرط منفی","bf":"مگر اینکه را می‌توانید به عنوان 'اگر نه' در نظر بگیرید. این کلمه برای معرفی شرطی به کار می‌رود که اگر رخ ندهد، نتیجه اصلی اتفاق می‌افتد. استفاده از آن در گفتگوهای روزمره برای بیان استثناها بسیار رایج است.","ex":[{"e":"We will go to the park unless it rains.","p":"اگر باران نبارد، به پارک می‌رویم."},{"e":"Unless you hurry, you will miss the bus.","p":"مگر اینکه عجله کنی، اتوبوس را از دست می‌دهی."}]},{"h":"As long as / Provided: Positive Conditions","b":"Use 'as long as' or 'provided' to set a positive requirement. They mean 'only if' or 'on the condition that'. They emphasize that the main action depends entirely on this specific rule being followed.","hf":"به شرطی که / تا زمانی که: شرایط مثبت","bf":"از 'as long as' یا 'provided' برای تعیین یک الزام مثبت استفاده کنید. آن‌ها به معنای 'فقط اگر' یا 'به شرطی که' هستند. آن‌ها تأکید می‌کنند که عمل اصلی کاملاً به رعایت این قانون خاص وابسته است.","ex":[{"e":"You can borrow my car as long as you drive carefully.","p":"می‌توانی از ماشین من استفاده کنی به شرطی که با دقت رانندگی کنی."},{"e":"Provided that you finish your homework, you can watch TV.","p":"به شرطی که تکالیفت را تمام کنی، می‌توانی تلویزیون تماشا کنی."}]},{"h":"In Case: Precaution","b":"Use 'in case' when you take action now to prepare for a possible future problem. It is different from 'if'; 'in case' means you act before the event happens, just to be safe.","hf":"در صورت / برای اینکه: احتیاط","bf":"از 'in case' زمانی استفاده کنید که اکنون اقدامی انجام می‌دهید تا برای یک مشکل احتمالی در آینده آماده باشید. این با 'if' متفاوت است؛ 'in case' به این معنی است که شما قبل از وقوع رویداد عمل می‌کنید، فقط برای اطمینان.","ex":[{"e":"Take an umbrella in case it rains.","p":"چتر بردار تا اگر باران آمد، خیالت راحت باشد."},{"e":"I will buy some food in case we get hungry.","p":"غذا می‌خرم تا اگر گرسنه شدیم، چیزی برای خوردن داشته باشیم."}]}],"tip":"Remember that 'unless' is negative, so do not use 'not' in the clause after it. For example, say 'unless it rains', not 'unless it does not rain'.","tipf":"به یاد داشته باشید که 'unless' منفی است، بنابراین بعد از آن از 'not' استفاده نکنید. برای مثال، بگویید 'unless it rains' نه 'unless it does not rain'.","bad":[{"b":"I will go unless I will be tired.","g":"I will go unless I am tired.","w":"After 'unless', we usually use the present simple for future meaning, not 'will'.","wf":"بعد از 'unless'، معمولاً برای بیان معنی آینده از حال ساده استفاده می‌کنیم، نه 'will'."},{"b":"You can enter provided that you have a ticket.","g":"You can enter provided you have a ticket.","w":"While 'provided that' is correct, 'provided' alone is more common and natural in modern English.","wf":"اگرچه 'provided that' صحیح است، اما 'provided' به تنهایی در انگلیسی مدرن رایج‌تر و طبیعی‌تر است."},{"b":"Take a map in case you get lost.","g":"Take a map in case you get lost.","w":"This sentence is actually correct! But a common mistake is using 'if' instead of 'in case' when talking about preparation. E.g., 'Take a map if you get lost' implies you take it only after getting lost, which is illogical.","wf":"این جمله در واقع صحیح است! اما یک اشتباه رایج این است که به جای 'in case' از 'if' استفاده شود وقتی درباره آماده‌سازی صحبت می‌کنیم. مثلاً 'Take a map if you get lost' به این معنی است که فقط بعد از گم شدن نقشه را برمی‌داری که منطقی نیست."}],"gold":[{"e":"Unless means 'if not'.","f":"مگر اینکه به معنای 'اگر نه' است."},{"e":"As long as means 'only if'.","f":"به شرطی که به معنای 'فقط اگر' است."},{"e":"In case means 'to prepare for a possibility'.","f":"در صورت به معنای 'برای آماده شدن برای یک احتمال' است."}]},{"lv":"A","title":"Mixed Conditionals","exp":[{"h":"Past condition, present result","b":"You use this when a past action still affects the present. The if clause uses the past perfect, while the result clause uses the simple present to show the current consequence.","hf":"شرط در گذشته، نتیجه در زمان حال (Past condition, present result)","bf":"وقتی می‌خواهیم درباره یک اتفاق در گذشته صحبت کنیم که اثر یا نتیجه‌اش هنوز در زمان حال باقی مانده است، از این ساختار استفاده می‌کنیم. در بخش شرط (if-clause) از گذشته کامل (had done) و در بخش نتیجه از حال ساده استفاده می‌کنیم.","ex":[{"e":"If I had studied harder, I would have a better job now.","p":"اگر سخت‌تر درس خوانده بودم، الان شغل بهتری داشتم."},{"e":"If she had caught the train, she would be here by now.","p":"اگر او به قطار رسیده بود، الان تا حالا اینجا بود."}]},{"h":"Present condition, past result","b":"This structure links a general truth or current state to a specific past event. You use the simple present in the if clause and the conditional perfect in the result clause to show how a current trait led to a past outcome.","hf":"شرط در حال (عمومی یا دائمی)، نتیجه در گذشته (Present condition, past result)","bf":"گاهی وضعیت یا ویژگی فعلی کسی یا چیزی روی یک اتفاق در گذشته تأثیر گذاشته است. در این حالت، در بخش شرط از گذشته ساده (یا حال ساده برای واقعیت‌ها) و در بخش نتیجه از وجهی با have + اسم مفعول استفاده می‌کنیم.","ex":[{"e":"If I spoke French, I would have translated the document yesterday.","p":"اگر فرانسوی بلدمی‌شدم (در حال حاضر)، دیروز آن سند را ترجمه کرده بودم."},{"e":"If she weren't so lazy, she would have finished the project last week.","p":"اگر او این‌قدر تنبل نبود، هفته پیش پروژه‌ها را تمام کرده بود."}]},{"h":"Common advanced usage","b":"This pattern is often used to express regret or imagine how your life would be different today based on past choices. It highlights the connection between a past decision and your current identity or situation.","hf":"کاربرد رایج در زبان انگلیسی پیشرفته (Most common advanced use case)","bf":"کاربرد اصلی و بسیار رایج شرطی‌های ترکیبی، بیان حسرت یا فرضیه‌سازی درباره تغییر مسیر زندگی بر اساس شرایط کنونی است. این ساختار نشان می‌دهد که چگونه یک تصمیم گذشته، هویت یا موقعیت امروز ما را شکل داده است.","ex":[{"e":"If I had won the lottery, I would be a rich man today.","p":"اگر در قرعه‌کشی برنده شده بودم، امروز مرد ثروتمندی بودم."},{"e":"If I were a good cook, I would have invited them for dinner.","p":"اگر آشپز خوبی بودم، آن‌ها را برای شام دعوت کرده بودم."}]}],"tip":"Look for time markers like now or yesterday to help you decide which tense to use in each part of the sentence.","tipf":"در جملات شرطی ترکیبی، معمولاً قیدهای زمان مانند now (الان) یا yesterday (دیروز) به شما کمک می‌کنند که تفاوت زمان‌ها را درک کرده و ساختار درست را انتخاب کنید.","bad":[{"b":"If I had time yesterday, I would buy a car now.","g":"If I had had time yesterday, I would buy a car now.","w":"You must use the past perfect in the if clause, not the simple past, to show the action happened before the present result.","wf":"برای شرط در گذشته، باید از had had (گذشته کامل) استفاده کنید نه گذشته ساده."},{"b":"If I would studied hard, I would pass the exam now.","g":"If I had studied hard, I would pass the exam now.","w":"Never use would in the if clause; it should only appear in the main clause to indicate the result.","wf":"هرگز از would در بخش if استفاده نکنید؛ در شرطی نوع سوم و ترکیبی، بعد از if از had استفاده می‌شود."},{"b":"If she was rich, she would bought a house last year.","g":"If she were rich, she would have bought a house last year.","w":"In the result clause for a past outcome, use would have plus the past participle, not just would.","wf":"در بخش نتیجه برای زمان گذشته، به جای would باید از would have همراه با اسم مفعول استفاده شود."}],"gold":[{"e":"Always match the if clause tense with the time of the condition.","f":"همیشه زمان شرط را با زمان شرط مطابقت دهید."},{"e":"Use would only in the main clause, never after if.","f":"فقط در جمله اصلی از would استفاده کنید، نه بعد از if."},{"e":"Check if the result is current or past to choose the correct verb form.","f":"بررسی کنید که نتیجه فعلی است یا گذشته تا شکل فعل درست را انتخاب کنید."}]}],"ex":[{"t":"gap","q":"If you heat water to 100°C, it ___ .","key":["boils"],"why":"Zero conditional uses present simple for general truths."},{"t":"gap","q":"If it rains tomorrow, we ___ stay at home.","key":["will"],"why":"First conditional uses will + base verb for future possibilities."},{"t":"gap","q":"You won't pass the exam ___ you study harder.","key":["unless"],"why":"Unless means 'if not' in first conditional contexts."},{"t":"gap","q":"If I ___ you, I would accept the offer.","key":["were"],"why":"Second conditional uses past simple 'were' for hypothetical present situations."},{"t":"gap","q":"If she had studied, she ___ passed the test.","key":["would have"],"why":"Third conditional uses would have + past participle for past hypothetical results."},{"t":"gap","q":"If I had known about the delay, I ___ wai
