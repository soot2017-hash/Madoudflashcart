<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d4dc4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<title>فلش‌کارت لغات انگلیسی</title>
<style>
:root{--bg:#f5f2fb;--card:#ffffff;--tx:#1d1a2e;--mut:#69628a;--ac:#6d4dc4;--acx:#fff;--bd:#ddd6ec;--bad:#b3402f;--sf:#ece5f8;--ok:#2f8f6e}
@media (prefers-color-scheme:dark){:root{--bg:#16121f;--card:#221b33;--tx:#eeecf4;--mut:#9d97b3;--ac:#a98ff0;--acx:#1b1330;--bd:#39314f;--bad:#e07a68;--sf:#2b2340;--ok:#6fbf9b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.7;font-size:16px;padding:env(safe-area-inset-top,0px) 0 220px}
main{max-width:600px;margin:0 auto;padding:12px 14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:1.1rem;margin:0;flex:1}
h3{margin:0 0 8px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
input,textarea,select{width:100%;min-height:50px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
select{padding:0 10px}
.en{direction:ltr;text-align:left}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
.btn{min-height:50px;padding:8px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.btn.d{color:var(--bad)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row>*{flex:1}
.ib{width:46px;height:46px;border:0;background:var(--sf);border-radius:12px;font-size:1.1rem;cursor:pointer;color:var(--tx);flex:none}
.hint{font-size:.82rem;color:var(--mut);margin-top:8px}
.mut{color:var(--mut);font-size:.85rem}
.ipa{direction:ltr;color:var(--mut);min-height:1.2em}
.w{font-size:2rem;font-weight:900;direction:ltr;text-align:center;word-break:break-word}
.warn{background:color-mix(in srgb,#d98a1f 16%,var(--card));border:1px solid #d98a1f;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:.9rem}
.fc{min-height:240px;display:flex;flex-direction:column;align-items:center;padding:20px;cursor:pointer;text-align:center}
.fc.top{justify-content:flex-start;align-items:stretch;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{padding:2px 12px;border-radius:14px;font-size:.85rem;border:1px solid;background:var(--card)}
.pg{margin-top:14px;text-align:right;border:1px solid var(--bd);border-right:5px solid var(--c);border-radius:14px;padding:8px 12px;background:color-mix(in srgb,var(--c) 7%,var(--card))}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ph b{color:var(--c);font-size:1.05rem}
.cnt{margin-inline-start:auto;font-size:.75rem;color:var(--mut)}
.ps{font-size:.9rem;color:var(--mut);border-bottom:1px dashed var(--bd);padding-bottom:6px;margin-bottom:4px}
.sn{display:flex;gap:10px;padding:6px 0;align-items:flex-start;direction:ltr}
.sn input{width:26px;min-height:26px;flex:none;margin-top:3px;accent-color:var(--ac)}
.nm{min-width:24px;height:24px;border-radius:50%;background:var(--sf);font-size:.8rem;display:flex;align-items:center;justify-content:center;flex:none;margin-top:3px}
.sb{flex:1;direction:ltr;text-align:left}
.df{font-size:1.05rem}
.ex{color:var(--mut);font-style:italic}
.fa{direction:rtl;text-align:right;color:var(--ok);font-size:.95rem;margin-top:4px;padding:4px 8px;border-right:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card));border-radius:6px}
.sa{font-size:.9rem;margin-top:2px}
.s1 b{color:var(--ok)}.s2 b{color:var(--bad)}
.day{padding:0;overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:center;min-height:64px;padding:12px 14px;cursor:pointer}
.dh b{font-size:1.05rem}
.dw{padding:0 12px 12px}
.wi{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:52px;padding:8px 12px;margin-top:6px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer;text-align:right}
.wi b{direction:ltr}
.it{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it .t{flex:1;min-height:52px;cursor:pointer;padding:4px 0}
.it b{direction:ltr;display:block}
.it small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#act{max-width:600px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}
#act:empty{display:none}
#act .btn{flex:1;min-height:52px}
#act .rates{display:flex;gap:4px;width:100%}
#act .rates .btn{flex:1;padding:6px 4px;font-size:.85rem;min-height:46px;color:#fff;border:none}
#nav{max-width:600px;margin:0 auto;display:flex;gap:4px}
#nav button{flex:1;min-height:54px;border:0;background:none;color:var(--mut);font:inherit;font-size:.76rem;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
#nav button span{font-size:1.25rem;line-height:1.2}
#nav button.on{color:var(--ac);background:var(--sf);font-weight:700}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:600px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(190px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:20;font-size:.9rem;max-width:92vw;text-align:center}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}.btnrow .btn{flex:1 1 40%;font-size:.9rem;text-align:center}
.selbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:14px;background:var(--card);border:1px solid var(--bd);box-shadow:0 6px 22px rgba(0,0,0,.5);max-width:94vw}
.selbar .btn{min-height:34px;padding:3px 10px;font-size:.85rem;flex:none}
.selmk{height:36px;border-radius:999px;border:none;cursor:pointer;flex:none;padding:0 12px 0 7px;display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#8b5cc4,#5b3fae);box-shadow:0 3px 10px rgba(91,63,174,.4);color:#fff;font-weight:700;font-size:.78rem}
.selmk svg{width:22px;height:22px;display:block}
.selmk:active{transform:scale(.92)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.btn:active,.ib:active{transform:scale(.97)}}
.pr{font-size:.92rem;margin-top:3px;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--ac) 10%,var(--card))}
.pb{color:var(--ac);font-weight:800}
.fm{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--bd)}
.fm .btn{min-height:40px;padding:2px 12px}
.fmb{width:40px;height:40px;min-height:40px;border-radius:12px;border:none;background:linear-gradient(135deg,#8b5cc4,#5b3fae);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;box-shadow:0 2px 6px rgba(91,63,174,.25)}
.fmb svg{width:21px;height:21px;display:block}
.fmb:active{transform:scale(.94)}
.fmb.wide{width:auto;min-width:116px;padding:0 14px;gap:7px;color:#fff;font:inherit;font-size:.8rem;font-weight:700}
.fmb.wide svg{width:17px;height:17px}
.hero{background:linear-gradient(135deg,#5b3fae,#8b5cc4);color:#fff;border:none;border-radius:18px;padding:18px;margin-bottom:12px;text-align:center}
.hero .big{font-size:2.2rem;font-weight:800;margin:4px 0}
.hero .btn{margin-top:12px;background:#fff;color:#6d4dc4;border:none;width:100%;font-weight:700}
.hero.empty{background:linear-gradient(135deg,#8a8a80,#6b6a64)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0;margin-bottom:10px}
.tabs button{padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap;flex:none}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.hide-fa .fa{display:none!important}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;background:var(--sf);font-size:.8rem;color:var(--mut);margin-right:6px}
.gchip{display:inline-block;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac);font-weight:700;font-size:.78rem;border-radius:8px;padding:1px 8px;margin-inline-end:4px;vertical-align:middle}
.gchip-fa{background:color-mix(in srgb,#b06a00 14%,var(--card));color:#b06a00;direction:rtl}
.spx{color:#c0504d;font-style:italic;font-size:.92rem;margin-bottom:2px}
.trbtn{background:none;border:0;padding:2px 6px;color:var(--mut);font:inherit;font-size:.8rem;cursor:pointer;border-bottom:1px dashed var(--bd)}
.trbtn:disabled{color:var(--mut);border-bottom-color:transparent}
.tr{direction:rtl;text-align:right;color:var(--ok);font-size:.9rem;margin-top:2px}
</style>
</head>
<body>
<main>
 <div class="top"><h1>📚 فلش‌کارت لغات</h1><span class="badge" id="olchip" hidden>📴 آفلاین</span><button class="ib" id="mn" aria-label="منو">⋮</button></div>
 <div id="view"></div>
</main>
<div id="dock">
 <div id="act"></div>
 <nav id="nav">
  <button data-t="study"><span>🎴</span>مرور</button>
  <button data-t="add"><span>➕</span>افزودن</button>
  <button data-t="spell"><span>✍️</span>املا</button>
  <button data-t="list"><span>🗂️</span>کارت‌ها</button>
  <button data-t="grammar"><span>📖</span>گرامر</button>
 </nav>
</div>
<div id="sh" class="shade" hidden></div>
<div id="toast" hidden></div>

function blankCard(w){

function addSenses(w,list,ipa,fam,sm2,src){
 let c=findCard(w),n=0;
 if(!c){c=blankCard(w);if(src)c.src=src;if(sm2){c.reps=sm2.reps||0;c.interval=sm2.interval||1;c.ease=sm2.ease||2.5;c.due=sm2.due||today0();c.last=sm2.last||null}cards.push(c)}
 if(src){
  if(!c.src)c.src=src;
  else if(c.src!==src){
   if(!(c.srcs||[]).length)c.srcs=[c.src];
   if(c.srcs.indexOf(src)<0)c.srcs.push(src);
  }
 }
 if(ipa&&!c.ipa)c.ipa=norm(ipa);
 if(fam&&fam.length&&!(c.fam||[]).length)c.fam=normFam(fam).filter(f=>f.w.toLowerCase()!==c.w.toLowerCase());
 normSenses(list).forEach(s=>{if(!c.senses.some(x=>x.d===s.d)){c.senses.push(s);n++}});
 if(!c.senses.length)cards=cards.filter(x=>x!==c);
 save();return n;
}

function applySM2(c,q){
 if(!c)return;
 if(!cards.some(x=>x===c)){const cc=cards.find(x=>x.id&&c.id&&x.id===c.id);if(cc)c=cc}
 if(q<2){ c.reps=0; c.interval=1; } 
 else if(q===2){ /* سخت: مرور می‌شمارد ولی فاصله کم رشد می‌کند */
   if(c.reps===0) c.interval=1;
   else c.interval=Math.max(1, Math.round(c.interval*1.2));
   c.reps+=1;
 }
 else {
   if(c.reps===0) c.interval=1;
   else if(c.reps===1) c.interval=6;
   else c.interval=Math.round(c.interval*c.ease);
   c.reps+=1;
 }
 c.ease=Math.max(1.3, c.ease + (0.1-(5-q)*(0.08+(5-q)*0.02)));
 c.last=Date.now();
 c.due=today0() + c.interval*DAY;
 save();
 try{const L=JSON.parse(localStorage.getItem('fc_audit')||'[]');L.push(JSON.stringify({w:c.w,q:q,reps:c.reps,due:c.due,at:Date.now()}));while(L.length>30)L.shift();localStorage.setItem('fc_audit',JSON.stringify(L))}catch(e){}
}

    id:c.id||uid(), w:norm(c.w), t, ipa:c.ipa||'',

    ex.t=Math.min(ex.t,t);

    ex.due=Math.min(ex.due,card.due);
    if(!(ex.fam||[]).length)ex.fam=card.fam;
    if(!ex.ipa)ex.ipa=card.ipa;
    if(!ex.src)ex.src=card.src;
    if(card.src&&ex.src&&card.src!==ex.src){
     if(!(ex.srcs||[]).length)ex.srcs=[ex.src];
     if(ex.srcs.indexOf(card.src)<0)ex.srcs.push(card.src);
    }
    if(!(ex.srcs||[]).length&&card.srcs.length)ex.srcs=card.srcs.slice();
  } else { cards.push(card); mergedLoad++ }

function days(){

}

function pj(t){
 t=String(t||'').replace(/```[a-z]*\n?|```/gi,'');
 const cands=[t.indexOf('{'),t.indexOf('[')].filter(x=>x>=0);
 if(!cands.length)throw 0;
 const i=Math.min(...cands);const k=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
 if(k<i)throw 0;
 return JSON.parse(t.slice(i,k+1));
}

window.__GTOPICS=[{"id":"t01","t":"There is / There are and have got","tf":"وجود و مالکیت","parts":[{"lv":"B","title":"there is / there are","exp":[{"h":"Singular Existence","b":"Use 'there is' when you are talking about one single thing or an uncountable noun. It is the standard way to say that something exists in a specific place. Keep it simple and direct for singular subjects.","hf":"وجود مفرد","bf":"وقتی درباره یک چیز واحد یا یک اسم غیرقابل شمارش صحبت می‌کنید، از 'there is' استفاده کنید. این روش استاندارد برای بیان وجود چیزی در مکانی خاص است.","ex":[{"e":"There is a book on the table.","p":"یک کتاب روی میز است."},{"e":"There is some water in the bottle.","p":"کمی آب توی بطری است."}]},{"h":"Plural Existence","b":"Switch to 'there are' when you have two or more items. This form matches plural nouns perfectly. Remember to keep the verb plural to agree with the items you are listing.","hf":"وجود جمع","bf":"وقتی دو یا چند مورد دارید، به 'there are' تغییر وضعیت دهید. این شکل با اسم‌های جمع کاملاً مطابقت دارد. به یاد داشته باشید که فعل را جمع نگه دارید تا با مواردی که نام می‌برید هماهنگ باشد.","ex":[{"e":"There are two cats in the garden.","p":"دو گربه در باغچه هستند."},{"e":"There are many students in the class.","p":"دانش‌آموزان زیادی در کلاس هستند."}]},{"h":"Questions and Negatives","b":"To ask a question, simply move 'is' or 'are' to the front. For negatives, just add 'not' after the verb. This structure works consistently for both singular and plural forms.","hf":"سوال و منفی","bf":"برای پرسشی کردن، کافی است 'is' یا 'are' را به ابتدای جمله ببرید. برای منفی کردن، فقط 'not' را بعد از فعل اضافه کنید. این ساختار برای هر دو شکل مفرد و جمع به یک شکل عمل می‌کند.","ex":[{"e":"Is there a problem?","p":"آیا مشکلی وجود دارد؟"},{"e":"There are not any apples left.","p":"هیچ سیبی باقی نمانده است."}]}],"tip":"Always check the noun that follows 'there is/are' to decide the verb form, not the word 'there'.","tipf":"همیشه برای تعیین شکل فعل به اسمی که بعد از 'there is/are' می‌آید نگاه کنید، نه به کلمه 'there'.","bad":[{"b":"There is two books on the shelf.","g":"There are two books on the shelf.","w":"The noun 'books' is plural, so you must use 'are', not 'is'.","wf":"اسم 'books' جمع است، بنابراین باید از 'are' استفاده کنید، نه 'is'."},{"b":"There is many people in the park.","g":"There are many people in the park.","w":"'People' is a plural noun, requiring the plural verb 'are'.","wf":"کلمه 'people' یک اسم جمع است و به فعل جمع 'are' نیاز دارد."},{"b":"Are there any milk?","g":"Is there any milk?","w":"Since 'milk' is an uncountable noun, you must use 'is' instead of 'are'.","wf":"از آنجا که 'milk' یک اسم غیرقابل شمارش است، باید به جای 'are' از 'is' استفاده کنید."}],"gold":[{"e":"Use 'there is' for singular nouns and uncountable nouns.","f":"برای اسم‌های مفرد و اسم‌های غیرقابل شمارش از 'there is' استفاده کنید."},{"e":"Use 'there are' for plural nouns.","f":"برای اسم‌های جمع از 'there are' استفاده کنید."}]},{"lv":"B","title":"I have got / has got","exp":[{"h":"Affirmative Sentences","b":"We use 'have got' to talk about possession. Remember to use 'have got' with I, you, we, and they, and 'has got' with he, she, and it. It is a very common way to say you own something in modern English.","hf":"جملات مثبت","bf":"ما از 'have got' برای صحبت درباره مالکیت استفاده می‌کنیم. به خاطر داشته باشید که برای I, you, we و they از 'have got' و برای he, she و it از 'has got' استفاده کنید. این یک روش بسیار رایج برای گفتن اینکه شما چیزی را دارید در انگلیسی مدرن است.","ex":[{"e":"I have got a new car.","p":"من یک ماشین جدید دارم."},{"e":"She has got blue eyes.","p":"او چشم‌های آبی دارد."}]},{"h":"Negative Sentences","b":"To make a negative sentence, just add 'not' after 'have' or 'has'. You can also use the contraction 'haven't' or 'hasn't'. This is how you say you do not possess something.","hf":"جملات منفی","bf":"برای ساختن جمله منفی، کافی است 'not' را بعد از 'have' یا 'has' اضافه کنید. همچنین می‌توانید از مخفف‌های 'haven't' یا 'hasn't' استفاده کنید. این روشی است که می‌گویید چیزی را ندارید.","ex":[{"e":"We have not got any money.","p":"ما هیچ پولی نداریم."},{"e":"He hasn't got a brother.","p":"او برادر ندارد."}]},{"h":"Questions","b":"To ask a question, move 'have' or 'has' to the beginning of the sentence. For example, 'Have you got...?' or 'Has she got...?'. This structure is essential for asking about possession.","hf":"سوالات","bf":"برای پرسیدن سوال، 'have' یا 'has' را به ابتدای جمله منتقل کنید. برای مثال، 'Have you got...?' یا 'Has she got...?'. این ساختار برای پرسش درباره مالکیت ضروری است.","ex":[{"e":"Have you got a pen?","p":"آیا تو خودکار داری؟"},{"e":"Has it got four legs?","p":"آیا آن چهار پا دارد؟"}]}],"tip":"Use 'have got' for possession and 'has got' for third person singular.","tipf":"برای مالکیت از 'have got' و برای سوم شخص مفرد از 'has got' استفاده کنید.","bad":[{"b":"I has got a cat.","g":"I have got a cat.","w":"Use 'have' with 'I', not 'has'.","wf":"با 'I' از 'have' استفاده کنید، نه 'has'."},{"b":"She have got a dog.","g":"She has got a dog.","w":"Use 'has' with 'she', not 'have'.","wf":"با 'she' از 'has' استفاده کنید، نه 'have'."},{"b":"Do you have got a key?","g":"Have you got a key?","w":"Do not use 'do' with 'have got'. Just move 'have' to the front.","wf":"از 'do' با 'have got' استفاده نکنید. فقط 'have' را به جلو ببرید."}],"gold":[{"e":"Use 'have got' for I, you, we, they and 'has got' for he, she, it.","f":"برای I, you, we, they از 'have got' و برای he, she, it از 'has got' استفاده کنید."},{"e":"Add 'not' after 'have' or 'has' to make negatives.","f":"برای ساختن منفی، 'not' را بعد از 'have' یا 'has' اضافه کنید."},{"e":"Move 'have' or 'has' to the start to form questions.","f":"برای ساختن سوال، 'have' یا 'has' را به ابتدای جمله ببرید."}]},{"lv":"B","title":"there was / there were","exp":[{"h":"Singular Existence in the Past","b":"Use 'there was' when talking about one thing or an uncountable noun that existed in the past. It helps you describe single items that were present at a specific time.","hf":"وجود مفرد در گذشته","bf":"وقتی درباره یک چیز یا یک اسم غیرقابل شمارش صحبت می‌کنید که در گذشته وجود داشته است، از 'there was' استفاده کنید. این به شما کمک می‌کند تا اجزای تکی که در زمان خاصی حضور داشته‌اند را توصیف کنید.","ex":[{"e":"There was a cat on the roof.","p":"یک گربه روی پشت‌بام بود."},{"e":"There was some milk in the fridge.","p":"کمی شیر در یخچال بود."}]},{"h":"Plural Existence in the Past","b":"Use 'there were' when referring to two or more things that existed in the past. This form matches plural nouns perfectly.","hf":"وجود جمع در گذشته","bf":"وقتی به دو یا چند چیز که در گذشته وجود داشته‌اند اشاره می‌کنید، از 'there were' استفاده کنید. این شکل به طور کامل با اسامی جمع مطابقت دارد.","ex":[{"e":"There were many students in the class.","p":"دانش‌آموزان زیادی در کلاس بودند."},{"e":"There were two apples on the table.","p":"دو سیب روی میز بود."}]},{"h":"Forming Questions and Negatives","b":"To ask a question, move 'was' or 'were' to the front. To make it negative, simply add 'not' after the verb. This structure is very consistent.","hf":"ساختن سوال و منفی","bf":"برای سوالی کردن، 'was' یا 'were' را به ابتدای جمله منتقل کنید. برای منفی کردن، کافی است 'not' را بعد از فعل اضافه کنید. این ساختار بسیار منسجم است.","ex":[{"e":"Was there a problem?","p":"مشکلی بود؟"},{"e":"There were not any books there.","p":"آنجا هیچ کتابی نبود."}]}],"tip":"Remember that 'there' is just a placeholder; the real subject comes after the verb, so check if the noun is singular or plural.","tipf":"به یاد داشته باشید که 'there' فقط یک جایگزین است؛ فاعل واقعی بعد از فعل می‌آید، بنابراین بررسی کنید که اسم مفرد است یا جمع.","bad":[{"b":"There was two cars in the street.","g":"There were two cars in the street.","w":"The noun 'cars' is plural, so you must use 'were', not 'was'.","wf":"اسم 'cars' جمع است، بنابراین باید از 'were' استفاده کنید، نه 'was'."},{"b":"There was many people at the party.","g":"There were many people at the party.","w":"The noun 'people' is plural, so the verb must be 'were'.","wf":"اسم 'people' جمع است، بنابراین فعل باید 'were' باشد."},{"b":"Were there a book on the desk?","g":"Was there a book on the desk?","w":"The noun 'book' is singular, so the question form must use 'was'.","wf":"اسم 'book' مفرد است، بنابراین حالت سوالی باید از 'was' استفاده کند."}],"gold":[{"e":"Use 'was' for singular nouns and 'were' for plural nouns in the past tense.","f":"برای اسامی مفرد از 'was' و برای اسامی جمع از 'were' در زمان گذشته استفاده کنید."},{"e":"The verb agrees with the noun that follows it, not with 'there'.","f":"فعل با اسمی که بعد از آن می‌آید مطابقت دارد، نه با 'there'."},{"e":"In questions, invert 'was/were' with 'there'.","f":"در سوالات، 'was/were' را با 'there' جابجا کنید."}]}],"ex":[{"t":"gap","q":"There ___ a book on the table.","key":["is"],"why":"Singular existence in the present requires 'is'."},{"t":"gap","q":"There ___ many students in the classroom.","key":["are"],"why":"Plural existence in the present requires 'are'."},{"t":"gap","q":"___ you got a pen?","key":["Have"],"why":"Questions with 'have got' start with 'Have' for 'you'."},{"t":"fix","q":"There is two cats in the garden.","key":["There are two cats in the garden."],"why":"Plural noun 'cats' requires the plural verb 'are'."},{"t":"fix","q":"She has got a new car.","key":["She has got a new car."],"why":"Correct affirmative form for third person singular."},{"t":"gap","q":"There ___ a big park near my house.","key":["is"],"why":"Singular existence in the present requires 'is'."},{"t":"gap","q":"I ___ not got any money.","key":["'ve"],"why":"Negative form of 'have got' uses 'haven't' or 'have not'."},{"t":"fix","q":"There was many books on the shelf.","key":["There were many books on the shelf."],"why":"Plural noun 'books' in the past requires 'were'."},{"t":"fa","q":"یک کتاب روی میز است.","key":["There is a book on the table."],"why":"Translating singular existence in the present."},{"t":"fa","q":"آیا تو یک خواهر داری؟","key":["Have you got a sister?"],"why":"Translating a question about possession using 'have got'."}]},{"id":"t02","t":"Pronouns and Possessives","tf":"ضمایر و مالکیت","parts":[{"lv":"B","title":"my / your / his / her (possessive adjectives)","exp":[{"h":"Understanding Possessive Adjectives","b":"Possessive adjectives like my, your, his, and her tell us who owns something. They always come before the noun they describe. Think of them as small labels that show possession.","hf":"درک صفت‌های ملکی","bf":"صفت‌های ملکی مانند my، your، his و her نشان می‌دهند که چه کسی مالک چیزی است. آن‌ها همیشه قبل از اسمی که توصیف می‌کنند می‌آیند. آن‌ها را برچسب‌های کوچکی در نظر بگیرید که مالکیت را نشان می‌دهند.","ex":[{"e":"This is my book.","p":"این کتاب من است."},{"e":"Is this your pen?","p":"آیا این خودکار تو است؟"}]},{"h":"Using His and Her Correctly","b":"Use 'his' for males and 'her' for females. Remember that 'her' is used when the owner is female, regardless of whether the noun is masculine or feminine. It is important to match the gender of the owner.","hf":"استفاده صحیح از his و her","bf":"برای مردان از 'his' و برای زنان از 'her' استفاده کنید. به یاد داشته باشید که 'her' زمانی استفاده می‌شود که مالک زن باشد، صرف‌نظر از اینکه اسم مذکر است یا مؤنث. مهم است که جنسیت مالک را مطابقت دهید.","ex":[{"e":"He lost his keys.","p":"او کلیدهایش را گم کرد."},{"e":"She forgot her bag.","p":"او کیفش را فراموش کرد."}]},{"h":"Position Before Nouns","b":"These adjectives must be placed directly before the noun they modify. They cannot stand alone without a noun. For example, you say 'my car', not just 'my'.","hf":"موقعیت قبل از اسم‌ها","bf":"این صفت‌ها باید مستقیماً قبل از اسمی که توصیف می‌کنند قرار گیرند. آن‌ها نمی‌توانند بدون اسم به تنهایی استفاده شوند. برای مثال، شما می‌گویید 'my car'، نه فقط 'my'.","ex":[{"e":"Where is your phone?","p":"تلفن همراه تو کجاست؟"},{"e":"Her hair is long.","p":"موهای او بلند است."}]}],"tip":"Always remember that possessive adjectives change based on the owner, not the object owned.","tipf":"همیشه به یاد داشته باشید که صفت‌های ملکی بر اساس مالک تغییر می‌کنند، نه بر اساس شیء مورد مالکیت.","bad":[{"b":"This is me book.","g":"This is my book.","w":"Use 'my' instead of 'me' before a noun.","wf":"به جای 'me' از 'my' قبل از اسم استفاده کنید."},{"b":"She lost her keys and he lost her keys.","g":"She lost her keys and he lost his keys.","w":"Use 'his' for the male owner, not 'her'.","wf":"برای مالک مرد از 'his' استفاده کنید، نه 'her'."},{"b":"I like your.","g":"I like your car.","w":"Possessive adjectives need a noun after them.","wf":"صفت‌های ملکی نیاز به یک اسم بعد از خود دارند."}],"gold":[{"e":"Possessive adjectives agree with the owner's gender.","f":"صفت‌های ملکی با جنسیت مالک مطابقت دارند."},{"e":"Place the possessive adjective directly before the noun.","f":"صفت ملکی را مستقیماً قبل از اسم قرار دهید."},{"e":"Use 'his' for males and 'her' for females.","f":"برای مردان از 'his' و برای زنان از 'her' استفاده کنید."}]},{"lv":"B","title":"him / her / them (object pronouns)","exp":[{"h":"Understanding Object Pronouns","b":"Object pronouns are used when the person or thing receives the action of the verb. Instead of using names like 'Ali' or 'Mary', we use 'him', 'her', or 'them' to avoid repetition. Think of them as the receivers of the action in your sentence.","hf":"درک ضمایر مفعولی","bf":"ضمایر مفعولی زمانی استفاده می‌شوند که فرد یا چیزی که مورد نظر است، گیرنده‌ی عمل فعل باشد. به جای استفاده از اسامی مانند «علی» یا «مریم»، از him، her یا them استفاده می‌کنیم تا از تکرار جلوگیری کنیم. آن‌ها را به عنوان گیرندگان عمل در جمله خود در نظر بگیرید.","ex":[{"e":"I saw Ali yesterday.","p":"دیروز علی را دیدم."},{"e":"I saw him yesterday.","p":"دیروز او را دیدم."}]},{"h":"Using 'Him' and 'Her'","b":"Use 'him' for one boy or man, and 'her' for one girl or woman. These are singular forms. Remember that 'her' is also used for plural objects in some contexts, but for people, it refers to a single female.","hf":"استفاده از him و her","bf":"برای یک پسر یا مرد از him و برای یک دختر یا زن از her استفاده کنید. این‌ها شکل‌های مفرد هستند. به یاد داشته باشید که her برای یک زن یا دخترِ تنها استفاده می‌شود.","ex":[{"e":"Call John. I will speak to him.","p":"به جان زنگ بزن. من با او (مرد) صحبت خواهم کرد."},{"e":"Ask Sarah. I will meet her.","p":"از سارا بپرس. من با او (زن) ملاقات خواهم کرد."}]},{"h":"Using 'Them' for Plurals","b":"Use 'them' when referring to more than one person or thing. It works for both males and females mixed together, or just a group of anyone. It is the plural form of both 'him' and 'her'.","hf":"استفاده از them برای جمع","bf":"وقتی به بیش از یک نفر یا چیز اشاره می‌کنید، از them استفاده کنید. این ضمیر برای گروهی از مردان، زنان یا ترکیبی از هر دو کاربرد دارد. این شکل جمعِ همِ him و هم her است.","ex":[{"e":"I know the students. I helped them.","p":"دانش‌آموزان را می‌شناسم. به آن‌ها کمک کردم."},{"e":"Where are your keys? I put them on the table.","p":"کلیدهایت کجا هستند؟ آن‌ها را روی میز گذاشتم."}]}],"tip":"Place object pronouns after the verb or preposition, never before the noun they replace.","tipf":"ضمایر مفعولی را بعد از فعل یا حرف اضافه قرار دهید، هرگز جایگزین اسم قبل از آن نشوید.","bad":[{"b":"I saw Ali and he went home.","g":"I saw Ali, and him went home.","w":"More importantly, if you want to use an object pronoun to replace a noun receiving an action, you must use the correct objective form rather than the subject form.","wf":"نکته مهم این است که اگر می‌خواهید از ضمیر مفعولی برای جایگزینی اسمی که عمل را دریافت می‌کند استفاده کنید، باید به جای شکل فاعلی، از شکل مفعولی صحیح استفاده کنید."},{"b":"Me and Ali went to school.","g":"Ali and I went to school.","w":"When the pronoun is the subject of the sentence, use 'I', not 'me'. 'Me' is an object pronoun and cannot be the subject.","wf":"وقتی ضمیر فاعلِ جمله است، از I استفاده کنید، نه me. ضمیر me یک ضمیر مفعولی است و نمی‌تواند فاعل باشد."},{"b":"Give the book to she.","g":"Give the book to her.","w":"After a preposition like 'to', you must use the object form 'her', not the subject form 'she'.","wf":"بعد از یک حرف اضافه مانند to، باید از شکل مفعولی her استفاده کنید، نه شکل فاعلی she."}],"gold":[{"e":"Subject pronouns (I, you, he, she, it, we, they) do the action; object pronouns (me, you, him, her, it, us, them) receive the action.","f":"ضمایر فاعلی (I, you, he, she, it, we, they) عمل را انجام می‌دهند؛ ضمایر مفعولی (me, you, him, her, it, us, them) عمل را دریافت می‌کنند."},{"e":"Use 'him' for one male, 'her' for one female, and 'them' for multiple people or things.","f":"برای یک مرد از him، برای یک زن از her و برای چند نفر یا چیز از them استفاده کنید."},{"e":"Object pronouns always come after the verb or preposition in a sentence.","f":"ضمایر مفعولی همیشه بعد از فعل یا حرف اضافه در جمله می‌آیند."}]},{"lv":"B","title":"mine / yours / theirs (possessive pronouns)","exp":[{"h":"What are possessive pronouns?","b":"Possessive pronouns replace a noun to show ownership. Instead of saying 'my book', you can simply say 'mine'. This makes your speech more concise and natural.","hf":"ضمایر ملکی چه هستند؟","bf":"ضمایر ملکی برای جایگزینی اسم و نشان دادن مالکیت استفاده می‌شوند. به جای گفتن 'کتاب من'، می‌توانید به سادگی بگویید 'مال من'. این کار گفتار شما را مختصرتر و طبیعی‌تر می‌کند.","ex":[{"e":"This pen is mine.","p":"این خودکار مال من است."},{"e":"The red car is yours.","p":"ماشین قرمز مال توست."}]},{"h":"Using 'theirs' and 'ours'","b":"Remember that 'theirs' and 'ours' do not have an apostrophe. They stand alone without a following noun. For example, you say 'The house is theirs', not 'The house is their's'.","hf":"استفاده از 'theirs' و 'ours'","bf":"به یاد داشته باشید که 'theirs' و 'ours' آپاستروف ندارند. آن‌ها بدون اسم بعدی به تنهایی استفاده می‌شوند. برای مثال، می‌گویید 'خانه مال آن‌هاست'، نه 'The house is their's'.","ex":[{"e":"That bag is theirs.","p":"آن کیف مال آن‌هاست."},{"e":"The victory is ours.","p":"پیروزی مال ماست."}]},{"h":"Difference from possessive adjectives","b":"Do not confuse 'mine' with 'my'. 'My' must be followed by a noun, like 'my bag'. 'Mine' stands alone. Use 'mine' when the noun is already known or mentioned.","hf":"تفاوت با صفت‌های ملکی","bf":"ضمایر ملکی 'mine' را با 'my' اشتباه نگیرید. 'my' باید حتماً بعد از آن اسم بیاید، مثل 'my bag'. اما 'mine' به تنهایی استفاده می‌شود. از 'mine' زمانی استفاده کنید که اسم قبلاً شناخته شده یا ذکر شده باشد.","ex":[{"e":"Is this your phone? Yes, it is mine.","p":"آیا این تلفن توست؟ بله، مال من است."},{"e":"Her dress is beautiful, but I like yours better.","p":"لباس او زیباست، اما من لباس تو را بیشتر دوست دارم."}]}],"tip":"Always check if a noun follows the word. If there is a noun, use my/your/his/her. If there is no noun, use mine/yours/hers/theirs.","tipf":"همیشه بررسی کنید آیا کلمه‌ای بعد از این واژه می‌آید یا خیر. اگر اسمی وجود دارد، از my/your/his/her استفاده کنید. اگر اسمی وجود ندارد، از mine/yours/hers/theirs استفاده کنید.","bad":[{"b":"This is my.","g":"This is mine.","w":"You cannot use 'my' without a noun after it. 'My' is an adjective, not a pronoun.","wf":"نمی‌توانید از 'my' بدون اسم بعد از آن استفاده کنید. 'my' یک صفت است، نه ضمیر."},{"b":"The book is your's.","g":"The book is yours.","w":"Possessive pronouns like 'yours' never take an apostrophe.","wf":"ضمایر ملکی مانند 'yours' هرگز آپاستروف نمی‌گیرند."},{"b":"It is their's car.","g":"It is their car.","w":"When a noun follows, use the possessive adjective 'their', not the pronoun 'theirs'.","wf":"وقتی اسم می‌آید، از صفت ملکی 'their' استفاده کنید، نه ضمیر 'theirs'."}],"gold":[{"e":"Possessive pronouns (mine, yours, hers, ours, theirs) replace nouns and never use apostrophes.","f":"ضمایر ملکی (mine, yours, hers, ours, theirs) جایگزین اسم می‌شوند و هرگز آپاستروف نمی‌گیرند."},{"e":"Use possessive adjectives (my, your, his, her, our, their) only when a noun immediately follows.","f":"فقط زمانی از صفت‌های ملکی (my, your, his, her, our, their) استفاده کنید که بلافاصله بعد از آن‌ها اسم بیاید."},{"e":"The form 'theirs' is always spelled with an 's' at the end and no apostrophe.","f":"شکل 'theirs' همیشه با حرف 's' در انتها و بدون آپاستروف نوشته می‌شود."}]},{"lv":"B","title":"myself / yourself / themselves (reflexive pronouns)","exp":[{"h":"Understanding Reflexive Pronouns","b":"Reflexive pronouns like myself, yourself, and themselves are used when the subject and the object of a sentence are the same person. You use them to show that the action reflects back on the doer. For example, if you cut yourself, you are doing the action to yourself.","hf":"درک ضمایر انعکاسی","bf":"ضمایر انعکاسی مانند myself، yourself و themselves زمانی استفاده می‌شوند که فاعل و مفعول جمله یک نفر باشند. شما از آن‌ها برای نشان دادن این موضوع استفاده می‌کنید که عمل به انجام‌دهنده آن باز می‌گردد. برای مثال، اگر خودتان را ببرید، شما عمل را روی خودتان انجام می‌دهید.","ex":[{"e":"I bought myself a new book.","p":"من برای خودم یک کتاب جدید خریدم."},{"e":"She taught herself to play the guitar.","p":"او خودش نوازندگی گیتار را یاد گرفت."}]},{"h":"Using 'Myself' and 'Yourself' in Daily Life","b":"In everyday conversation, we often use myself and yourself to emphasize that we did something alone or without help. It is important to match the pronoun with the subject. For instance, if you are talking about yourself, use myself.","hf":"استفاده از myself و yourself در زندگی روزمره","bf":"در مکالمات روزمره، ما اغلب از myself و yourself برای تأکید بر این موضوع استفاده می‌کنیم که کاری را به تنهایی یا بدون کمک انجام داده‌ایم. مهم است که ضمیر را با فاعل مطابقت دهید. برای مثال، اگر درباره خودتان صحبت می‌کنید، از myself استفاده کنید.","ex":[{"e":"I made the cake myself.","p":"من کیک را خودم درست کردم."},{"e":"You should be proud of yourself.","p":"تو باید به خودت افتخار کنی."}]},{"h":"Reflexive Pronouns for Other People","b":"When talking about other people, we use his, her, its, our, and their reflexive forms. Remember that 'themselves' is used for both singular and plural 'they' in modern English. This helps avoid confusion when the subject is not clear.","hf":"ضمایر انعکاسی برای سایر افراد","bf":"وقتی درباره سایر افراد صحبت می‌کنیم، از شکل‌های انعکاسی his، her، its، our و their استفاده می‌کنیم. به یاد داشته باشید که در انگلیسی مدرن، 'themselves' هم برای 'they' مفرد و هم برای جمع استفاده می‌شود. این کار از ایجاد ابهام زمانی که فاعل مشخص نیست، جلوگیری می‌کند.","ex":[{"e":"The cat cleaned itself.","p":"گربه خودش را تمیز کرد."},{"e":"They enjoyed themselves at the party.","p":"آن‌ها در مهمانی از خودشان لذت بردند."}]}],"tip":"Do not use reflexive pronouns after verbs like 'introduce' or 'meet' unless you want to emphasize that the person did it alone. For example, say 'I introduced John to Mary' instead of 'I introduced John to myself' unless John is talking about himself.","tipf":"از ضمایر انعکاسی پس از افعالی مانند introduce یا meet استفاده نکنید، مگر اینکه بخواهید تأکید کنید که شخص آن کار را به تنهایی انجام داده است. برای مثال، بگویید 'I introduced John to Mary' به جای 'I introduced John to myself' مگر اینکه جان درباره خودش صحبت کند.","bad":[{"b":"I saw myself in the mirror.","g":"I saw myself in the mirror.","w":"This sentence is actually correct, but a common mistake is using 'me' instead of 'myself' when the subject is 'I'. For example, saying 'I saw me in the mirror' is less standard in formal English.","wf":"این جمله در واقع صحیح است، اما یک اشتباه رایج این است که به جای 'myself' از 'me' استفاده شود وقتی فاعل 'I' است. برای مثال، گفتن 'I saw me in the mirror' در انگلیسی رسمی کمتر استاندارد است."},{"b":"She cut her hand.","g":"She cut herself.","w":"While 'she cut her hand' is grammatically possible, it is not reflexive. To emphasize that she did it to herself, use 'herself'. Persian speakers often omit the reflexive pronoun when the body part is mentioned.","wf":"اگرچه 'she cut her hand' از نظر دستوری ممکن است، اما انعکاسی نیست. برای تأکید بر اینکه او خودش را بریده است، از 'herself' استفاده کنید. فارسی‌زبانان اغلب ضمیر انعکاسی را وقتی عضو بدن ذکر می‌شود، حذف می‌کنند."},{"b":"They enjoyed themself at the party.","g":"They enjoyed themselves at the party.","w":"The correct reflexive pronoun for 'they' is 'themselves', not 'themself'. Although 'themself' is becoming more common in singular 'they' contexts, 'themselves' is the standard form for plural subjects.","wf":"ضمیر انعکاسی صحیح برای 'they'، 'themselves' است، نه 'themself'. اگرچه 'themself' در زمینه‌های 'they' مفرد در حال رایج‌تر شدن است، اما 'themselves' شکل استاندارد برای فاعل‌های جمع است."}],"gold":[{"e":"Use reflexive pronouns when the subject and object are the same.","f":"وقتی فاعل و مفعول یکسان هستند، از ضمایر انعکاسی استفاده کنید."},{"e":"Match the reflexive pronoun to the subject: I -> myself, you -> yourself, he -> himself, she -> herself, it -> itself, we -> ourselves, they -> themselves.","f":"ضمیر انعکاسی را با فاعل مطابقت دهید: I -> myself، you -> yourself، he -> himself، she -> herself، it -> itself، we -> ourselves، they -> themselves."},{"e":"Reflexive pronouns can also be used for emphasis, placed after the subject or object.","f":"ضمایر انعکاسی همچنین می‌توانند برای تأکید استفاده شوند، که پس از فاعل یا مفعول قرار می‌گیرند."}]},{"lv":"B","title":"Whose …? and the possessive 's","exp":[{"h":"Using 's for possession","b":"To show that something belongs to someone, we add 's to the owner's name. This is the most common way to express possession in English for singular nouns.","hf":"استفاده از 's برای مالکیت","bf":"برای نشان دادن اینکه چیزی متعلق به کسی است، 's را به نام مالک اضافه می‌کنیم. این رایج‌ترین روش برای بیان مالکیت در انگلیسی برای اسم‌های مفرد است.","ex":[{"e":"This is Ali's book.","p":"این کتاب علی است."},{"e":"The cat's toy is under the table.","p":"اسباب‌بازی گربه زیر میز است."}]},{"h":"Asking about ownership with 'Whose'","b":"When you want to know who owns something, use the question word 'Whose'. It is followed by the noun being owned.","hf":"پرسش درباره مالکیت با 'Whose'","bf":"وقتی می‌خواهید بدانید چیزی متعلق به کیست، از کلمه پرسشی 'Whose' استفاده کنید. این کلمه با اسمی که مالکیت آن پرسیده می‌شود دنبال می‌شود.","ex":[{"e":"Whose pen is this?","p":"این خودکار مال کیست؟"},{"e":"Whose car is parked outside?","p":"ماشین پارک شده بیرون مال کیست؟"}]},{"h":"Plural possessives","b":"If the owner is already plural and ends in 's', just add an apostrophe after the 's'. If it does not end in 's', add 's as usual.","hf":"مالکیت‌های جمع","bf":"اگر اسم مالک جمع است و به حرف 's' ختم می‌شود، فقط یک آپاستروف بعد از 's' اضافه کنید. اگر به 's' ختم نمی‌شود، مثل حالت عادی 's اضافه کنید.","ex":[{"e":"The students' books are here.","p":"کتاب‌های دانش‌آموزان اینجا است."},{"e":"The children's toys are messy.","p":"اسباب‌بازی‌های کودکان به هم ریخته است."}]}],"tip":"Remember that 'Whose' asks for the owner, while 'who's' means 'who is'.","tipf":"به یاد داشته باشید که 'Whose' برای پرسش درباره مالک است، در حالی که 'who's' مخفف 'who is' است.","bad":[{"b":"This is Ali book.","g":"This is Ali's book.","w":"You need the possessive 's to show ownership.","wf":"برای نشان دادن مالکیت، به 's مالکیت نیاز دارید."},{"b":"Whose is this book?","g":"Whose book is this?","w":"The noun usually follows 'Whose' directly in this structure.","wf":"در این ساختار، اسم معمولاً مستقیماً بعد از 'Whose' می‌آید."},{"b":"The students books are here.","g":"The students' books are here.","w":"For plural owners ending in s, use an apostrophe after the s.","wf":"برای مالکان جمعی که به s ختم می‌شوند، از یک آپاستروف بعد از s استفاده کنید."}],"gold":[{"e":"Use 's for singular owners and ' for plural owners ending in s.","f":"برای مالکان مفرد از 's و برای مالکان جمعی که به s ختم می‌شوند از ' استفاده کنید."},{"e":"Start questions about ownership with 'Whose'.","f":"سوالات مربوط به مالکیت را با 'Whose' شروع کنید."}]}],"ex":[{"t":"gap","q":"This is ___ book. (I)","key":["my"],"why":"Possessive adjective 'my' is used before the noun 'book' to show ownership by the speaker."},{"t":"gap","q":"I saw ___ at the cinema yesterday. (you)","key":["you"],"why":"Object pronoun 'you' is used after the verb 'saw' to refer to the person being addressed."},{"t":"gap","q":"The car is ___. (they)","key":["theirs"],"why":"Possessive pronoun 'theirs' stands alone without a noun to indicate ownership by 'they'."},{"t":"fix","q":"She looked at herself in the mirror.","key":["She looked at herself in the mirror."],"why":"The sentence is already correct; 'herself' is the correct reflexive pronoun for 'she'."},{"t":"fix","q":"That is my bag, not your.","key":["That is my bag, not yours."],"why":"Possessive pronoun 'yours' is needed instead of 'your' because there is no noun following it."},{"t":"gap","q":"___ is this pen? It belongs to Ali.","key":["Whose"],"why":"'Whose' is the correct question word to ask about possession or ownership."},{"t":"fix","q":"He gave the book to her.","key":["He gave the book to her."],"why":"The sentence is correct; 'her' is the correct object pronoun for 'she' after the preposition 'to'."},{"t":"gap","q":"We enjoyed ___ at the party.","key":["ourselves"],"why":"Reflexive pronoun 'ourselves' is used when the subject 'we' performs the action on themselves."},{"t":"fa","q":"این کیف مال من است.","key":["This bag is mine."],"why":"Possessive pronoun 'mine' is used to indicate ownership without a following noun."},{"t":"gap","q":"The children hurt ___ while playing.","key":["themselves"],"why":"Reflexive pronoun 'themselves' is used because the subject 'children' (they) is the object of the action."}]},{"id":"t03","t":"Present Tenses","tf":"زمان‌های حال","parts":[{"lv":"B","title":"am / is / are","exp":[{"h":"Positive and Short Forms","b":"To make simple present sentences with am, is, and are, you put them right after the subject. In everyday speaking and writing, we usually use the short forms to sound more natural.","hf":"شکل مثبت و مخفف","bf":"برای ساخت جملات حال ساده با am, is و are، آنها را بعد از فاعل می‌آوریم. در گفتار و نوشتار روزمره معمولاً از شکل‌های مخفف استفاده می‌کنیم.","ex":[{"e":"I am happy. / I'm happy.","p":"من خوشحال هستم."},{"e":"She is a doctor. / She's a doctor.","p":"او یک پزشک است."}]},{"h":"Negative Forms","b":"To make a sentence negative, you just add the word not right after am, is, and are. You can also use negative short forms like isn't or aren't.","hf":"شکل منفی","bf":"برای منفی کردن، کافی است بعد از am, is و are از کلمه not استفاده کنیم. همچنین می‌توانیم مخفف‌های منفی را به کار ببریم.","ex":[{"e":"He is not tired. / He isn't tired.","p":"او خسته نیست."},{"e":"We are not at home. / We aren't at home.","p":"ما در خانه نیستیم."}]},{"h":"Question Forms","b":"To make a question, you switch the place of the subject and the be verb. This means you put the verb right at the beginning of the sentence.","hf":"شکل سوالی","bf":"برای سوالی کردن، جای فاعل و فعل to be را با هم عوض می‌کنیم (فعل را اول جمله می‌آوریم).","ex":[{"e":"Are you ready?","p":"آیا شما آماده هستید؟"},{"e":"Is she your sister?","p":"آیا او خواهر شماست؟"}]}],"tip":"In Persian you often drop the verb at the end of a sentence, but in English, am, is, and are are always required.","tipf":"در زبان فارسی اغلب «است» یا «هستیم» را در انتهای جمله حذف می‌کنیم، اما در انگلیسی آوردن am, is و are همیشه اجباری است.","bad":[{"b":"I a student.","g":"I am a student.","w":"In English you must not drop the be verb; using am is necessary here.","wf":"در انگلیسی نباید فعل to be را حذف کنید؛ وجود am الزامی است."},{"b":"She are happy.","g":"She is happy.","w":"For the pronouns he, she, and it, you always need to use is, not are.","wf":"برای ضمایر he, she, it همیشه باید از is استفاده کنید نه are."},{"b":"You is tired?","g":"Are you tired?","w":"For the pronouns you, we, and they, a question must start with are, not is.","wf":"برای ضمایر you, we, they فعل سوالی با are شروع می‌شود نه is."}],"gold":[{"e":"Always use am with I, is with he, she, it, and are with you, we, they.","f":"همیشه با I از am، با he، she، it از is و با you، we، they از are استفاده کنید."},{"e":"Never drop the be verb in English sentences, even if your native language does it.","f":"هرگز فعل to be را در جملات انگلیسی حذف نکنید، حتی اگر زبان مادری شما این کار را بکند."},{"e":"To make a question, just put the be verb before the subject.","f":"برای ساختن سوال، کافی است فعل to be را قبل از فاعل بیاورید."}]},{"lv":"B","title":"Present Continuous","exp":[{"h":"Main Structure","b":"To form this tense, you use the verb to be (am, is, are) along with the main verb ending in -ing. You use this tense to describe an action that is happening exactly at the moment of speaking.","hf":"ساختار اصلی","bf":"برای ساختن این زمان از فعل to be (am/is/are) به همراه فعل اصلی با پسوند -ing استفاده می‌کنیم. این زمان برای بیان کاری که دقیقاً در لحظه صحبت کردن در حال انجام است به کار می‌رود.","ex":[{"e":"I am reading a book now.","p":"من الان دارم کتاب می‌خوانم."},{"e":"She is cooking dinner.","p":"او دارد شام می‌پزد."}]},{"h":"Temporary Situations","b":"You use this tense to describe situations that are temporary and not always fixed. These situations may only last for a short period of time.","hf":"وضعیت‌های موقتی","bf":"از این زمان برای توصیف موقعیت‌هایی استفاده می‌کنیم که موقتی هستند و نه همیشه ثابت. این وضعیت‌ها ممکن است فقط برای مدت کوتاهی ادامه داشته باشند.","ex":[{"e":"I am staying with my parents this week.","p":"من این هفته پیش پدر و مادرم می‌مانم."},{"e":"He is working in London for a month.","p":"او برای یک ماه در لندن کار می‌کند."}]}],"tip":"Remember to always use am, is, or are before the main verb.","tipf":"فراموش نکنید که قبل از فعل اصلی حتماً از am، is یا are استفاده کنید.","bad":[{"b":"I reading English now.","g":"I am reading English now.","w":"The verb to be (am) has been forgotten.","wf":"فعل to be (am) فراموش شده است."},{"b":"She is cook dinner.","g":"She is cooking dinner.","w":"The -ing ending has not been added to the verb.","wf":"پسوند -ing به فعل اضافه نشده است."}],"gold":[{"e":"Always check that you have included the correct form of to be before the -ing verb.","f":"حتما چک کنید که قبل از فعل با پسوند ing، شکل درست فعل to be را قرار داده‌اید."},{"e":"Use this tense only for actions happening right now or temporary situations.","f":"از این زمان فقط برای کارهایی که همین الان در حال انجام هستند یا موقعیت‌های موقتی استفاده کنید."}]},{"lv":"B","title":"Present Simple","exp":[{"h":"General rule and third person singular","b":"You use the present simple for habits and facts. Remember that for he, she, and it, you must add an s to the verb.","hf":"قاعده کلی و سوم شخص مفرد","bf":"از زمان حال ساده برای کارهای همیشگی و حقیقت‌ها استفاده می‌کنیم. توجه کنید که برای ضمیرهای he، she و it، باید به انتهای فعل حرف s اضافه کنیم.","ex":[{"e":"I work in an office.","p":"من در یک اداره کار می‌کنم."},{"e":"She works very hard.","p":"او خیلی سخت کار می‌کند."}]},{"h":"Negating with do and does","b":"To make negative sentences, use do not for most subjects and does not for he, she, and it. Note that the main verb loses the s after does not.","hf":"منفی کردن با do و does","bf":"برای ساخت جملات منفی در زمان حال ساده، از do not (don't) و برای سوم شخص از does not (doesn't) استفاده می‌کنیم. به یاد داشته باشید که بعد از doesn't، فعل دیگر پسوند s نمی‌گیرد.","ex":[{"e":"I don't like coffee.","p":"من قهوه دوست ندارم."},{"e":"He doesn't speak French.","p":"او فرانسوی صحبت نمی‌کند."}]},{"h":"Asking questions with Do and Does","b":"Start questions with Do or Does. The main verb stays in its base form without an s in this structure.","hf":"سوالی کردن با Do و Does","bf":"برای پرسشی کردن جملات، کلمات Do یا Does را در ابتدای جمله قرار می‌دهیم. در این حالت نیز فعل اصلی به صورت ساده و بدون s می‌آید.","ex":[{"e":"Do you live in Tehran?","p":"آیا شما در تهران زندگی می‌کنید؟"},{"e":"Does she play tennis?","p":"آیا او تنیس بازی می‌کند؟"}]}],"tip":"Always check if the subject is third person singular to decide on the verb ending.","tipf":"فراموش نکنید که در سوم شخص مفرد (he/she/it)، حتماً باید به فعل جمله مثبت s اضافه کنید.","bad":[{"b":"He work in a bank.","g":"He works in a bank.","w":"You must add s to the verb for third person singular subjects like he.","wf":"برای سوم شخص مفرد (He) حتماً باید به فعل s اضافه شود."},{"b":"Does she likes music?","g":"Does she like music?","w":"The main verb should be in its base form after does, so it does not take an s.","wf":"بعد از کلمه کمکی Does، فعل اصلی باید به صورت ساده بیاید و دیگر s نمی‌گیرد."},{"b":"I not speak English.","g":"I don't speak English.","w":"You need do not or does not to negate the main verb in the present simple.","wf":"برای منفی کردن فعل‌های اصلی در زمان حال ساده، به don't یا doesn't نیاز داریم."}],"gold":[{"e":"Add s to the verb for he, she, and it in positive sentences.","f":"برای ضمایر he، she و it در جملات مثبت به فعل s اضافه کنید."},{"e":"Remove the s from the main verb after does in negative and question forms.","f":"بعد از does در جملات منفی و سوالی، s را از فعل اصلی حذف کنید."},{"e":"Use do for I, you, we, and they, and does for he, she, and it.","f":"برای I، you، we و they از do و برای he، she و it از does استفاده کنید."}]},{"lv":"B","title":"Present Continuous vs Present Simple","exp":[{"h":"Permanent vs Temporary","b":"Use the present simple for facts or habits that are always true. Use the present continuous for actions happening right now or during a temporary period.","hf":"قانون اصلی: دائمی در برابر موقت","bf":"از حال ساده برای کارهایی که همیشه یا به طور کلی درست هستند استفاده می‌کنیم. حال استمراری برای کارهایی که الان در حال انجام هستند یا در دوره‌ای موقت رخ می‌دهند به کار می‌رود.","ex":[{"e":"I live in Tehran.","p":"من در تهران زندگی می‌کنم."},{"e":"I am living in Tehran this month.","p":"من این ماه در تهران زندگی می‌کنم."}]},{"h":"State Verbs","b":"Verbs that describe feelings, thoughts, or possession usually stay in the present simple. This is true even if you are experiencing that feeling at this exact moment.","hf":"افعال حالتی (State Verbs)","bf":"برای افعالی که نشان‌دهنده احساس، فکر یا مالکیت هستند (مثل دوست داشتن، دانستن، داشتن)، معمولاً از حال ساده استفاده می‌شود، حتی اگر الان باشد.","ex":[{"e":"I want a coffee.","p":"من یک قهوه می‌خواهم."},{"e":"I am wanting a coffee.","p":"من در حال خواستن یک قهوه هستم (کمتر رایج)."}]},{"h":"Habits vs Current Events","b":"The present simple describes your regular routines and habits. The present continuous describes what is happening specifically this week or in this particular situation.","hf":"استفاده رایج: عادات در برابر اتفاقات امروز","bf":"حال ساده برای عادات تکراری و حال استمراری برای اتفاقاتی که فقط در این هفته یا این دوره خاص رخ می‌دهد استفاده می‌شود.","ex":[{"e":"She works at a bank.","p":"او در یک بانک کار می‌کند."},{"e":"She is working at a bank this summer.","p":"او این تابستان در یک بانک کار می‌کند."}]}],"tip":"If a verb describes a feeling or thought, you generally should not use the -ing form.","tipf":"اگر فعل نشان‌دهنده یک حس یا فکر است (مثل دوست داشتن یا دانستن)، معمولاً نباید از فرم استمراری (-ing) استفاده کنید.","bad":[{"b":"I am knowing the answer.","g":"I know the answer.","w":"The verb 'know' is a state verb and is rarely used in the continuous form.","wf":"فعل 'دانستن' یک فعل حالتی است و معمولاً به صورت استمراری استفاده نمی‌شود."},{"b":"She is living in London for ten years.","g":"She lives in London for ten years.","w":"To express the duration of a permanent state, we use the present simple, not the present continuous.","wf":"برای بیان مدت زمان یک وضعیت دائمی، از حال ساده استفاده می‌کنیم، نه حال استمراری."},{"b":"I am wanting some water.","g":"I want some water.","w":"The verb 'want' is a state verb and is better expressed in the simple form.","wf":"فعل 'خواستن' یک فعل حالتی است و بهتر است به صورت ساده بیان شود."}],"gold":[{"e":"State verbs like know or want usually do not take the -ing ending.","f":"افعال حالتی مانند know یا want معمولاً پسوند -ing نمی‌گیرند."},{"e":"Use the present simple for general truths and the present continuous for temporary actions.","f":"برای حقایق کلی از حال ساده و برای اقدامات موقت از حال استمراری استفاده کنید."},{"e":"Present continuous is perfect for describing what is happening around you right now.","f":"حال استمراری برای توصیف آنچه هم‌اکنون در اطراف شما در حال رخ دادن است، عالی است."}]}],"ex":[{"t":"gap","q":"I ___ a student.","key":["am"],"why":"Present Simple: am/is/are positive form for I."},{"t":"gap","q":"He ___ not like coffee.","key":["does"],"why":"Present Simple: negation with does for third person singular."},{"t":"gap","q":"___ you speak English?","key":["Do"],"why":"Present Simple: question form with Do for second person."},{"t":"gap","q":"She ___ reading a book now.","key":["is"],"why":"Present Continuous: am/is/are for current action."},{"t":"gap","q":"They ___ not watching TV at the moment.","key":["are"],"why":"Present Continuous: negative form for they."},{"t":"gap","q":"What ___ he doing?","key":["is"],"why":"Present Continuous: question form for he."},{"t":"fix","q":"She is go to school every day.","key":["She goes to school every day."],"why":"Present Simple: use goes for habitual action, not continuous."},{"t":"fix","q":"I am liking this song.","key":["I like this song."],"why":"State verbs like like are not usually used in continuous form."},{"t":"fix","q":"Does she works here?","key":["Does she work here?"],"why":"Present Simple question: main verb stays in base form after Does."},{"t":"fa","q":"من الان دارم درس می‌خوانم.","key":["I am studying now."],"why":"Present Continuous: action happening at the moment of speaking."},{"t":"fa","q":"او هر روز صبحانه می‌خورد.","key":["He eats breakfast every day."],"why":"Present Simple: habitual action with third person singular."},{"t":"fa","q":"آیا تو امروز کار می‌کنی؟","key":["Are you working today?"],"why":"Present Continuous: temporary situation or current plan."}]},{"id":"t04","t":"this / that / these / those and one / ones","tf":"اشاره و جانشینی","parts":[{"lv":"B","title":"this / that / these / those","exp":[{"h":"Singular Proximity: This and That","b":"Use 'this' for a single item close to you, and 'that' for a single item further away. Think of 'this' as your immediate space and 'that' as pointing to something at a distance.","hf":"نزدیک مفرد: این و آن","bf":"برای یک شیء نزدیک به خودتان از 'this' و برای یک شیء دورتر از 'that' استفاده کنید. 'this' را فضای اطراف خود و 'that' را برای اشاره به چیزی در فاصله دور در نظر بگیرید.","ex":[{"e":"This book is mine.","p":"این کتاب مال من است."},{"e":"That car is very fast.","p":"آن ماشین خیلی سریع است."}]},{"h":"Plural Proximity: These and Those","b":"Use 'these' for multiple items near you, and 'those' for multiple items far away. Just remember to add the 's' sound for plurals.","hf":"نزدیک جمع: این‌ها و آن‌ها","bf":"برای چند شیء نزدیک به خودتان از 'these' و برای چند شیء دورتر از 'those' استفاده کنید. فقط به یاد داشته باشید که برای اسم‌های جمع از پسوند جمع (مثل s) استفاده کنید.","ex":[{"e":"These apples are fresh.","p":"این سیب‌ها تازه هستند."},{"e":"Those birds are flying high.","p":"آن پرنده‌ها در ارتفاع بالا پرواز می‌کنند."}]},{"h":"Introducing People","b":"When you introduce someone to others, use 'this' or 'these' even if they are standing right next to you. It is the standard polite form for introductions.","hf":"معرفی افراد","bf":"وقتی کسی را به دیگران معرفی می‌کنید، از 'this' یا 'these' استفاده کنید، حتی اگر او کنار شما ایستاده باشد. این فرم استاندارد و مودبانه برای معرفی افراد است.","ex":[{"e":"This is my friend, Ali.","p":"این دوست من، علی است."},{"e":"These are my colleagues.","p":"این‌ها همکاران من هستند."}]}],"tip":"Remember that 'this' and 'these' are for near things, while 'that' and 'those' are for far things.","tipf":"به یاد داشته باشید که 'this' و 'these' برای اشیای نزدیک هستند، در حالی که 'that' و 'those' برای اشیای دور استفاده می‌شوند.","bad":[{"b":"That books are on the table.","g":"Those books are on the table.","w":"Use 'those' for plural nouns, not 'that'.","wf":"برای اسامی جمع از 'those' استفاده کنید، نه 'that'."},{"b":"These is my pen.","g":"This is my pen.","w":"Use 'this' for singular nouns, not 'these'.","wf":"برای اسامی مفرد از 'this' استفاده کنید، نه 'these'."},{"b":"This apples are red.","g":"These apples are red.","w":"Use 'these' for plural nouns, not 'this'.","wf":"برای اسامی جمع از 'these' استفاده کنید، نه 'this'."}],"gold":[{"e":"Use this/these for near items and that/those for far items.","f":"برای موارد نزدیک از this/these و برای موارد دور از that/those استفاده کنید."},{"e":"Use this/these for singular and plural respectively.","f":"برای مفرد از this و برای جمع از these استفاده کنید."},{"e":"Use that/those for singular and plural respectively.","f":"برای مفرد از that و برای جمع از those استفاده کنید."}]},{"lv":"B","title":"one / ones","exp":[{"h":"Using 'one' for singular nouns","b":"Use 'one' to avoid repeating a singular countable noun that has already been mentioned. It acts as a substitute for the noun, keeping your sentences concise and natural. Remember, you can only use it with singular nouns.","hf":"استفاده از 'one' برای اسم‌های مفرد","bf":"برای جلوگیری از تکرار یک اسم قابل‌شمارش مفرد که قبلاً ذکر شده است، از 'one' استفاده کنید. این کلمه به جای اسم عمل می‌کند و جملات شما را مختصر و طبیعی می‌سازد. به یاد داشته باشید که فقط می‌توانید آن را با اسم‌های مفرد استفاده کنید.","ex":[{"e":"I don't like this red shirt. I prefer the blue one.","p":"من این پیراهن قرمز را دوست ندارم. من مدل آبی‌اش را ترجیح می‌دهم."},{"e":"She has a new car, but her brother wants a new one.","p":"او یک ماشین جدید دارد، اما برادرش یک ماشین جدید می‌خواهد."}]},{"h":"Using 'ones' for plural nouns","b":"Use 'ones' when you want to replace a plural countable noun. It works exactly like 'one' but for more than one item. This is very common when comparing or choosing between several items.","hf":"استفاده از 'ones' برای اسم‌های جمع","bf":"وقتی می‌خواهید یک اسم قابل‌شمارش جمع را جایگزین کنید، از 'ones' استفاده کنید. این دقیقاً مانند 'one' عمل می‌کند اما برای بیش از یک مورد. این وقتی که بین چندین مورد مقایسه یا انتخاب می‌کنید بسیار رایج است.","ex":[{"e":"The shoes in the window are too expensive, so I bought these ones.","p":"کفش‌های داخل ویترین خیلی گران هستند، بنابراین من این مدل‌ها را خریدم."},{"e":"I like the black dresses, but not the white ones.","p":"من پیراهن‌های سیاه را دوست دارم، اما مدل‌های سفید را نه."}]},{"h":"Adjectives before 'one' or 'ones'","b":"You can place adjectives before 'one' or 'ones' to be more specific. For example, 'the old one' or 'the best ones'. This helps clarify exactly which noun you are referring to without repeating the noun itself.","hf":"صفت‌ها قبل از 'one' یا 'ones'","bf":"می‌توانید صفت‌ها را قبل از 'one' یا 'ones' قرار دهید تا دقیق‌تر باشید. برای مثال، 'مدل قدیمی' یا 'بهترین مدل‌ها'. این به شما کمک می‌کند تا دقیقاً مشخص کنید که به کدام اسم اشاره دارید بدون اینکه خود اسم را تکرار کنید.","ex":[{"e":"Which pen do you want? The black one.","p":"کدام خودکار را می‌خواهی؟ مدل سیاهش."},{"e":"These apples are fresh, but those ones are rotten.","p":"این سیب‌ها تازه هستند، اما آن مدل‌ها گندیده شده‌اند."}]}],"tip":"Remember that 'one/ones' replaces countable nouns only. Do not use them for uncountable nouns like 'water' or 'advice'.","tipf":"به یاد داشته باشید که 'one/ones' فقط جایگزین اسم‌های قابل‌شمارش می‌شوند. آن‌ها را برای اسم‌های غیرقابل‌شمارش مانند 'آب' یا 'مشورت' استفاده نکنید.","bad":[{"b":"I prefer the red one car.","g":"I prefer the red car.","w":"You cannot use 'one' after an adjective if the noun is already present. 'One' replaces the noun, so it cannot coexist with the noun it replaces.","wf":"شما نمی‌توانید بعد از صفت از 'one' استفاده کنید اگر اسم قبلاً وجود دارد. 'one' اسم را جایگزین می‌کند، بنابراین نمی‌تواند همراه با اسمی که جایگزین آن شده است باشد."},{"b":"I don't like these ones.","g":"I don't like these.","w":"When using demonstratives like 'this', 'that', 'these', or 'those', you do not need 'one/ones'. The demonstrative already points to the noun.","wf":"هنگام استفاده از ضمیرهای اشاره‌ای مانند 'this', 'that', 'these' یا 'those', نیازی به 'one/ones' نیست. ضمیر اشاره‌ای خودش به اسم اشاره می‌کند."},{"b":"She has many ones.","g":"She has many.","w":"'Many' can stand alone as a pronoun. Adding 'ones' is redundant and unnatural here.","wf":"'Many' می‌تواند به تنهایی به عنوان ضمیر استفاده شود. اضافه کردن 'ones' اینجا اضافی و غیرطبیعی است."}],"gold":[{"e":"Use 'one' for singular and 'ones' for plural countable nouns.","f":"برای اسم‌های قابل‌شمارش مفرد از 'one' و برای اسم‌های قابل‌شمارش جمع از 'ones' استفاده کنید."},{"e":"Never use 'one/ones' with uncountable nouns.","f":"هرگز از 'one/ones' با اسم‌های غیرقابل‌شمارش استفاده نکنید."},{"e":"Do not use 'one/ones' immediately after demonstratives like 'this' or 'these'.","f":"از 'one/ones' بلافاصله بعد از ضمیرهای اشاره‌ای مانند 'this' یا 'these' استفاده نکنید."}]}],"ex":[{"t":"gap","q":"___ is my new car.","key":["This"],"why":"Use 'this' for a singular noun that is near the speaker."},{"t":"gap","q":"Look at ___ birds in the sky!","key":["those"],"why":"Use 'those' for plural nouns that are far from the speaker."},{"t":"fix","q":"These are my favorite books.","key":["These are my favorite books."],"why":"The sentence is already correct; 'these' matches the plural noun 'books'."},{"t":"gap","q":"I prefer the red shoes to the blue ___.","key":["ones"],"why":"Use 'ones' to replace a plural noun previously mentioned."},{"t":"fa","q":"این کتاب مال توست؟","key":["Is this book yours?"],"why":"Translate 'this' for a singular noun near the speaker."},{"t":"fix","q":"That are my friends over there.","key":["Those are my friends over there."],"why":"Use 'those' for plural nouns that are far from the speaker."},{"t":"gap","q":"She bought a nice dress, but I bought a cheap ___.","key":["one"],"why":"Use 'one' to replace a singular noun previously mentioned."},{"t":"gap","q":"___ is my best friend.","key":["This"],"why":"Use 'this' when introducing someone who is near you."},{"t":"fix","q":"I like this shirt, but I don't like that one.","key":["I like this shirt, but I don't like that one."],"why":"The sentence is already correct; 'this' and 'that' are used correctly for singular nouns."},{"t":"fa","q":"آن سیب‌ها تازه هستند.","key":["Those apples are fresh."],"why":"Translate 'those' for plural nouns that are far from the speaker."}]},{"id":"t05","t":"Past Tenses","tf":"زمان‌های گذشته","parts":[{"lv":"B","title":"Past Simple: was / were","exp":[{"h":"Main rule for was and were","b":"The verb be changes to was for singular subjects and were for plural subjects in the past tense. You use this structure to describe a state or location that existed in the past.","hf":"قاعده اصلی was و were","bf":"فعل be در زمان گذشته برای مفرد was و برای جمع were می‌شود. از این ساختار برای توصیف وضعیت یا مکان در گذشته استفاده می‌کنیم.","ex":[{"e":"I was tired yesterday.","p":"من دیروز خسته بودم."},{"e":"They were at home.","p":"آن‌ها در خانه بودند."}]},{"h":"Making negative and question forms","b":"To make a negative sentence, add not after was or were, creating wasn't or weren't. To form a question, move was or were to the beginning of the sentence.","hf":"منفی کردن و سوالی ساختن","bf":"برای منفی کردن، بعد از was یا were کلمه not را اضافه می‌کنیم (wasn't / weren't). برای سوالی کردن، آن‌ها را به ابتدای جمله می‌آوریم.","ex":[{"e":"She wasn't happy.","p":"او خوشحال نبود."},{"e":"Were you late?","p":"آیا شما دیر کردید؟"}]},{"h":"Using age and location","b":"A very common use of these verbs is to talk about age in the past or to describe where people and things were located.","hf":"کاربرد برای سن و مکان","bf":"کاربرد بسیار رایج دیگر این افعال برای بیان سن در گذشته یا موقعیت مکانی افراد و اشیاء است.","ex":[{"e":"He was 20 last year.","p":"او سال گذشته ۲۰ ساله بود."},{"e":"The keys were on the table.","p":"کلیدها روی میز بودند."}]}],"tip":"Remember that you use was with I, he, she, and it, but you use were with you, we, and they.","tipf":"توجه کنید که برای I و he/she/it از was و برای you/we/they از were استفاده می‌شود.","bad":[{"b":"I were in Tehran yesterday.","g":"I was in Tehran yesterday.","w":"It is wrong to always use was with the subject I because you must use were with you.","wf":"برای فاعل I همیشه باید از was استفاده کنید نه were."},{"b":"You was tired.","g":"You were tired.","w":"It is incorrect to always use were with the subject you because you use was with singular subjects like he or she.","wf":"برای فاعل you همیشه باید از were استفاده کنید."},{"b":"Was you at the party?","g":"Were you at the party?","w":"In questions with the subject you, you should use Were at the start, not Was.","wf":"با فاعل you در جملات سوالی باید از Were استفاده شود نه Was."}],"gold":[{"e":"Always match was with singular subjects like I, he, she, and it.","f":"همیشه was را با فاعل‌های مفرد مثل I، he، she و it استفاده کنید."},{"e":"Always use were with the subject you, regardless of whether it is singular or plural.","f":"همیشه با فاعل you از were استفاده کنید، چه مفرد باشد چه جمع."},{"e":"When asking a question, place was or were at the very beginning of the sentence.","f":"هنگام سوال پرسیدن، was یا were را در ابتدای جمله قرار دهید."}]},{"lv":"B","title":"Past Simple: regular and irregular verbs","exp":[{"h":"Forming regular and irregular verbs","b":"For regular verbs, you simply add -ed to the base form. Irregular verbs have their own unique past forms that you need to memorize. You will see examples of both types below to help you practice.","hf":"ساختن افعال باقاعده و بی‌قاعده","bf":"برای افعال باقاعده، پسوند -ed را به فعل اضافه می‌کنیم. برای افعال بی‌قاعده، شکل خاص خود را دارند که باید حفظ شوند. مثال‌ها در زیر آمده است.","ex":[{"e":"I worked yesterday.","p":"من دیروز کار کردم."},{"e":"She went to school.","p":"او به مدرسه رفت."}]},{"h":"Making questions with did","b":"To ask a question in the past, use the helper verb did for all subjects. The main verb then returns to its simple base form. This structure remains the same regardless of who performed the action.","hf":"سوالی کردن با did","bf":"برای ساختن سوال در گذشته، از فعل کمکی did استفاده می‌کنیم و فعل اصلی به حالت ساده برمی‌گردد. این ساختار برای همه فاعل‌ها یکسان است.","ex":[{"e":"Did you work?","p":"آیا تو کار کردی؟"},{"e":"Did she go?","p":"آیا او رفت؟"}]},{"h":"Using ago","b":"Use the word ago at the end of a sentence to show time passed from a past event. It is commonly paired with the past simple tense. This helps you specify exactly when something happened.","hf":"استفاده از ago","bf":"برای بیان زمانی که از یک رویداد در گذشته گذشته است، از کلمه ago در انتهای جمله استفاده می‌کنیم. این کلمه معمولاً با زمان گذشته ساده می‌آید.","ex":[{"e":"I arrived two hours ago.","p":"من دو ساعت پیش رسیدم."},{"e":"She left ten minutes ago.","p":"او ده دقیقه پیش رفت."}]}],"tip":"Always remember that after did, the main verb becomes simple and loses its -ed ending or past form.","tipf":"همیشه به یاد داشته باشید که بعد از did، فعل اصلی ساده می‌شود و پسوند -ed یا شکل گذشته آن حذف می‌شود.","bad":[{"b":"Did you worked?","g":"Did you work?","w":"After did, the verb must return to its base form.","wf":"بعد از did، فعل باید به حالت ساده برگردد."},{"b":"I didn't went.","g":"I didn't go.","w":"In negative sentences with didn't, the main verb stays simple.","wf":"در جمله منفی با didn't، فعل اصلی ساده می‌ماند."}],"gold":[{"e":"Never add -ed to the main verb when using did.","f":"هرگز به فعل اصلی -ed اضافه نکنید وقتی did استفاده می‌کنید."},{"e":"Did works for all subjects like I, you, he, and they.","f":"did برای همه فاعل‌ها مثل I، you، he و they کار می‌کند."},{"e":"Place ago at the very end of your sentence.","f":"ago را در انتهای جمله خود قرار دهید."}]},{"lv":"B","title":"Past Continuous","exp":[{"h":"How to form the Past Continuous","b":"You form this tense by using was or were with the verb ending in ing. Use was for I, he, she, it, and use were for you, we, they. This tense shows that an action was in progress at a specific time in the past.","hf":"طرز ساخت گذشته استمراری","bf":"برای ساختن این زمان از was یا were به همراه فعل با پسوند ing استفاده می‌کنیم. از was برای I, he, she, it و از were برای you, we, they استفاده می‌شود. این زمان نشان می‌دهد که کاری در گذشته در یک زمان مشخص در جریان بوده است.","ex":[{"e":"I was watching TV at 8 PM yesterday.","p":"دیشب ساعت ۸ داشتم تلویزیون تماشا می‌کردم."},{"e":"They were playing football in the park.","p":"آن‌ها داشتند در پارک فوتبال بازی می‌کردند."}]},{"h":"Main use: interrupted action","b":"We often use the Past Continuous for an action that was in progress (the longer action) when another action suddenly interrupted it (the shorter action in the Past Simple). In these sentences, we usually use the word when.","hf":"کاربرد اصلی: کار در حال انجام که با کار دیگری قطع شد","bf":"اغلب از گذشته استمراری برای کاری استفاده می‌کنیم که در حال انجام بود (زمان طولانی‌تر) و ناگهان کار دیگری (با زمان کوتاه‌تر در گذشته ساده) آن را قطع کرد. در این جملات معمولاً از when استفاده می‌کنیم.","ex":[{"e":"I was sleeping when the phone rang.","p":"داشتم می‌خوابیدم که تلفن زنگ زد."},{"e":"She was cooking when I arrived.","p":"او داشت آشپزی می‌کرد که من رسیدم."}]},{"h":"Using while for simultaneous actions","b":"When two actions were happening at the same time in the past, we usually use the word while before the Past Continuous. In this case, both parts of the sentence can be in the Past Continuous.","hf":"استفاده از while برای دو کار همزمان","bf":"وقتی دو کار در گذشته همزمان در حال انجام بوده‌اند، معمولاً از کلمه while قبل از گذشته استمراری استفاده می‌کنیم. در این حالت هر دو بخش جمله می‌توانند گذشته استمراری باشند.","ex":[{"e":"While I was reading, my brother was playing.","p":"درحالی‌که داشتم مطالعه می‌کردم، برادرم بازی می‌کرد."},{"e":"She was listening while he was talking.","p":"او داشت گوش می‌داد درحالی‌که مرد داشت صحبت می‌کرد."}]}],"tip":"Remember that state verbs like know, want, or like usually do not take ing and are not used in the Past Continuous.","tipf":"حواستان باشد که افعال حالت (مثل know, want, like) معمولاً ing نمی‌گیرند و در گذشته استمراری استفاده نمی‌شوند.","bad":[{"b":"I was watch TV at 10 yesterday.","g":"I was watching TV at 10 yesterday.","w":"After was or were, you must use the verb with the ing ending, not the base form.","wf":"بعد از was/were حتماً باید فعل را با پسوند ing بیاورید، نه شکل ساده آن."},{"b":"He were working hard yesterday.","g":"He was working hard yesterday.","w":"For the pronouns he, she, and it, you must use was, not were.","wf":"برای ضمایر he, she, it باید از was استفاده کنید، نه were."},{"b":"When I was arriving, she cooked.","g":"I was arriving when she cooked. / When I arrived, she was cooking.","w":"For the shorter action that interrupts, use the Past Simple, and for the longer action, use the Past Continuous.","wf":"برای کاری که کوتاه است و کار دیگر را قطع می‌کند از گذشته ساده (arrived) و برای کار طولانی‌تر از گذشته استمراری استفاده کنید."}],"gold":[{"e":"Always pair was or were with the verb ending in ing.","f":"همیشه was یا were را با فعلی که پسوند ing دارد به کار ببرید."},{"e":"Use was for singular subjects like he, she, and it.","f":"برای فاعل‌های مفرد مثل he, she و it از was استفاده کنید."},{"e":"Use the Past Simple for the short interrupting action.","f":"برای عمل کوتاه‌تری که اختلال ایجاد می‌کند، از زمان گذشته ساده استفاده کنید."}]},{"lv":"B","title":"I was doing (past continuous, basic)","exp":[{"h":"Forming the Past Continuous","b":"To create this tense, you simply combine the past tense of 'to be' (was/were) with the verb ending in '-ing'. Use 'was' for singular subjects like I, he, she, or it, and 'were' for plural subjects like we, you, or they. It is a very straightforward structure to master.","hf":"ساختار گذشتهٔ استمراری","bf":"برای ساختن این زمان، کافی است فعل «بودن» را در زمان گذشته (was/were) با فاعلی که با فعل اصلی دارای پسوند '-ing' همراه است ترکیب کنید. برای فاعل‌های مفرد مانند I, he, she, it از was و برای فاعل‌های جمع مانند we, you, they از were استفاده کنید. ساختار آن بسیار ساده است.","ex":[{"e":"I was reading a book when you called.","p":"من داشتم کتاب می‌خواندم که تو زنگ زدی."},{"e":"They were playing football in the park.","p":"آن‌ها داشتند در پارک فوتبال بازی می‌کردند."}]},{"h":"Using for Interrupted Actions","b":"We often use this tense to describe an action that was in progress when another shorter action interrupted it. The longer action uses the past continuous, while the shorter one uses the simple past. This helps us paint a clear picture of the timeline.","hf":"استفاده برای کارهای در حال انجام که متوقف شده‌اند","bf":"ما اغلب از این زمان برای توصیف عملی استفاده می‌کنیم که در حال انجام بود و عمل کوتاه‌تری آن را قطع کرد. عمل طولانی‌تر به صورت گذشتهٔ استمراری و عمل کوتاه‌تر به صورت گذشتهٔ ساده می‌آید. این به ما کمک می‌کند تا تصویر روشنی از توالی زمان‌ها داشته باشیم.","ex":[{"e":"I was sleeping when the phone rang.","p":"من داشتم می‌خوابیدم که تلفن زنگ خورد."},{"e":"She was cooking dinner when the power went out.","p":"او داشت شام درست می‌کرد که برق رفت."}]},{"h":"Describing Background Scenes","b":"You can also use the past continuous to set the scene or describe the background atmosphere of a story. It describes what was happening around a specific moment in the past. This is very common in storytelling and descriptive writing.","hf":"توصیف صحنه‌های پس‌زمینه","bf":"شما همچنین می‌توانید از گذشتهٔ استمراری برای فضاسازی یا توصیف پس‌زمینهٔ یک داستان استفاده کنید. این زمان نشان می‌دهد که در یک لحظهٔ خاص در گذشته، چه چیزی در جریان بوده است. این کاربرد در داستان‌نویسی و متون توصیفی بسیار رایج است.","ex":[{"e":"The sun was shining and the birds were singing.","p":"خورشید داشت می‌درخشید و پرندگان آواز می‌خواندند."},{"e":"It was raining heavily outside.","p":"بیرون داشت به شدت باران می‌بارید."}]}],"tip":"Remember that 'was' goes with I, he, she, it and 'were' goes with you, we, they.","tipf":"به یاد داشته باشید که was با ضمیرهای I, he, she, it و were با you, we, they می‌آید.","bad":[{"b":"I was read a book.","g":"I was reading a book.","w":"You need the '-ing' form after 'was' for the continuous aspect.","wf":"برای ساختار استمراری، بعد از was به فعل با پسوند '-ing' نیاز دارید."},{"b":"They was playing.","g":"They were playing.","w":"Use 'were' with plural subjects like 'they'.","wf":"با فاعل‌های جمع مانند they باید از were استفاده کنید."},{"b":"I was slept when you arrived.","g":"I was sleeping when you arrived.","w":"The verb must be in the '-ing' form, not the past tense form.","wf":"فعل باید به شکل '-ing' باشد، نه به شکل گذشته."}],"gold":[{"e":"Structure: Subject + was/were + verb-ing.","f":"ساختار: فاعل + was/were + فعل با پسوند ing."},{"e":"Use 'was' for singular subjects and 'were' for plural subjects.","f":"برای فاعل‌های مفرد از was و برای فاعل‌های جمع از were استفاده کنید."},{"e":"The past continuous describes an ongoing action in the past.","f":"گذشتهٔ استمراری برای توصیف یک کار در حال جریان در گذشته به کار می‌رود."}]},{"lv":"I","title":"Past Perfect","exp":[{"h":"Structure and Concept","b":"The past perfect is formed using 'had' and the past participle of the main verb. You use it to describe an action that was completed before another action or time in the past.","hf":"ساختار و مفهوم کلی","bf":"ماضی بعید از فعل کمکی 'had' و قسمت سوم فعل (p.p.) تشکیل می‌شود. این زمان برای بیان عملی استفاده می‌شود که قبل از یک زمان دیگر در گذشته رخ داده است.","ex":[{"e":"I had finished my work before he arrived.","p":"من کارم را قبل از رسیدن او تمام کرده بودم."},{"e":"She had never seen snow before she moved to Canada.","p":"او قبل از نقل مکان به کانادا هرگز برف ندیده بود."}]},{"h":"Using with 'by the time'","b":"We often use this tense with 'by the time' to show that something had finished before a specific moment in the past. It emphasizes the completion of the first action relative to the second.","hf":"استفاده با 'by the time'","bf":"از این زمان اغلب همراه با عبارت 'by the time' (تا زمانی که) استفاده می‌شود تا نشان دهد کاری تا یک نقطه خاص در گذشته کامل شده است.","ex":[{"e":"By the time we got to the station, the train had left.","p":"تا زمانی که ما به ایستگاه رسیدیم، قطار رفته بود."},{"e":"By the time she woke up, the sun had risen.","p":"تا زمانی که او بیدار شد، خورشید طلوع کرده بود."}]},{"h":"Difference from Simple Past","b":"While the simple past just states that an event happened, the past perfect clarifies the order of events. It shows which action occurred first in the timeline of the past.","hf":"تفاوت با ماضی ساده","bf":"تفاوت اصلی این است که ماضی ساده فقط وقوع رویداد را بیان می‌کند، اما ماضی بعید اولویت زمانی آن رویداد را نسبت به رویداد دیگر نشان می‌دهد.","ex":[{"e":"When I arrived, the movie started.","p":"وقتی من رسیدم، فیلم شروع شد."},{"e":"When I arrived, the movie had started.","p":"وقتی من رسیدم، فیلم از قبل شروع شده بود."}]}],"tip":"Always pay attention to the sequence of events; the action that happened earlier takes the past perfect form.","tipf":"همیشه به ترتیب زمانی رویدادها دقت کنید؛ کاری که زودتر اتفاق افتاده، ماضی بعید می‌شود.","bad":[{"b":"I had went to the cinema.","g":"I had gone to the cinema.","w":"The past participle of 'go' is 'gone', not 'went'.","wf":"قسمت سوم فعل 'go' شکل 'went' نیست، بلکه 'gone' است."},{"b":"She had finished her homework before she watched TV.","g":"She had finished her homework before she watched TV.","w":"This sentence is grammatically correct, but if you mean he watched TV first and then did homework, the structure should change. A more common mistake is using 'had' for both verbs.","wf":"این جمله از نظر گرامری صحیح است، اما اگر منظور این باشد که اول تلویزیون دید و بعد تکلیف کرد، باید ساختار تغییر کند. اما اشتباه رایج‌تر استفاده از 'had' برای هر دو فعل است."},{"b":"I had known him for ten years when we met.","g":"I had known him for ten years when we met.","w":"This sentence is correct. The common error is using the simple past for 'know' in this structure: 'I knew him...'.","wf":"این جمله صحیح است. اشتباه رایج استفاده از ماضی ساده برای فعل 'know' در این ساختار است: 'I knew him...'"}],"gold":[{"e":"Use the past perfect for the earlier of two past actions.","f":"برای زودتر از دو عمل گذشته از ماضی بعید استفاده کنید."},{"e":"Remember that 'had' never changes regardless of the subject.","f":"به یاد داشته باشید که 'had' بدون توجه به فاعل تغییر نمی‌کند."},{"e":"The past participle is required, not the simple past form.","f":"شکل سوم فعل لازم است، نه شکل
