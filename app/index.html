rb like 'Rarely' requires subject-auxiliary inversion."},{"t":"fix","q":"No sooner had she left than the storm started.","key":["No sooner had she left than the storm started."],"why":"The sentence is already correct; 'No sooner' is followed by past perfect and 'than'."},{"t":"gap","q":"Under no circumstances ___ you open this door.","key":["should"],"why":"Inversion after 'Under no circumstances' requires the modal 'should'."},{"t":"gap","q":"Seldom ___ it rain so heavily in November.","key":["does"],"why":"Inversion with 'Seldom' requires the auxiliary 'does' for present simple."},{"t":"fa","q":"او هرگز چنین غذای خوشمزه‌ای نخورده بود.","key":["Never had he eaten such delicious food."],"why":"Persian 'هرگز... نخورده بود' (past perfect negative) translates to 'Never had + past participle' in English inversion."},{"t":"fa","q":"او نه تنها پولدار است، بلکه بسیار مهربان نیز هست.","key":["Not only is he rich, but he is also very kind."],"why":"'Not only... but also' structure requires inversion in the first clause when 'Not only' starts the sentence."}]},{"id":"t34","t":"Cleft Sentences","tf":"جمله‌های شکسته","parts":[{"lv":"A","title":"Cleft Sentences","exp":[{"h":"The It was... that structure","b":"You use this structure to put strong emphasis on a specific part of your sentence. By moving the element you want to highlight into the It was... that frame, you direct the listener's attention exactly where you want it to go.","hf":"ساختار It was... that","bf":"برای تأکید بر یک بخش خاص از جمله، آن را در ساختار It was... that قرار می‌دهیم. این ساختار اجازه می‌دهد توجه شنونده را دقیقاً به همان کلمه یا عبارت مورد نظر جلب کنیم.","ex":[{"e":"It was John who broke the window.","p":"جان بود که پنجره را شکست."},{"e":"It was yesterday that I saw her.","p":"دیروز بود که او را دیدم."}]},{"h":"The What-clause structure","b":"Use this pattern when you want to introduce the subject or object as the main topic of your statement. It is commonly used to define or explain something by turning the focus into a noun clause starting with What.","hf":"ساختار What-clause","bf":"وقتی می‌خواهیم روی فاعل یا مفعول جمله تأکید کنیم و آن را به عنوان موضوع اصلی معرفی کنیم، از ساختار What... is/was استفاده می‌کنیم. این ساختار معمولاً برای تعریف یا توضیح چیزی به کار می‌رود.","ex":[{"e":"What I need is a good rest.","p":"آنچه من نیاز دارم یک استراحت خوب است."},{"e":"What he said was true.","p":"آنچه او گفت حقیقت داشت."}]},{"h":"Emphasizing time and place","b":"One of the most common uses is to highlight when or where an event happened. In this case, you use It was... that, and the main verb of the sentence remains unchanged.","hf":"کاربرد رایج: تأکید بر قید زمان و مکان","bf":"یکی از رایج‌ترین کاربردهای جملات گسسته، تأکید بر زمان یا مکان وقوع یک رویداد است. در این حالت از It was... that استفاده می‌شود و فعل اصلی جمله تغییر نمی‌کند.","ex":[{"e":"It was in Paris that they met.","p":"در پاریس بود که آن‌ها همدیگر را دیدند."},{"e":"It was at 5 PM that the meeting started.","p":"ساعت ۵ عصر بود که جلسه شروع شد."}]}],"tip":"Remember that in It was... that sentences, use who if the emphasized part is the subject, and that is better for objects or adverbs.","tipf":"به یاد داشته باشید که در جملات It was... that، اگر بخش تأکیدی فاعل باشد، از who استفاده کنید و اگر مفعول یا قید باشد، that مناسب‌تر است.","bad":[{"b":"It was John that broke the window.","g":"It was John who broke the window.","w":"You should use who instead of that when the emphasized part is a human subject, as it sounds more natural.","wf":"وقتی بخش تأکیدی فاعل انسان است، استفاده از who طبیعی‌تر و رایج‌تر از that است."},{"b":"What I need is rested.","g":"What I need is rest.","w":"After is, you need a noun or noun phrase, not an adjective or a past tense verb.","wf":"بعد از is باید اسم یا عبارت اسمی بیاید، نه صفت یا فعل گذشته."},{"b":"It was John which broke the window.","g":"It was John who broke the window.","w":"For people, use who rather than which to refer to them correctly.","wf":"برای انسان‌ها از who استفاده می‌شود، نه which."}],"gold":[{"e":"Use who for people and that for things or time in cleft sentences.","f":"در جملات تأکیدی برای افراد از who و برای چیزها یا زمان از that استفاده کنید."},{"e":"Keep the main verb tense consistent with the original sentence when using It was... that.","f":"هنگام استفاده از It was... that، زمان فعل اصلی را با جمله اصلی یکسان نگه دارید."},{"e":"What-clauses act as a noun phrase, so they need a verb after them.","f":"جملات What به عنوان یک عبارت اسمی عمل می‌کنند، بنابراین بعد از آن‌ها باید یک فعل بیاید."}]},{"lv":"A","title":"Cleft 2: all (that) / the thing (that)","exp":[{"h":"Emphasizing a specific thing with 'The thing that'","b":"Use 'The thing that' to highlight a specific object or idea. It acts as a subject or object in the main clause. This structure helps you focus on exactly what you are talking about.","hf":"تاکید بر یک چیز خاص با 'The thing that'","bf":"از 'The thing that' برای برجسته کردن یک شیء یا ایده خاص استفاده کنید. این ساختار به عنوان فاعل یا مفعول در جمله اصلی عمل می‌کند. این ساختار به شما کمک می‌کند تا دقیقاً روی همان چیزی که درباره آن صحبت می‌کنید تمرکز کنید.","ex":[{"e":"The thing that I like is coffee.","p":"چیزی که من دوست دارم قهوه است."},{"e":"That is the thing that bothers me.","p":"آن چیزی است که من را آزار می‌دهد."}]},{"h":"Using 'All that' for totality","b":"Use 'All that' to refer to everything or the entirety of something. It is often used to summarize a situation or a set of actions. It implies 'everything that' or 'the only thing that'.","hf":"استفاده از 'All that' برای کلیت","bf":"از 'All that' برای اشاره به همه چیز یا کل یک موضوع استفاده کنید. این عبارت اغلب برای خلاصه کردن یک موقعیت یا مجموعه‌ای از اقدامات استفاده می‌شود. این عبارت به معنای 'همه چیزی که' یا 'تنها چیزی که' است.","ex":[{"e":"All that I need is love.","p":"همه‌ی چیزی که من نیاز دارم عشق است."},{"e":"This is all that remains of the house.","p":"این همه‌ی چیزی است که از خانه باقی مانده است."}]},{"h":"Cleft sentences for focus","b":"Cleft sentences split a simple sentence into two parts to add emphasis. 'The thing that' and 'All that' are common ways to start these sentences. They help you draw attention to a specific part of the message.","hf":"جملات شکسته برای تمرکز","bf":"جملات شکسته یک جمله ساده را به دو قسمت تقسیم می‌کنند تا تأکید بیشتری ایجاد کنند. 'The thing that' و 'All that' روش‌های رایجی برای شروع این جملات هستند. آن‌ها به شما کمک می‌کنند توجه را به بخش خاصی از پیام جلب کنید.","ex":[{"e":"What I mean is that we should leave.","p":"منظورم این است که ما باید برویم."},{"e":"All that happened was a mistake.","p":"همه‌ی اتفاقی که افتاد یک اشتباه بود."}]}],"tip":"Remember that 'that' can often be omitted in informal speech, but keeping it makes the structure clearer.","tipf":"به یاد داشته باشید که 'that' اغلب در گفتار غیررسمی می‌تواند حذف شود، اما نگه داشتن آن ساختار را واضح‌تر می‌کند.","bad":[{"b":"The thing I like is coffee.","g":"The thing that I like is coffee.","w":"While 'that' can be omitted, including it is more formal and clear for learners.","wf":"اگرچه 'that' می‌تواند حذف شود، اما گنجاندن آن برای یادگیرندگان رسمی‌تر و واضح‌تر است."},{"b":"All that I need is money.","g":"All that I need is money.","w":"This is actually correct, but a common mistake is using 'All which'.","wf":"این در واقع صحیح است، اما یک اشتباه رایج استفاده از 'All which' است."},{"b":"The thing which I like is coffee.","g":"The thing that I like is coffee.","w":"Use 'that' instead of 'which' after 'the thing'.","wf":"به جای 'which' بعد از 'the thing' از 'that' استفاده کنید."}],"gold":[{"e":"Use 'The thing that' to emphasize a specific noun.","f":"از 'The thing that' برای تأکید بر یک اسم خاص استفاده کنید."},{"e":"Use 'All that' to refer to everything.","f":"از 'All that' برای اشاره به همه چیز استفاده کنید."},{"e":"Cleft sentences help to focus on specific information.","f":"جملات شکسته به تمرکز بر اطلاعات خاص کمک می‌کنند."}]}],"ex":[{"t":"gap","q":"It was John ___ broke the window.","key":["who"],"why":"Use 'who' for people in it-cleft sentences."},{"t":"gap","q":"It was yesterday ___ I saw her.","key":["that"],"why":"Use 'that' for time expressions in it-cleft sentences."},{"t":"fix","q":"It was in the park where I met him.","key":["It was in the park that I met him."],"why":"In it-cleft sentences, use 'that' instead of 'where' for place emphasis."},{"t":"gap","q":"What ___ is needed is more time.","key":["is"],"why":"Use 'is' in what-cleft sentences when the focus is singular."},{"t":"gap","q":"What they need ___ more resources.","key":["is"],"why":"The verb in the main clause agrees with the focus, which is singular here."},{"t":"fix","q":"It was the book that I bought yesterday.","key":["It was the book that I bought yesterday."],"why":"This sentence is already correct; 'that' is used for things in it-clefts."},{"t":"gap","q":"It was in 1990 ___ the war started.","key":["that"],"why":"Use 'that' to emphasize a specific time in an it-cleft sentence."},{"t":"gap","q":"What surprised me ___ his honesty.","key":["was"],"why":"Use 'was' in what-cleft sentences when the focus is singular past event."},{"t":"fix","q":"It was Sarah who did the work.","key":["It was Sarah who did the work."],"why":"This sentence is correct; 'who' is used for people."},{"t":"fa","q":"آن کسی بود که ماشین را تعمیر کرد.","key":["It was the person who repaired the car."],"why":"Translate the Persian cleft structure into an English it-cleft sentence."},{"t":"gap","q":"It was in the kitchen ___ she found the keys.","key":["that"],"why":"Use 'that' to emphasize a place in an it-cleft sentence."},{"t":"fa","q":"آنچه من دوست دارم چای است.","key":["What I like is tea."],"why":"Translate the Persian what-cleft structure into an English what-cleft sentence."},{"t":"gap","q":"It was the noise ___ kept me awake last night.","key":["that"],"why":"In an 'it was... that' cleft sentence, 'that' introduces the clause containing the emphasized element."},{"t":"gap","q":"What ___ I dislike is his rudeness.","key":["is"],"why":"The verb in the main clause of a 'what'-cleft sentence agrees with the singular 'what' acting as the subject."},{"t":"gap","q":"All ___ he did was apologize.","key":["that"],"why":"'All that' is used to refer to everything or the only thing someone did or said."},{"t":"gap","q":"The thing ___ I hate most is waiting.","key":["that"],"why":"In a 'the thing that' cleft structure, 'that' connects the noun phrase to the relative clause defining it."},{"t":"fix","q":"It was the red car which I bought.","key":["It was the red car that I bought."],"why":"While 'which' is possible, 'that' is the standard and most natural relative pronoun in cleft sentences for emphasis."},{"t":"fix","q":"What needed is more money.","key":["What is needed is more money."],"why":"The 'what'-cleft structure requires a finite verb in the main clause (here, 'is') before the subject complement."},{"t":"fa","q":"آن چیزی که من می‌خواهم یک کتاب است.","key":["The thing that I want is a book."],"why":"This uses the 'The thing that' cleft structure to emphasize the specific object desired."},{"t":"fa","q":"همه‌ای که او گفت این بود که صبر کنیم.","key":["All that he said was that we should wait."],"why":"'All that' is used here to summarize the totality of what was said, followed by the content of that speech."}]},{"id":"t35","t":"Participle Clauses","tf":"جمله‌های وصفی کوتاه (participle)","parts":[{"lv":"A","title":"Participle Clauses","exp":[{"h":"Dropping Auxiliary Verbs","b":"You can make your sentences more concise by removing auxiliary verbs in passive or perfect contexts. Simply use the participle form, such as being done for present passive or having done for past perfect, to create a more natural flow.","hf":"حذف فعل کمکی و استفاده از participle","bf":"در جملات مجهول یا گذشته کامل، می‌توانیم فعل کمکی و فعل اصلی را حذف کرده و تنها از فرم participle استفاده کنیم. این کار جمله را مختصرتر و طبیعی‌تر می‌کند. برای زمان حال مجهول از being done و برای زمان گذشته از having done استفاده می‌شود.","ex":[{"e":"Having been warned, he left.","p":"هشدار داده شده بود، او رفت."},{"e":"Being tired, she sat down.","p":"خسته بود، نشست."}]},{"h":"Reduced Relative Clauses","b":"When you have a relative clause with a continuous or perfect verb, you can reduce it to a participle. This technique is very useful for making your writing sound more formal and fluent.","hf":"کاهش جملات موصولی (Reduced Relative Clauses)","bf":"وقتی یک جمله موصولی (Relative Clause) فعل مستمر یا گذشته کامل دارد، می‌توانیم آن را به participle تبدیل کنیم. این کار برای نوشتار رسمی و روان‌تر متن بسیار مفید است.","ex":[{"e":"The man who is standing there is my boss.","p":"مردی که آنجا ایستاده رئیس من است."},{"e":"The book which was written by him is famous.","p":"کتابی که توسط او نوشته شده معروف است."}]},{"h":"Expressing Cause or Time","b":"Participle phrases are often used to show the reason or timing of an action. This structure clearly indicates that two events are closely related in time or cause.","hf":"بیان علت یا زمان","bf":"عبارات participle اغلب برای بیان علت یا زمان رخ دادن عمل استفاده می‌شوند. این ساختار نشان می‌دهد که دو رویداد به هم مرتبط هستند.","ex":[{"e":"Having finished his work, he went home.","p":"کارش را تمام کرده بود، به خانه رفت."},{"e":"Being late, he missed the bus.","p":"دیر کرده بود، اتوبوس را از دست داد."}]}],"tip":"Ensure the subject of the main clause is the same as the subject of the participle phrase.","tipf":"دقت کنید که فاعل جمله اصلی باید همان فاعل participle باشد.","bad":[{"b":"Having finished the homework, the TV was turned on.","g":"Having finished the homework, he turned on the TV.","w":"The subject he must be the same as the subject having finished.","wf":"فاعل جمله اصلی (he) باید همان فاعل having finished باشد."},{"b":"Being a good student, the exam was easy.","g":"Being a good student, he found the exam easy.","w":"The subject being a good student must match the subject of the main clause.","wf":"فاعل being a good student باید همان فاعل جمله اصلی باشد."},{"b":"The man who being standing there is my boss.","g":"The man standing there is my boss.","w":"Do not use being after who; instead, use the participle directly.","wf":"بعد از who نباید being را آورد، بلکه مستقیماً از participle استفاده کنید."}],"gold":[{"e":"Always check that the subject performing the action in the participle is the same as the subject of the main verb.","f":"همیشه چک کنید که فاعل انجام دهنده عمل در عبارت participle همان فاعل فعل اصلی باشد."},{"e":"Use being done for present passive and having done for past perfect to keep your grammar accurate.","f":"برای زمان حال مجهول از being done و برای گذشته کامل از having done استفاده کنید تا گرامر شما دقیق باشد."},{"e":"Avoid using relative pronouns like who when you can simply use the participle form.","f":"وقتی می‌توانید از فرم participle استفاده کنید، از حروف ربط مثل who پرهیز کنید."}]}],"ex":[{"t":"gap","q":"The man ___ on the bench is my grandfather.","key":["sitting"],"why":"Present participle used as a reduced relative clause modifying 'The man'."},{"t":"gap","q":"___ by the loud noise, the baby woke up.","key":["Frightened"],"why":"Past participle used to express cause or state resulting from an action."},{"t":"fix","q":"Being tired, he decided to go to bed early.","key":["Being tired, he decided to go to bed early."],"why":"The sentence is grammatically correct; the participle clause properly modifies the subject 'he'."},{"t":"gap","q":"She opened the door, ___ the letter.","key":["holding"],"why":"Present participle indicating an accompanying action or state."},{"t":"fix","q":"Having finished his homework, the television was turned on.","key":["Having finished his homework, he turned on the television."],"why":"Dangling modifier correction: the subject of the participle clause must be the same as the main clause subject."},{"t":"gap","q":"The book, ___ in 1990, is still very popular.","key":["published"],"why":"Past participle used in a reduced relative clause with passive meaning."},{"t":"fa","q":"با توجه به اینکه خسته بود، زود خوابید.","key":["Being tired, he went to sleep early."],"why":"Translating a causal participle clause from Persian to English."},{"t":"gap","q":"___ by the teacher, the students listened carefully.","key":["Instructed"],"why":"Past participle indicating the action done to the subject 'the students'."},{"t":"fix","q":"Walking down the street, the trees looked beautiful.","key":["Walking down the street, I saw that the trees looked beautiful."],"why":"Dangling modifier correction: 'Walking' must modify the person, not 'the trees'."},{"t":"gap","q":"He sat in the chair, ___ a book.","key":["reading"],"why":"Present participle describing an action happening at the same time as the main verb."},{"t":"fa","q":"کتابی که دیروز خریدم، جالب بود.","key":["The book I bought yesterday was interesting."],"why":"Reduced relative clause where the relative pronoun and auxiliary verb are omitted."},{"t":"gap","q":"___ the exam, she felt very relieved.","key":["Having passed"],"why":"Perfect participle indicating an action completed before the main clause action."},{"t":"gap","q":"___ (exhausted) from the long journey, he fell asleep immediately.","key":["Exhausted"],"why":"Past participle used as an adjective to describe the subject's state."},{"t":"gap","q":"The movie, ___ (direct) by Spielberg, won several awards.","key":["directed"],"why":"Reduced relative clause: 'which was directed' becomes 'directed'."},{"t":"fix","q":"Walking through the park, the flowers looked beautiful.","key":["Walking through the park, I thought the flowers looked beautiful."],"why":"Fixes a dangling modifier: the walker (I) must be the subject doing the walking."},{"t":"fix","q":"Having finished his work, the phone rang.","key":["Having finished his work, he answered the phone."],"why":"Fixes a dangling modifier: the person who finished the work is the subject, not the phone."},{"t":"fa","q":"با توجه به اینکه باران می‌بارید، ما در خانه ماندیم.","key":["It raining, we stayed at home."],"why":"Uses an absolute participle clause to express cause."},{"t":"gap","q":"___ (know) the answer, she raised her hand.","key":["Knowing"],"why":"Present participle used to show simultaneous action or cause."},{"t":"gap","q":"The man ___ I met yesterday is a doctor.","key":["whom"],"why":"Relative pronoun for the object of the verb 'met' in a reduced relative clause context."},{"t":"fa","q":"بعد از اینکه غذا خورد، به کارش ادامه داد.","key":["Having eaten the meal, he continued his work."],"why":"Perfect participle clause to show an action completed before the main verb."}]},{"id":"t36","t":"Causative have / get","tf":"سببی‌ساختن","parts":[{"lv":"A","title":"Causative have / get","exp":[{"h":"Having someone do something (Have/Get something done)","b":"You use this structure when you want someone else to perform a service for you, usually for a fee. In Persian, this is often translated as having something repaired or done by someone else.","hf":"دارای چه کسی یا چه چیزی کار را انجام دادن (Have/Get something done)","bf":"وقتی از کسی می‌خواهیم کاری را برای ما انجام دهد (معمولاً در ازای پول)، از ساختار have یا get به اضافه مفعول و شکل سوم فعل (اسم مفعول) استفاده می‌کنیم. در زبان فارسی معمولاً این را به صورت «... را تعمیر کردن/انجام دادن» ترجمه می‌کنیم.","ex":[{"e":"I need to have my car serviced before the trip.","p":"باید قبل از سفر ماشینم را سرویس کنم (دهم سرویس کنند)."},{"e":"She got her hair cut in a very modern style.","p":"او موهایش را به سبک بسیار مدرنی کوتاه کرد (داد کوتاه کنند)."}]},{"h":"Persuading someone to do something (Get someone to do something)","b":"Use this when you convince or persuade someone to do a task for you. It implies that you made an effort to get them to agree or act.","hf":"متقاعد کردن کسی به انجام کاری (Get someone to do something)","bf":"وقتی کسی را متقاعد یا ترغیب می‌کنیم که کاری را برای ما انجام دهد، از فعل get به همراه شخص و مصدر با to استفاده می‌کنیم. این ساختار نشان‌دهنده تلاش یا متقاعدسازی است.","ex":[{"e":"How did you get the mechanic to fix your car so fast?","p":"چطور مکانیک را متقاعد کردی ماشینت را این‌قدر سریع درست کند؟"},{"e":"I’ll get my brother to help us move the furniture.","p":"داداشم را راضی می‌کنم در جابجایی مبل‌ها به ما کمک کند."}]},{"h":"Instructing or assigning a task (Have someone do something)","b":"Use this when you give a direct order or assign a duty to someone. It is commonly used in professional or formal settings to delegate tasks.","hf":"دستور دادن یا اجازه دادن (Have someone do something)","bf":"وقتی به کسی دستور می‌دهیم یا وظیفه‌ای را به او محول می‌کنیم، از ساختار have به همراه شخص و مصدر بدون to (bare infinitive) استفاده می‌کنیم. این کاربرد بیشتر در محیط‌های کاری و رسمی دیده می‌شود.","ex":[{"e":"The manager had his assistant send the report immediately.","p":"مدیر از دستیارش خواست فوراً گزارش را بفرستد."},{"e":"I’ll have the waiter bring you the menu.","p":"به گارسون می‌گویم منو را برایتان بیاورد."}]}],"tip":"For routine services like car repairs or haircuts, the have something done structure is the most natural choice.","tipf":"نکته مهم: برای کارهای خدماتی و تعمیراتی (مثل تعمیر ماشین یا کوتاه کردن مو)، استفاده از have something done بسیار رایج‌تر از شکل‌های دیگر است.","bad":[{"b":"I must have my hair cut it tomorrow.","g":"I must have my hair cut tomorrow.","w":"You should not add an object pronoun after the past participle.","wf":"نباید بعد از اسم مفعول (cut) دوباره ضمیر مفعولی بیاورید."},{"b":"She got her car repair yesterday.","g":"She got her car repaired yesterday.","w":"You must always use the past participle form in the have/get something done structure.","wf":"در ساختار have/get something done همیشه باید از قسمت سوم فعل (اسم مفعول) استفاده کنید."},{"b":"I had the mechanic fixing my brakes.","g":"I had the mechanic fix my brakes.","w":"After the person in the causative have structure, use the base verb, not the -ing form.","wf":"بعد از شخص در ساختار causative have، باید از مصدر بدون to استفاده کنید نه فعل ing‌دار."}],"gold":[{"e":"Always use the past participle form of the verb in the have/get something done structure.","f":"همیشه از شکل سوم فعل (اسم مفعول) در ساختار have/get something done استفاده کنید."},{"e":"Use get with to-infinitive when you want to emphasize persuasion or effort.","f":"وقتی می‌خواهید بر متقاعدسازی یا تلاش تأکید کنید، از get به همراه مصدر با to استفاده کنید."},{"e":"Use have with the base verb when giving a direct instruction or assignment.","f":"وقتی دستور مستقیم می‌دهید یا وظیفه‌ای را محول می‌کنید، از have به همراه مصدر بدون to استفاده کنید."},{"e":"Avoid adding object pronouns after the past participle in causative structures.","f":"از آوردن ضمیر مفعولی بعد از اسم مفعول در ساختاره��ی سببی خودداری کنید."}]}],"ex":[{"t":"gap","q":"I had the mechanic ___ my car yesterday.","key":["repair"],"why":"Causative 'have' is followed by the base form of the verb."},{"t":"gap","q":"She got her brother ___ the windows.","key":["to clean"],"why":"Causative 'get' requires 'to' before the verb."},{"t":"gap","q":"We got the plumber to fix the leak.","key":["fix"],"why":"The verb follows 'to' in the infinitive form."},{"t":"fix","q":"I had the dentist check my teeth.","key":["I had the dentist check my teeth."],"why":"Correct usage of 'have' with the base verb form."},{"t":"fix","q":"She got the teacher explain the rule.","key":["She got the teacher to explain the rule."],"why":"'Get' requires 'to' before the verb."},{"t":"fix","q":"He had the secretary send the email.","key":["He had the secretary send the email."],"why":"Correct structure for 'have' causative."},{"t":"fa","q":"من ماشینم را تعمیر کردم.","key":["I had my car repaired."],"why":"Passive causative structure for having something done."},{"t":"fa","q":"او پسرش را متقاعد کرد که پنجره‌ها را تمیز کند.","key":["She got her son to clean the windows."],"why":"'Get' implies persuading someone to do something."},{"t":"gap","q":"The boss had the staff ___ the report.","key":["write"],"why":"Base form after 'have' in causative structure."},{"t":"gap","q":"I got my hair ___ last week.","key":["cut"],"why":"Past participle used in passive causative."},{"t":"fix","q":"She got the mechanic repair the car.","key":["She got the mechanic to repair the car."],"why":"'Get' requires 'to' before the verb."},{"t":"fa","q":"ما خانه را رنگ کردیم.","key":["We had the house painted."],"why":"Passive causative for having a task performed on something."},{"t":"gap","q":"I had the tailor ___ my suit.","key":["alter"],"why":"Causative 'have' is followed by the base form of the verb when someone performs the action."},{"t":"gap","q":"She got her son ___ the laundry.","key":["to do"],"why":"Causative 'get' requires 'to' + base verb when persuading someone to do something."},{"t":"fix","q":"I got the plumber fix the leak.","key":["I got the plumber to fix the leak."],"why":"When using 'get' as a causative verb, you must include 'to' before the base verb."},{"t":"fix","q":"He had the mechanic to repair the car.","key":["He had the mechanic repair the car."],"why":"With 'have', you do not use 'to' before the base verb; it is 'have someone do something'."},{"t":"fa","q":"من آرایشگر را دعوت کردم تا موهایم را کوتاه کند.","key":["I had the hairdresser cut my hair."],"why":"This uses the 'have someone do something' structure for instructing or assigning a task."},{"t":"gap","q":"We got the neighbors ___ our plants while we were away.","key":["to water"],"why":"Using 'get' implies persuasion or arrangement, requiring 'to' + base verb."},{"t":"gap","q":"The doctor had the patient ___ an X-ray.","key":["take"],"why":"In the causative 'have' structure, the verb following the object is in its base form."},{"t":"fa","q":"او پسرش را متقاعد کرد که اتاقش را تمیز کند.","key":["She got her son to clean his room."],"why":"This translates 'persuading someone' using the 'get someone to do something' structure."}]},{"id":"t37","t":"The Grammar of Phrasal Verbs","tf":"گرامر افعال عبارتی","parts":[{"lv":"I","title":"The grammar of phrasal verbs: separable / inseparable, particle position","exp":[{"h":"Separable Phrasal Verbs","b":"Some phrasal verbs allow the object to move. If the object is a noun, it can go between the verb and the particle, or after the particle. This flexibility makes English feel more natural as you practice.","hf":"افعال عبارتی جداپذیر","bf":"برخی از افعال عبارتی اجازه می‌دهند که مفعول جابجا شود. اگر مفعول اسم باشد، می‌تواند بین فعل و ذره یا بعد از ذره قرار گیرد. این انعطاف‌پذیری با تمرین، انگلیسی را برای شما طبیعی‌تر می‌کند.","ex":[{"e":"I turned off the light.","p":"من چراغ را خاموش کردم."},{"e":"I turned the light off.","p":"من چراغ را خاموش کردم."}]},{"h":"Inseparable Phrasal Verbs","b":"Other phrasal verbs are fixed. The object must always come after the particle. You cannot split them, so pay close attention to the order of words to avoid confusion.","hf":"افعال عبارتی جداناپذیر","bf":"افعال عبارتی دیگر ثابت هستند. مفعول باید همیشه بعد از ذره بیاید. نمی‌توان آن‌ها را جدا کرد، بنابراین برای جلوگیری از سردرگمی به ترتیب کلمات دقت کنید.","ex":[{"e":"She looked after her brother.","p":"او از برادرش مراقبت کرد."},{"e":"She looked her brother after.","p":"او برادرش را بعد از خودش نگاه کرد. (غلط)"}]},{"h":"Pronoun Placement Rules","b":"When using a pronoun like 'it' or 'them', the rule changes for separable verbs. The pronoun MUST go between the verb and the particle. For inseparable verbs, the pronoun stays after the particle.","hf":"قواعد جایگذاری ضمایر","bf":"وقتی از ضمیری مانند 'it' یا 'them' استفاده می‌کنید، قانون برای افعال جداپذیر تغییر می‌کند. ضمیر MUST بین فعل و ذره قرار می‌گیرد. برای افعال جداناپذیر، ضمیر بعد از ذره می‌ماند.","ex":[{"e":"Pick it up.","p":"آن را بردار."},{"e":"Look after him.","p":"از او مراقبت کن."}]}],"tip":"Always check if a phrasal verb is separable or inseparable in a dictionary before using it with a noun object.","tipf":"همیشه قبل از استفاده از یک فعل عبارتی با مفعول اسمی، در فرهنگ لغت بررسی کنید که جداپذیر است یا جداناپذیر.","bad":[{"b":"I turned it off the light.","g":"I turned it off.","w":"You cannot use both a pronoun and a noun object for the same verb in a separable phrasal verb.","wf":"شما نمی‌توانید هم از ضمیر و هم از مفعول اسمی برای یک فعل عبارتی جداپذیر استفاده کنید."},{"b":"She looked him after.","g":"She looked after him.","w":"The verb 'look after' is inseparable, so the object cannot come before the particle.","wf":"فعل 'look after' جداناپذیر است، بنابراین مفعول نمی‌تواند قبل از ذره بیاید."},{"b":"Turn off it.","g":"Turn it off.","w":"With separable verbs, pronouns must go between the verb and the particle, not after.","wf":"با افعال جداپذیر، ضمیرها باید بین فعل و ذره قرار گیرند، نه بعد از آن."}],"gold":[{"e":"Separable verbs allow the object to move between the verb and particle.","f":"افعال جداپذیر اجازه می‌دهند مفعول بین فعل و ذره جابجا شود."},{"e":"Inseparable verbs require the object to stay after the particle.","f":"افعال جداناپذیر نیاز دارند مفعول بعد از ذره بماند."},{"e":"Pronouns always go between the verb and particle in separable phrasal verbs.","f":"ضمیرها همیشه بین فعل و ذره در افعال عبارتی جداپذیر قرار می‌گیرند."}]},{"lv":"A","title":"Grammar of Phrasal Verbs","exp":[{"h":"Separable and Inseparable","b":"Separable phrasal verbs allow the object to sit between the verb and the preposition, while inseparable ones must stay together. If the object is a noun, you can place it in either position, but if it is a pronoun, it must go between the two parts.","hf":"جداشدنی و جدانشدنی بودن","bf":"فعل‌های جداشدنی اجازه می‌دهند مفعول بین فعل و حرف اضافه قرار گیرد، اما فعل‌های جدانشدنی باید به هم چسبیده باشند. اگر مفعول اسم باشد، هر دو حالت مجاز است، اما اگر مفعول ضمیر باشد، در فعل‌های جداشدنی باید بین دو بخش قرار گیرد.","ex":[{"e":"Turn the light on.","p":"چراغ را روشن کن."},{"e":"Turn it on.","p":"آن را روشن کن."}]},{"h":"Transitive and Intransitive","b":"Transitive verbs need an object to complete their meaning, whereas intransitive verbs can stand alone without one. With transitive verbs, the object can appear before or after the verb, but intransitive verbs typically do not take an object at all.","hf":"فعل‌های لازم و متعدی","bf":"فعل‌های متعدی نیاز به مفعول دارند، در حالی که فعل‌های لازم بدون مفعول نیز کامل هستند. در فعل‌های متعدی، مفعول می‌تواند قبل یا بعد از فعل قرار گیرد، اما در فعل‌های لازم معمولاً مفعولی وجود ندارد.","ex":[{"e":"I look after the children.","p":"من از بچه‌ها مراقبت می‌کنم."},{"e":"The sun rose slowly.","p":"خورشید به آرامی طلوع کرد."}]}],"tip":"Always place short pronoun objects between the verb and the preposition in separable phrasal verbs.","tipf":"همیشه سعی کنید مفعول‌های کوتاه (ضمایر) را در فعل‌های جداشدنی بین فعل و حرف اضافه قرار دهید.","bad":[{"b":"I turned on it.","g":"I turned it on.","w":"When the object is a pronoun, it should not come after the preposition.","wf":"وقتی مفعول ضمیر است، نباید بعد از حرف اضافه بیاید."},{"b":"She gave up smoking.","g":"She gave smoking up.","w":"Although this structure is not strictly wrong, placing the object between the verb and preposition is much more common and natural for phrasal verbs with noun objects.","wf":"اگرچه این ساختار غلط نیست، اما برای افعال جداشدنی با مفعول اسمی، قرار دادن مفعول بین فعل و حرف اضافه رایج‌تر و طبیعی‌تر است."}],"gold":[{"e":"Always put pronouns like it or them between the verb and the preposition.","f":"همیشه ضمایری مانند it یا them را بین فعل و حرف اضافه قرار دهید."},{"e":"Keep inseparable phrasal verbs together as a single unit.","f":"افعال جدانشدنی را به عنوان یک واحد واحد نگه دارید."},{"e":"Remember that transitive verbs require an object to make sense.","f":"به یاد داشته باشید که افعال متعدی برای معنی دار شدن به مفعول نیاز دارند."}]}],"ex":[{"t":"gap","q":"Please turn ___ the light. It's too dark in here.","key":["on"],"why":"Turn on is a separable phrasal verb used to activate something."},{"t":"gap","q":"I can't ___ up with his loud music anymore.","key":["put"],"why":"Put up with is an inseparable phrasal verb meaning to tolerate."},{"t":"fix","q":"She turned on the light.","key":["She turned the light on."],"why":"Turn on is separable, so the object can go between the verb and the particle."},{"t":"gap","q":"We need to figure ___ the problem before the meeting.","key":["out"],"why":"Figure out is a separable phrasal verb meaning to understand or solve."},{"t":"gap","q":"He gave ___ his job because he was tired.","key":["up"],"why":"Give up is an inseparable phrasal verb meaning to quit or stop trying."},{"t":"fix","q":"I looked after my sister.","key":["I looked my sister after."],"why":"Look after is inseparable, so the object cannot go between the verb and the particle."},{"t":"gap","q":"Can you pick ___ the kids from school?","key":["up"],"why":"Pick up is a separable phrasal verb meaning to collect someone."},{"t":"gap","q":"They broke ___ the news gently.","key":["up"],"why":"Break up is used here to mean dividing or softening the impact of news."},{"t":"fix","q":"I ran into an old friend yesterday.","key":["I ran an old friend into."],"why":"Run into is inseparable, so the object cannot be placed between the verb and the particle."},{"t":"gap","q":"Please hold ___ on the line while I check.","key":["on"],"why":"Hold on is an inseparable phrasal verb meaning to wait."},{"t":"fa","q":"لطفاً صبر کن تا من بیایم.","key":["Please wait until I come."],"why":"Wait is an intransitive phrasal verb that does not take a direct object in this context."},{"t":"fa","q":"او تصمیم گرفت درس خواندن را رها کند.","key":["He decided to give up studying."],"why":"Give up is an inseparable phrasal verb, so the gerund follows the particle."},{"t":"gap","q":"Please turn ___ the music; it's too loud.","key":["down"],"why":"Separable phrasal verb 'turn down' meaning to reduce volume."},{"t":"gap","q":"I need to look ___ the word in the dictionary.","key":["up"],"why":"Separable phrasal verb 'look up' meaning to search for information."},{"t":"fix","q":"She gave up it because it was too difficult.","key":["She gave it up because it was too difficult."],"why":"With separable phrasal verbs, a pronoun object must come between the verb and the particle."},{"t":"fix","q":"We ran into with an old friend at the mall.","key":["We ran into an old friend at the mall."],"why":"'Run into' is inseparable and does not take 'with' when meaning to meet by chance."},{"t":"gap","q":"Can you pick ___ after your brother tonight?","key":["up"],"why":"Separable phrasal verb 'pick up' meaning to collect someone."},{"t":"gap","q":"The meeting was called ___ due to the storm.","key":["off"],"why":"Inseparable phrasal verb 'call off' meaning to cancel."},{"t":"fa","q":"او باید روی درس‌هایش تمرکز کند.","key":["He needs to focus on his studies."],"why":"'Focus on' is a standard prepositional verb construction often used in academic contexts."},{"t":"fa","q":"آیا می‌توانی این کار را فردا انجام دهی؟","key":["Can you do this task tomorrow?"],"why":"Simple request using the separable phrasal verb 'do' (or just 'perform') in a future context."}]},{"id":"t38","t":"Dependent Prepositions","tf":"حروف اضافهٔ وابسته","parts":[{"lv":"A","title":"Dependent Prepositions","exp":[{"h":"General Rules and Structures","b":"At an advanced level, many verbs, adjectives, and nouns come with specific prepositions that you must learn as a single unit. These combinations often do not follow the logic of literal translation, and changing the preposition can completely alter the meaning. Remembering these patterns is essential for mastering academic writing and speaking skills.","hf":"قواعد کلی و ساختارها","bf":"در سطح پیشرفته، بسیاری از فعل‌ها، صفت‌ها و اسم‌ها با حرف اضافه مشخصی می‌آیند که باید به عنوان یک واحد یاد گرفته شوند. این ترکیب‌ها اغلب از منطق ترجمه تحت‌الفظی پیروی نمی‌کنند و تغییر حرف اضافه می‌تواند معنا را کاملاً دگرگون کند. به خاطر سپردن این الگوها برای تسلط بر مهارت نگارش و گفتار آکادمیک ضروری است.","ex":[{"e":"She is fully committed to improving the company's environmental policy.","p":"او کاملاً متعهد به بهبود سیاست زیست‌محیطی شرکت است."},{"e":"We must refrain from making hasty decisions during the crisis.","p":"ما باید در طول بحران از گرفتن تصمیمات عجولانه خودداری کنیم."}]},{"h":"Subtle Differences in Context","b":"Some words take different prepositions depending on the sentence context or subtle shifts in meaning, which shows a high level of language proficiency. Paying attention to these differences prevents subtle grammatical errors in formal texts.","hf":"تفاوت‌های ظریف در بافت‌های پیشرفته","bf":"برخی واژگان بسته به بافت جمله یا تغییر ظریف معنایی، حرف اضافه متفاوتی می‌پذیرند که نشان‌دهنده تسلط زبانی بالاست. دقت به این تفاوت‌ها مانع از بروز خطاهای گرامری نامحسوس در متون رسمی می‌شود.","ex":[{"e":"The scientist was credited with discovering the new particle.","p":"این دانشمند به خاطر کشف ذره جدید مستحق تقدیر شناخته شد."},{"e":"The success of the project is credited to the entire team.","p":"موفقیت پروژه به کل تیم نسبت داده می‌شود."}]}],"tip":"Never memorize dependent prepositions in isolation; always learn them as part of the whole phrase, such as succeed in or capable of.","tipf":"حرف‌های اضافه وابسته را هرگز به صورت مجزا حفظ نکنید؛ همیشه آن‌ها را در قالب کل عبارت (مثل succeed in یا capable of) به خاطر بسپارید.","bad":[{"b":"He is capable to handle complex projects.","g":"He is capable of handling complex projects.","w":"The adjective capable always comes with the preposition of, and the verb following it must take the ing form.","wf":"صفت capable همیشه با حرف اضافه of می‌آید و بعد از آن فعل به شکل ing-دار می‌گیرد."},{"b":"I object to participate in this unethical procedure.","g":"I object to participating in this unethical procedure.","w":"The phrase object to contains a real preposition to, so the following verb must take the ing ending, not the infinitive with to.","wf":"عبارت object to یک حرف اضافه واقعی (to) دارد، بنابراین فعل بعدی باید پسوند ing بگیرد نه مصدر با to."},{"b":"She succeeded to pass the rigorous exam.","g":"She succeeded in passing the rigorous exam.","w":"The verb succeed always comes with the preposition in, unlike what Persian speakers might naturally expect to use.","wf":"فعل succeed برخلاف تمایل فارسی‌زبانان به استفاده از to، همیشه با حرف اضافه in همراه است."}],"gold":[{"e":"Always treat the verb and its preposition as one unbreakable chunk when you learn a new word.","f":"همیشه فعل و حرف اضافه‌اش را به عنوان یک واحد نشکن‌پذیر هنگام یادگیری کلمه جدید در نظر بگیرید."},{"e":"Check if the word following the preposition is a noun or a verb, as this changes the form you need.","f":"بررسی کنید که کلمه بعد از حرف اضافه اسم است یا فعل، زیرا این موضوع شکل مورد نیاز شما را تغییر می‌دهد."},{"e":"Practice using these phrases in full sentences to reinforce the correct preposition in your memory.","f":"برای تقویت حافظه‌تان در مورد حرف اضافه صحیح، این عبارات را در جملات کامل تمرین کنید."}]},{"lv":"A","title":"Complex prepositions and connectors: in terms of / with regard to","exp":[{"h":"Using 'in terms of'","b":"You use 'in terms of' when you want to specify the aspect or category you are discussing. It helps you narrow down the topic to a specific area, such as price, quality, or performance. Think of it as saying 'from the perspective of'.","hf":"استفاده از 'in terms of'","bf":"وقتی می‌خواهید جنبه یا دسته‌ای که درباره آن صحبت می‌کنید را مشخص کنید، از 'in terms of' استفاده می‌کنید. این عبارت به شما کمک می‌کند موضوع را به یک حوزه خاص مانند قیمت، کیفیت یا عملکرد محدود کنید. آن را به معنای 'از دیدگاهِ' در نظر بگیرید.","ex":[{"e":"The car is expensive in terms of fuel consumption.","p":"این خودرو از نظر مصرف سوخت گران است."},{"e":"In terms of quality, this brand is excellent.","p":"از نظر کیفیت، این برند عالی است."}]},{"h":"Using 'with regard to'","b":"'With regard to' is a slightly more formal way to introduce a topic. It is often used in business or academic contexts to refer to a specific subject. You can replace it with 'about' or 'concerning' in many cases.","hf":"استفاده از 'with regard to'","bf":"'with regard to' روشی کمی رسمی‌تر برای معرفی یک موضوع است. این عبارت اغلب در زمینه‌های تجاری یا آکادمیک برای اشاره به یک موضوع خاص استفاده می‌شود. شما می‌توانید در بسیاری از موارد آن را با 'about' یا 'concerning' جایگزین کنید.","ex":[{"e":"We need to discuss the budget with regard to the new project.","p":"ما باید درباره بودجه‌ی پروژه جدید بحث کنیم."},{"e":"With regard to your question, the answer is yes.","p":"در خصوص سوال شما، پاسخ مثبت است."}]},{"h":"Comparing the two phrases","b":"Both phrases allow you to focus on a specific detail. 'In terms of' is very common in everyday speech, while 'with regard to' sounds more professional. Choose 'in terms of' for general comparisons and 'with regard to' for formal references.","hf":"مقایسه این دو عبارت","bf":"هر دو عبارت به شما اجازه می‌دهند بر جزئیات خاصی تمرکز کنید. عبارت 'in terms of' در گفتگوی روزمره بسیار رایج است، در حالی که 'with regard to' حرفه‌ای‌تر به نظر می‌رسد. برای مقایسه‌های عمومی 'in terms of' و برای ارجاعات رسمی 'with regard to' را انتخاب کنید.","ex":[{"e":"In terms of speed, this phone is better.","p":"از نظر سرعت، این گوشی بهتر است."},{"e":"With regard to speed, this phone is better.","p":"از نظر سرعت، این گوشی بهتر است."}]}],"tip":"Remember that 'in terms of' is followed by a noun or noun phrase, not a full sentence.","tipf":"به یاد داشته باشید که بعد از 'in terms of' یک اسم یا گروه اسمی می‌آید، نه یک جمله کامل.","bad":[{"b":"In terms of the price is high.","g":"In terms of price, it is high.","w":"You cannot use a full clause (subject + verb) directly after the preposition. You need a noun phrase.","wf":"شما نمی‌توانید یک جمله کامل (فاعل + فعل) را مستقیماً بعد از این عبارت استفاده کنید؛ بلکه به یک گروه اسمی نیاز دارید."},{"b":"With regard to he is late.","g":"With regard to his lateness.","w":"Similar to the previous error, you need a noun after 'with regard to', not a subject and verb.","wf":"مشابه خطای قبلی، بعد از 'with regard to' به یک اسم نیاز دارید، نه فاعل و فعل."},{"b":"In terms of, the food was good.","g":"In terms of food, it was good.","w":"Do not leave the preposition hanging without an object. You must specify what aspect you are talking about.","wf":"این عبارت را بدون مفعول رها نکنید؛ باید مشخص کنید درباره چه جنبه‌ای صحبت می‌کنید."}],"gold":[{"e":"Use 'in terms of' + noun to specify the aspect of comparison.","f":"از 'in terms of' + اسم برای مشخص کردن جنبه مقایسه استفاده کنید."},{"e":"Use 'with regard to' + noun for formal references to a topic.","f":"از 'with regard to' + اسم برای ارجاعات رسمی به یک موضوع استفاده کنید."},{"e":"Never follow these prepositions with a full independent clause without a conjunction.","f":"هرگز این عبارات را با یک جمله مستقل کامل (بدون ارتباط‌دهنده مناسب) دنبال نکنید."}]}],"ex":[{"t":"gap","q":"She is good ___ playing the piano.","key":["at"],"why":"The adjective 'good' is followed by the preposition 'at' when referring to a skill."},{"t":"gap","q":"He is interested ___ learning Persian.","key":["in"],"why":"The adjective 'interested' is typically followed by the preposition 'in'."},{"t":"gap","q":"They are afraid ___ spiders.","key":["of"],"why":"The adjective 'afraid' is followed by the preposition 'of'."},{"t":"fix","q":"She is interested to learn Persian.","key":["She is interested in learning Persian."],"why":"The correct preposition for 'interested' is 'in', not 'to'."},{"t":"gap","q":"He depends ___ his parents for support.","key":["on"],"why":"The verb 'depend' is followed by the preposition 'on' or 'upon'."},{"t":"gap","q":"We arrived ___ the airport late.","key":["at"],"why":"The verb 'arrive' takes 'at' for specific locations like airports or stations."},{"t":"fix","q":"She is married with a doctor.","key":["She is married to a doctor."],"why":"The correct preposition after 'married' is 'to', not 'with'."},{"t":"gap","q":"I am tired ___ waiting for the bus.","key":["of"],"why":"The adjective 'tired' is followed by the preposition 'of' when referring to an activity."},{"t":"gap","q":"She apologized ___ being late.","key":["for"],"why":"The verb 'apologize' is followed by the preposition 'for'."},{"t":"fix","q":"He is angry with the situation.","key":["He is angry about the situation."],"why":"While 'with' is used for people, 'about' or 'at' is typically used for situations or events."},{"t":"fa","q":"او به یادگیری زبان انگلیسی علاقه‌مند است.","key":["He is interested in learning English."],"why":"The Persian phrase 'علاقه‌مند است' translates to 'is interested in' in English."},{"t":"gap","q":"She is proud ___ her daughter's achievements.","key":["of"],"why":"The adjective 'proud' is followed by the preposition 'of'."},{"t":"gap","q":"She is accustomed ___ working late hours.","key":["to"],"why":"The adjective 'accustomed' is followed by the preposition 'to'."},{"t":"gap","q":"He succeeded ___ passing the exam on his first try.","key":["in"],"why":"The verb 'succeed' is followed by the preposition 'in'."},{"t":"fix","q":"She is interested on learning Persian.","key":["She is interested in learning Persian."],"why":"The correct preposition for 'interested' is 'in', not 'on'."},{"t":"fix","q":"He is dependent on his parents for financial support.","key":["He is dependent on his parents for financial support."],"why":"The sentence is already correct; 'dependent' takes the preposition 'on'."},{"t":"gap","q":"We need to talk ___ the details of the project.","key":["about"],"why":"The verb 'talk' is commonly followed by 'about' when discussing a topic."},{"t":"gap","q":"In terms ___ quality, this product is superior.","key":["of"],"why":"The complex preposition phrase is 'in terms of'."},{"t":"fa","q":"او با دوستش درباره سفر صحبت کرد.","key":["He talked with his friend about the trip."],"why":"'Talk' takes 'with' for the person and 'about' for the topic."},{"t":"gap","q":"With regard ___ the budget, we need to cut costs.","key":["to"],"why":"The complex preposition phrase is 'with regard to'."}]},{"id":"t39","t":"Linking Words and Connectors","tf":"کلمات ربط و پیوند","parts":[{"lv":"B","title":"and / but / or / so / because","exp":[{"h":"Connecting similar ideas with 'and'","b":"Use 'and' to join two ideas that are alike or happen together. It is the simplest way to add information. Think of it as a bridge between two positive thoughts.","hf":"اتصال ایده‌های مشابه با 'and'","bf":"از 'and' برای پیوند دادن دو ایده که شبیه هستند یا همزمان رخ می‌دهند استفاده کنید. این ساده‌ترین راه برای افزودن اطلاعات است. آن را مانند پلی بین دو فکر مثبت در نظر بگیرید.","ex":[{"e":"I like tea and coffee.","p":"من چای و قهوه دوست دارم."},{"e":"She is smart and hardworking.","p":"او باهوش و سخت‌کوش است."}]},{"h":"Showing contrast with 'but'","b":"Use 'but' when the second part of your sentence is different or opposite to the first part. It highlights a change or a problem. It is very common in daily conversation.","hf":"نشان دادن تضاد با 'but'","bf":"از 'but' زمانی استفاده کنید که بخش دوم جمله با بخش اول متفاوت یا متضاد باشد. آن تغییر یا مشکل را برجسته می‌کند. این در مکالمات روزمره بسیار رایج است.","ex":[{"e":"I am tired but happy.","p":"خسته هستم اما خوشحال."},{"e":"It is cold but sunny.","p":"سرد است اما آفتابی."}]},{"h":"Explaining reasons with 'because'","b":"Use 'because' to give a reason for something. It answers the question 'why?'. You can put it at the start or in the middle of your sentence.","hf":"توضیح دلایل با 'because'","bf":"از 'because' برای دادن دلیل چیزی استفاده کنید. این سوال 'چرا؟' را پاسخ می‌دهد. می‌توانید آن را در ابتدا یا در وسط جمله قرار دهید.","ex":[{"e":"I stayed home because it rained.","p":"من خانه ماندم چون باران بارید."},{"e":"She smiled because she was happy.","p":"او لبخند زد چون خوشحال بود."}]}],"tip":"Remember that 'because' explains the reason, while 'so' shows the result. Do not use both in the same sentence.","tipf":"به یاد داشته باشید که 'because' دلیل را توضیح می‌دهد، در حالی که 'so' نتیجه را نشان می‌دهد. از هر دو در یک جمله استفاده نکنید.","bad":[{"b":"I was tired so I slept.","g":"I was tired, so I slept.","w":"You need a comma before 'so' when it connects two independent clauses.","wf":"وقتی 'so' دو جمله مستقل را به هم وصل می‌کند، قبل از آن نیاز به ویرگول دارید."},{"b":"Because I was tired, so I slept.","g":"Because I was tired, I slept.","w":"Do not use 'because' and 'so' together. Choose one connector.","wf":"از 'because' و 'so' با هم استفاده نکنید. یک اتصال‌دهنده را انتخاب کنید."},{"b":"I like tea but I don't like coffee.","g":"I like tea, but I don't like coffee.","w":"Use a comma before 'but' when it joins two complete sentences.","wf":"وقتی 'but' دو جمله کامل را به هم وصل می‌کند، قبل از آن ویرگول بگذارید."}],"gold":[{"e":"Use 'and' to add information.","f":"از 'and' برای افزودن اطلاعات استفاده کنید."},{"e":"Use 'but' to show a difference.","f":"از 'but' برای نشان دادن تفاوت استفاده کنید."},{"e":"Use 'because' to give a reason.","f":"از 'because' برای دادن دلیل استفاده کنید."}]},{"lv":"B","title":"although / but / however (contrast, basic)","exp":[{"h":"Using 'although' to start a contrast","b":"You can start a sentence with 'although' to show a contrast. This word connects two ideas that seem opposite. It is very common in both speaking and writing.","hf":"استفاده از 'although' برای شروع یک تقابل","bf":"شما می‌توانید جمله را با 'although' شروع کنید تا تقابلی را نشان دهید. این کلمه دو ایده را که به نظر متضاد می‌آیند به هم متصل می‌کند. این کلمه در گفتار و نوشتار بسیار رایج است.","ex":[{"e":"Although it was raining, we went out.","p":"اگرچه باران می‌بارید، ما بیرون رفتیم."},{"e":"Although she is tired, she keeps working.","p":"اگرچه او خسته است، اما به کار کردن ادامه می‌دهد."}]},{"h":"Using 'but' in the middle of a sentence","b":"Use 'but' to connect two parts of a sentence. It comes in the middle, not at the start. This is the most natural way to show contrast in everyday English.","hf":"استفاده از 'but' در وسط جمله","bf":"از 'but' برای اتصال دو بخش از یک جمله استفاده کنید. این کلمه در وسط می‌آید، نه در ابتدا. این طبیعی‌ترین راه برای نشان دادن تقابل در انگلیسی روزمره است.","ex":[{"e":"I wanted to go, but I was too busy.","p":"می‌خواستم بروم، اما خیلی مشغول بودم."},{"e":"The food was good, but it was expensive.","p":"غذا خوب بود، اما گران بود."}]},{"h":"Using 'however' for formal contrast","b":"'However' is a bit more formal than 'but'. You can use it to start a new sentence or after a semicolon. It sounds professional and clear.","hf":"استفاده از 'however' برای تقابل رسمی‌تر","bf":"کلمه 'however' کمی رسمی‌تر از 'but' است. می‌توانید آن را برای شروع یک جمله جدید یا بعد از نقطه‌ویرگول استفاده کنید. این کلمه حرفه‌ای و واضح به نظر می‌رسد.","ex":[{"e":"It was cold. However, we enjoyed the walk.","p":"هوا سرد بود. با این حال، از پیاده‌روی لذت بردیم."},{"e":"He is young; however, he is very smart.","p":"او جوان است؛ با این حال، بسیار هوشمند است."}]}],"tip":"Do not use 'although' and 'but' in the same sentence. Choose one or the other.","tipf":"از 'although' و 'but' در یک جمله به طور همزمان استفاده نکنید. یکی را انتخاب کنید.","bad":[{"b":"Although it was raining, but we went out.","g":"Although it was raining, we went out.","w":"In English, you cannot use 'although' and 'but' together. 'Although' already shows the contrast.","wf":"در انگلیسی نمی‌توانید 'although' و 'but' را با هم به کار ببرید. خود 'although' مفهوم تقابل را می‌رساند."},{"b":"But although it was raining, we went out.","g":"Although it was raining, we went out.","w":"Start with 'although' or 'but', not both. Using both is redundant and incorrect.","wf":"با 'although' یا 'but' جمله را شروع کنید، نه هر دو. استفاده از هر دو حشو و نادرست است."},{"b":"However, I like tea, but I prefer coffee.","g":"I like tea. However, I prefer coffee.","w":"'However' usually starts a new sentence or clause. Do not mix it with 'but' in the same structure.","wf":"کلمه 'however' معمولاً یک جمله یا بند جدید را آغاز می‌کند. آن را با 'but' در یک ساختار ترکیب نکنید."}],"gold":[{"e":"Use 'although' at the start, 'but' in the middle, and 'however' for formal breaks.","f":"از 'although' در ابتدا، از 'but' در وسط و از 'however' برای تفکیک رسمی‌تر استفاده کنید."},{"e":"Never combine 'although' with 'but' in one sentence.","f":"هرگز 'although' را با 'but' در یک جمله ترکیب نکنید."},{"e":"'However' is more formal than 'but' and often starts a new sentence.","f":"کلمه 'however' رسمی‌تر از 'but' است و اغلب جمله جدیدی را آغاز می‌کند."}]},{"lv":"I","title":"although / even though / in spite of / despite / however","exp":[{"h":"Using 'although' and 'even though'","b":"These words introduce a contrast between two ideas. You use them when the first part of the sentence makes the second part surprising. 'Even though' is slightly stronger than 'although'.","hf":"استفاده از although و even though","bf":"این کلمات تضاد بین دو ایده را نشان می‌دهند. زمانی از آن‌ها استفاده می‌کنید که بخش اول جمله باعث شود بخش دوم تعجب‌انگیز به نظر برسد. عبارت 'even though' کمی قوی‌تر از 'although' است.","ex":[{"e":"Although it was raining, we went out.","p":"با اینکه باران می‌بارید، ما بیرون رفتیم."},{"e":"Even though he is tired, he keeps working.","p":"حتی با وجود اینکه او خسته است، به کار کردن ادامه می‌دهد."}]},{"h":"Using 'despite' and 'in spite of'","b":"These phrases are followed by a noun or a gerund (-ing form), not a full sentence. They mean the same as 'although', but the grammar structure is different.","hf":"استفاده از despite و in spite of","bf":"این عبارت‌ها پیش از یک اسم یا شکل ing-دار (اسم مصدر) می‌آیند، نه یک جمله کامل. آن‌ها هم‌معنی 'although' هستند، اما ساختار گرامری متفاوتی دارند.","ex":[{"e":"We went out despite the rain.","p":"ما با وجود باران بیرون رفتیم."},{"e":"In spite of feeling tired, he kept working.","p":"با وجود احساس خستگی، او به کار کردن ادامه داد."}]},{"h":"Using 'however'","b":"'However' is an adverb used to show contrast. It usually starts a new sentence or comes after a semicolon. It is more formal than 'but'.","hf":"استفاده از however","bf":"کلمه 'however' قیدی است که برای نشان دادن تضاد به کار می‌رود. این کلمه معمولاً جمله جدیدی را شروع می‌کند یا پس از نقطه ویرگول (;) می‌آید. همچنین از 'but' رسمی‌تر است.","ex":[{"e":"It was raining. However, we went out.","p":"باران می‌بارید. با این حال، ما بیرون رفتیم."},{"e":"He was tired; however, he kept working.","p":"او خسته بود؛ با این حال، به کار کردن ادامه داد."}]}],"tip":"Remember that 'although' and 'even though' need a subject and a verb, while 'despite' and 'in spite of' need a noun or -ing form.","tipf":"به یاد داشته باشید که 'although' و 'even though' به فاعل و فعل نیاز دارند، در حالی که 'despite' و 'in spite of' با اسم یا شکل ing-دار می‌آیند.","bad":[{"b":"Despite it was raining, we went out.","g":"Although it was raining, we went out.","w":"'Despite' cannot be followed by a full sentence with a subject and verb. Use 'although' or 'despite the rain'.","wf":"بعد از 'despite' نمی‌توان از یک جمله کامل با فاعل و فعل استفاده کرد. از 'although' یا 'despite the rain' استفاده کنید."},{"b":"However, we went out, it was raining.","g":"It was raining. However, we went out.","w":"'However' cannot connect two clauses like 'but'. It should start a new sentence or follow a semicolon.","wf":"کلمه 'however' نمی‌تواند مانند 'but' دو بند را به هم متصل کند. این کلمه باید جمله جدیدی را آغاز کند یا بعد از نقطه ویرگول بیاید."},{"b":"In spite of he was tired, he worked.","g":"In spite of being tired, he worked.","w":"'In spite of' needs a noun or gerund, not a full clause with 'he was'.","wf":"عبارت 'In spite of' به اسم یا اسم مصدر نیاز دارد، نه یک بند کامل همراه با 'he was'."}],"gold":[{"e":"Use 'although/even though' with clauses (subject + verb) and 'despite/in spite of' with nouns or gerunds.","f":"از 'although/even though' با بندها (فاعل + فعل) و از 'despite/in spite of' با اسامی یا افعال ing-دار استفاده کنید."},{"e":"'However' is an adverb and should be punctuated carefully, often starting a new sentence.","f":"کلمه 'however' یک قید است و باید نقطه‌گذاری آن با دقت انجام شود؛ این کلمه اغلب آغازگر یک جمله جدید است."},{"e":"'Even though' emphasizes the contrast more strongly than 'although'.","f":"عبارت 'Even though' تضاد را با تأکید بیشتری نسبت به 'although' بیان می‌کند."}]},{"lv":"I","title":"because / because of / due to / owing to","exp":[{"h":"Using 'because' with a clause","b":"Use 'because' when you want to explain the reason using a subject and a verb. It connects two complete ideas in one sentence. Think of it as the most direct way to say 'why' something happened.","hf":"استفاده از 'because' با یک جمله کامل","bf":"وقتی می‌خواهید دلیل را با یک فاعل و فعل توضیح دهید، از 'because' استفاده کنید. آن دو ایده کامل را در یک جمله به هم متصل می‌کند. آن را مستقیم‌ترین راه برای گفتن 'چرا' چیزی اتفاق افتاده است، در نظر بگیرید.","ex":[{"e":"I stayed home because it was raining.","p":"من در خانه ماندم چون باران می‌بارید."},{"e":"She was late because she missed the bus.","p":"او دیر رسید چون اتوبوس را از دست داد."}]},{"h":"Using 'because of' with a noun phrase","b":"Use 'because of' followed by a noun or a noun phrase. It is slightly more formal than 'because' but very common in everyday speech. Remember, you cannot put a full sentence after 'because of'.","hf":"استفاده از 'because of' با یک عبارت اسمی","bf":"از 'because of' بعد از یک اسم یا عبارت اسمی استفاده کنید. آن کمی رسمی‌تر از 'because' است اما در گفتگوهای روزمره بسیار رایج است. به یاد داشته باشید، نمی‌توانید یک جمله کامل را بعد از 'because of' بگذارید.","ex":[{"e":"We canceled the trip because of the rain.","p":"ما سفر را به خاطر باران لغو کردیم."},{"e":"He failed because of his lack of preparation.","p":"او به خاطر عدم آمادگی خود شکست خورد."}]},{"h":"Using 'due to' and 'owing to'","b":"These phrases are more formal and often used in writing or official contexts. 'Due to' means 'caused by' and usually follows the verb 'to be'. 'Owing to' is similar but can start a sentence.","hf":"استفاده از 'due to' و 'owing to'","bf":"این عبارات رسمی‌تر هستند و اغلب در نوشتار یا زمینه‌های رسمی استفاده می‌شوند. 'Due to' به معنای 'ناشی از' است و معمولاً بعد از فعل 'to be' می‌آید. 'Owing to' مشابه آن است اما می‌تواند یک جمله را شروع کند.","ex":[{"e":"The delay was due to traffic.","p":"تأخیر به خاطر ترافیک بود."},{"e":"Owing to bad weather, the flight was delayed.","p":"به خاطر وضعیت بد آب و هوا، پرواز تاخیر داشت."}]}],"tip":"Remember: 'because' needs a verb, while 'because of' needs a noun.","tipf":"به یاد داشته باشید: 'because' نیاز به یک فعل دارد، در حالی که 'because of' نیاز به یک اسم دارد.","bad":[{"b":"I was late because of I missed the bus.","g":"I was late because I missed the bus.","w":"You cannot use 'because of' before a subject and verb. Use 'because' instead.","wf":"نمی‌توانید قبل از فاعل و فعل از 'because of' استفاده کنید. به جای آن از 'because' استفاده کنید."},{"b":"The game was canceled due to it was raining.","g":"The game was canceled because it was raining.","w":"'Due to' should be followed by a noun, not a full clause with a verb.","wf":"عبارت 'due to' باید با یک اسم دنبال شود، نه یک جمله کامل با فعل."},{"b":"She succeeded because of hard work.","g":"She succeeded because of hard work.","w":"You need a possessive adjective before the noun 'hard work' to make it natural.","wf":"شما نیاز به یک صفت ملکی قبل از اسم 'hard work' دارید تا آن طبیعی به نظر برسد."}],"gold":[{"e":"Use 'because' + subject + verb.","f":"از 'because' + فاعل + فعل استفاده کنید."},{"e":"Use 'because of' + noun/noun phrase.","f":"از 'because of' + اسم/عبارت اسمی استفاده کنید."},{"e":"Use 'due to' after the verb 'to be' to mean 'caused by'.","f":"از 'due to' بعد از فعل 'to be' استفاده کنید تا به معنای 'ناشی از' باشد."}]},{"lv":"I","title":"Purpose and result: to / for / so that / so … that","exp":[{"h":"Purpose with 'to' and 'for'","b":"We use 'to' before a verb to show purpose, like 'I went to the shop to buy milk'. For nouns, we use 'for', as in 'This gift is for you'. It is simple and direct.","hf":"هدف با to و for","bf":"ما از to قبل از فعل برای نشان دادن هدف استفاده می‌کنیم، مثل 'I went to the shop to buy milk'. برای اسم‌ها از for استفاده می‌کنیم، مثل 'This gift is for you'. ساده و مستقیم است.","ex":[{"e":"I study hard to pass the exam.","p":"من سخت درس می‌خوانم تا در امتحان قبول شوم."},{"e":"This coffee is for my friend.","p":"این قهوه برای دوست من است."}]},{"h":"Result with 'so ... that'","b":"Use 'so ... that' to show a result. For example, 'The tea was so hot that I couldn't drink it.' This structure connects the cause to the outcome clearly.","hf":"نتیجه با so ... that","bf":"از so ... that برای نشان دادن نتیجه استفاده کنید. مثلا، 'The tea was so hot that I couldn't drink it.' این ساختار علت را به نتیجه به وضوح متصل می‌کند.","ex":[{"e":"She was so tired that she fell asleep.","p":"او آنقدر خسته بود که خوابش برد."},{"e":"The box is so heavy that I cannot lift it.","p":"جعبه آنقدر سنگین است که نمی‌توانم آن را بلند کنم."}]},{"h":"Purpose with 'so that'","b":"Use 'so that' when you want to explain why someone does something, often with modal verbs like can or could. For instance, 'I speak slowly so that you can understand.'","hf":"هدف با so that","bf":"از so that زمانی استفاده کنید که می‌خواهید دلیل کاری را توضیح دهید، اغلب با افعال مدال مثل can یا could. مثلا، 'I speak slowly so that you can understand.'","ex":[{"e":"He saved money so that he could buy a car.","p":"او پول پس‌انداز کرد تا بتواند ماشین بخرد."},{"e":"We left early so that we wouldn't be late.","p":"ما زود رفتیم تا دیر نرسیم."}]}],"tip":"Remember: 'to' is followed by a verb, while 'for' is followed by a noun.","tipf":"به یاد داشته باشید: بعد از 'to' فعل می‌آید، در حالی که بعد از 'for' اسم قرار می‌گیرد.","bad":[{"b":"I went to the shop for buy milk.","g":"I went to the shop to buy milk.","w":"We use 'to' + verb for purpose, not 'for'.","wf":"ما برای هدف از 'to' + فعل استفاده می‌کنیم، نه 'for'."},{"b":"The tea was so hot I couldn't drink it.","g":"The tea was so hot that I couldn't drink it.","w":"In formal English, 'that' is usually included after 'so' in this structure.","wf":"در انگلیسی رسمی، معمولاً بعد از 'so' در این ساختار 'that' ذکر می‌شود."},{"b":"I study hard for pass the exam.","g":"I study hard to pass the exam.","w":"Use 'to' before a verb to show purpose, not 'for'.","wf":"برای نشان دادن هدف قبل از فعل از 'to' استفاده کنید، نه 'for'."}],"gold":[{"e":"Use 'to' + base verb for purpose.","f":"برای هدف از 'to' + فعل ساده استفاده کنید."},{"e":"Use 'so ... that' to emphasize the result.","f":"از 'so ... that' برای تأکید بر نتیجه استفاده کنید."},{"e":"Use 'so that' with modals like 'can' or 'could'.","f":"از 'so that' با افعال مدال مثل 'can' یا 'could' استفاده کنید."}]},{"lv":"A","title":"Linking Words and Connectors","exp":[{"h":"Using However and Whereas","b":"You use however to show a contrast between two ideas, usually placing a comma after it. Whereas is great for comparing two situations or people, and it typically appears in the middle of your sentence to link them smoothly.","hf":"استفاده از However و Whereas","bf":"از however برای نشان دادن تضاد بین دو جمله استفاده می‌کنیم و پس از آن کاما می‌گذاریم. Whereas برای مقایسه دو وضعیت یا شخص به کار می‌رود و معمولاً در وسط جمله می‌آید.","ex":[{"e":"It was cold. However, we went out.","p":"سرد بود. با این حال، ما بیرون رفتیم."},{"e":"She likes tea, whereas he prefers coffee.","p":"او چای دوست دارد، در حالی که او قهوه را ترجیح می‌دهد."}]},{"h":"Difference Between Despite and In spite of","b":"Both phrases mean the same thing and are used to show a contrast with the result. You should place them before a noun or a gerund to introduce the opposing fact clearly.","hf":"تفاوت Despite و In spite of","bf":"هر دو به معنی 'با وجود' هستند و از نظر معنایی یکسان‌اند. هر دو قبل از یک اسم یا اسم‌واره (Gerund) می‌آیند و برای بیان تضاد با نتیجه مورد استفاده قرار می‌گیرند.","ex":[{"e":"Despite the rain, we played.","p":"با وجود باران، ما بازی کردیم."},{"e":"In spite of being tired, he worked.","p":"با وجود خستگی، او کار کرد."}]},{"h":"Using Consequently","b":"Use consequently to show a logical result or consequence of something that happened before. It usually starts a new sentence and is followed by a comma to separate it from the rest of the statement.","hf":"استفاده از Consequently","bf":"این کلمه برای نشان دادن نتیجه منطقی یا عواقب یک اتفاق قبلی استفاده می‌شود و معمولاً در ابتدای جمله می‌آید و با کاما از بقیه جمله جدا می‌شود.","ex":[{"e":"He missed the bus. Consequently, he was late.","p":"او اتوبوس را از دست داد. در نتیجه، دیر رسید."},{"e":"Consequently, the project was delayed.","p":"در نتیجه، پروژه به تعویق افتاد."}]}],"tip":"Try to vary your writing by using these connectors instead of relying only on but.","tipf":"به جای استفاده بیش از حد از 'but'، از این کلمات برای متنوع‌تر کردن جملات خود استفاده کنید.","bad":[{"b":"Despite of the rain, we went out.","g":"Despite the rain, we went out.","w":"You forgot to include the word of after Despite.","wf":"بعد از Despite حرف اضافه 'of' نیامد."},{"b":"However, we went out because it was cold.","g":"It was cold. However, we went out.","w":"However usually starts a new thought, so it should not just continue the previous sentence without proper separation.","wf":"However معمولاً جمله را جدا می‌کند و با آن ادامه نمی‌دهد."},{"b":"In spite it was raining, we played.","g":"In spite of the rain, we played.","w":"In spite of must be followed by a noun or gerund, not a full sentence.","wf":"بعد از In spite of باید اسم یا Gerund بیاید، نه جمله کامل."}],"gold":[{"e":"Always remember to put a comma after however when it starts a clause.","f":"همیشه به یاد داشته باشید که بعد از however وقتی یک عبارت را شروع می‌کند، باید ویرگول بگذارید."},{"e":"Use despite or in spite of only before nouns or gerunds, not full sentences.","f":"از despite یا in spite of فقط قبل از اسم‌ها یا فعل‌های مصدری استفاده کنید، نه قبل از جملات کامل."},{"e":"Use consequently to show a direct result, and place it at the beginning of the sentence.","f":"از consequently برای نشان دادن یک نتیجه مستقیم استفاده کنید و آن را در ابتدای جمله قرار دهید."}]},{"lv":"A","title":"Discourse markers in writing: moreover / nevertheless / on the other hand","exp":[{"h":"Adding Information with Moreover","b":"Use 'moreover' when you want to add a stronger or additional point that supports your previous statement. It is like saying 'in addition' but sounds more formal and academic. It helps your writing flow logically from one idea to the next.","hf":"افزودن اطلاعات با Moreover","bf":"وقتی می‌خواهید نکته قوی‌تر یا اضافی‌ای را که از جمله قبلی شما حمایت می‌کند اضافه کنید، از 'moreover' استفاده کنید. این کلمه شبیه 'in addition' است اما رسمی‌تر و آکادمیک‌تر به نظر می‌رسد. این کلمه به جریان منطقی نوشتن شما از یک ایده به ایده دیگر کمک می‌کند.","ex":[{"e":"The hotel is expensive. Moreover, it is far from the city center.","p":"هتل گران است. علاوه بر این، از مرکز شهر دور است."},{"e":"She is a talented singer. Moreover, she plays the piano beautifully.","p":"او یک خواننده بااستعداد است. علاوه بر این، پیانو را به زیبایی می‌نوازد."}]},{"h":"Showing Contrast with Nevertheless","b":"Use 'nevertheless' to introduce a contrasting point that is surprising or unexpected given the previous sentence. It means 'despite that' or 'however'. It is perfect for showing that something happened even though there was an obstacle.","hf":"نشان دادن تضاد با Nevertheless","bf":"از 'nevertheless' برای معرفی یک نقطه متضاد که با توجه به جمله قبلی تعجب‌آور یا غیرمنتظره است استفاده کنید. این کلمه به معنی 'با وجود آن' یا 'با این حال' است. این کلمه برای نشان دادن اینکه چیزی اتفاق افتاده است، با وجود موانع، عالی است.","ex":[{"e":"It was raining heavily. Nevertheless, we went for a walk.","p":"باران شدید می‌بارید. با این حال، ما برای پیاده‌روی رفتیم."},{"e":"He was tired. Nevertheless, he finished the work.","p":"او خسته بود. با این حال، کار را تمام کرد."}]},{"h":"Comparing Opposites with On the Other Hand","b":"Use 'on the other hand' to present a different side of an argument or a contrasting fact. It is often used with 'on the one hand' to show two different perspectives. It helps balance your writing by showing both sides.","hf":"مقایسه متضادها با On the other hand","bf":"از 'on the other hand' برای ارائه جنبه متفاوتی از یک استدلال یا یک واقعیت متضاد استفاده کنید. این عبارت اغلب با 'on the one hand' استفاده می‌شود تا دو دیدگاه مختلف را نشان دهد. این عبارت با نشان دادن هر دو طرف، به تعادل نوشتن شما کمک می‌کند.","ex":[{"e":"Living in the city is exciting. On the other hand, it can be noisy.","p":"زندگی در شهر هیجان‌انگیز است. از طرف دیگر، می‌تواند پر سر و صدا باشد."},{"e":"The job pays well. On the other hand, it requires long hours.","p":"شغل درآمد خوبی دارد. از طرف دیگر، ساعت‌های کاری طولانی می‌طلبد."}]}],"tip":"Always follow discourse markers with a comma when they start a sentence.","tipf":"همیشه وقتی نشانه‌های گفتاری (discourse markers) جمله را شروع می‌کنند، بعد از آن‌ها ویرگول بگذارید.","bad":[{"b":"The weather was bad. Nevertheless we went out.","g":"The weather was bad. Nevertheless, we went out.","w":"You need a comma after 'nevertheless' when it starts a new clause.","wf":"وقتی 'nevertheless' یک عبارت جدید را شروع می‌کند، شما نیاز به ویرگول بعد از آن دارید."},{"b":"On the other hand, I like tea. On the other hand, I like coffee.","g":"On the one hand, I like tea. On the other hand, I like coffee.","w":"When contrasting two points, use 'on the one hand' for the first point and 'on the other hand' for the second.","wf":"هنگام مقایسه دو نقطه، برای نقطه اول از 'on the one hand' و برای نقطه دوم از 'on the other hand' استفاده کنید."},{"b":"Moreover, the movie was good. Moreover, the acting was great.","g":"The movie was good. Moreover, the acting was great.","w":"Avoid starting every sentence with the same marker. Use it to connect ideas, not just to start sentences.","wf":"از شروع هر جمله با یک نشانه یکسان خودداری کنید. از آن برای اتصال ایده‌ها استفاده کنید، نه فقط برای شروع جملات."}],"gold":[{"e":"Use 'moreover' to add information.","f":"از 'moreover' برای افزودن اطلاعات استفاده کنید."},{"e":"Use 'nevertheless' to show contrast despite a previous statement.","f":"از 'nevertheless' برای نشان دادن تضاد علی‌رغم یک جمله قبلی استفاده کنید."},{"e":"Use 'on the other hand' to present a contrasting perspective.","f":"از 'on the other hand' برای ارائه یک دیدگاه متضاد استفاده کنید."}]},{"lv":"A","title":"Concession: much as / adjective + as or though","exp":[{"h":"Using 'much as' for strong concession","b":"You can use 'much as' to show that you really want something or believe something, even though there is a reason against it. It is a polite and natural way to express contrast. Think of it as saying 'I really like X, but...'.","hf":"استفاده از 'much as' برای بیان تضاد قوی","bf":"شما می‌توانید از 'much as' برای نشان دادن این استفاده کنید که چیزی را خیلی دوست دارید یا به آن باور دارید، با وجود اینکه دلیلی در تضاد با آن وجود دارد. این یک راه مودبانه و طبیعی برای بیان تضاد است. آن را به عنوان گفتن 'من واقعاً X را دوست دارم، اما...' در نظر بگیرید.","ex":[{"e":"Much as I admire her, I don't agree with her views.","p":"با وجود اینکه تحسینش می‌کنم، با نظراتش موافق نیستم."},{"e":"Much as I would like to help, I am too busy.","p":"با وجود اینکه دوست دارم کمک کنم، خیلی سرم شلوغ است."}]},{"h":"Inverting with 'Adjective + as/though'","b":"To sound more formal or literary, you can put the adjective first. The structure is 'Adjective + as/though + subject + verb'. This inversion emphasizes the concession. It is very common in written English.","hf":"جابه‎جایی با 'صفت + as/though'","bf":"برای اینکه رسمی‌تر یا ادبی‌تر به نظر برسید، می‌توانید صفت را در ابتدا قرار دهید. ساختار به صورت 'صفت + as/though + فاعل + فعل' است. این جابه‌جایی، تضاد را برجسته می‌کند. این ساختار در انگلیسی نوشتاری بسیار رایج است.","ex":[{"e":"Tired as he was, he continued working.","p":"با وجود اینکه خسته بود، به کار خود ادامه داد."},{"e":"Rich as she is, she lives simply.","p":"با وجود اینکه ثروتمند است، زندگی ساده‌ای دارد."}]},{"h":"Difference between 'as' and 'though' in inversion","b":"Both 'as' and 'though' work in this inverted structure. However, 'though' is slightly more common in modern spoken English. 'As' can sometimes feel a bit more formal or old-fashioned. Choose based on your context.","hf":"تفاوت بین 'as' و 'though' در ساختار جابه‌جایی","bf":"هم 'as' و هم 'though' در این ساختار جابه‌جایی به کار می‌روند. با این حال، 'though' در انگلیسی گفتاری مدرن کمی رایج‌تر است. 'as' گاهی اوقات کمی رسمی‌تر یا قدیمی‌تر به نظر می‌رسد. بر اساس بافت متن خود یکی را انتخاب کنید.","ex":[{"e":"Smart as he is, he made a mistake.","p":"با وجود اینکه باهوش است، اشتباهی مرتکب شد."},{"e":"Smart though he is, he made a mistake.","p":"با وجود اینکه باهوش است، اشتباهی مرتکب شد."}]}],"tip":"Remember that 'as' in this structure means 'although', not 'because'. Do not confuse it with causal 'as'.","tipf":"به یاد داشته باشید که 'as' در این ساختار به معنی 'اگرچه' است، نه 'زیرا'. آن را با 'as' به معنای علت اشتباه نگیرید.","bad":[{"b":"I like him as he is kind.","g":"I like him, though he is kind.","w":"Using 'as' here implies cause, but the context suggests concession. 'Though' or 'although' is needed.","wf":"استفاده از 'as' در اینجا علت را می‌رساند، اما بافت جمله تضاد را می‌طلبد. استفاده از 'though' یا 'although' در اینجا لازم است."},{"b":"Tired he was, he continued.","g":"Tired as he was, he continued.","w":"Inverted concession requires 'as' or 'though' after the adjective. Without it, it is not a standard concession structure.","wf":"ساختار تضاد با جابه‌جایی نیاز به 'as' یا 'though' پس از صفت دارد. بدون آن، جمله یک ساختار استاندارد برای بیان تضاد نخواهد بود."},{"b":"Much as I like, I won't go.","g":"Much as I like it, I won't go.","w":"'Much as' usually needs an object if the verb is transitive. 'Like' here needs 'it' to refer to the thing.","wf":"عبارت 'Much as' معمولاً اگر فعل متعدی باشد به مفعول نیاز دارد. فعل 'Like' در اینجا برای ارجاع به شیء مورد نظر به ضمیر 'it' نیاز دارد."}],"gold":[{"e":"Adjective + as/though + subject + verb creates a concessive clause.","f":"ساختار «صفت + as/though + فاعل + فعل» یک بند تضاد ایجاد می‌کند."},{"e":"'Much as' is followed by a clause to express strong desire or belief.","f":"عبارت 'Much as' برای بیان تمایل یا باوری قوی با یک بند (جمله واره) دنبال می‌شود."},{"e":"Inversion with 'as' is more formal than with 'though'.","f":"جابه‌جایی با 'as' رسمی‌تر از 'though' است."}]}],"ex":[{"t":"gap","q":"He wanted to buy the car, ___ he didn't have enough money.","key":["however"],"why":"However is used to introduce a contrasting statement."},{"t":"gap","q":"___ the bad weather, we enjoyed our trip.","key":["Despite"],"why":"Despite is followed by a noun phrase to show contrast."},{"t":"gap","q":"She studied hard, ___ she failed the exam.","key":["whereas"],"why":"Whereas connects two contrasting facts or situations."},{"t":"fix","q":"Despite of the rain, we went out.","key":["Despite the rain, we went out."],"why":"Despite is never followed by 'of'; use 'in spite of' if you want to keep 'of'."},{"t":"gap","q":"He didn't study, ___ he failed the test.","key":["consequently"],"why":"Consequently indicates a result or effect of the previous clause."},{"t":"gap","q":"I like tea, ___ my brother prefers coffee.","key":["whereas"],"why":"Whereas is used to compare two different preferences or facts."},{"t":"fix","q":"He was tired, so consequently he went to bed early.","key":["He was tired; consequently, he went to bed early."],"why":"Consequently is an adverb, not a conjunction, so it should not follow 'so' directly in this structure."},{"t":"gap","q":"___ his illness, he came to work.","key":["In spite of"],"why":"In spite of is followed by a noun phrase to show contrast."},{"t":"gap","q":"The road was icy; ___, many accidents occurred.","key":["consequently"],"why":"Consequently shows the result of the icy road."},{"t":"fix","q":"She is smart, however she is lazy.","key":["She is smart; however, she is lazy."],"why":"However is a conjunctive adverb and requires a semicolon before it when connecting two independent clauses."},{"t":"fa","q":"با وجود باران، ما به پارک رفتیم.","key":["Despite the rain, we went to the park."],"why":"Despite is used before a noun phrase to express contrast."},{"t":"fa","q":"او درس خواند، با این حال نمره خوبی نگرفت.","key":["He studied; however, he did not get a good grade."],"why":"However is used to introduce a contrasting result after a semicolon."},{"t":"gap","q":"I was hungry, ___ I ate a sandwich.","key":["so"],"why":"Use 'so' to show a result or consequence of the previous clause."},{"t":"gap","q":"___ it was raining, we played football outside.","key":["Although"],"why":"Use 'Although' at the start of a clause to introduce a contrast."},{"t":"fix","q":"He failed the exam because of he didn't study.","key":["He failed the exam because he didn't study."],"why":"Use 'because' followed by a clause (subject + verb), not 'because of'."},{"t":"gap","q":"She is very talented; ___, she works hard to improve.","key":["however"],"why":"Use 'however' to introduce a contrasting point in a formal context."},{"t":"fa","q":"با وجود اینکه دیر شده بود، او هنوز خانه نبود.","key":["Although it was late, he was not home yet."],"why":"Translate 'با وجود اینکه' as 'Although' followed by a full clause."},{"t":"gap","q":"The test was difficult, ___ no one passed it.","key":["so"],"why":"Use 'so' to connect a cause with its direct result."},{"t":"fix","q":"Despite of the traffic, we arrived on time.","key":["Despite the traffic, we arrived on time."],"why":"Use 'despite' without 'of' when followed by a noun phrase."},{"t":"fa","q":"او به کتابخانه رفت تا کتاب‌هایش را پیدا کند.","key":["He went to the library to find his books."],"why":"Use 'to' + infinitive to express purpose."}]},{"id":"t40","t":"Hedging and Register","tf":"متانت و سطح زبان","parts":[{"lv":"A","title":"Hedging and Register","exp":[{"h":"Using Hedging Verbs and Adverbs","b":"To avoid sounding too absolute, you can use words like seem, appear, likely, or arguably. This makes your speech sound more scientific and professional, especially at an advanced level.","hf":"استفاده از افعال وجهی و قیدها برای تعدیل ادعاها (Hedging)","bf":"در سطح پیشرفته، برای اینکه قطعی و قاطع به نظر نرسید، از کلماتی مانند seem, appear, likely, arguably و قیدهای تردید استفاده می‌کنیم. این کار باعث می‌شود سخن شما علمی‌تر و حرفه‌ای‌تر به نظر برسد.","ex":[{"e":"This policy arguably represents a significant shift in our economic strategy.","p":"این سیاست، احتمالاً (قابل‌بحث) نشان‌دهنده تغییر چشمگیری در استراتژی اقتصادی ما است."},{"e":"The research findings appear to suggest a direct correlation between stress and productivity.","p":"یافته‌های پژوهش به نظر می‌رسد ارتباط مستقیمی بین استرس و بهره‌وری را نشان می‌دهند."}]},{"h":"Formal vs Informal Structures for Hedging","b":"In formal English, use passive structures with impersonal pronouns like It is suggested or It is widely believed. In informal conversation, you are more likely to use I think or maybe.","hf":"تفاوت ساختارهای رسمی و غیررسمی در بیان تردید","bf":"در انگلیسی رسمی، از ساختارهای مجهول با ضمایر غیرشخصی (It is suggested / It is widely believed) استفاده می‌شود، در حالی که در گفتار غیررسمی تمایل داریم از I think یا maybe استفاده کنیم.","ex":[{"e":"It is generally believed that the new regulations will reduce carbon emissions.","p":"به طور عمده باور بر این است که مقررات جدید انتشار کربن را کاهش خواهد داد."},{"e":"I reckon the new rules might cut down pollution a bit.","p":"فکر کنم قوانین جدید ممکنه یه کم آلودگی رو کم کنه."}]},{"h":"Common Uses in Academic Papers and Work Emails","b":"Hedging is most common in the conclusions of academic papers and polite professional emails. It helps you avoid making definitive mistakes by softening your claims.","hf":"کاربرد رایج در مقالات آکادمیک و ایمیل‌های کاری","bf":"شایع‌ترین کاربرد زبان احتیاطی در نتیجه‌گیری مقالات و درخواست‌های ادب‌محور در محیط‌های حرفه‌ای است تا از اشتباه قطعی جلوگیری شود.","ex":[{"e":"It tends to be the case that younger employees prefer remote work.","p":"معمولاً این‌گونه است که کارمندان جوان‌تر کار از راه دور را ترجیح می‌دهند."},{"e":"I would be grateful if you could possibly review the attached document.","p":"سپاسگزار خواهم شد اگر در صورت امکان سند پیوست را بررسی کنید."}]}],"tip":"In academic wr
