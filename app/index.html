ild.","g":"I could speak Persian when I was a child.","w":"Use 'could' for general past ability, not 'managed to'.","wf":"برای توانایی کلی در گذشته از 'could' استفاده کنید، نه 'managed to'."},{"b":"I can to swim very well.","g":"I can swim very well.","w":"Do not use 'to' after 'can'.","wf":"بعد از 'can' از 'to' استفاده نکنید."},{"b":"She managed to speak Persian fluently.","g":"She is able to speak Persian fluently.","w":"Use 'be able to' for general skill, not 'managed to'.","wf":"برای مهارت کلی از 'be able to' استفاده کنید، نه 'managed to'."}],"gold":[{"e":"Use 'be able to' for all tenses except simple present and past.","f":"برای تمام زمان‌ها به جز حال ساده و گذشته ساده از 'be able to' استفاده کنید."},{"e":"Use 'managed to' when there was a difficulty or effort involved in the specific event.","f":"وقتی در یک رویداد خاص تلاش یا سختی وجود داشته است، از 'managed to' استفاده کنید."},{"e":"'Can' is for general ability; 'managed to' is for a specific success.","f":"'Can' برای توانایی کلی است؛ 'managed to' برای موفقیت خاص."}]},{"lv":"I","title":"Requests and permission: can / could / may / would you mind","exp":[{"h":"Using 'Can' for simple requests","b":"You can use 'can' to ask for something in a casual way. It is perfect for friends and family. For example, you might ask a friend to pass the salt.","hf":"استفاده از 'Can' برای درخواست‌های ساده","bf":"شما می‌توانید از 'can' برای درخواست چیزی به شکل غیررسمی استفاده کنید. این حالت برای دوستان و خانواده عالی است. برای مثال، ممکن است از دوستتان بخواهید نمک را به شما بدهد.","ex":[{"e":"Can you open the window?","p":"می‌توانی پنجره را باز کنی؟"},{"e":"Can I sit here?","p":"می‌توانم اینجا بنشینم؟"}]},{"h":"Politeness with 'Could' and 'Would you mind'","b":"When you want to be more polite, use 'could' or 'would you mind'. These forms show respect and are great for work or strangers. 'Would you mind' is very soft and gentle.","hf":"ادب با 'Could' و 'Would you mind'","bf":"وقتی می‌خواهید مودب‌تر باشید، از 'could' یا 'would you mind' استفاده کنید. این ساختارها احترام را نشان می‌دهند و برای محیط کار یا افراد غریبه عالی هستند. عبارت 'Would you mind' بسیار نرم و ملایم است.","ex":[{"e":"Could you help me with this box?","p":"می‌توانید در جابجایی این جعبه به من کمک کنید؟"},{"e":"Would you mind closing the door?","p":"ممکن است (زحمت بکشید و) در را ببندید؟"}]},{"h":"Asking for permission formally","b":"Use 'may' when you need to be very formal or polite. It is common in schools or official places. It sounds more professional than 'can'.","hf":"درخواست اجازه به صورت رسمی","bf":"وقتی می‌خواهید خیلی رسمی یا مودب باشید، از 'may' استفاده کنید. این کلمه در مدارس یا مکان‌های رسمی رایج است و نسبت به 'can' حرفه‌ای‌تر به نظر می‌رسد.","ex":[{"e":"May I come in?","p":"اجازه دارم وارد شوم؟"},{"e":"May I use your phone?","p":"می‌توانم از تلفن شما استفاده کنم؟"}]}],"tip":"Remember that 'Can' is for ability or casual requests, while 'Could' and 'May' are for politeness.","tipf":"به یاد داشته باشید که 'Can' برای بیان توانایی یا درخواست‌های غیررسمی است، در حالی که 'Could' و 'May' برای ادب و احترام به کار می‌روند.","bad":[{"b":"Can you to open the window?","g":"Can you open the window?","w":"We do not use 'to' after 'can'.","wf":"ما بعد از 'can' از 'to' استفاده نمی‌کنیم."},{"b":"Would you mind open the door?","g":"Would you mind opening the door?","w":"After 'mind', we use the -ing form of the verb.","wf":"بعد از 'mind'، از شکل ing-دار فعل استفاده می‌کنیم."},{"b":"May I opens the window?","g":"May I open the window?","w":"After 'may', we use the base form of the verb without 's'.","wf":"بعد از 'may'، از شکل پایه فعل بدون 's' استفاده می‌کنیم."}],"gold":[{"e":"Use 'can' for friends and 'could' for strangers.","f":"از 'can' برای دوستان و از 'could' برای غریبه‌ها استفاده کنید."},{"e":"'Would you mind' is followed by a verb with -ing.","f":"بعد از عبارت 'Would you mind' از فعل با پسوند ing- استفاده می‌شود."},{"e":"'May' is the most formal way to ask for permission.","f":"کلمه 'May' رسمی‌ترین روش برای درخواست اجازه است."}]},{"lv":"I","title":"Deduction: must / can't / might be","exp":[{"h":"Making Deductions with 'Must Be'","b":"Use 'must be' when you are almost certain that something is true based on the evidence you see. It shows strong confidence in your guess about a present situation.","hf":"حدس و استنتاج با 'must be'","bf":"وقتی بر اساس شواهدی که می‌بینید تقریباً مطمئن هستید که چیزی درست است، از 'must be' استفاده کنید. این نشان‌دهنده اطمینان بالا در حدس زدن درباره یک وضعیت فعلی است.","ex":[{"e":"She has been working all day; she must be tired.","p":"او تمام روز کار کرده است؛ او باید خسته باشد."},{"e":"The lights are on, so someone must be home.","p":"چراغ‌ها روشن است، پس کسی باید در خانه باشد."}]},{"h":"Expressing Certainty with 'Can't Be'","b":"Use 'can't be' when you are sure that something is NOT true. It is the negative form of deduction, indicating that a situation is impossible based on what you know.","hf":"بیان قطعیت با 'can't be'","bf":"وقتی مطمئن هستید که چیزی درست نیست، از 'can't be' استفاده کنید. این شکل منفی استنتاج است و نشان می‌دهد که یک وضعیت بر اساس آنچه می‌دانید غیرممکن است.","ex":[{"e":"He can't be at the office; he is on vacation.","p":"او نمی‌تواند در دفتر باشد؛ او در مرخصی است."},{"e":"That can't be true; it's too expensive.","p":"این نمی‌تواند درست باشد؛ خیلی گران است."}]},{"h":"Showing Possibility with 'Might Be'","b":"Use 'might be' when you think something is possible, but you are not sure. It suggests a weaker level of certainty compared to 'must' or 'can't'.","hf":"نشان دادن احتمال با 'might be'","bf":"وقتی فکر می‌کنید چیزی ممکن است، اما مطمئن نیستید، از 'might be' استفاده کنید. این سطح کمتری از قطعیت را نسبت به 'must' یا 'can't' پیشنهاد می‌دهد.","ex":[{"e":"It might rain later, so take an umbrella.","p":"شاید بعداً باران ببارد، پس چتر بردار."},{"e":"She might be late because of the traffic.","p":"او ممکن است به خاطر ترافیک دیر برسد."}]}],"tip":"Remember that 'must' and 'can't' show strong certainty, while 'might' shows possibility.","tipf":"به یاد داشته باشید که 'must' و 'can't' قطعیت قوی را نشان می‌دهند، در حالی که 'might' احتمال را نشان می‌دهد.","bad":[{"b":"He must to be at home.","g":"He must be at home.","w":"After modal verbs like 'must', we do not use 'to'.","wf":"بعد از فعل‌های وجهی مانند 'must'، ما از 'to' استفاده نمی‌کنیم."},{"b":"She can't to be tired.","g":"She can't be tired.","w":"After modal verbs like 'can't', we do not use 'to'.","wf":"بعد از فعل‌های وجهی مانند 'can't'، ما از 'to' استفاده نمی‌کنیم."},{"b":"It can rain tomorrow.","g":"It might rain tomorrow.","w":"Persian speakers often mistakenly use 'can' for possibility in affirmative sentences, whereas 'can' is generally used for ability or general possibility, not specific future or present likelihood.","wf":"فارسی‌زبانان اغلب به اشتباه از 'can' برای امکان در جملات مثبت استفاده می‌کنند، در حالی که 'can' معمولاً برای توانایی یا امکان کلی استفاده می‌شود، نه احتمال خاص در زمان حال یا آینده."}],"gold":[{"e":"Must + be + adjective/noun is used for strong positive deduction.","f":"Must + be + صفت/اسم برای استنتاج قوی مثبت استفاده می‌شود."},{"e":"Can't + be + adjective/noun is used for strong negative deduction.","f":"Can't + be + صفت/اسم برای استنتاج قوی منفی استفاده می‌شود."},{"e":"Might + be + adjective/noun is used for possible deduction.","f":"Might + be + صفت/اسم برای استنتاج احتمالی استفاده می‌شود."}]},{"lv":"I","title":"need / needn't / didn't need to","exp":[{"h":"Using 'need' as a main verb","b":"You can use 'need' like any other regular verb. It is followed by an infinitive with 'to' or a noun. This is the most common way to express necessity in modern English.","hf":"استفاده از 'need' به عنوان فعل اصلی","bf":"می‌توانید از 'need' مانند هر فعل معمولی دیگری استفاده کنید. بعد از آن مصدر با 'to' یا یک اسم می‌آید. این رایج‌ترین روش برای بیان ضرورت در انگلیسی مدرن است.","ex":[{"e":"I need to buy some milk.","p":"من باید مقداری شیر بخرم."},{"e":"She needs a new laptop for work.","p":"او برای کار به یک لپ‌تاپ جدید نیاز دارد."}]},{"h":"Using 'need' as a modal verb","b":"In formal or British English, 'need' can act as a modal verb, similar to 'can' or 'must'. It is followed by the base form of the verb without 'to'. This form is less common in American English.","hf":"استفاده از 'need' به عنوان فعل مدال","bf":"در انگلیسی رسمی یا بریتانیایی، 'need' می‌تواند مانند افعال مدال مانند 'can' یا 'must' عمل کند. بعد از آن شکل پایه فعل بدون 'to' می‌آید. این شکل در انگلیسی آمریکایی کمتر رایج است.","ex":[{"e":"Need I sign this form?","p":"آیا باید این فرم را امضا کنم؟"},{"e":"He need not worry about the deadline.","p":"او نیازی به نگرانی درباره مهلت ندارد."}]},{"h":"Expressing lack of necessity","b":"To say something is not necessary, use 'needn't' or 'don't need to'. 'Needn't' is more formal, while 'don't need to' is common in everyday speech. Both mean the same thing.","hf":"بیان عدم ضرورت","bf":"برای گفتن اینکه چیزی ضروری نیست، از 'needn't' یا 'don't need to' استفاده کنید. 'Needn't' رسمی‌تر است، در حالی که 'don't need to' در گفتگوهای روزمره رایج‌تر است. هر دو به یک معنا هستند.","ex":[{"e":"You don't need to bring food; we have plenty.","p":"شما نیازی به آوردن غذا ندارید؛ ما به اندازه کافی داریم."},{"e":"You needn't come if you are busy.","p":"اگر مشغول هستید، نیازی نیست بیایید."}]}],"tip":"Remember that 'need' as a modal verb is mostly used in questions and negative sentences in British English.","tipf":"به یاد داشته باشید که 'need' به عنوان فعل مدال بیشتر در سوالات و جملات منفی در انگلیسی بریتانیایی استفاده می‌شود.","bad":[{"b":"I need go to the store.","g":"I need to go to the store.","w":"When 'need' is a main verb, it must be followed by 'to' + base verb.","wf":"وقتی 'need' یک فعل اصلی است، باید با 'to' + فعل پایه دنبال شود."},{"b":"She needs studying harder.","g":"She needs to study harder.","w":"The verb 'need' is followed by an infinitive with 'to', not a gerund.","wf":"فعل 'need' با مصدر با 'to' دنبال می‌شود، نه با اسم مصدر."},{"b":"You needn't to wear a coat.","g":"You needn't wear a coat.","w":"When 'need' is used as a modal verb, it is followed by the base verb without 'to'.","wf":"وقتی 'need' به عنوان فعل مدال استفاده می‌شود، با فعل پایه بدون 'to' دنبال می‌شود."}],"gold":[{"e":"Use 'need to' + verb for general necessity.","f":"برای ضرورت عمومی از 'need to' + فعل استفاده کنید."},{"e":"Use 'don't need to' for things that are not necessary.","f":"برای چیزهایی که ضروری نیستند از 'don't need to' استفاده کنید."},{"e":"Use 'needn't' in formal contexts or British English.","f":"در زمینه‌های رسمی یا انگلیسی بریتانیایی از 'needn't' استفاده کنید."}]},{"lv":"A","title":"Modals in the Past","exp":[{"h":"Past Deduction and Probability","b":"You use must have to express a logical conclusion about a past event that you are fairly sure happened. If you believe something was impossible in the past, you use can't have or couldn't have to show that strong certainty about what did not occur.","hf":"استنتاج و احتمال گذشته با must have و can't have","bf":"برای بیان نتیجه‌گیری منطقی درباره یک اتفاق در گذشته از must have استفاده می‌کنیم. در مقابل، برای ناممکن بودن یک رویداد در گذشته، can't have یا couldn't have به کار می‌رود. این ساختارها نشان‌دهنده میزان قطعیت ما درباره گذشته هستند.","ex":[{"e":"The ground is wet; it must have rained last night.","p":"زمین خیس است؛ حتماً دیشب باران آمده است."},{"e":"She can't have left her keys here; I saw them in her bag.","p":"او امکان ندارد کلیدهایش را اینجا جا گذاشته باشد؛ آن‌ها را توی کیفش دیدم."}]},{"h":"Blame and Regret","b":"You use should have to criticize someone else's actions or to express your own regret about a past mistake. On the other hand, needn't have indicates that you performed an action in the past which turned out to be unnecessary.","hf":"سرزنش و پشیمانی با should have و needn't have","bf":"ساختار should have (done) برای انتقاد از عملکرد دیگران یا ابراز پشیمانی از کار خودمان در گذشته استفاده می‌شود. از سوی دیگر، needn't have (done) نشان می‌دهد کاری را در گذشته انجام داده‌ایم که در نهایت غیرضروری بوده است.","ex":[{"e":"You should have told me about the meeting; I missed it.","p":"باید درباره جلسه به من می‌خبرفتی؛ آن را از دست دادم."},{"e":"You needn't have bought extra food; we have plenty.","p":"لازم نبود غذای اضافه بخری؛ کلی غذا داریم."}]}],"tip":"Remember that these structures always refer to the past, even if you are thinking about the present result.","tipf":"نکته مهم: در فارسی معمولاً 'باید' را برای آینده یا حال استفاده می‌کنیم، اما must have همیشه درباره گذشته‌ای است که نتیجه‌اش را حالا می‌بینیم.","bad":[{"b":"You must to have finished this yesterday.","g":"You must have finished this yesterday.","w":"After must, you must use the base form have, so adding to is incorrect.","wf":"بعد از must حتماً باید از شکل ساده have استفاده شود و آوردن to نادرست است."},{"b":"You should tell me the truth yesterday.","g":"You should have told me the truth yesterday.","w":"You need the past participle after should have to talk about a past action that did not happen.","wf":"برای انتقاد از یک کار انجام‌نشده در گذشته، باید از should have همراه با قسمت سوم فعل (pp) استفاده کنید."},{"b":"You didn't need to buy bread because I bought some.","g":"You needn't have bought bread because I bought some.","w":"Needn't have is more precise than didn't need to when describing an action that was done but was not needed.","wf":"وقتی کاری بی‌جهت در گذشته انجام شده، ساختار needn't have دقیق‌تر از didn't need to است."}],"gold":[{"e":"Always use the past participle after these modals.","f":"همیشه بعد از این مدال‌ها از شکل سوم فعل استفاده کنید."},{"e":"Use must have for strong certainty about the past.","f":"برای قطعیت قوی درباره گذشته از must have استفاده کنید."},{"e":"Use can't have when you are sure something did not happen.","f":"وقتی مطمئن هستید چیزی اتفاق نیفتاده از can't have استفاده کنید."},{"e":"Use should have to show regret or criticism.","f":"برای نشان دادن پشیمانی یا انتقاد از should have استفاده کنید."}]},{"lv":"A","title":"Modal perfects: must have done / can't have done","exp":[{"h":"Forming the Modal Perfect","b":"To talk about past possibilities or certainties, we use modal verbs like 'must', 'can't', or 'might' followed by 'have' and the past participle of the main verb. This structure helps you speculate about events that have already happened. It is a very useful tool for making educated guesses based on evidence.","hf":"ساختار افعال کمکی کامل","bf":"برای صحبت درباره احتمالات یا قطعیت‌های گذشته، از افعال کمکی مانند must، can't یا might به همراه have و شکل سوم فعل اصلی استفاده می‌کنیم. این ساختار به شما کمک می‌کند تا درباره رویدادهایی که قبلاً رخ داده‌اند حدس بزنید. این ابزار بسیار مفیدی برای حدس‌زدن منطقی بر اساس شواهد است.","ex":[{"e":"She must have forgotten the meeting.","p":"او حتماً جلسه را فراموش کرده است."},{"e":"They can't have arrived already.","p":"آن‌ها نمی‌توانند همین الان رسیده باشند."}]},{"h":"Using 'Must Have Done' for Certainty","b":"Use 'must have + past participle' when you are almost sure that something happened in the past because you have evidence. For example, if you see wet streets, you can say it must have rained. It shows a strong logical conclusion about the past.","hf":"استفاده از must have done برای قطعیت","bf":"وقتی تقریباً مطمئن هستید که چیزی در گذشته رخ داده است زیرا شواهدی دارید، از must have + past participle استفاده کنید. برای مثال، اگر خیابان‌های خیس را ببینید، می‌توانید بگویید حتماً باران آمده است. این نشان‌دهنده یک نتیجه‌گیری منطقی قوی درباره گذشته است.","ex":[{"e":"He must have taken the bus.","p":"او حتماً با اتوبوس رفته است."},{"e":"You must have studied hard.","p":"تو حتماً سخت درس خوانده‌ای."}]},{"h":"Using 'Can't Have Done' for Impossibility","b":"Use 'can't have + past participle' when you are sure that something did NOT happen in the past. It is the negative form of 'must have'. If someone was abroad yesterday, they can't have been at the party. This expresses a strong belief that an event was impossible.","hf":"استفاده از can't have done برای غیرممکن بودن","bf":"وقتی مطمئن هستید که چیزی در گذشته رخ نداده است، از can't have + past participle استفاده کنید. این شکل منفی must have است. اگر کسی دیروز در خارج از کشور بوده باشد، امکان ندارد در مهمانی بوده باشد. این بیانگر باور قوی به غیرممکن بودن یک رویداد است.","ex":[{"e":"She can't have eaten all the cake.","p":"او نمی‌تواند تمام کیک را خورده باشد."},{"e":"They can't have seen the movie.","p":"آن‌ها محال است فیلم را دیده باشند."}]}],"tip":"Remember that 'must' and 'can't' are followed by 'have', not 'has' or 'had'. The form 'have' stays the same for all subjects.","tipf":"به یاد داشته باشید که بعد از must و can't از have استفاده می‌شود، نه has یا had. شکل have برای همه فاعل‌ها ثابت می‌ماند.","bad":[{"b":"She must has forgotten the meeting.","g":"She must have forgotten the meeting.","w":"After modal verbs, we always use the base form 'have', not 'has'.","wf":"بعد از افعال کمکی، همیشه از شکل پایه have استفاده می‌کنیم، نه has."},{"b":"He can't has left already.","g":"He can't have left already.","w":"Similar to above, 'can't' is followed by 'have', not 'has'.","wf":"مشابه مورد قبل، بعد از can't از have استفاده می‌شود، نه has."}],"gold":[{"e":"Modal perfects express logical conclusions about the past.","f":"افعال کمکی کامل نتیجه‌گیری‌های منطقی درباره گذشته را بیان می‌کنند."},{"e":"Use 'must have' for high certainty that something happened.","f":"برای قطعیت بالا درباره وقوع چیزی، از must have استفاده کنید."},{"e":"Use 'can't have' for high certainty that something did not happen.","f":"برای قطعیت بالا درباره عدم وقوع چیزی، از can't have استفاده کنید."}]},{"lv":"A","title":"should have / needn't have / might have (criticism and hindsight)","exp":[{"h":"Understanding Should Have for Regret","b":"We use 'should have' + past participle to talk about something we didn't do but wish we had. It expresses regret or criticism about a past action. For example, if you missed the bus, you might say you should have left earlier.","hf":"درک کردن should have برای حسرت","bf":"ما از 'should have' به همراه اسم مفعول (قسمت سوم فعل) برای صحبت درباره چیزی که انجام ندادیم اما آرزو می‌کردیم انجام می‌دادیم استفاده می‌کنیم. این عبارت حسرت یا انتقاد از یک عمل گذشته را بیان می‌کند. برای مثال، اگر اتوبوس را از دست دادید، ممکن است بگویید که باید زودتر می‌رفتید.","ex":[{"e":"You should have studied harder for the exam.","p":"تو باید برای امتحان سخت‌تر درس می‌خواندی."},{"e":"She should have called me before coming.","p":"او باید قبل از آمدن به من زنگ می‌زد."}]},{"h":"Using Needn't Have for Unnecessary Actions","b":"'Needn't have' is used when someone did something, but it turned out to be unnecessary. It implies that the action was done, but wasn't needed. For instance, if you brought an umbrella but it didn't rain, you needn't have brought it.","hf":"استفاده از needn't have برای کارهای غیرضروری","bf":"'needn't have' زمانی استفاده می‌شود که کسی کاری را انجام داده باشد، اما مشخص شود که آن کار ضروری نبوده است. این عبارت بیان می‌کند که عمل انجام شده، اما نیاز نبوده است. برای مثال، اگر چتر آورده باشی اما باران نیامده باشد، لازم نبوده چتر بیاوری.","ex":[{"e":"You needn't have bought so what you needed.","p":"تو لازم نبود این‌قدر غذا بخری."},{"e":"He needn't have worried about the result.","p":"او لازم نبود بابت نتیجه نگران باشد."}]},{"h":"Might Have for Possibility in the Past","b":"'Might have' suggests that something was possible in the past, but we are not sure if it happened. It is less certain than 'should have'. Use it when speculating about past events. For example, 'He might have forgotten the meeting.'","hf":"might have برای امکان در گذشته","bf":"'might have' نشان می‌دهد که چیزی در گذشته امکان‌پذیر بوده، اما مطمئن نیستیم که اتفاق افتاده است. این عبارت کمتر از 'should have' قطعی است. وقتی درباره رویدادهای گذشته حدس می‌زنی از آن استفاده کن. برای مثال: 'شاید جلسه را فراموش کرده باشد.'","ex":[{"e":"They might have missed the train.","p":"شاید آن‌ها قطار را از دست داده باشند."},{"e":"She might have taken the wrong bus.","p":"شاید او اتوبوس اشتباه را سوار شده باشد."}]}],"tip":"Remember that 'should have' expresses regret, 'needn't have' means the action was unnecessary, and 'might have' shows possibility without certainty.","tipf":"به یاد داشته باش که 'should have' حسرت را بیان می‌کند، 'needn't have' یعنی عمل غیرضروری بوده، و 'might have' امکان را بدون قطعیت نشان می‌دهد.","bad":[{"b":"You should to have studied more.","g":"You should have studied more.","w":"After 'should', we use the base form 'have', not 'to have'. The structure is should have + past participle.","wf":"بعد از 'should'، ما از شکل پایه 'have' استفاده می‌کنیم، نه 'to have'. ساختار should have + اسم مفعول است."},{"b":"She needn't have to bring an umbrella.","g":"She needn't have brought an umbrella.","w":"'Needn't have' is followed by the past participle, not the infinitive with 'to'. It refers to a past action that was unnecessary.","wf":"'needn't have' با اسم مفعول دنبال می‌شود، نه مصدر با 'to'. این به عملی در گذشته اشاره می‌کند که غیرضروری بوده است."}],"gold":[{"e":"Should have + past participle expresses regret about a past action.","f":"should have + اسم مفعول حسرت درباره یک عمل گذشته را بیان می‌کند."},{"e":"Needn't have + past participle indicates an action that was done but was unnecessary.","f":"needn't have + اسم مفعول نشان می‌دهد که عملی انجام شده اما غیرضروری بوده است."},{"e":"Might have + past participle suggests a possibility in the past without certainty.","f":"might have + اسم مفعول امکانی در گذشته را پیشنهاد می‌دهد بدون قطعیت."}]}],"ex":[{"t":"gap","q":"You ___ swim very well.","key":["can"],"why":"Can expresses present ability."},{"t":"gap","q":"I ___ play the piano when I was five.","key":["could"],"why":"Could is used for past ability."},{"t":"gap","q":"You ___ wear a uniform at this school.","key":["have to"],"why":"Have to expresses external obligation."},{"t":"fix","q":"She must to go now.","key":["She must go now."],"why":"Modals like must are followed by the base verb without 'to'."},{"t":"gap","q":"He ___ be at home; I saw him leaving the office.","key":["can't"],"why":"Can't expresses logical deduction that something is impossible."},{"t":"gap","q":"It ___ rain later, so take an umbrella.","key":["might"],"why":"Might expresses weak probability or possibility."},{"t":"fix","q":"You had better study harder for the exam.","key":["You had better study harder for the exam."],"why":"The sentence is already correct; 'had better' is used for strong advice."},{"t":"gap","q":"You ___ see the doctor; you look very pale.","key":["should"],"why":"Should is used for general advice."},{"t":"gap","q":"The road ___ repair soon.","key":["needs"],"why":"'Need doing' means the subject requires an action to be done to it."},{"t":"gap","q":"She ___ have forgotten the meeting.","key":["might"],"why":"Might + have + past participle expresses past possibility."},{"t":"fix","q":"He must have forgot the key.","key":["He must have forgotten the key."],"why":"Past deduction uses 'must have' followed by the past participle."},{"t":"fa","q":"او باید درس می‌خواند، اما بازی کرد.","key":["He should have studied, but he played."],"why":"'Should have + past participle' expresses regret or blame about the past."},{"t":"gap","q":"You ___ wear a helmet when riding a motorcycle.","key":["must"],"why":"Strong obligation or rule."},{"t":"fix","q":"She can speak three languages fluently.","key":["She can speak three languages fluently."],"why":"Correct usage of 'can' for ability."},{"t":"fa","q":"او احتمالاً در خانه است.","key":["He/She might be at home."],"why":"Expressing possibility with 'might'."},{"t":"gap","q":"You ___ not smoke in the hospital.","key":["must"],"why":"Prohibition using 'mustn't'."},{"t":"fix","q":"He must have forgot his keys.","key":["He must have forgotten his keys."],"why":"Past participle of 'forget' is 'forgotten'."},{"t":"gap","q":"She ___ have been tired after such a long day.","key":["must"],"why":"Deduction about a past situation with high certainty."},{"t":"fa","q":"او نباید نگران باشد.","key":["He/She shouldn't be worried."],"why":"Giving negative advice using 'shouldn't'."},{"t":"gap","q":"You ___ have called me; I was waiting for you.","key":["should"],"why":"Criticism or regret about a past action using 'should have'."}]},{"id":"t18","t":"Imperatives, Let's and Suggestions","tf":"جملهٔ امری و پیشنهاد","parts":[{"lv":"B","title":"Imperatives: do this / don't do that","exp":[{"h":"Basic Positive Imperatives","b":"To give a command or instruction, simply use the base form of the verb. There is no need to add 'to' or any subject pronoun like 'you'. This is the most direct way to tell someone what to do.","hf":"جملهٔ امری مثبت ساده","bf":"برای دادن دستور یا دستورالعمل، صرفاً از شکل پایه فعل استفاده کنید. نیازی به افزودن 'to' یا ضمایر فاعلی مانند 'you' نیست. این مستقیم‌ترین راه برای گفتن به کسی است که چه کاری انجام دهد.","ex":[{"e":"Open the window.","p":"پنجره را باز کن."},{"e":"Sit down, please.","p":"لطفاً بنشین."}]},{"h":"Forming Negative Imperatives","b":"To make an imperative negative, place 'do not' or its contraction 'don't' before the base verb. This structure is consistent and easy to remember for stopping an action.","hf":"ساخت جملهٔ امری منفی","bf":"برای منفی کردن جملهٔ امری، 'do not' یا شکل کوتاه‌شده آن 'don't' را قبل از فعل پایه قرار دهید. این ساختار ثابت است و به خاطر سپردن آن برای متوقف کردن یک عمل آسان است.","ex":[{"e":"Do not touch the paint.","p":"به رنگ دست نزن."},{"e":"Don't be late.","p":"دیر نکن."}]},{"h":"Using 'Let's' for Suggestions","b":"When you want to suggest an action that includes yourself and the listener, use 'Let's' followed by the base verb. It is a friendly way to propose doing something together.","hf":"استفاده از 'Let's' برای پیشنهاد","bf":"وقتی می‌خواهید پیشنهادی بدهید که شامل خودتان و شنونده باشد، از 'Let's' به همراه شکل پایه فعل استفاده کنید. این راهی دوستانه برای پیشنهاد انجام کاری با هم است.","ex":[{"e":"Let's go to the park.","p":"بیا به پارک برویم."},{"e":"Let's study together.","p":"بیا با هم درس بخوانیم."}]}],"tip":"Always start the imperative sentence with the verb, except for negative forms which start with 'Don't' or 'Do not'.","tipf":"همیشه جملهٔ امری را با فعل شروع کنید، مگر در حالت‌های منفی که با 'Don't' یا 'Do not' شروع می‌شوند.","bad":[{"b":"You open the window.","g":"Open the window.","w":"In imperatives, we usually omit the subject 'you'. Adding it makes the sentence sound less natural and more like a statement than a command.","wf":"در جمله‌های امری، معمولاً فاعل 'you' را حذف می‌کنیم. اضافه کردن آن باعث می‌شود جمله کمتر طبیعی به نظر برسد و بیشتر شبیه یک خبری باشد تا یک دستور."},{"b":"Don't to open the window.","g":"Don't open the window.","w":"After 'don't', use the base form of the verb without 'to'. The 'to' is unnecessary and incorrect here.","wf":"بعد از 'don'ت'، از شکل پایه فعل بدون 'to' استفاده کنید. 'to' در اینجا اضافی و نادرست است."},{"b":"Lets go to the park.","g":"Let's go to the park.","w":"When using 'let' for suggestions, it must be contracted with an apostrophe: 'Let's'. 'Lets' means 'allows'.","wf":"هنگام استفاده از 'let' برای پیشنهاد، باید با آپوستروف مخفف شود: 'Let's'. واژهٔ 'Lets' به معنای «اجازه می‌دهد» است."}],"gold":[{"e":"Imperatives use the base verb form without a subject.","f":"جمله‌های امری از شکل پایه فعل بدون فاعل استفاده می‌کنند."},{"e":"Use 'Don't' + base verb for negative commands.","f":"برای دستورات منفی از 'Don't' + شکل پایه فعل استفاده کنید."},{"e":"Use 'Let's' + base verb to suggest joint actions.","f":"برای پیشنهاد دادن کارهای مشترک از 'Let's' + شکل پایه فعل استفاده کنید."}]},{"lv":"B","title":"Let's … and suggestions (Shall we …?)","exp":[{"h":"Making suggestions with Let's","b":"Use 'Let's' followed by the base form of a verb to suggest doing something together. It is a friendly and common way to propose an activity with friends or family. Remember to include 'not' if you want to suggest not doing something.","hf":"پیشنهاد دادن با Let's","bf":"از 'Let's' به همراه شکل پایه فعل برای پیشنهاد انجام کاری با دیگران استفاده کنید. این یک روش دوستانه و رایج برای پیشنهاد دادن یک فعالیت به دوستان یا خانواده است. به یاد داشته باشید که اگر می‌خواهید پیشنهاد دهید کاری را انجام ندهید، از 'not' استفاده کنید.","ex":[{"e":"Let's go to the cinema tonight.","p":"بیایید امشب به سینما برویم."},{"e":"Let's not eat too much sugar.","p":"بیایید شکر زیادی نخوریم."}]},{"h":"Asking for opinions with Shall we","b":"Use 'Shall we' to ask for someone's opinion or agreement on a suggestion. It is slightly more formal than 'Let's' and invites the other person to agree or disagree. This structure is perfect for polite suggestions.","hf":"پرسیدن نظر با Shall we","bf":"از 'Shall we' برای پرسیدن نظر یا موافقت کسی در مورد یک پیشنهاد استفاده کنید. این ساختار کمی رسمی‌تر از 'Let's' است و از طرف مقابل می‌خواهد که موافقت یا مخالفت کند. این ساختار برای پیشنهادهای مودانه عالی است.","ex":[{"e":"Shall we start the meeting now?","p":"الان جلسه را شروع کنیم؟"},{"e":"Shall we order some pizza?","p":"پیتزا سفارش بدهیم؟"}]},{"h":"Responding to suggestions","b":"When someone makes a suggestion, you can accept it with 'Yes, let's' or decline it politely. You can also suggest an alternative if you disagree. It is important to be clear about your decision.","hf":"پاسخ دادن به پیشنهادها","bf":"وقتی کسی پیشنهادی می‌دهد، می‌توانید آن را با 'Yes, let's' بپذیرید یا به طور مودبانه رد کنید. همچنین اگر مخالف هستید، می‌توانید پیشنهاد جایگزینی ارائه دهید. مهم است که درباره تصمیم خود واضح صحبت کنید.","ex":[{"e":"Shall we go for a walk? Yes, let's.","p":"برویم پیاده‌روی؟ بله، حتماً."},{"e":"Shall we eat out? No, let's cook at home.","p":"بیرون غذا بخوریم؟ نه، بیایید در خانه آشپزی کنیم."}]}],"tip":"Always use the base form of the verb after 'Let's' and 'Shall we'.","tipf":"همیشه پس از 'Let's' و 'Shall we' از شکل پایه فعل استفاده کنید.","bad":[{"b":"Let's goes to the park.","g":"Let's go to the park.","w":"After 'Let's', use the base form of the verb, not the third person singular.","wf":"پس از 'Let's'، از شکل پایه فعل استفاده کنید، نه سوم شخص مفرد."},{"b":"Shall we goes to the cinema?","g":"Shall we go to the cinema?","w":"After 'Shall we', use the base form of the verb.","wf":"پس از 'Shall we'، از شکل پایه فعل استفاده کنید."},{"b":"Let's not to go.","g":"Let's not go.","w":"Do not use 'to' after 'not' in 'Let's not' structures.","wf":"در ساختارهای 'Let's not' از 'to' پس از 'not' استفاده نکنید."}],"gold":[{"e":"Let's + base verb for suggestions.","f":"Let's + شکل پایه فعل برای پیشنهاد دادن."},{"e":"Shall we + base verb for asking opinions.","f":"Shall we + شکل پایه فعل برای پرسیدن نظر."},{"e":"Use 'Let's not' for negative suggestions.","f":"از 'Let's not' برای پیشنهادهای منفی استفاده کنید."}]}],"ex":[{"t":"gap","q":"___ the door, please.","key":["Close"],"why":"Positive imperative uses the base form of the verb at the start of the sentence."},{"t":"gap","q":"___ not forget your keys.","key":["Do"],"why":"Negative imperatives are formed with 'Do not' or 'Don't' followed by the base verb."},{"t":"gap","q":"Let's ___ to the cinema tonight.","key":["go"],"why":"'Let's' is followed by the base form of the verb to make a suggestion."},{"t":"fix","q":"Let's goes to the park.","key":["Let's go to the park."],"why":"After 'Let's', use the base form of the verb, not the third-person singular."},{"t":"gap","q":"___ we watch a movie?","key":["Shall"],"why":"'Shall we' is used to ask for opinions or make suggestions."},{"t":"fix","q":"Don't to eat too much sugar.","key":["Don't eat too much sugar."],"why":"After 'Don't', use the base verb without 'to'."},{"t":"gap","q":"Let's ___ up early tomorrow.","key":["get"],"why":"'Let's' is followed by the base form of the verb."},{"t":"fix","q":"Shall we to go now?","key":["Shall we go now?"],"why":"'Shall we' is followed by the base verb, not the infinitive with 'to'."},{"t":"fa","q":"بیا با هم غذا بخوریم.","key":["Let's eat together."],"why":"'Let's' is the standard way to suggest doing something together in English."},{"t":"fa","q":"آیا دوست داری به سینما برویم؟","key":["Shall we go to the cinema?"],"why":"'Shall we' is used to invite someone or suggest an activity."}]},{"id":"t19","t":"Gerunds and Infinitives","tf":"اسم مصدر و مصدر با to","parts":[{"lv":"B","title":"verb + to … (want to / hope to / decide to)","exp":[{"h":"Using 'want to' for personal desires","b":"We use 'want to' when we have a strong desire to do something. It is the most common way to express what you wish for yourself. Remember that the verb after 'to' is always in its base form without 's'.","hf":"استفاده از 'want to' برای خواسته‌های شخصی","bf":"ما از 'want to' زمانی استفاده می‌کنیم که بخواهیم کاری را انجام دهیم. این رایج‌ترین راه برای بیان چیزی است که برای خودتان می‌خواهید. به یاد داشته باشید که فعل بعد از 'to' همیشه به صورت شکل پایه (بدون تغییر و پسوند) می‌آید.","ex":[{"e":"I want to learn English.","p":"من می‌خواهم انگلیسی یاد بگیرم."},{"e":"She wants to buy a new car.","p":"او می‌خواهد یک ماشین جدید بخرد."}]},{"h":"Expressing hope with 'hope to'","b":"Use 'hope to' when you are optimistic about a future event. It suggests that something is possible but not guaranteed. This structure is very useful for talking about plans and expectations.","hf":"بیان امید با 'hope to'","bf":"از 'hope to' زمانی استفاده کنید که نسبت به یک رویداد آینده خوش‌بین هستید. این نشان می‌دهد که چیزی امکان‌پذیر است اما قطعی نیست. این ساختار برای صحبت درباره برنامه‌ها و انتظارات بسیار مفید است.","ex":[{"e":"I hope to see you soon.","p":"امیدوارم به زودی تو را ببینم."},{"e":"We hope to visit Iran next year.","p":"ما امیدواریم سال آینده به ایران سفر کنیم."}]},{"h":"Making decisions with 'decide to'","b":"Use 'decide to' when you have made a firm choice about an action. It implies that you have thought about it and chosen a specific path. This is different from just wanting something; it is about commitment.","hf":"تصمیم‌گیری با 'decide to'","bf":"از 'decide to' زمانی استفاده کنید که انتخاب قطعی درباره یک کار انجام داده‌اید. این یعنی درباره آن فکر کرده‌اید و مسیر مشخصی را برگزیده‌اید. این با صرفاً خواستن چیزی فرق دارد؛ بلکه درباره تعهد است.","ex":[{"e":"He decided to study medicine.","p":"او تصمیم گرفت پزشکی بخواند."},{"e":"They decided to move to London.","p":"آن‌ها تصمیم گرفتند به لندن نقل مکان کنند."}]}],"tip":"Always check if the subject changes. If the subject changes, use 'hope that' or 'want someone to' instead of just 'to'.","tipf":"همیشه بررسی کنید که آیا فاعل تغییر کرده است یا خیر. اگر فاعل تغییر کرد، به جای ساختار 'to'، از 'hope that' یا 'want someone to' استفاده کنید.","bad":[{"b":"I want studying English.","g":"I want to study English.","w":"After 'want', we must use the infinitive with 'to', not the -ing form.","wf":"بعد از 'want' باید از مصدر با 'to' استفاده کنیم، نه شکل ing-دار."},{"b":"She hopes to go to the party yesterday.","g":"She hoped to go to the party yesterday.","w":"Since the action happened in the past, the verb 'hope' must be in the past tense.","wf":"از آنجا که این اتفاق در گذشته رخ داده است، فعل 'hope' باید به صورت گذشته بیاید."},{"b":"We decided going home.","g":"We decided to go home.","w":"The verb 'decide' is always followed by the infinitive with 'to'.","wf":"فعل 'decide' همیشه با مصدر با 'to' می‌آید."}],"gold":[{"e":"The structure is always Subject + Verb + to + Base Verb.","f":"ساختار همیشه به صورت «فاعل + فعل + to + فعل پایه» است."},{"e":"Do not add 's' to the base verb after 'to'.","f":"به فعل پایه بعد از 'to' پسوند 's' اضافه نکنید."},{"e":"These verbs express attitude or intention towards an action.","f":"این افعال نگرش یا قصد و نیت را نسبت به یک عمل بیان می‌کنند."}]},{"lv":"B","title":"verb + -ing (like doing / enjoy doing)","exp":[{"h":"Verbs followed by -ing","b":"Some verbs in English are naturally followed by a verb ending in -ing. Think of verbs like 'enjoy', 'avoid', or 'mind'. When you use these, the second action takes the -ing form. This is a very common pattern in daily conversation.","hf":"افعالی که با -ing دنبال می‌شوند","bf":"برخی از افعال در زبان انگلیسی به‌طور طبیعی با فعلی که به -ing ختم می‌شود می‌آیند. به افعالی مانند 'enjoy' (لذت بردن)، 'avoid' (اجتناب کردن) یا 'mind' (اشکالی نداشتن) فکر کنید. وقتی از این افعال استفاده می‌کنید، عمل دوم فرم -ing می‌گیرد. این الگو در مکالمات روزمره بسیار رایج است.","ex":[{"e":"I enjoy reading books.","p":"من از کتاب خواندن لذت می‌برم."},{"e":"She avoids eating sugar.","p":"او از خوردن قند و شکر اجتناب می‌کند."}]},{"h":"Common verbs with -ing","b":"You should memorize a list of verbs that always take -ing. Words like 'suggest', 'recommend', and 'finish' are in this group. Using the infinitive (to + verb) after these words is a common mistake for learners.","hf":"افعال رایج همراه با -ing","bf":"شما باید فهرستی از افعالی را که همیشه با -ing می‌آیند به خاطر بسپارید. کلماتی مانند 'suggest' (پیشنهاد کردن)، 'recommend' (توصیه کردن) و 'finish' (تمام کردن) در این گروه هستند. استفاده از مصدر با to (to + فعل) بعد از این کلمات، خطایی رایج در میان زبان‌آموزان است.","ex":[{"e":"He suggested watching a movie.","p":"او پیشنهاد کرد که فیلمی تماشا کنیم."},{"e":"We finished cleaning the house.","p":"ما تمیز کردن خانه را تمام کردیم."}]},{"h":"Negative forms with -ing","b":"To make these sentences negative, simply put 'not' before the -ing verb. The structure remains the same, but you add 'not'. For example, if you don't like doing something, you say 'don't like doing'.","hf":"شکل منفی با -ing","bf":"برای منفی کردن این جملات، کافی است 'not' را قبل از فعل دارای -ing قرار دهید. ساختار جمله ثابت می‌ماند، اما 'not' اضافه می‌شود. برای مثال، اگر کاری را دوست نداشته باشید، می‌گویید 'don't like doing'.","ex":[{"e":"I don't mind waiting.","p":"من مشکلی با منتظر ماندن ندارم."},{"e":"She doesn't enjoy cooking.","p":"او از آشپزی لذت نمی‌برد."}]}],"tip":"Always check if the main verb requires -ing or to + verb. There is no single rule for all verbs, so practice with common examples.","tipf":"همیشه بررسی کنید که آیا فعل اصلی به -ing نیاز دارد یا to + فعل. برای تمام افعال یک قانون واحد وجود ندارد، بنابراین با تمرین مثال‌های رایج مسلط شوید.","bad":[{"b":"I enjoy to read books.","g":"I enjoy reading books.","w":"The verb 'enjoy' is always followed by -ing, not the infinitive.","wf":"فعل 'enjoy' همیشه با -ing می‌آید، نه با شکل مصدری."},{"b":"She suggested to watch a movie.","g":"She suggested watching a movie.","w":"The verb 'suggest' takes the -ing form after it.","wf":"فعل 'suggest' پس از خود فرم -ing می‌گیرد."},{"b":"We finished to clean the house.","g":"We finished cleaning the house.","w":"The verb 'finish' is followed by -ing.","wf":"فعل 'finish' با -ing دنبال می‌شود."}],"gold":[{"e":"Verbs like enjoy, avoid, and finish are followed by a verb ending in -ing.","f":"افعالی مانند enjoy، avoid و finish با فعلی که به -ing ختم می‌شود می‌آیند."},{"e":"Do not use 'to' after these specific verbs.","f":"بعد از این افعال خاص از 'to' استفاده نکنید."},{"e":"The -ing form acts as a noun in these sentences.","f":"فرم -ing در این جملات به عنوان اسم عمل می‌کند."}]},{"lv":"B","title":"I want you to … / I told him to … (object + to)","exp":[{"h":"Using 'want' with an object and infinitive","b":"When you want someone else to do something, you use the structure 'want + person + to + verb'. For example, if you want your friend to help you, you say 'I want you to help me'. This is a very common way to express desires involving another person.","hf":"استفاده از 'want' با مفعول و مصدر","bf":"وقتی می‌خواهید شخص دیگری کاری را انجام دهد، از ساختار 'want + person + to + verb' استفاده می‌کنید. برای مثال، اگر می‌خواهید دوستتان به شما کمک کنید، می‌گویید 'I want you to help me'. این یک روش بسیار رایج برای بیان خواسته‌هایی است که شامل شخص دیگری می‌شود.","ex":[{"e":"I want you to open the window.","p":"می‌خواهم پنجره را باز کنی."},{"e":"She wants him to call her later.","p":"او می‌خواهد که او بعداً با او تماس بگیرد."}]},{"h":"Using 'tell' with an object and infinitive","b":"The verb 'tell' follows the same pattern as 'want'. You tell someone to do something by saying 'tell + person + to + verb'. It is used to give instructions or commands. For instance, 'I told him to wait' means I instructed him to wait.","hf":"استفاده از 'tell' با مفعول و مصدر","bf":"فعل 'tell' الگوی مشابهی با 'want' دارد. شما به کسی چیزی را می‌گویید یا دستور می‌دهید با گفتن 'tell + person + to + verb'. این برای دادن دستورالعمل‌ها یا دستورها استفاده می‌شود. برای مثال، 'I told him to wait' یعنی من به او دستور دادم که صبر کند.","ex":[{"e":"I told her to sit down.","p":"به او گفتم بنشیند."},{"e":"They told us to be quiet.","p":"به ما گفتند ساکت باشیم."}]},{"h":"Common verbs with this structure","b":"Many verbs work like 'want' and 'tell'. Other common verbs include 'ask', 'expect', and 'need'. For example, 'I asked him to leave' or 'I need you to finish this'. Remember to always use 'to' before the main verb in these structures.","hf":"افعال رایج با این ساختار","bf":"افعال زیادی مانند 'want' و 'tell' کار می‌کنند. افعال رایج دیگر شامل 'ask'، 'expect' و 'need' هستند. برای مثال، 'I asked him to leave' یا 'I need you to finish this'. به یاد داشته باشید که همیشه قبل از فعل اصلی در این ساختارها از 'to' استفاده کنید.","ex":[{"e":"I asked him to help me.","p":"از او خواستم که به من کمک کند."},{"e":"We need you to sign this document.","p":"ما نیاز داریم که شما این سند را امضا کنید."}]}],"tip":"Always remember to include 'to' between the object and the main verb. For example, say 'I want you to go', not 'I want you go'.","tipf":"همیشه به یاد داشته باشید که 'to' را بین مفعول و فعل اصلی قرار دهید. برای مثال، بگویید 'I want you to go'، نه 'I want you go'.","bad":[{"b":"I want you help me.","g":"I want you to help me.","w":"The verb 'help' needs 'to' after the object 'you' in this structure.","wf":"فعل 'help' در این ساختار بعد از مفعول 'you' به 'to' نیاز دارد."},{"b":"I told him go home.","g":"I told him to go home.","w":"The verb 'go' needs 'to' after the object 'him' in this structure.","wf":"فعل 'go' در این ساختار بعد از مفعول 'him' به 'to' نیاز دارد."},{"b":"She asked me waiting.","g":"She asked me to wait.","w":"After 'ask + object', we use the infinitive with 'to', not the gerund.","wf":"بعد از 'ask + object'، ما از مصدر با 'to' استفاده می‌کنیم، نه اسم مصدر."}],"gold":[{"e":"Structure: Subject + Verb (want/tell/ask) + Object + to + Base Verb.","f":"ساختار: فاعل + فعل (want/tell/ask) + مفعول + to + فعل پایه."},{"e":"The word 'to' is part of the infinitive and must always be present.","f":"کلمه 'to' بخشی از مصدر است و همیشه باید حضور داشته باشد."},{"e":"This structure is used to express desires, commands, or requests directed at someone.","f":"این ساختار برای بیان خواسته‌ها، دستورها یا درخواست‌هایی که متوجه کسی است استفاده می‌شود."}]},{"lv":"I","title":"Gerunds and Infinitives (1)","exp":[{"h":"Verbs followed by the -ing form","b":"When you want to say you enjoy or have finished something, use the verb with an -ing ending after words like enjoy and finish. This structure is used for actions you are currently doing or for the general idea of the activity.","hf":"افعالی که بعد از آن‌ها از ing- استفاده می‌شود","bf":"وقتی می‌خواهید بگویید از انجام کاری لذت می‌برید یا آن را تمام کرده‌اید، بعد از افعالی مثل enjoy و finish از فعل با ing- استفاده کنید. این ساختار برای کارهایی که در حال انجامشان هستید یا کلیتی از آن‌ها مد نظر است کاربرد دارد.","ex":[{"e":"I enjoy reading books in the evening.","p":"من از کتاب خواندن در غروب لذت می‌برم."},{"e":"She finished doing her homework an hour ago.","p":"او یک ساعت پیش تمام کردن تکالیفش را به پایان رساند."}]},{"h":"Verbs followed by to + verb","b":"After verbs like decide and want, always use the infinitive with to. This structure is usually used for decisions and goals that you have for the future.","hf":"افعالی که بعد از آن‌ها از to + فعل استفاده می‌شود","bf":"بعد از افعالی مانند decide (تصمیم گرفتن) و want (خواستن)، همیشه از مصدر با to استفاده کنید. این ساختار معمولاً برای تصمیمات و اهدافی که برای آینده دارید به کار می‌رود.","ex":[{"e":"We decided to buy a new car.","p":"ما تصمیم گرفتیم یک ماشین جدید بخریم."},{"e":"He wants to learn French next year.","p":"او می‌خواهد سال آینده فرانسوی یاد بگیرد."}]},{"h":"The verb stop and its important meaning difference","b":"The verb stop can be used with both -ing and to, but the meaning changes. When you stop an activity and do not do it anymore, use stop with the -ing form.","hf":"فعل stop و تفاوت معنایی مهم آن","bf":"فعل stop می‌تواند هم با ing- و هم با to بیاید، اما معنایش عوض می‌شود. وقتی کاری را متوقف می‌کنید و دیگر انجام نمی‌دهید، از stop با ing- استفاده کنید.","ex":[{"e":"Please stop making that noise!","p":"لطفاً سر و صدا کردن را متوقف کنید!"},{"e":"He stopped to talk to his friend on the street.","p":"او ایستاد تا در خیابان با دوستش صحبت کند."}]}],"tip":"Never use to after enjoy; say I enjoy swimming, not I enjoy to swim.","tipf":"هرگز بعد از enjoy از to استفاده نکنید؛ بگویید I enjoy swimming و نه I enjoy to swim.","bad":[{"b":"I want learning English.","g":"I want to learn English.","w":"After the verb want, you must always use to + base verb, not the -ing form.","wf":"بعد از فعل want همیشه باید از to + فعل پایه استفاده شود، نه ing-."},{"b":"She enjoys to watch movies.","g":"She enjoys watching movies.","w":"After the verb enjoy, we always use the verb with an -ing ending, not to.","wf":"بعد از فعل enjoy همیشه از فعل با ing- استفاده می‌کنیم، نه to."},{"b":"He decided going home early.","g":"He decided to go home early.","w":"The verb decide is used with to and you cannot use the -ing form after it.","wf":"فعل decide با to همراه است و نمی‌توان بعد از آن از ing- استفاده کرد."}],"gold":[{"e":"Always remember that enjoy is followed by the -ing form, never by to.","f":"همیشه به یاد داشته باشید که enjoy با فرم ing- می‌آید، نه با to."},{"e":"Use to + base verb after want and decide to talk about future intentions.","f":"برای صحبت درباره قصد و هدف‌های آینده، بعد از want و decide از to + فعل پایه استفاده کنید."},{"e":"Stop + -ing means you cease an activity, while stop + to means you pause to do something else.","f":"stop به همراه ing- یعنی انجام کاری را متوقف می‌کنید، در حالی که stop به همراه to یعنی برای انجام کاری دیگر مکث می‌کنید."}]},{"lv":"I","title":"Gerunds and Infinitives (2)","exp":[{"h":"Use ing after prepositions","b":"When a verb follows a preposition like in, on, at, or about, you must use the ing form. This rule applies to almost all prepositions and is a fixed part of English grammar that you can rely on.","hf":"بعد از حروف اضافه از ing استفاده می‌کنیم","bf":"وقتی یک فعل بعد از حرف اضافه (مثل in, on, at, about, of) می‌آید، شکل ing‌دار آن به کار می‌رود. این قانون برای تقریباً تمام حروف اضافه صادق است و یکی از قواعد ثابت گرامر انگلیسی است.","ex":[{"e":"He is good at playing tennis.","p":"او در تنیس بازی کردن خوب است."},{"e":"She is interested in learning French.","p":"او در یادگیری فرانسوی علاقه‌مند است."}]},{"h":"Use to after certain adjectives","b":"Many English adjectives such as happy, easy, hard, difficult, or important are followed by to and a verb. This structure is very common for expressing feelings or the difficulty of doing something.","hf":"بعد از برخی صفات از to استفاده می‌کنیم","bf":"بسیاری از صفات انگلیسی مانند happy, easy, hard, difficult یا important به دنبالشان to + فعل می‌آید. این ساختار برای بیان احساسات یا سختی و آسانی انجام کاری بسیار رایج است.","ex":[{"e":"It is easy to understand this rule.","p":"درک این قانون آسان است."},{"e":"I am happy to see you.","p":"خوشحالم که تو را می‌بینم."}]},{"h":"Use ing after go","b":"When you want to describe a recreational or sports activity starting with go, use the ing form. This structure is used to talk about hobbies and physical activities.","hf":"بعد از go از ing استفاده می‌کنیم","bf":"وقتی می‌خواهیم فعالیت تفریحی یا ورزشی را که با go شروع می‌شود بیان کنیم، از شکل ing‌دار استفاده می‌کنیم. این ساختار برای بیان سرگرمی‌ها و فعالیت‌های فیزیکی کاربرد دارد.","ex":[{"e":"Let's go swimming.","p":"بیا شنا کنیم."},{"e":"They went shopping yesterday.","p":"آن‌ها دیروز به خرید رفتند."}]}],"tip":"Remember that after any preposition, the verb must always have ing, even if the meaning changes.","tipf":"یادتان باشد بعد از هر حرف اضافه (in, on, at, about...) فعل حتماً باید ing‌دار باشد، حتی اگر معنی آن متفاوت باشد.","bad":[{"b":"I am good at play tennis.","g":"I am good at playing tennis.","w":"After the preposition at, you must use the ing form.","wf":"بعد از حرف اضافه at باید از ing استفاده شود."},{"b":"She is interested to learn French.","g":"She is interested in learning French.","w":"After the adjective interested, you usually use in followed by ing.","wf":"بعد از صفت interested معمولاً از in و بعد از آن ing استفاده می‌شود."},{"b":"Let's go swim.","g":"Let's go swimming.","w":"For recreational activities with go, the ing form is more common and natural.","wf":"در عبارت go برای فعالیت‌های تفریحی، شکل ing‌دار رایج‌تر و طبیعی‌تر است."}],"gold":[{"e":"Always use the ing form for verbs that immediately follow a preposition.","f":"همیشه برای افعالی که بلافاصله بعد از حرف اضافه می‌آیند، از فرم ing استفاده کنید."},{"e":"Use to plus the base verb after adjectives like happy or difficult.","f":"بعد از صفاتی مانند happy یا difficult، از to به همراه فعل ساده استفاده کنید."},{"e":"When describing sports or hobbies with go, always add ing to the activity.","f":"هنگام توصیف ورزش‌ها یا سرگرمی‌ها با go، همیشه به فعالیت ing اضافه کنید."}]},{"lv":"I","title":"Verb + preposition + -ing (interested in doing)","exp":[{"h":"The Basic Pattern","b":"When you use a verb or adjective followed by a preposition, the next verb must always end in -ing. This is a fixed rule in English. For example, we say 'interested in doing' rather than 'interested in do'.","hf":"الگوی پایه","bf":"وقتی از یک فعل یا صفت همراه با حرف اضافه استفاده می‌کنید، فعل بعدی باید حتماً به -ing ختم شود. این یک قانون ثابت در انگلیسی است. برای مثال، می‌گوییم 'interested in doing' نه 'interested in do'.","ex":[{"e":"I am interested in learning English.","p":"من علاقه‌مند به یادگیری انگلیسی هستم."},{"e":"She is good at speaking.","p":"او در صحبت کردن خوب است."}]},{"h":"Common Verb + Preposition Pairs","b":"Some verbs and adjectives are always followed by specific prepositions. You need to memorize these pairs as units. For instance, 'think' goes with 'about', and 'look forward' goes with 'to'.","hf":"جفت‌های رایج فعل/صفت + حرف اضافه","bf":"برخی افعال و صفت‌ها همیشه با حروف اضافه خاصی همراه می‌شوند. شما باید این جفت‌ها را به عنوان یک واحد حفظ کنید. برای مثال، 'think' با 'about' و 'look forward' با 'to' می‌آید.","ex":[{"e":"He is thinking about moving to London.","p":"او در مورد نقل مکان به لندن فکر می‌کند."},{"e":"We are looking forward to seeing you.","p":"ما مشتاقانه منتظر دیدن شما هستیم."}]},{"h":"Using it in Questions","b":"You can also use this structure in questions. Just remember that the preposition stays at the end when asking questions with question words. For example, 'What are you interested in?' is correct.","hf":"استفاده در سوالات","bf":"شما می‌توانید از این ساختار در سوالات نیز استفاده کنید. فقط به یاد داشته باشید که هنگام پرسیدن با کلمات پرسشی، حرف اضافه در آخر جمله باقی می‌ماند. برای مثال، 'What are you interested in?' صحیح است.","ex":[{"e":"What are you interested in doing?","p":"به انجام چه کاری علاقه‌مند هستید؟"},{"e":"Who are you talking to?","p":"با چه کسی صحبت می‌کنید؟"}]}],"tip":"Always check if the word needs a preposition after it. If it does, the next verb must be in the -ing form.","tipf":"همیشه چک کنید که آیا کلمه بعد از خود نیاز به حرف اضافه دارد یا نه. اگر دارد، فعل بعدی باید به صورت -ing باشد.","bad":[{"b":"I am interested to learn English.","g":"I am interested in learning English.","w":"After 'interested in', we use the -ing form, not the infinitive with 'to'.","wf":"بعد از 'interested in'، ما از فرم -ing استفاده می‌کنیم، نه مصدر با 'to'."},{"b":"She is good in singing.","g":"She is good at singing.","w":"The correct preposition for 'good' is 'at', not 'in'.","wf":"حرف اضافه صحیح برای 'good'، 'at' است، نه 'in'."},{"b":"He is thinking about to go home.","g":"He is thinking about going home.","w":"After the preposition 'about', the verb must be in the -ing form.","wf":"بعد از حرف اضافه 'about'، فعل باید به صورت -ing باشد."}],"gold":[{"e":"Verb/Adjective + preposition + verb-ing is a fixed structure.","f":"فعل/صفت + حرف اضافه + فعل-ing یک ساختار ثابت است."},{"e":"Never use the infinitive (to + verb) after a preposition.","f":"هرگز بعد از حرف اضافه از مصدر (to + فعل) استفاده نکنید."},{"e":"Memorize common pairs like 'interested in', 'good at', and 'afraid of'.","f":"جفت‌های رایج مانند 'interested in'، 'good at' و 'afraid of' را حفظ کنید."}]},{"lv":"I","title":"remember / forget / stop / try / regret + to vs -ing","exp":[{"h":"Remembering the Future: To vs. -ing","b":"When you remember to do something, you did not forget the task itself. You remembered it and then performed the action. Think of it as a duty or a future event that you successfully completed.","hf":"به خاطر سپردن آینده: to در برابر -ing","bf":"وقتی چیزی را به خاطر می‌سپارید که باید انجام دهید، آن وظیفه را فراموش نکرده‌اید. آن را به خاطر سپردید و سپس عمل را انجام دادید. آن را به عنوان یک وظیفه یا رویدادی در آینده در نظر بگیرید که با موفقیت انجام شده است.","ex":[{"e":"I remembered to lock the door before leaving.","p":"به خاطر سپردم که قبل از رفتن در را قفل کنم."},{"e":"Don't forget to call your mother.","p":"فراموش نکن که به مادرت زنگ بزنی."}]},{"h":"Recalling the Past: The -ing Form","b":"When you remember doing something, you are recalling a memory from the past. The action has already happened, and you are thinking about the experience itself. It is like looking back at a photo in your mind.","hf":"یادآوری گذشته: شکل -ing","bf":"وقتی چیزی را به خاطر می‌سپارید که انجام داده‌اید، یک خاطره از گذشته را مرور می‌کنید. آن عمل قبلاً اتفاق افتاده است و شما درباره خودِ تجربه فکر می‌کنید. این مانند نگاه کردن به یک عکس در ذهن شماست.","ex":[{"e":"I remember locking the door, but it was open.","p":"به خاطر می‌آورم که در را قفل کردم، اما باز بود."},{"e":"She remembers meeting him at the party.","p":"او به خاطر می‌آورد که او را در مهمانی دیده بود."}]},{"h":"Stopping an Activity vs. Ceasing a Purpose","b":"Stop doing means you ceased the activity itself. Stop to do means you paused one activity in order to start a new one. It is a shift in purpose rather than just ending an action.","hf":"توقف یک فعالیت در برابر توقف برای یک هدف","bf":"توقف کردن یک فعالیت به معنای پایان دادن به خود آن فعالیت است. توقف برای انجام چیزی به معنای مکث کردن در یک فعالیت به منظور شروع یک فعالیت جدید است. این یک تغییر در هدف است، نه صرفاً پایان دادن به یک عمل.","ex":[{"e":"He stopped smoking last year.","p":"او سال گذشته سیگار را ترک کرد."},{"e":"He stopped to smoke a cigarette.","p":"او ایستاد تا سیگاری بکشد."}]}],"tip":"Remember to look at the time reference: if the action is in the past memory, use -ing; if it is a future task, use to.","tipf":"به خاطر داشته باشید که به مرجع زمان توجه کنید: اگر عمل در خاطره گذشته است، از -ing استفاده کنید؛ اگر یک وظیفه آینده است، از to استفاده کنید.","bad":[{"b":"I remember to lock the door, but it was open.","g":"I remember locking the door, but it was open.","w":"You are recalling a past memory, so you must use the -ing form, not the infinitive.","wf":"شما یک خاطره گذشته را مرور می‌کنید، بنابراین باید از شکل -ing استفاده کنید، نه مصدر."},{"b":"I forgot to meeting her at the station.","g":"I forgot meeting her at the station.","w":"When referring to a past experience or memory, the gerund (-ing) is required after forget.","wf":"هنگام ارجاع به یک تجربه یا خاطره گذشته، پس از فراموش کردن استفاده از اسم مصدر (-ing) الزامی است."},{"b":"He stopped to work yesterday.","g":"He stopped working yesterday.","w":"If he ceased the activity of working, use the gerund. 'Stopped to work' implies he paused something else to start working.","wf":"اگر او فعالیت کار کردن را متوقف کرد، از اسم مصدر استفاده کنید. 'توقف کرد تا کار کند' به این معنی است که او چیزی دیگر را متوقف کرد تا کار کردن را شروع کند."}],"gold":[{"e":"Use 'to + verb' for a future task or duty that you did not forget.","f":"برای یک وظیفه یا تکلیف آینده که فراموش نکردید، از 'to + فعل' استفاده کنید."},{"e":"Use 'verb + -ing' to recall a memory or experience that has already happened.","f":"برای یادآوری یک خاطره یا تجربه‌ای که قبلاً اتفاق افتاده است، از 'فعل + -ing' استفاده کنید."},{"e":"Use 'stop + -ing' to end an activity, and 'stop + to + verb' to pause for a new purpose.","f":"برای پایان دادن به یک فعالیت از 'stop + -ing' و برای مکث کردن به منظور یک هدف جدید از 'stop + to + فعل' استفاده کنید."}]},{"lv":"A","title":"Complex verb patterns: verb + -ing vs to with meaning change (advanced)","exp":[{"h":"Verbs that change meaning with -ing or to","b":"Some verbs like 'stop' or 'remember' change their meaning depending on whether you use an -ing form or a to-infinitive. It is important to pay attention to this difference because it changes the whole message you are sending.","hf":"افعالی که با -ing یا to معنی خود را تغییر می‌دهند","bf":"برخی افعال مانند stop یا remember بسته به اینکه از شکل -ing یا مصدر با to استفاده کنید، معنی‌شان تغییر می‌کند. توجه به این تفاوت بسیار مهم است، زیرا پیامی که می‌رسانید را کاملاً عوض می‌کند.","ex":[{"e":"I stopped smoking last year.","p":"من سال گذشته سیگار کشیدن را ترک کردم."},{"e":"I stopped to smoke a cigarette.","p":"من ایستادم تا سیگاری بکشم."}]},{"h":"Regret and memory differences","b":"When you use 'regret' or 'remember' with -ing, you are usually talking about a past event. When you use them with 'to', you are often talking about something you need to do in the future or right now.","hf":"تفاوت‌های regret و remember","bf":"وقتی فعل‌های regret یا remember را با شکل -ing به کار می‌برید، معمولاً از یک اتفاق در گذشته صحبت می‌کنید. وقتی آن‌ها را با to می‌آورید، اغلب منظور کاری است که باید در آینده یا همین الان انجام دهید.","ex":[{"e":"I regret telling her the secret.","p":"از گفتن آن راز به او پشیمانم."},{"e":"I regret to inform you that you failed.","p":"متأسفم که به شما اطلاع می‌دهم در امتحان رد شده‌اید."}]},{"h":"Try and forget nuances","b":"If you 'try to do' something, you make an effort to achieve a goal. If you 'try doing' something, you are testing an experiment to see if it works. This is a subtle but useful distinction for advanced learners.","hf":"ظرافت‌های فعل‌های try و فراموشی","bf":"اگر تلاش کنید کاری را انجام دهید (try to do)، یعنی برای رسیدن به هدفی زحمت می‌کشید. اگر کاری را امتحان کنید (try doing)، یعنی روشی را آزمایش می‌کنید تا ببینید جواب می‌دهد یا نه. این نکته‌ای ظریف اما بسیار مفید برای زبان‌آموزان پیشرفته است.","ex":[{"e":"Try to concentrate on the lesson.","p":"سعی کنید روی درس تمرکز کنید."},{"e":"Try adding more salt to the soup.","p":"امتحان کنید و کمی نمک بیشتر به سوپ بزنید (ببینید چطور می‌شود)."}]}],"tip":"Always check the verb before the -ing or to form to see if the meaning changes.","tipf":"همیشه به فعل قبل از شکل -ing یا to دقت کنید تا ببینید آیا معنای جمله تغییر می‌کند یا خیر.","bad":[{"b":"I remember to lock the door yesterday.","g":"I remembered locking the door yesterday.","w":"For past events, we use the -ing form after remember.","wf":"برای خاطرات و اتفاقات گذشته، بعد از remember از شکل -ing استفاده می‌کنیم."},{"b":"She stopped to work after lunch.","g":"She stopped working after lunch.","w":"If she ceased the activity, use -ing. If she paused to do something else, use to.","wf":"اگر فعالیت را به‌طور کامل متوقف کرده، از -ing استفاده کنید. اگر برای انجام کار دیگری متوقف شده (مکث کرده)، از to استفاده کنید."},{"b":"I tried to open the window, but it was stuck.","g":"I tried opening the window, but it was stuck.","w":"Here, 'trying to open' implies effort to achieve a result, while 'trying opening' implies testing a method. In this context, testing the method is more natural.","wf":"در اینجا، ساختار try to open به معنای تلاش برای انجام کار است، اما try opening به معنی آزمایش کردن یک روش برای باز کردن است. در این بافت، آزمایش کردن روش طبیعی‌تر به نظر می‌رسد."}],"gold":[{"e":"Stop + -ing means cease an activity; stop + to + verb means pause for a purpose.","f":"ترکیب stop + -ing یعنی متوقف کردن یک فعالیت؛ اما stop + to + verb یعنی ایستادن و مکث کردن برای انجام منظوری خاص."},{"e":"Remember + -ing refers to a past memory; remember + to + verb refers to a future task.","f":"ترکیب remember + -ing به خاطره‌ای در گذشته اشاره دارد؛ در حالی که remember + to + verb به انجام وظیفه‌ای در آینده مربوط می‌شود."},{"e":"Try + -ing is an experiment; try + to + verb is an effort to succeed.","f":"ترکیب try + -ing یعنی امتحان کردن یک روش؛ اما try + to + verb یعنی تلاش کردن برای موفقیت در انجام کار."}]}],"ex":[{"t":"gap","q":"I enjoy ___ (read) books in the evening.","key":["reading"],"why":"The verb 'enjoy' is followed by a gerund (-ing form)."},{"t":"gap","q":"She decided ___ (buy) a new car.","key":["to buy"],"why":"The verb 'decide' is followed by an infinitive (to + verb)."},{"t":"gap","q":"He stopped ___ (smoke) last year.","key":["smoking"],"why":"'Stop + gerund' means to cease the action itself."},{"t":"gap","q":"She is good at ___ (play) tennis.","key":["playing"],"why":"Gerunds are used after prepositions like 'at'."},{"t":"gap","q":"It is important ___ (study) hard.","key":["to study"],"why":"Infinitives are used after certain adjectives like 'important'."},{"t":"gap","q":"Let's go ___ (swim) in the lake.","key":["swimming"],"why":"The verb 'go' is followed by a gerund for activities."},{"t":"fix","q":"I want go to the park.","key":["I want to go to the park."],"why":"The verb 'want' requires an infinitive (to + verb), not a bare verb."},{"t":"fix","q":"She is interested in learn English.","key":["She is interested in learning English."],"why":"After a preposition like 'in', we use the gerund (-ing form)."},{"t":"fix","q":"He stopped to smoke last year.","key":["He stopped smoking last year."],"why":"'Stop to smoke' means he paused another action in order to smoke; 'stopped smoking' means he quit the habit."},{"t":"fa","q":"من دوست دارم فوتبال بازی کنم.","key":["I like playing football."],"why":"The verb 'like' is typically followed by a gerund when referring to general enjoyment."},{"t":"fa","q":"او تصمیم گرفت درس بخواند.","key":["He decided to study."],"why":"The verb 'decide' is followed by an infinitive (to + verb)."},{"t":"fa","q":"آیا مایل هستید به سینما برویم؟","key":["Would you like to go to the cinema?"],"why":"The phrase 'would like' is followed by an infinitive (to + verb)."},{"t":"gap","q":"I hope ___ (visit) my grandparents this weekend.","key":["to visit"],"why":"The verb 'hope' is followed by the infinitive 'to + verb'."},{"t":"gap","q":"She enjoys ___ (cook) delicious meals for her family.","key":["cooking"],"why":"The verb 'enjoy' is followed by a gerund (-ing form)."},{"t":"gap","q":"I want you ___ (finish) your homework before dinner.","key":["to finish"],"why":"The structure 'want + object + to + infinitive' is used here."},{"t":"gap","q":"He is interested in ___ (learn) more about history.","key":["learning"],"why":"After a preposition like 'in', we use the gerund (-ing form)."},{"t":"fix","q":"I remember lock the door before leaving.","key":["I remember locking the door before leaving."],"why":"Remember + -ing refers to recalling a past action; 'lock' should be 'locking'."},{"t":"fix","q":"She stopped to drink water because she was thirsty.","key":["She stopped drinking water because she was thirsty."],"why":"Stop + -ing means ceasing an activity; the context implies she ceased the act of drinking."},{"t":"fa","q":"او تصمیم گرفت که به دانشگاه برود.","key":["He decided to go to university."],"why":"The verb 'decide' is followed by the infinitive 'to + verb'."},{"t":"fa","q":"آیا شما دوست دارید شنا کنید؟","key":["Do you enjoy swimming?"],"why":"The verb 'enjoy' is followed by a gerund (-ing form)."}]},{"id":"t20","t":"used to / be used to / get used to","tf":"عادت‌ها و عادت‌کردن","parts":[{"lv":"I","title":"used to / be used to / get used to","exp":[{"h":"Used to","b":"You use this structure to talk about habits or states in the past that are no longer true. It only works in the past tense, so you cannot use it for the present or future.","hf":"عادت در گذشته (Used to)","bf":"برای بیان عادت‌ها یا وضعیت‌هایی در گذشته که دیگر ادامه ندارند، از این ساختار استفاده می‌کنیم. این شکل فقط برای زمان گذشته به کار می‌رود و با حال یا آینده مقایسه نمی‌شود.","ex":[{"e":"I used to play tennis.","p":"من سابقاً تنیس بازی می‌کردم."},{"e":"Did you use to live here?","p":"آیا قبلاً اینجا زندگی می‌کردی؟"}]},{"h":"Be used to","b":"You use this when you are familiar with something or have mastered it. The word to here is a preposition, so it must be followed by a noun or a verb ending in ing.","hf":"آشنا بودن با چیزی (Be used to)","bf":"وقتی می‌گوییم کسی با چیزی آشنا است یا بر آن مسلط شده، از این ساختار استفاده می‌کنیم. کلمه to در اینجا حرف اضافه است، بنابراین بعد از آن باید اسم یا gerund (فعل با ing) بیاید.","ex":[{"e":"I am used to the cold weather.","p":"من به هوای سرد عادت دارم."},{"e":"She is used to working late.","p":"او به کار کردن تا دیر وقت عادت دارد."}]},{"h":"Get used to","b":"This phrase shows the process of becoming accustomed to something, moving from unfamiliarity to familiarity. Like the previous structure, it requires a noun or a verb ending in ing after to.","hf":"عادت کردن به چیزی (Get used to)","bf":"این عبارت فرآیند عادت کردن را نشان می‌دهد؛ یعنی از ناشناخته بودن به آشنا شدن می‌رسیم. این ساختار نیز مانند مورد قبلی، بعد از to نیاز به اسم یا gerund دارد.","ex":[{"e":"I can't get used to waking up early.","p":"نمی‌توانم به زود بیدار شدن عادت کنم."},{"e":"He got used to driving on the left.","p":"او به رانندگی در سمت چپ عادت کرد."}]}],"tip":"Remember that in be used to and get used to, the word to is a preposition, not part of the verb, so it is always followed by a noun or an ing form.","tipf":"به یاد داشته باشید که در 'be used to' و 'get used to'، کلمه 'to' یک حرف اضافه است، نه بخشی از فعل، بنابراین همیشه بعد از آن اسم یا فرم ing می‌آید.","bad":[{"b":"I am used to play tennis.","g":"I am used to playing tennis.","w":"You must use the ing form after be used to, not the base verb.","wf":"بعد از 'be used to' باید از gerund (ing) استفاده شود، نه مصدر."},{"b":"I used to live here now.","g":"I am used to living here now.","w":"Do not use the past form used to for a current state of familiarity; use am used to instead.","wf":"برای وضعیت فعلی که در آن آشنا هستید، از 'used to' گذشته استفاده نکنید؛ از 'am used to' استفاده کنید."},{"b":"She got used to wake up early.","g":"She got used to waking up early.","w":"In the get used to structure, just like in be used to, you must use the ing form after to.","wf":"در ساختار 'get used to' نیز مانند 'be used to'، بعد از to باید فرم ing بیاید."}],"gold":[{"e":"Used to is only for the past.","f":"Used to فقط برای گذشته است."},{"e":"Be used to and get used to are followed by a noun or an ing verb.","f":"Be used to و get used to با یک اسم یا فعل ing دنبال می‌شوند."},{"e":"Get used to describes the process of becoming familiar.","f":"Get used to فرآیند آشنا شدن را توصیف می‌کند."}]}],"ex":[{"t":"gap","q":"I ___ play football when I was a child.","key":["used to"],"why":"Used to describes a past habit that is no longer true."},{"t":"gap","q":"She is not used to ___ up early.","key":["waking"],"why":"Be used to is followed by a gerund (verb+ing)."},{"t":"gap","q":"He is getting used to ___ in a cold climate.","key":["living"],"why":"Get used to is followed by a gerund (verb+ing)."},{"t":"fix","q":"I am used to drive to work.","key":["I am used to driving to work."],"why":"After 'be used to', use the gerund form (driving)."},{"t":"fix","q":"She used to working late hours.","key":["She is used to working late hours."],"why":"To describe current familiarity, use 'is used to' instead of 'used to'."},{"t":"fix","q":"They got used to the new schedule.","key":["They got used to the new schedule."],"why":"This sentence is already correct; 'get used to' takes a noun phrase here."},{"t":"fa","q":"من قبلاً در لندن زندگی می‌کردم.","key":["I used to live in London."],"why":"Used to describes a past state or habit that is no longer true."},{"t":"fa","q":"او به غذای تند عادت دارد.","key":["He is used to spicy food."],"why":"Be used to describes a current state of familiarity with something."},{"t":"gap","q":"Did you use to live in Paris?","key":["use"],"why":"In questions with 'did', use the base form 'use'."},{"t":"gap","q":"It took me time to get used to ___ late.","key":["waking"],"why":"Get used to is followed by a gerund (verb+ing)."},{"t":"fix","q":"I am get used to the noise.","key":["I am getting used to the noise."],"why":"Use the present continuous 'getting' to describe the process of adaptation."},{"t":"fa","q":"آنها به رانندگی در ترافیک سنگین عادت کردند.","key":["They got used to driving in heavy traffic."],"why":"Get used to describes the process of becoming familiar with something."},{"t":"gap","q":"I ___ to the cold weather now.","key":["am used"],"why":"'be used to' describes a current state of familiarity with something."},{"t":"fix","q":"He get used to waking up early.","key":["He got used to waking up early."],"why":"The past tense 'got' is needed to match the completed action of adapting."},{"t":"fa","q":"او به غذای ایرانی عادت کرده است.","key":["He is used to Iranian food."],"why":"'be used to' is used to describe a current habit or state of familiarity."}]},{"id":"t21","t":"Time Clauses","tf":"جمله‌های زمانی","parts":[{"lv":"B","title":"when I do / before I do (future time clauses)","exp":[{"h":"Using 'when' for future events","b":"When we talk about the future after 'when', we use the present simple tense, not 'will'. This is because 'when' already points to the future. For example, say 'When I arrive, I will call you' instead of 'When I will arrive'.","hf":"استفاده از 'when' برای رویدادهای آینده","bf":"وقتی درباره آینده بعد از 'when' صحبت می‌کنیم، از زمان حال ساده استفاده می‌کنیم، نه 'will'. این به این دلیل است که 'when' از پیش به آینده اشاره دارد. برای مثال، بگویید 'When I arrive, I will call you' به جای 'When I will arrive'.","ex":[{"e":"When I finish work, I will go home.","p":"وقتی کارم را تمام کنم، به خانه خواهم رفت."},{"e":"When she arrives, we will start the meeting.","p":"وقتی او برسد، جلسه را شروع خواهیم کرد."}]},{"h":"Using 'before' for future actions","b":"Similarly, after 'before', we use the present simple for the future action. Do not use 'will' in the 'before' clause. The main clause usually contains 'will'.","hf":"استفاده از 'before' برای کارهای آینده","bf":"به همین ترتیب، بعد از 'before'، برای کار آینده از زمان حال ساده استفاده می‌کنیم. در بند 'before' از 'will' استفاده نکنید. بند اصلی معمولاً شامل 'will' است.","ex":[{"e":"Before I leave, I will lock the door.","p":"قبل از اینکه بروم، در را قفل خواهم کرد."},{"e":"Before you eat, wash your hands.","p":"قبل از اینکه غذا بخوری، دست‌هایت را بشوی."}]},{"h":"Order of clauses does not matter","b":"You can put the 'when' or 'before' clause first or second. If it comes first, use a comma. If it comes second, do not use a comma. The tense rule stays the same.","hf":"ترتیب بندها مهم نیست","bf":"می‌توانید بند 'when' یا 'before' را در اول یا دوم بیاورید. اگر در ابتدا بیاید، از ویرگول استفاده کنید. اگر در انتها بیاید، از ویرگول استفاده نکنید. قانون زمان تغییری نمی‌کند.","ex":[{"e":"I will call you when I arrive.","p":"وقتی برسم به تو زنگ خواهم زد."},{"e":"When I arrive, I will call you.","p":"وقتی برسم، به تو زنگ خواهم زد."}]}],"tip":"Always use present simple after when, before, after, as soon as, until for future meaning.","tipf":"همیشه برای بیان آینده، بعد از when، before، after، as soon as و until از زمان حال ساده استفاده کنید.","bad":[{"b":"When I will arrive, I will call you.","g":"When I arrive, I will call you.","w":"Do not use 'will' in the time clause after 'when'.","wf":"از 'will' در بند زمانی بعد از 'when' استفاده نکنید."},{"b":"Before I will leave, I will lock the door.","g":"Before I leave, I will lock the door.","w":"Do not use 'will' in the 'before' clause.","wf":"از 'will' در بند 'before' استفاده نکنید."},{"b":"When she will come, we will start.","g":"When she comes, we will start.","w":"Do not use 'will' in the time clause. Use the present simple instead.","wf":"از 'will' در بند زمانی استفاده نکنید. به جای آن از حال ساده استفاده کنید."}],"gold":[{"e":"Use present simple in time clauses (when, before, after) for future reference.","f":"در بندهای زمانی (when، before، after) برای اشاره به آینده از زمان حال ساده استفاده کنید."},{"e":"Do not use 'will' in the clause introduced by 'when' or 'before'.","f":"در بندی که با 'when' یا 'before' شروع می‌شود از 'will' استفاده نکنید."},{"e":"The main clause usually contains 'will' or an imperative.","f":"بند اصلی معمولاً شامل 'will' یا یک فعل امری است."}]},{"lv":"I","title":"Time clauses: when / while / until / as soon as / once","exp":[{"h":"Using 'when' for specific moments","b":"We use 'when' to talk about a specific moment in time. It connects two events where one happens immediately after the other. Think of it as a trigger for the second action.","hf":"استفاده از 'when' برای لحظات خاص","bf":"ما از 'when' برای صحبت درباره یک لحظه خاص در زمان استفاده می‌کنیم. این کلمه دو رویداد را به هم متصل می‌کند که یکی پس از دیگری رخ می‌دهند. آن را به عنوان یک محرک برای عمل دوم در نظر بگیرید.","ex":[{"e":"When I arrived, the movie had started.","p":"وقتی رسیدم، فیلم شروع شده بود."},{"e":"When she calls, tell her I am busy.","p":"وقتی تماس گرفت، به او بگو که مشغولم."}]},{"h":"Using 'while' for continuous actions","b":"Use 'while' when two actions happen at the same time for a duration. It emphasizes that both actions are ongoing simultaneously. It is often followed by a continuous tense.","hf":"استفاده از 'while' برای کارهای در جریان","bf":"از 'while' زمانی استفاده کنید که دو کار همزمان و در طول یک مدت زمان رخ می‌دهند. این کلمه تأکید می‌کند که هر دو عمل همزمان در حال انجام هستند. معمولاً بعد از آن از زمان استمراری استفاده می‌شود.","ex":[{"e":"While I was cooking, he was cleaning.","p":"در حالی که من آشپزی می‌کردیم، او داشت تمیزکاری می‌کرد."},{"e":"While she was reading, the phone rang.","p":"در حالی که او مطالعه می‌کرد، تلفن زنگ خورد."}]},{"h":"Using 'until' and 'as soon as'","b":"'Until' marks the endpoint of an action. 'As soon as' means immediately after. Both help you define exactly when something starts or stops in your story.","hf":"استفاده از 'until' و 'as soon as'","bf":"کلمه 'until' نقطه پایان یک عمل را مشخص می‌کند و 'as soon as' به معنای «به محض اینکه» است. هر دو به شما کمک می‌کنند دقیقاً تعیین کنید چه زمانی چیزی در داستان شما شروع می‌شود یا پایان می‌یابد.","ex":[{"e":"Wait here until I come back.","p":"اینجا منتظر بمان تا من برگردم."},{"e":"Call me as soon as you arrive.","p":"به محض اینکه رسیدی، به من زنگ بزن."}]}],"tip":"Remember that 'while' is usually followed by a continuous verb form, whereas 'when' can be followed by simple or continuous forms.","tipf":"به یاد داشته باشید که بعد از 'while' معمولاً از شکل استمراری فعل استفاده می‌شود، در حالی که پس از 'when' می‌توانید از فرم‌های ساده یا استمراری استفاده کنید.","bad":[{"b":"I was sleeping when the phone was ringing.","g":"I was sleeping when the phone rang.","w":"Use simple past for the interrupting action, not continuous.","wf":"برای عمل ناگهانی و قطع‌کننده از گذشته ساده استفاده کنید، نه استمراری."},{"b":"I will wait until you will finish.","g":"I will wait until you finish.","w":"Do not use 'will' in the time clause after 'until'.","wf":"در جملهواره‌های زمانی بعد از 'until' از 'will' استفاده نکنید."},{"b":"While I was eat, he was watching TV.","g":"While I was eating, he was watching TV.","w":"After 'while' with past tense, use the -ing form.","wf":"بعد از 'while' در زمان گذشته، فعل را با پسوند ing- به کار ببرید."}],"gold":[{"e":"Use 'when' for short actions that interrupt longer actions.","f":"از 'when' برای کارهای کوتاهی که کارهای طولانی‌تر را قطع می‌کنند، استفاده کنید."},{"e":"Use 'while' for two long actions happening at the same time.","f":"از 'while' برای دو کار طولانی که به‌صورت همزمان اتفاق می‌افتند استفاده کنید."},{"e":"Use 'until' to show the end point of an action.","f":"از 'until' برای نشان دادن نقطه پایان یک عمل استفاده کنید."}]}],"ex":[{"t":"gap","q":"I will call you when I ___ home.","key":["get"],"why":"In future time clauses with 'when', we use the present simple tense."},{"t":"gap","q":"___ you finish your homework, you can watch TV.","key":["When"],"why":"'When' is used to refer to a specific moment in the future."},{"t":"gap","q":"She will wait here until the bus ___.","key":["arrives"],"why":"With 'until', we use the present simple to describe the future event."},{"t":"fix","q":"I will call you when I will arrive.","key":["I will call you when I arrive."],"why":"We do not use 'will' in the time clause; use present simple instead."},{"t":"gap","q":"___ you see him, say hello.","key":["As soon as"],"why":"'As soon as' indicates that one action happens immediately after another."},{"t":"gap","q":"He was sleeping while I ___ cooking dinner.","key":["was"],"why":"'While' is often used with continuous tenses to show simultaneous actions."},{"t":"fa","q":"من قبل از اینکه بیرون بروم، لباس‌هایم را می‌پوشم.","key":["I put on my clothes before I go out."],"why":"'Before' introduces the time clause; the main clause can be present or future depending on context."},{"t":"gap","q":"We won't start the meeting until the manager ___.","key":["arrives"],"why":"Use present simple in the time clause after 'until' for future meaning."},{"t":"fix","q":"When I will finish, I will call you.","key":["When I finish, I will call you."],"why":"Remove 'will' from the 'when' clause; keep it in the main clause."},{"t":"gap","q":"___ you have finished your work, you can leave.","key":["Once"],"why":"'Once' means 'as soon as' or 'after' and is followed by a present tense in future contexts."},{"t":"gap","q":"I will stay here ___ it stops raining.","key":["until"],"why":"'Until' marks the endpoint of an action in the future."},{"t":"fix","q":"She will call you before she will leave.","key":["She will call you before she leaves."],"why":"The time clause after 'before' uses present simple, not future."},{"t":"gap","q":"___ you see the sign, turn left.","key":["As soon as"],"why":"'As soon as' emphasizes the immediacy of the action following the condition."},{"t":"fa","q":"وقتی که باران می‌بارد، من در خانه می‌مانم.","key":["When it rains, I stay at home."],"why":"Use present simple in both clauses for general truths or habits with 'when'."},{"t":"gap","q":"He read the book while I ___ watching TV.","key":["was"],"why":"'While' connects two continuous actions happening at the same time."}]},{"id":"t22","t":"Relative Clauses","tf":"جمله‌های وصفی","parts":[{"lv":"I","title":"Relative Clauses","exp":[{"h":"Relative Pronouns (who, which, that)","b":"You use these pronouns to connect two sentences and give more information about a noun. Use who for people, which for things and animals, and that for both people and things.","hf":"ضمایر موصولی (who, which, that)","bf":"برای وصل کردن دو جمله و توضیح دادن درباره یک اسم از این ضمایر استفاده می‌کنیم. از who برای انسان، which برای اشیاء و حیوانات، و از that برای هر دو استفاده می‌شود.","ex":[{"e":"I met a man who speaks four languages.","p":"مردی را ملاقات کردم که چهار زبان صحبت می‌کند."},{"e":"This is the car which I bought yesterday.","p":"این همان ماشینی است که دیروز خریدم."}]},{"h":"Defining vs Non-defining Clauses","b":"If the information is essential to identify the noun, do not use commas, which creates a defining clause. If the noun is already clear and you are adding extra information, put it between commas for a non-defining clause.","hf":"تفاوت جمله‌های تعریف‌کننده و غیرتعریف‌کننده (Defining vs Non-defining)","bf":"اگر اطلاعات داخل جمله برای شناختن اسم ضروری باشد، کاما نمی‌گذاریم (Defining). اما اگر اسم از قبل کاملاً مشخص باشد، اطلاعات اضافی را بین دو کاما قرار می‌دهیم (Non-defining).","ex":[{"e":"My brother, who lives in London, is a doctor.","p":"برادر من که در لندن زندگی می‌کند، پزشک است."},{"e":"The woman who lives next door is a teacher.","p":"زنی که در خانه مجاور زندگی می‌کند معلم است."}]},{"h":"Possession with whose","b":"To show possession in relative clauses, use whose instead of hi
