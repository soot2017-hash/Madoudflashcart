ted longer.","key":["would have"],"why":"Third conditional structure for past conditions and results."},{"t":"fix","q":"If I would have more money, I would travel the world.","key":["If I had more money, I would travel the world."],"why":"Second conditional uses past simple 'had' in the if-clause, not 'would have'."},{"t":"fix","q":"If she studied harder, she would have passed the exam last year.","key":["If she had studied harder, she would have passed the exam last year."],"why":"Third conditional requires past perfect in the if-clause for past results."},{"t":"fix","q":"If he is taller, he could reach the shelf.","key":["If he were taller, he could reach the shelf."],"why":"Second conditional uses 'were' for hypothetical present situations, even with 'he'."},{"t":"fa","q":"اگر باران ببارد، ما به پارک نم��‌رویم.","key":["If it rains, we will not go to the park."],"why":"First conditional for real future possibility."},{"t":"fa","q":"اگر من جای تو بودم، این کار را نمی‌کردم.","key":["If I were you, I would not do it."],"why":"Second conditional for hypothetical present situation."},{"t":"fa","q":"اگر او زودتر آمده بود، می‌توانست با ما شام بخورد.","key":["If he had come earlier, he could have had dinner with us."],"why":"Third conditional for past condition and result."},{"t":"gap","q":"If it rains, we ___ at home.","key":["will stay"],"why":"First conditional structure uses will + base verb for the result clause."},{"t":"gap","q":"Unless you hurry, you ___ miss the bus.","key":["will"],"why":"Unless introduces a negative condition, and the main clause typically uses will for future prediction."},{"t":"fix","q":"If I was you, I would accept the offer.","key":["If I were you, I would accept the offer."],"why":"In the second conditional, 'were' is used for all subjects in the if-clause, not 'was'."},{"t":"gap","q":"If she had studied, she ___ have passed the exam.","key":["would"],"why":"The third conditional result clause uses would have + past participle."},{"t":"fa","q":"اگر پول بیشتری داشتم، یک ماشین می‌خریدم.","key":["If I had more money, I would buy a car."],"why":"This is a second conditional sentence expressing a hypothetical present situation and its result."},{"t":"gap","q":"You can use the computer as long as you ___ make noise.","key":["don't"],"why":"As long as introduces a condition, and the negative form is needed here to match the context."},{"t":"fix","q":"If he would have known, he would have come.","key":["If he had known, he would have come."],"why":"The third conditional if-clause uses the past perfect (had + past participle), not 'would have'."},{"t":"fa","q":"اگر او زودتر نمی‌آمد، ما گرسنه می‌ماندیم.","key":["If he hadn't come earlier, we would have been hungry."],"why":"This is a mixed conditional or third conditional context where the past action affects a past state, but typically 'would have been' fits the past result of a past condition."}]},{"id":"t26","t":"Wishes, Subjunctive and Unreal Past","tf":"آرزو و گذشتهٔ غیرواقعی","parts":[{"lv":"I","title":"I wish / If only","exp":[{"h":"Regret about the present","b":"Use wish or if only with the simple past to talk about a present situation you want to be different. Even though you use a past tense form, the meaning refers to now, not the past.","hf":"بیان حسرت برای وضعیت فعلی (گذشته ساده)","bf":"وقتی می‌خواهیم شرایط فعلی‌مان متفاوت از این باشد، از wish یا if only به همراه زمان گذشته ساده استفاده می‌کنیم. معنی این ساختار مربوط به زمان حال است، نه گذشته.","ex":[{"e":"I wish I had a bigger car.","p":"ای کاش ماشین بزرگ‌تری داشتم."},{"e":"If only I knew the answer.","p":"ای کاش جواب را می‌دانستم."}]},{"h":"Complaining about someone else's behavior","b":"Use wish or if only with would when you are annoyed by someone and want them to change their actions or stop doing something.","hf":"گلایه و درخواست تغییر رفتار دیگران (would)","bf":"از wish یا if only به همراه would وقتی استفاده می‌کنیم که از دست کسی ناراحتیم و می‌خواهیم کاری را انجام دهد یا متوقف کند.","ex":[{"e":"I wish it would stop raining.","p":"ای کاش باران بند می‌آمد."},{"e":"I wish you wouldn't make so much noise.","p":"ای کاش این‌قدر سر و صدا نمی‌کردی."}]},{"h":"Regret about the past","b":"Use the past perfect to express regret or remorse about something you did or did not do in the past.","hf":"ابراز پشیمانی از گذشته (گذشته کامل)","bf":"برای بیان حسرت و پشیمانی درباره کاری که در گذشته انجام داده‌ایم یا نداده‌ایم، از گذشته کامل (had done) استفاده می‌کنیم.","ex":[{"e":"I wish I had studied harder for the exam.","p":"ای کاش بیشتر برای امتحان درس خوانده بودم."},{"e":"If only I hadn't said that.","p":"ای کاش آن حرف را نزده بودم."}]}],"tip":"If only is stronger and more emotional than I wish, and it is usually used as a standalone sentence.","tipf":"عبارت If only از I wish قوی‌تر و احساسی‌تر است و معمولاً تنها در جمله به کار می‌رود.","bad":[{"b":"I wish I have a car now.","g":"I wish I had a car now.","w":"You must use the past tense form, not the present, to express regret about the current situation.","wf":"برای بیان حسرت در زمان حال، حتماً باید از فعل گذشته (had) استفاده کنید نه حال."},{"b":"I wish you will help me.","g":"I wish you would help me.","w":"You must use would, not will, after wish when asking for a change in behavior.","wf":"برای درخواست تغییر در آینده، بعد از wish باید از would استفاده شود نه will."},{"b":"I wish I went to the party yesterday.","g":"I wish I had gone to the party yesterday.","w":"You must use the past perfect, not the simple past, to express regret about past actions.","wf":"برای پشیمانی از کارهای گذشته، استفاده از گذشته ساده غلط است و باید گذشته کامل به کار ببرید."}],"gold":[{"e":"Remember that wish + past simple talks about the present, not the past.","f":"به یاد داشته باشید که wish به همراه زمان گذشته ساده درباره حال صحبت می‌کند، نه گذشته."},{"e":"Use would only when you want someone else to change their behavior.","f":"فقط زمانی از would استفاده کنید که می‌خواهید رفتار شخص دیگری تغییر کند."},{"e":"Always use the past perfect for regrets about things that already happened.","f":"همیشه برای حسرت درباره کارهایی که قبلاً رخ داده‌اند، از گذشته کامل استفاده کنید."}]},{"lv":"A","title":"Subjunctive and Unreal Past","exp":[{"h":"Base form after suggestion verbs","b":"When you use verbs like suggest or recommend, you should use the base form of the next verb. This means you do not add an s for the third person. It shows that the action is just an idea or a suggestion for now.","hf":"صورت پایه (Base Form) پس از افعال پیشنهاد","bf":"در انگلیسی رسمی، پس از افعالی مانند suggest، recommend یا动词های مشابه که بیانگر پیشنهاد، درخواست یا دستور هستند، از صورت پایه فعل (بدون s برای سوم شخص) استفاده می‌شود. این ساختار نشان‌دهنده یک عمل پیشنهادی است که هنوز رخ نداده است.","ex":[{"e":"I suggest that he be present.","p":"پیشنهاد می‌کنم که او حضور داشته باشد."},{"e":"She recommended that the document be signed.","p":"او توصیه کرد که سند امضا شود."}]},{"h":"Using past tense with It's time","b":"When you say it is time for something, you use the past tense of the verb. This makes it sound like the time for that action has already passed or is very urgent. It is a common way to express that something needs to happen soon.","hf":"استفاده از 'It's time' با گذشته ساده","bf":"وقتی می‌گوییم 'It's time'، از گذشته ساده استفاده می‌کنیم تا نشان دهیم زمان انجام کار گذشته است یا باید همین حالا انجام شود. این ساختار بیانگر یک احساس فوری یا تأخیر در انجام کار است.","ex":[{"e":"It's time we left.","p":"وقت آن است که برویم."},{"e":"It's time you started working harder.","p":"وقت آن است که سخت‌تر کار کنی."}]},{"h":"Preferences with would rather","b":"If you talk about yourself, you use the base form after would rather. But if you talk about someone else, you use the past tense. This helps you show that you prefer a different person to do something differently.","hf":"علاقه‌مندی با 'Would rather'","bf":"برای بیان ترجیح شخصی درباره خودمان، از 'would rather' به همراه صورت پایه فعل استفاده می‌کنیم. اما اگر درباره شخص دیگری ترجیح می‌دهیم که کاری را انجام دهد، از گذشته ساده استفاده می‌کنیم.","ex":[{"e":"I would rather stay home tonight.","p":"ترجیح می‌دهم امشب در خانه بمانم."},{"e":"I would rather you didn't smoke here.","p":"ترجیح می‌دهم اینجا سیگار نکشی."}]}],"tip":"Always check if the verb follows a suggestion word or talks about another person to choose the right form.","tipf":"در جملات پیشنهادی، فعل اصلی را بدون تغییر و به صورت ساده بنویسید.","bad":[{"b":"I suggest that he is late.","g":"I suggest that he be late.","w":"You should use the base form after suggest, not the present tense form.","wf":"بعد از suggest باید از صورت پایه فعل استفاده شود، نه زمان حال."},{"b":"It's time we leave now.","g":"It's time we left now.","w":"After it is time, you need to use the past tense to show urgency.","wf":"بعد از It's time باید از گذشته ساده استفاده شود."},{"b":"I would rather you don't go.","g":"I would rather you didn't go.","w":"When referring to another person, the past tense is required after would rather.","wf":"وقتی درباره شخص دیگری صحبت می‌کنیم، باید از گذشته ساده استفاده کنیم."}],"gold":[{"e":"Use the base form after suggest and recommend.","f":"از صورت پایه فعل بعد از suggest و recommend استفاده کنید."},{"e":"Use the past tense after it is time.","f":"بعد از it is time از زمان گذشته استفاده کنید."},{"e":"Use the past tense after would rather when talking about someone else.","f":"وقتی درباره شخص دیگری صحبت می‌کنید، بعد از would rather از زمان گذشته استفاده کنید."},{"e":"Use the base form after would rather when talking about yourself.","f":"وقتی درباره خودتان صحبت می‌کنید، بعد از would rather از صورت پ��یه استفاده کنید."}]},{"lv":"A","title":"Subjunctive: insist that he be / suggest that he do","exp":[{"h":"The Subjunctive After 'Insist'","b":"When you use verbs like 'insist', 'demand', or 'suggest', the next verb stays in its base form. It does not change for he, she, or it. This is called the subjunctive mood. It sounds formal but is very common in professional English.","hf":"وجه التزامی پس از 'اصرار'","bf":"وقتی از افعالی مانند 'insist' (اصرار کردن)، 'demand' (درخواست کردن) یا 'suggest' (پیشنهاد دادن) استفاده می‌کنید، فعل بعدی به شکل پایه خود باقی می‌ماند و برای he، she یا it تغییر نمی‌کند. به این حالت وجه التزامی می‌گویند. این ساختار کمی رسمی است اما در انگلیسی حرفه‌ای بسیار رایج است.","ex":[{"e":"I insist that he be present at the meeting.","p":"من اصرار دارم که او در جلسه حضور داشته باشد."},{"e":"She insisted that the report be finished today.","p":"او اصرار داشت که گزارش امروز تکمیل شود."}]},{"h":"Using 'Suggest' and 'Recommend'","b":"The rule is the same for suggestions. Do not add 's' to the verb, even if the subject is third person singular. Many learners make the mistake of saying 'suggests that he goes'. Remember to use the base form 'go' instead.","hf":"استفاده از 'Suggest' و 'Recommend'","bf":"قانون برای پیشنهادها نیز یکسان است. حتی اگر فاعل سوم شخص مفرد باشد، به فعل 's' اضافه نکنید. بسیاری از زبان‌آموزان به اشتباه می‌گویند 'suggests that he goes'. به یاد داشته باشید که به جای آن باید از شکل پایه 'go' استفاده کنید.","ex":[{"e":"I suggest that she take a break.","p":"پیشنهاد می‌کنم که او استراحت کند."},{"e":"We recommend that he apply for the job.","p":"ما توصیه می‌کنیم که او برای این شغل درخواست بدهد."}]},{"h":"Common Verbs Triggering Subjunctive","b":"You can use this structure with several key verbs: insist, suggest, recommend, demand, and propose. In all these cases, the verb following 'that' is always in the infinitive without 'to'. This creates a consistent pattern for formal requests.","hf":"افعال رایجی که وجه التزامی را فعال می‌کنند","bf":"می‌توانید از این ساختار با چند فعل کلیدی استفاده کنید: insist، suggest، recommend، demand و propose. در همه این موارد، فعلی که بعد از 'that' می‌آید همیشه به صورت مصدر بدون 'to' است. این یک الگوی ثابت برای درخواست‌های رسمی ایجاد می‌کند.","ex":[{"e":"The doctor recommended that he stop smoking.","p":"پزشک توصیه کرد که او سیگار را ترک کند."},{"e":"They demanded that the manager explain the error.","p":"آن‌ها درخواست کردند که مدیر خطا را توضیح دهد."}]}],"tip":"Always check if the verb before 'that' is one of the special verbs like insist or suggest. If yes, use the base form of the next verb without 'to' and without any endings like -s or -ed.","tipf":"همیشه بررسی کنید که آیا فعلِ قبل از 'that' یکی از افعال خاص مانند insist یا suggest است یا خیر. اگر پاسخ مثبت است، از شکل پایه فعل بعدی بدون 'to' و بدون هیچ پسوندی مانند -s یا -ed استفاده کنید.","bad":[{"b":"I insist that he is late.","g":"I insist that he be late.","w":"After 'insist', we use the subjunctive base form 'be', not the indicative 'is'.","wf":"پس از 'insist'، ما از شکل پایه التزامی 'be' استفاده می‌کنیم، نه شکل خبری 'is'."},{"b":"She suggests that he goes home.","g":"She suggests that he go home.","w":"Even though 'she' is third person singular, the verb after 'suggest that' remains in the base form 'go', not 'goes'.","wf":"با وجود اینکه 'she' سوم شخص مفرد است، فعل بعد از 'suggest that' در شکل پایه 'go' باقی می‌ماند، نه 'goes'."},{"b":"We recommend that she takes the medicine.","g":"We recommend that she take the medicine.","w":"The verb 'recommend' triggers the subjunctive mood, so we use 'take' instead of 'takes'.","wf":"فعل 'recommend' وجه التزامی را فعال می‌کند، بنابراین به جای 'takes' از 'take' استفاده می‌کنیم."}],"gold":[{"e":"Use the base form of the verb after verbs like insist, suggest, and demand.","f":"از شکل پایه فعل بعد از افعالی مانند insist، suggest و demand استفاده کنید."},{"e":"Do not add 's' to the verb in the third person singular subjunctive.","f":"در وجه التزامی برای سوم شخص مفرد، به فعل 's' اضافه نکنید."},{"e":"The structure is always: Subject + Verb + that + Subject + Base Verb.","f":"ساختار همیشه به این صورت است: فاعل + فعل + that + فاعل + فعل پایه."}]}],"ex":[{"t":"gap","q":"I wish I ___ taller.","key":["were"],"why":"Subjunctive mood for present unreal wishes uses 'were' for all subjects."},{"t":"gap","q":"If only I ___ studied harder for the exam.","key":["had"],"why":"Past regret requires the Past Perfect (had + past participle)."},{"t":"fix","q":"I wish he doesn't make so much noise.","key":["I wish he didn't make so much noise."],"why":"Complaints about present behavior use the Past Simple in the wish clause."},{"t":"gap","q":"The teacher suggested that he ___ more time.","key":["take"],"why":"After suggestion verbs, use the base form (subjunctive) regardless of the subject."},{"t":"fa","q":"کاش دیرتر می‌رفتم خانه.","key":["I wish I had gone home later."],"why":"Regret about the past translates to 'I wish' + Past Perfect."},{"t":"gap","q":"It's time we ___ home.","key":["went"],"why":"'It's time' is followed by the Past Simple to indicate something should happen now."},{"t":"fix","q":"I would rather you call me tomorrow.","key":["I would rather you called me tomorrow."],"why":"With a different subject, 'would rather' takes the Past Simple."},{"t":"gap","q":"I wish I ___ know the answer right now.","key":["knew"],"why":"Present unreal wishes use the Past Simple form of the verb."},{"t":"fa","q":"اگر فقط زودتر بیدار می‌شدم، دیر نمی‌رسیدم.","key":["If only I had woken up earlier, I wouldn't have been late."],"why":"Unreal past conditionals and regrets use Past Perfect in the if-clause/wish."},{"t":"gap","q":"The doctor recommended that she ___ a rest.","key":["take"],"why":"Subjunctive base form is used after recommendation verbs like 'recommend'."},{"t":"fix","q":"I wish I am richer.","key":["I wish I were richer."],"why":"Present wishes about state use the subjunctive 'were'."},{"t":"fa","q":"بهتره الان بریم.","key":["It's time we went now."],"why":"'It's time' indicates the moment for an action, using the Past Simple."},{"t":"gap","q":"I wish I ___ more time to study.","key":["had"],"why":"Present regret uses the past simple form of 'have'."},{"t":"gap","q":"If only she ___ not been so rude.","key":["had"],"why":"Past regret uses the past perfect auxiliary 'had'."},{"t":"fix","q":"The manager insisted that he arrives on time.","key":["The manager insisted that he arrive on time."],"why":"After 'insist', use the base subjunctive form 'arrive'."},{"t":"fix","q":"It's time we go to the park.","key":["It's time we went to the park."],"why":"After 'It's time', use the past simple form 'went'."},{"t":"fa","q":"کاش من آن را زودتر می‌دانستم.","key":["I wish I knew it earlier."],"why":"Present regret about knowledge uses 'wish' + past simple 'knew'."},{"t":"fa","q":"پیشنهاد می‌کنم که او این کار را انجام دهد.","key":["I suggest that he do this."],"why":"After 'suggest', use the base subjunctive form 'do'."},{"t":"gap","q":"I would rather you ___ me alone.","key":["left"],"why":"After 'would rather' with a different subject, use the past simple."},{"t":"gap","q":"The doctor recommended that she ___ more water.","key":["drink"],"why":"After 'recommend', use the base subjunctive form 'drink'."}]},{"id":"t27","t":"Degree and Intensity","tf":"درجه و شدت","parts":[{"lv":"I","title":"so / such (so tired / such a good film)","exp":[{"h":"Using 'so' with adjectives and adverbs","b":"Use 'so' to emphasize the degree of an adjective or adverb. It is followed directly by the adjective or adverb without a noun. For example, you can say 'so tired' or 'so quickly'.","hf":"استفاده از 'so' با صفت‌ها و قیدها","bf":"برای تأکید بر میزان یک صفت یا قید از 'so' استفاده کنید. آن مستقیماً قبل از صفت یا قید می‌آید و اسمی بین آن‌ها نیست. برای مثال می‌توانید بگویید 'so tired' یا 'so quickly'.","ex":[{"e":"The movie was so boring.","p":"فیلم خیلی خسته‌کننده بود."},{"e":"She drives so fast.","p":"او خیلی سریع رانندگی می‌کند."}]},{"h":"Using 'such' with noun phrases","b":"Use 'such' to emphasize a noun phrase. The structure is 'such + a/an + adjective + singular noun' or 'such + adjective + plural/uncountable noun'. It focuses on the noun itself.","hf":"استفاده از 'such' با عبارات اسمی","bf":"برای تأکید بر یک عبارت اسمی از 'such' استفاده کنید. ساختار آن به این صورت است: 'such + a/an + adjective + singular noun' یا 'such + adjective + plural/uncountable noun'. تمرکز روی خود اسم است.","ex":[{"e":"It was such a good film.","p":"این یک فیلم خیلی خوب بود."},{"e":"They have such nice houses.","p":"آن‌ها خانه‌های خیلی زیبایی دارند."}]},{"h":"Difference between 'so' and 'such'","b":"Remember that 'so' modifies adjectives and adverbs directly, while 'such' modifies noun phrases. If there is a noun, you usually need 'such'. If there is only an adjective, use 'so'.","hf":"تفاوت بین 'so' و 'such'","bf":"به یاد داشته باشید که 'so' مستقیماً صفت‌ها و قیدها را تغییر می‌دهد، در حالی که 'such' عبارات اسمی را تغییر می‌دهد. اگر اسم وجود دارد، معمولاً به 'such' نیاز دارید. اگر فقط یک صفت وجود دارد، از 'so' استفاده کنید.","ex":[{"e":"It was so cold.","p":"خیلی سرد بود."},{"e":"It was such cold weather.","p":"این یک هوای خیلی سرد بود."}]}],"tip":"Use 'so' before adjectives/adverbs and 'such' before noun phrases.","tipf":"از 'so' قبل از صفت‌ها/قیدها و از 'such' قبل از عبارات اسمی استفاده کنید.","bad":[{"b":"It was so a good film.","g":"It was such a good film.","w":"We use 'such' with 'a/an' and a noun phrase, not 'so'.","wf":"ما با عبارت اسمی که شامل 'a/an' و اسم است از 'such' استفاده می‌کنیم، نه 'so'."},{"b":"She is such tired.","g":"She is so tired.","w":"'Tired' is an adjective without a noun here, so we use 'so', not 'such'.","wf":"'Tired' یک صفت است و اسمی در اینجا نیست، بنابراین از 'so' استفاده می‌کنیم، نه 'such'."},{"b":"It was such cold.","g":"It was so cold.","w":"'Cold' is an adjective standing alone, so 'so' is required.","wf":"'Cold' یک صفت است که به تنهایی آمده، بنابراین 'so' لازم است."}],"gold":[{"e":"So + adjective/adverb","f":"so + صفت/قید"},{"e":"Such + a/an + adjective + singular noun","f":"such + a/an + صفت + اسم مفرد"},{"e":"Such + adjective + plural/uncountable noun","f":"such + صفت + اسم جمع/غیرقابل شمارش"}]},{"lv":"A","title":"Gradable and ungradable adjectives; degree adverbs","exp":[{"h":"Understanding Gradable Adjectives","b":"Gradable adjectives describe qualities that can exist in different degrees, such as 'big', 'cold', or 'interesting'. You can modify them with words like 'very', 'quite', or 'a bit' to show intensity. Think of them as a scale where you can move up or down.","hf":"صفات درجه‌پذیر","bf":"صفات درجه‌پذیر توصیف‌کننده‌ی ویژگی‌هایی هستند که می‌توانند در درجات مختلف وجود داشته باشند، مانند «بزرگ»، «سرد» یا «جذاب». شما می‌توانید آن‌ها را با کلماتی مانند «خیلی»، «نسبتاً» یا «کمی» اصلاح کنید تا شدت را نشان دهید. آن‌ها را مانند یک مقیاس در نظر بگیرید که می‌توانید در آن بالا یا پایین بروید.","ex":[{"e":"The coffee is very hot.","p":"قهوه خیلی داغ است."},{"e":"She is quite tall.","p":"او نسبتاً قدبلند است."}]},{"h":"Understanding Ungradable Adjectives","b":"Ungradable adjectives represent absolute states, such as 'dead', 'free', or 'perfect'. They usually cannot be graded because something is either that state or it is not. Instead of 'very', we use adverbs like 'absolutely' or 'completely'.","hf":"صفات غیردرجه‌پذیر","bf":"صفات غیردرجه‌پذیر نشان‌دهنده‌ی حالت‌های مطلق هستند، مانند «مرده»، «آزاد» یا «کامل». آن‌ها معمولاً قابل درجه‌بندی نیستند زیرا چیزی یا در آن حالت است یا نیست. به جای «خیلی»، از قیدهایی مانند «کاملاً» استفاده می‌کنیم.","ex":[{"e":"The movie was absolutely fantastic.","p":"فیلم کاملاً فوق‌العاده بود."},{"e":"He is completely exhausted.","p":"او کاملاً خسته است."}]},{"h":"Using Degree Adverbs Correctly","b":"Degree adverbs help you express how much of a quality something has. For gradable adjectives, use 'very' or 'really'. For ungradable adjectives, use 'absolutely' or 'totally'. Choosing the right adverb makes your English sound more natural.","hf":"استفاده صحیح از قیدهای شدت","bf":"قیدهای شدت به شما کمک می‌کنند تا بیان کنید که یک ویژگی تا چه حدی وجود دارد. برای صفات درجه‌پذیر، از «خیلی» یا «واقعاً» استفاده کنید. برای صفات غیردرجه‌پذیر، از «کاملاً» یا «کاملاً (به طور کامل)» استفاده کنید. انتخاب قید مناسب باعث می‌شود انگلیسی شما طبیعی‌تر به نظر برسد.","ex":[{"e":"It is really cold today.","p":"امروز واقعاً سرد است."},{"e":"She is absolutely brilliant.","p":"او فوق‌العاده باهوش است."}]}],"tip":"Avoid using 'very' with ungradable adjectives like 'perfect' or 'dead'. Use 'absolutely' or 'completely' instead.","tipf":"از به کار بردن 'very' با صفات غیردرجه‌پذیر مانند 'perfect' یا 'dead' خودداری کنید. به جای آن از 'absolutely' یا 'completely' استفاده کنید.","bad":[{"b":"The room is very empty.","g":"The room is absolutely empty.","w":"'Empty' is an ungradable adjective, so 'very' is incorrect. Use 'absolutely' or 'completely'.","wf":"کلمه 'empty' یک صفت غیردرجه‌پذیر است، بنابراین استفاده از 'very' نادرست است. از 'absolutely' یا 'completely' استفاده کنید."},{"b":"She is very dead.","g":"She is completely dead.","w":"'Dead' is an absolute state, so 'very' does not fit. Use 'completely' or 'absolutely'.","wf":"کلمه 'dead' یک حالت مطلق است، بنابراین 'very' مناسب نیست. از 'completely' یا 'absolutely' استفاده کنید."},{"b":"This is very unique.","g":"This is absolutely unique.","w":"'Unique' means one of a kind, so it is ungradable. 'Very' is not appropriate here.","wf":"کلمه 'unique' به معنای بی‌نظیر و تک است، بنابراین غیردرجه‌پذیر می‌باشد. کلمه 'very' در اینجا مناسب نیست."}],"gold":[{"e":"Use 'very' with gradable adjectives like 'big' or 'cold'.","f":"از 'very' با صفات درجه‌پذیر مانند 'big' یا 'cold' استفاده کنید."},{"e":"Use 'absolutely' with ungradable adjectives like 'perfect' or 'free'.","f":"از 'absolutely' با صفات غیردرجه‌پذیر مانند 'perfect' یا 'free' استفاده کنید."},{"e":"Never say 'very perfect' or 'very dead'.","f":"هرگز نگویید 'very perfect' یا 'very dead'."}]}],"ex":[{"t":"gap","q":"The movie was ___ interesting that I watched it twice.","key":["so"],"why":"Use 'so' before an adjective to indicate degree."},{"t":"gap","q":"It was ___ a beautiful day that we went for a picnic.","key":["such"],"why":"Use 'such' before a noun phrase with an adjective."},{"t":"gap","q":"She is ___ tired after working all day.","key":["so"],"why":"Use 'so' with adjectives to show intensity."},{"t":"gap","q":"He is ___ a kind person.","key":["such"],"why":"Use 'such' before a noun phrase."},{"t":"gap","q":"The coffee was ___ hot that I couldn't drink it.","key":["so"],"why":"Use 'so' with an adjective before 'that'."},{"t":"fix","q":"It was such tired that she went to bed early.","key":["It was so tired that she went to bed early."],"why":"Use 'so' with the adjective 'tired', not 'such'."},{"t":"fix","q":"She is so a good teacher.","key":["She is such a good teacher."],"why":"Use 'such' before a noun phrase with an article."},{"t":"fix","q":"The food was such delicious that we asked for more.","key":["The food was so delicious that we asked for more."],"why":"Use 'so' with the adjective 'delicious'."},{"t":"gap","q":"They were ___ happy with the results.","key":["so"],"why":"Use 'so' to modify the adjective 'happy'."},{"t":"gap","q":"It was ___ an interesting book.","key":["such"],"why":"Use 'such' before a noun phrase."},{"t":"gap","q":"The test was ___ difficult for me.","key":["so"],"why":"Use 'so' with the adjective 'difficult'."},{"t":"gap","q":"He is ___ a smart student.","key":["such"],"why":"Use 'such' before a noun phrase."},{"t":"fix","q":"The weather was so nice that we stayed outside.","key":["The weather was so nice that we stayed outside."],"why":"Correct usage of 'so' with an adjective."},{"t":"fix","q":"It was such cold today.","key":["It was so cold today."],"why":"Use 'so' with the adjective 'cold', not 'such'."},{"t":"gap","q":"She spoke ___ clearly that everyone understood her.","key":["so"],"why":"Use 'so' with an adverb to show degree."},{"t":"gap","q":"It was ___ a nice surprise.","key":["such"],"why":"Use 'such' before a noun phrase."},{"t":"gap","q":"The problem was ___ complicated to solve quickly.","key":["so"],"why":"Use 'so' with the adjective 'complicated'."},{"t":"fix","q":"He is such tall.","key":["He is so tall."],"why":"Use 'so' with an adjective, not 'such'."},{"t":"fa","q":"فیلم خیلی جالب بود که من دوباره آن را دیدم.","key":["The movie was so interesting that I watched it again."],"why":"Translate 'خیلی جالب' as 'so interesting'."},{"t":"fa","q":"او یک معلم بسیار خوب است.","key":["He is such a good teacher."],"why":"Translate 'یک معلم بسیار خوب' as 'such a good teacher'."}]},{"id":"t28","t":"Common Verbs: get / go","tf":"افعال پرکاربرد get و go","parts":[{"lv":"B","title":"get: get up / get on / get home","exp":[{"h":"Getting out of bed","b":"We use 'get up' to describe the action of rising from bed in the morning. It is a very common phrasal verb for starting your day. Remember that 'up' is essential here to show the upward movement.","hf":"از جا برخاستن","bf":"ما از 'get up' برای توصیف عمل بلند شدن از رختخواب در صبح استفاده می‌کنیم. این یک فعل عبارتی بسیار رایج برای شروع روز شماست. به خاطر داشته باشید که 'up' در اینجا ضروری است تا حرکت به سمت بالا را نشان دهد.","ex":[{"e":"I get up at seven o'clock every day.","p":"من هر روز ساعت هفت از خواب بیدار می‌شوم."},{"e":"She got up quickly to catch the bus.","p":"او سریع از جا برخاست تا به اتوبوس برسد."}]},{"h":"Boarding or riding transport","b":"Use 'get on' when you board buses, trains, planes, or bikes. It implies entering and riding the vehicle. For cars or taxis, we usually say 'get in' instead.","hf":"سوار شدن یا سواری گرفتن","bf":"وقتی وارد اتوبوس، قطار، هواپیما یا دوچرخه می‌شوید، از 'get on' استفاده کنید. این کلمه وارد شدن و سوار شدن بر وسیله نقلیه را بیان می‌کند. برای ماشین‌های شخصی یا تاکسی، معمولاً به جای آن از 'get in' استفاده می‌کنیم.","ex":[{"e":"We need to get on the train at platform three.","p":"ما باید در سکوی سه سوار قطار شویم."},{"e":"He got on the bus and found a seat.","p":"او سوار اتوبوس شد و صندلی پیدا کرد."}]},{"h":"Arriving at your house","b":"'Get home' means to arrive at your house after a journey. Note that we do not use 'to' or 'at' before 'home' in this context. It acts like an adverb here.","hf":"رسیدن به خانه","bf":"'Get home' به معنای رسیدن به خانه پس از یک سفر است. توجه کنید که در این حالت قبل از 'home' از 'to' یا 'at' استفاده نمی‌کنیم. اینجا این کلمه مانند یک قید عمل می‌کند.","ex":[{"e":"I get home late from work.","p":"من از سر کار دیر به خانه می‌رسم."},{"e":"Did you get home safely?","p":"آیا به سلامتی به خانه رسیدی؟"}]}],"tip":"Remember that 'get' changes its meaning completely depending on the word that follows it.","tipf":"به یاد داشته باشید که فعل 'get' بسته به کلمه‌ای که بعد از آن می‌آید، معنی کاملاً متفاوتی پیدا می‌کند.","bad":[{"b":"I get up from the bed at 7 AM.","g":"I get up at 7 AM.","w":"In English, we usually say 'get up' without 'from the bed' because 'up' already implies the action of rising.","wf":"در انگلیسی، معمولاً می‌گوییم 'get up' بدون 'from the bed' زیرا کلمه 'up' خودش مفهوم برخاستن را القا می‌کند."},{"b":"She got on the car.","g":"She got in the car.","w":"We use 'get on' for large vehicles where you can walk (bus, train). For small vehicles like cars, we use 'get in'.","wf":"ما برای وسایل نقلیه بزرگ که می‌توان در آن‌ها راه رفت (اتوبوس، قطار) از 'get on' استفاده می‌کنیم. برای وسایل نقلیه کوچک مانند ماشین، از 'get in' استفاده می‌کنیم."},{"b":"I get to home late.","g":"I get home late.","w":"The word 'home' functions as an adverb here, so we do not need the preposition 'to'.","wf":"کلمه 'home' در اینجا به عنوان یک قید عمل می‌کند، بنابراین نیازی به حرف اضافه 'to' نیست."}],"gold":[{"e":"Use 'get up' for rising from bed.","f":"برای برخاستن از رختخواب از 'get up' استفاده کنید."},{"e":"Use 'get on' for buses, trains, and planes.","f":"برای اتوبوس، قطار و هواپیما از 'get on' استفاده کنید."},{"e":"Say 'get home', not 'get to home'.","f":"بگویید 'get home'، نه 'get to home'."}]},{"lv":"B","title":"go: go to / go home / go for a walk","exp":[{"h":"Going to a specific place","b":"When you move towards a specific destination, we use 'go to'. Remember to include 'to' before the place name. For example, you go to school, go to work, or go to the park.","hf":"رفتن به یک مکان مشخص","bf":"وقتی به سمت مقصد خاصی حرکت می‌کنید، از 'go to' استفاده می‌کنیم. به یاد داشته باشید که قبل از نام مکان، 'to' را قرار دهید. برای مثال، به مدرسه، محل کار یا پارک می‌روید.","ex":[{"e":"I go to the gym every morning.","p":"من هر روز صبح به باشگاه می‌روم."},{"e":"She goes to London for her holiday.","p":"او برای تعطیلات به لندن می‌رود."}]},{"h":"Going home","b":"This is a special case! We do not say 'go to home'. Since 'home' acts like an adverb here, we just say 'go home'. It is simple and direct.","hf":"رفتن به خانه","bf":"این یک مورد خاص است! ما نمی‌گوییم 'go to home'. از آنجا که کلمه 'home' در اینجا نقش قید مکان را دارد، فقط می‌گوییم 'go home'. این ساختار ساده و مستقیم است.","ex":[{"e":"I go home after work.","p":"من بعد از کار به خانه می‌روم."},{"e":"Let's go home now.","p":"بیایید الان به خانه برویم."}]},{"h":"Going for a walk","b":"If you want to talk about the activity of walking for pleasure or exercise, use 'go for a walk'. This structure is very common in daily conversation.","hf":"رفتن برای پیاده‌روی","bf":"اگر می‌خواهید درباره فعالیت پیاده‌روی برای تفریح یا ورزش صحبت کنید، از 'go for a walk' استفاده کنید. این ساختار در مکالمات روزمره بسیار رایج است.","ex":[{"e":"We go for a walk in the park.","p":"ما برای پیاده‌روی به پارک می‌رویم."},{"e":"He goes for a run every evening.","p":"او هر عصر برای دویدن می‌رود."}]}],"tip":"Remember: 'go to' + place, but 'go' + home.","tipf":"به یاد داشته باشید: 'go to' به همراه مکان، اما 'go' به همراه home (بدون to).","bad":[{"b":"I go to home.","g":"I go home.","w":"We do not use 'to' before 'home' in this context.","wf":"ما در این ساختار قبل از 'home' از 'to' استفاده نمی‌کنیم."},{"b":"She goes for walk.","g":"She goes for a walk.","w":"We need the article 'a' before 'walk' in this phrase.","wf":"ما در این عبارت قبل از 'walk' به حروف تعریف 'a' نیاز داریم."},{"b":"I go school.","g":"I go to school.","w":"We need 'to' before the name of the place.","wf":"ما قبل از نام مکان به 'to' نیاز داریم."}],"gold":[{"e":"Use 'go to' for specific locations.","f":"برای مکان‌های مشخص از 'go to' استفاده کنید."},{"e":"Use 'go home' without 'to'.","f":"عبارت 'go home' را بدون 'to' به کار ببرید."},{"e":"Use 'go for a walk' for the activity.","f":"برای فعالیت پیاده‌روی از 'go for a walk' استفاده کنید."}]}],"ex":[{"t":"gap","q":"I usually ___ up at 7 o'clock.","key":["get"],"why":"Phrasal verb 'get up' means to rise from bed."},{"t":"gap","q":"Please ___ the bus at the next stop.","key":["get on"],"why":"'Get on' is used for boarding buses, trains, or planes."},{"t":"gap","q":"I ___ home late last night.","key":["got"],"why":"Past tense of 'get home' indicates arriving at one's house."},{"t":"fix","q":"She go to the park every Sunday.","key":["She goes to the park every Sunday."],"why":"Third-person singular requires 'goes' in Present Simple."},{"t":"gap","q":"Let's ___ for a walk in the park.","key":["go"],"why":"'Go for a walk' is a common phrase for walking for leisure."},{"t":"fix","q":"He get home very late.","key":["He gets home very late."],"why":"Third-person singular requires 'gets' in Present Simple."},{"t":"gap","q":"We ___ home from work at 5 PM.","key":["get"],"why":"'Get home' means to arrive at one's residence."},{"t":"fix","q":"They goes to school by bus.","key":["They go to school by bus."],"why":"Plural subject 'They' takes the base form 'go'."},{"t":"fa","q":"او هر روز صبح زود بیدار می‌شود.","key":["He gets up early every day."],"why":"Translation of 'بیدار می‌شود' using 'get up' in Present Simple."},{"t":"fa","q":"ما به پارک می‌رویم تا قدم بزنیم.","key":["We go to the park to go for a walk."],"why":"Translation combining 'go to' and 'go for a walk'."}]},{"id":"t29","t":"Spelling: -s / -ed / -ing Endings","tf":"املای پسوندها","parts":[{"lv":"I","title":"Spelling: -s / -ed / -ing endings","exp":[{"h":"Adding -s for Present Simple","b":"When we talk about habits or facts in the present, we add -s to the verb for he, she, or it. Remember that this only happens with third-person singular subjects. For example, she plays tennis every weekend.","hf":"افزودن -s برای حال ساده","bf":"وقتی درباره عادت‌ها یا حقایق در زمان حال صحبت می‌کنیم، برای فاعل‌های he، she یا it به فعل پسوند -s اضافه می‌کنیم. به خاطر داشته باشید که این کار فقط برای فاعل‌های سوم شخص مفرد اتفاق می‌افتد. برای مثال، او هر آخر هفته تنیس بازی می‌کند.","ex":[{"e":"He works in a bank.","p":"او در یک بانک کار می‌کند."},{"e":"She likes coffee.","p":"او قهوه دوست دارد."}]},{"h":"Forming the Past Simple with -ed","b":"To talk about finished actions in the past, we usually add -ed to the base verb. This is the most common way to create the past tense for regular verbs. For instance, I walked to school yesterday.","hf":"ساختن گذشته ساده با -ed","bf":"برای صحبت درباره کارهای تمام‌شده در گذشته، معمولاً به فعل پایه پسوند -ed اضافه می‌کنیم. این رایج‌ترین روش برای ساختن زمان گذشته برای افعال باقاعده است. برای مثال، من دیروز پیاده به مدرسه رفتم.","ex":[{"e":"They played football last night.","p":"آن‌ها دیشب فوتبال بازی کردند."},{"e":"I watched a movie.","p":"من یک فیلم تماشا کردم."}]},{"h":"Creating Continuous Forms with -ing","b":"We use -ing to show actions that are happening right now or around the current time. This form is essential for building continuous tenses. Think about how you describe ongoing activities in your daily life.","hf":"ایجاد فرم‌های استمراری با -ing","bf":"ما از -ing برای نشان دادن کارهایی استفاده می‌کنیم که همین الان یا در زمان حال در حال وقوع هستند. این فرم برای ساختن زمان‌های استمراری ضروری است. به این فکر کنید که چگونه فعالیت‌های در حال جریان را در زندگی روزمره خود توصیف می‌کنید.","ex":[{"e":"She is reading a book now.","p":"او الان در حال خواندن کتاب است."},{"e":"We are waiting for the bus.","p":"ما منتظر اتوبوس هستیم."}]}],"tip":"Always check the subject before adding -s; it is only needed for he, she, and it.","tipf":"همیشه قبل از اضافه کردن -s فاعل را بررسی کنید؛ این کار فقط برای he، she و it نیاز است.","bad":[{"b":"He work in a hospital.","g":"He works in a hospital.","w":"The subject 'He' is third-person singular, so the verb needs the -s ending.","wf":"فاعل 'He' سوم شخص مفرد است، بنابراین فعل به پسوند -s نیاز دارد."},{"b":"I playted tennis yesterday.","g":"I played tennis yesterday.","w":"The past tense of 'play' is regular, so we just add -ed without adding extra letters.","wf":"زمان گذشته 'play' باقاعده است، بنابراین بدون اضافه کردن حروف اضافه، فقط -ed اضافه می‌کنیم."},{"b":"She is go to school.","g":"She is going to school.","w":"For continuous tenses, the main verb must take the -ing form, not the base form.","wf":"برای زمان‌های استمراری، فعل اصلی باید شکل -ing بگیرد، نه شکل پایه."}],"gold":[{"e":"Add -s to verbs for he, she, and it in the present simple.","f":"در زمان حال ساده، برای he، she و it به افعال پسوند -s اضافه کنید."},{"e":"Add -ed to regular verbs to form the past simple.","f":"برای ساختن گذشته ساده، به افعال باقاعده -ed اضافه کنید."},{"e":"Use -ing for actions happening at the moment of speaking.","f":"برای کارهایی که در لحظه صحبت کردن در حال انجام هستند، از -ing استفاده کنید."}]}],"ex":[{"t":"gap","q":"He ___ his homework every evening.","key":["does"],"why":"Present Simple third person singular requires -es for verbs ending in 'do'."},{"t":"gap","q":"They ___ football in the park yesterday.","key":["played"],"why":"Past Simple regular verb adds -ed to the base form."},{"t":"gap","q":"Look! It ___ outside.","key":["is raining"],"why":"Present Continuous requires 'is' + verb-ing for current actions."},{"t":"fix","q":"She watchs TV every night.","key":["She watches TV every night."],"why":"Verbs ending in 'ch' take -es for the third person singular present."},{"t":"gap","q":"We ___ to the cinema last weekend.","key":["went"],"why":"Past Simple of 'go' is irregular: went."},{"t":"gap","q":"The baby ___ right now.","key":["is sleeping"],"why":"Present Continuous form for 'sleep' adds -ing."},{"t":"fix","q":"He studyed hard for the exam.","key":["He studied hard for the exam."],"why":"Verbs ending in consonant + y change y to i and add -ed."},{"t":"gap","q":"I ___ my keys. Can you help me find them?","key":["lost"],"why":"Past Simple regular verb adds -ed."},{"t":"gap","q":"She ___ a letter to her friend.","key":["writes"],"why":"Present Simple third person singular adds -s."},{"t":"fix","q":"They are play football now.","key":["They are playing football now."],"why":"Present Continuous requires the -ing form of the verb."},{"t":"gap","q":"The sun ___ in the east.","key":["rises"],"why":"Present Simple third person singular adds -s."},{"t":"gap","q":"He ___ his car yesterday.","key":["washed"],"why":"Past Simple regular verb adds -ed."},{"t":"gap","q":"Look at the sky! It ___ to rain.","key":["is starting"],"why":"Present Continuous form for 'start' adds -ing."},{"t":"fa","q":"او هر روز صبحانه می‌خورد.","key":["He eats breakfast every day."],"why":"Present Simple third person singular of 'eat' adds -s."},{"t":"fa","q":"ما دیروز به سینما رفتیم.","key":["We went to the cinema yesterday."],"why":"Past Simple of 'go' is irregular: went."}]},{"id":"t30","t":"Prepositions of Time","tf":"حروف اضافهٔ زمان","parts":[{"lv":"B","title":"in / at / on for time","exp":[{"h":"Using 'at' for precise times","b":"Use 'at' when you refer to a specific point on the clock or a precise moment. Think of it as a dot on the timeline. This is the most precise preposition for time.","hf":"استفاده از 'at' برای زمان‌های دقیق","bf":"از 'at' زمانی استفاده کنید که به یک نقطه خاص روی ساعت یا یک لحظه دقیق اشاره می‌کنید. آن را به عنوان یک نقطه روی خط زمان در نظر بگیرید. این دقیق‌ترین حرف اضافه برای زمان است.","ex":[{"e":"I wake up at 7:00 AM.","p":"من ساعت ۷ صبح بیدار می‌شوم."},{"e":"We will meet at noon.","p":"ما ظهر همدیگر را ملاقات خواهیم کرد."}]},{"h":"Using 'on' for days and dates","b":"Use 'on' when talking about specific days of the week or full dates. Imagine the day is a surface you are standing on. It connects you to that specific day.","hf":"استفاده از 'on' برای روزها و تاریخ‌ها","bf":"از 'on' زمانی استفاده کنید که درباره روزهای خاص هفته یا تاریخ‌های کامل صحبت می‌کنید. تصور کنید که روز یک سطح است که روی آن ایستاده‌اید. این شما را به آن روز خاص متصل می‌کند.","ex":[{"e":"The meeting is on Monday.","p":"جلسه روز دوشنبه است."},{"e":"My birthday is on July 5th.","p":"تولد من در پنجم جولای است."}]},{"h":"Using 'in' for longer periods","b":"Use 'in' for months, years, seasons, and parts of the day. Think of these as containers of time. You are inside that period.","hf":"استفاده از 'in' برای دوره‌های طولانی‌تر","bf":"از 'in' برای ماه‌ها، سال‌ها، فصل‌ها و بخش‌های مختلف روز استفاده کنید. این‌ها را به عنوان ظرف‌های زمان در نظر بگیرید. شما در داخل آن دوره هستید.","ex":[{"e":"It is cold in winter.","p":"هوا در زمستان سرد است."},{"e":"I was born in 1990.","p":"من در سال ۱۹۹۰ به دنیا آمدم."}]}],"tip":"Remember: at for clock time, on for days, in for months and years.","tipf":"به یاد داشته باشید: at برای ساعت، on برای روزها، in برای ماه‌ها و سال‌ها.","bad":[{"b":"I will see you on 5 PM.","g":"I will see you at 5 PM.","w":"We use 'at' for specific clock times, not 'on'.","wf":"ما برای زمان‌های دقیق ساعتی از 'at' استفاده می‌کنیم، نه 'on'."},{"b":"She arrives in Monday.","g":"She arrives on Monday.","w":"We use 'on' for specific days of the week, not 'in'.","wf":"ما برای روزهای خاص هفته از 'on' استفاده می‌کنیم، نه 'in'."},{"b":"I go to school at September.","g":"I go to school in September.","w":"We use 'in' for months, not 'at'.","wf":"ما برای ماه‌ها از 'in' استفاده می‌کنیم، نه 'at'."}],"gold":[{"e":"Use 'at' for precise times like 9:00 or noon.","f":"برای زمان‌های دقیق مثل ۹:۰۰ یا ظهر از 'at' استفاده کنید."},{"e":"Use 'on' for days (Monday) and dates (July 5th).","f":"برای روزها (دوشنبه) و تاریخ‌ها (پنجم جولای) از 'on' استفاده کنید."},{"e":"Use 'in' for months, years, and seasons.","f":"برای ماه‌ها، سال‌ها و فصل‌ها از 'in' استفاده کنید."}]},{"lv":"B","title":"from … to / until / since / for (time ranges)","exp":[{"h":"Using 'from ... to' for clear start and end points","b":"This structure is perfect when you want to specify exactly when something starts and when it ends. It gives a very clear picture of the time range to your listener. Use it when the duration is defined by two specific moments.","hf":"استفاده از 'from ... to' برای نقاط شروع و پایان مشخص","bf":"این ساختار برای زمانی که می‌خواهید دقیقاً مشخص کنید چیزی از کجا شروع و به کجا پایان می‌یابد، عالی است. این کار تصویری بسیار واضح از بازه زمانی به شنونده می‌دهد. از آن زمانی استفاده کنید که مدت زمان توسط دو لحظه خاص تعریف شده است.","ex":[{"e":"The shop is open from 9 AM to 5 PM.","p":"فروشگاه از ساعت ۹ صبح تا ۵ عصر باز است."},{"e":"We will stay in Paris from Monday to Wednesday.","p":"ما از دوشنبه تا چهارشنبه در پاریس می‌مانیم."}]},{"h":"Using 'since' for the starting point","b":"Use 'since' when you focus on the moment something began and it continues until now. It is always followed by a specific point in time, like a date or an event. This helps you emphasize the duration from that past point to the present.","hf":"استفاده از 'since' برای نقطه شروع","bf":"از 'since' زمانی استفاده کنید که روی لحظه‌ای که چیزی شروع شده و تا الان ادامه دارد تمرکز دارید. آن همیشه بعد از یک نقطه زمانی خاص، مثل یک تاریخ یا یک رویداد، می‌آید. این به شما کمک می‌کند تا مدت زمان از آن نقطه در گذشته تا حال را تأکید کنید.","ex":[{"e":"I have lived here since 2010.","p":"من از سال ۲۰۱۰ اینجا زندگی می‌کنم."},{"e":"She has been working since morning.","p":"او از صبح مشغول کار است."}]},{"h":"Using 'for' to measure duration","b":"Use 'for' when you want to state the length of time something lasts. It answers the question 'how long?'. You can use it with periods like hours, days, or years.","hf":"استفاده از 'for' برای اندازه‌گیری مدت زمان","bf":"از 'for' زمانی استفاده کنید که می‌خواهید طول مدت زمانی که چیزی طول می‌کشد را بیان کنید. این کلمه به سوال 'چند وقت؟' پاسخ می‌دهد. می‌توانید آن را با بازه‌هایی مثل ساعت، روز یا سال استفاده کنید.","ex":[{"e":"I studied English for two years.","p":"من دو سال انگلیسی خواندم."},{"e":"The meeting lasted for an hour.","p":"جلسه یک ساعت طول کشید."}]}],"tip":"Remember that 'since' needs a starting point, while 'for' needs a duration.","tipf":"به یاد داشته باشید که 'since' به یک نقطه شروع نیاز دارد، در حالی که 'for' به یک مدت زمان نیاز دارد.","bad":[{"b":"I have lived here since two years.","g":"I have lived here for two years.","w":"'Since' is used with a specific point in time, not a duration. 'For' is correct here.","wf":"'since' با یک نقطه زمانی خاص استفاده می‌شود، نه با یک مدت زمان. اینجا 'for' صحیح است."},{"b":"The movie was from 2 hours.","g":"The movie was for 2 hours.","w":"'From' indicates a start point, not a length. Use 'for' to describe the duration.","wf":"'from' یک نقطه شروع را نشان می‌دهد، نه طول مدت. برای توصیف مدت زمان از 'for' استفاده کنید."},{"b":"I have known him since three years.","g":"I have known him for three years.","w":"'Since' is used for a starting point (like a year or an o'clock), whereas 'for' is used for a duration (like three years).","wf":"'since' برای نقطه شروع (مثل یک سال یا ساعت مشخص) استفاده می‌شود، در حالی که 'for' برای مدت زمان (مثل سه سال) به کار می‌رود."}],"gold":[{"e":"Use 'from ... to' for defined ranges.","f":"از 'from ... to' برای بازه‌های تعریف شده استفاده کنید."},{"e":"Use 'since' with a starting point.","f":"از 'since' با یک نقطه شروع استفاده کنید."},{"e":"Use 'for' with a duration.","f":"از 'for' با یک مدت زمان استفاده کنید."}]},{"lv":"B","title":"before / after / during / while","exp":[{"h":"Using 'before' and 'after' with clauses","b":"We use 'before' and 'after' to show the order of two past events. You can follow them with a full clause (subject + verb) or a gerund (-ing form). Remember that the event mentioned first in the clause happened first in time.","hf":"استفاده از 'before' و 'after' با جملات","bf":"ما از 'before' و 'after' برای نشان دادن ترتیب دو رویداد استفاده می‌کنیم. می‌توانید بعد از آن‌ها یک جمله کامل (فاعل + فعل) یا یک اسم مصدر (فرم ing-) قرار دهید.","ex":[{"e":"Before I left, I locked the door.","p":"قبل از اینکه بروم، در را قفل کردم."},{"e":"After she finished work, she went home.","p":"بعد از اینکه کارش را تمام کرد، به خانه رفت."}]},{"h":"Using 'during' with nouns","b":"'During' is followed by a noun or noun phrase, not a full clause. It means 'throughout the course of' an event or period. If you want to use a verb, you need to change it to a noun form or use 'while'.","hf":"استفاده از 'during' با اسم‌ها","bf":"بعد از 'during' یک اسم یا عبارت اسمی می‌آید، نه یک جمله کامل. این کلمه به معنای «در طول» یک رویداد یا دوره زمانی است. اگر می‌خواهید از فعل استفاده کنید، باید آن را به صورت اسم درآورید یا از 'while' استفاده کنید.","ex":[{"e":"During the movie, I fell asleep.","p":"در طول فیلم، خوابم برد."},{"e":"He received the news during dinner.","p":"او خبر را هنگام شام دریافت کرد."}]},{"h":"Using 'while' for simultaneous actions","b":"'While' is used to connect two actions happening at the same time. It is usually followed by a clause with a continuous verb tense. It emphasizes that the two actions were ongoing simultaneously.","hf":"استفاده از 'while' برای کارهای همزمان","bf":"کلمه 'while' برای اتصال دو کاری که همزمان رخ می‌دهند استفاده می‌شود. معمولاً بعد از آن جمله‌ای با زمان استمرار (continuous) می‌آید و تأکید می‌کند که هر دو کار همزمان در حال انجام بوده‌اند.","ex":[{"e":"While I was cooking, the phone rang.","p":"در حالی که داشتم آشپزی می‌کردم، تلفن زنگ زد."},{"e":"She listened to music while she studied.","p":"او در حالی که درس می‌خوانید به موسیقی گوش می‌داد."}]}],"tip":"Use 'during' with nouns and 'while' with clauses to avoid common mistakes.","tipf":"برای جلوگیری از اشتباهات رایج، با اسم‌ها از 'during' و با جملات از 'while' استفاده کنید.","bad":[{"b":"I was reading during I was sleeping.","g":"I was reading while I was sleeping.","w":"'During' cannot be followed by a clause (subject + verb). Use 'while' instead.","wf":"بعد از 'during' نمی‌توان از جمله (فاعل + فعل) استفاده کرد. به جای آن از 'while' استفاده کنید."},{"b":"After the movie finished, we went home.","g":"After the movie finished, we went home.","w":"This sentence is actually correct, but a common mistake is using 'during' here: 'During the movie finished...'. 'During' needs a noun.","wf":"این جمله صحیح است، اما یک اشتباه رایج استفاده از 'during' به جای آن است: 'During the movie finished...'. کلمه 'during' نیاز به اسم دارد."},{"b":"While the movie, I ate popcorn.","g":"During the movie, I ate popcorn.","w":"'While' must be followed by a clause. If you use a noun phrase like 'the movie', use 'during'.","wf":"بعد از 'while' حتماً باید یک جمله بیاید. اگر از عبارت اسمی مانند 'the movie' استفاده می‌کنید، باید از 'during' بهره بگیرید."}],"gold":[{"e":"Use 'before' and 'after' with clauses to show sequence.","f":"برای نشان دادن ترتیب وقایع، از 'before' و 'after' با جملات استفاده کنید."},{"e":"Use 'during' with nouns to indicate a time period.","f":"برای نشان دادن یک دوره زمانی، از 'during' همراه با اسم‌ها استفاده کنید."},{"e":"Use 'while' with continuous actions to show simultaneity.","f":"برای نشان دادن همزمانی، از 'while' با افعال استمرار (continuous) استفاده کنید."}]}],"ex":[{"t":"gap","q":"I wake up ___ 7 o'clock every morning.","key":["at"],"why":"Use 'at' for precise times."},{"t":"gap","q":"We have a meeting ___ Monday.","key":["on"],"why":"Use 'on' for days of the week."},{"t":"gap","q":"She was born ___ 1995.","key":["in"],"why":"Use 'in' for years and longer periods."},{"t":"gap","q":"The shop is open ___ 9 a.m. ___ 5 p.m.","key":["from","to"],"why":"Use 'from ... to' to indicate clear start and end points."},{"t":"gap","q":"I have lived here ___ 2010.","key":["since"],"why":"Use 'since' to indicate the starting point of an action."},{"t":"fix","q":"I have known him for five years.","key":["I have known him since 2019."],"why":"Use 'since' with a specific starting point, not 'for' which measures duration."},{"t":"fix","q":"She read a book during she waited for the bus.","key":["She read a book while she waited for the bus."],"why":"Use 'while' before a clause (subject + verb), not 'during' which takes a noun phrase."},{"t":"fix","q":"I will call you after I will finish work.","key":["I will call you after I finish work."],"why":"In time clauses referring to the future, use the present simple, not the future tense."},{"t":"fa","q":"من هر روز صبح زود بیدار می‌شوم.","key":["I wake up early every morning."],"why":"Translate the Persian sentence into natural English using present simple for habits."},{"t":"fa","q":"او در حالی که غذا می‌خورد تلویزیون تماشا کرد.","key":["He watched TV while he was eating."],"why":"Use 'while' to show two simultaneous actions in the past."}]},{"id":"t31","t":"Prepositions of Place and Movement","tf":"حروف اضافهٔ مکان و حرکت","parts":[{"lv":"B","title":"in / at / on for place","exp":[{"h":"In for Enclosed Spaces","b":"Use 'in' when something is inside a defined area or enclosed space. Think of it as being surrounded by boundaries, like being inside a room, a city, or a country. It suggests that the object is contained within those limits.","hf":"برای فضاهای بسته","bf":"از 'in' زمانی استفاده می‌کنیم که چیزی در یک منطقه مشخص یا فضای بسته قرار دارد. آن را مانند بودن در داخل یک اتاق، شهر یا کشور تصور کنید. این نشان می‌دهد که شیء در داخل آن مرزها محصور است.","ex":[{"e":"The keys are in the drawer.","p":"کلیدها در کشو هستند."},{"e":"She lives in Tehran.","p":"او در تهران زندگی می‌کند."}]},{"h":"On for Surfaces and Lines","b":"Use 'on' when something is touching the surface of something else. It is also used for lines, such as streets or rivers, and for public transport where you can walk around. Imagine the object resting on top of another surface.","hf":"برای سطوح و خطوط","bf":"از 'on' زمانی استفاده می‌کنیم که چیزی با سطح چیزی دیگر در تماس باشد. همچنین برای خطوط مانند خیابان‌ها یا رودخانه‌ها و برای وسایل حمل‌ونقل عمومی که می‌توانید در آن‌ها راه بروید به کار می‌رود. تصور کنید که شیء روی سطح دیگری قرار دارد.","ex":[{"e":"The book is on the table.","p":"کتاب روی میز است."},{"e":"We traveled on the bus.","p":"ما با اتوبوس سفر کردیم."}]},{"h":"At for Specific Points","b":"Use 'at' for a specific point or location, rather than a large area. It is often used for addresses, specific places like shops or stations, or general locations where an activity happens. Think of it as a precise dot on a map.","hf":"برای نقاط مشخص","bf":"از 'at' برای یک نقطه یا مکان خاص استفاده می‌کنیم، نه یک منطقه بزرگ. این معمولاً برای آدرس‌ها، مکان‌های مشخصی مانند فروشگاه‌ها یا ایستگاه‌ها، یا مکان‌های عمومی که فعالیت در آن‌ها انجام می‌شود به کار می‌رود. آن را به عنوان یک نقطه دقیق روی نقشه در نظر بگیرید.","ex":[{"e":"I will meet you at the station.","p":"من تو را در ایستگاه ملاقات می‌کنم."},{"e":"She is at home right now.","p":"او الان در خانه است."}]}],"tip":"Remember: 'in' is for containers, 'on' is for surfaces, and 'at' is for points.","tipf":"به یاد داشته باشید: 'in' برای ظرف‌ها، 'on' برای سطوح و 'at' برای نقاط است.","bad":[{"b":"I am in home.","g":"I am at home.","w":"We use 'at' with 'home', not 'in'. Saying 'in home' is a common literal translation mistake from Persian.","wf":"ما با کلمه 'home' از 'at' استفاده می‌کنیم، نه 'in'. گفتن 'in home' یک اشتباه رایج ترجمه تحت‌اللفظی از فارسی است."},{"b":"I live in 123 Main Street.","g":"I live at 123 Main Street.","w":"For specific addresses, we usually use 'at', not 'in'. 'In' is for the city or country.","wf":"برای آدرس‌های خاص، معمولاً از 'at' استفاده می‌کنیم، نه 'in'. 'In' برای شهر یا کشور است."},{"b":"The picture is in the wall.","g":"The picture is on the wall.","w":"We use 'on' for surfaces like walls. Using 'in' implies the picture is embedded inside the wall structure.","wf":"ما برای سطوح مثل دیوار از 'on' استفاده می‌کنیم. استفاده از 'in' به این معنی است که عکس درون ساختار دیوار فرو رفته است."}],"gold":[{"e":"Use 'in' for enclosed spaces and areas.","f":"از 'in' برای فضاهای بسته و مناطق استفاده کنید."},{"e":"Use 'on' for surfaces and public transport.","f":"از 'on' برای سطوح و حمل‌ونقل عمومی استفاده کنید."},{"e":"Use 'at' for specific points and addresses.","f":"از 'at' برای نقاط خاص و آدرس‌ها استفاده کنید."}]},{"lv":"B","title":"Prepositions of movement: to / into / onto / through / across","exp":[{"h":"Moving towards a destination","b":"Use 'to' when you are moving towards a specific place or person. It indicates direction without necessarily entering the place. Think of it as the general path you are taking.","hf":"حرکت به سمت مقصد","bf":"از 'to' استفاده کنید وقتی که به سمت یک مکان یا شخص خاص حرکت می‌کنید. این کلمه جهت را نشان می‌دهد اما لزوماً وارد شدن به آن مکان را شامل نمی‌شود. آن را به عنوان مسیر کلی که طی می‌کنید در نظر بگیرید.","ex":[{"e":"I am going to the park.","p":"من به پارک می‌روم."},{"e":"She walked to the school.","p":"او به سمت مدرسه پیاده رفت."}]},{"h":"Entering a space","b":"Use 'into' when you move from outside to inside something. It emphasizes the change of location and entering a bounded area. It shows the action of entering.","hf":"ورود به یک فضا","bf":"از 'into' استفاده کنید وقتی که از بیرون به داخل چیزی حرکت می‌کنید. این کلمه بر تغییر مکان و ورود به یک فضای محدود تأکید دارد. این کلمه عمل ورود را نشان می‌دهد.","ex":[{"e":"He jumped into the pool.","p":"او به داخل استخر پرید."},{"e":"The cat ran into the house.","p":"گربه به داخل خانه دوید."}]},{"h":"Passing through or across","b":"Use 'through' for moving within a 3D space or from one side to the other, like a tunnel or forest. Use 'across' for moving from one side of a surface to the other, like a street or a field.","hf":"عبور از میان یا روی سطح","bf":"از 'through' برای حرکت در یک فضای سه‌بعدی یا از یک طرف به طرف دیگر، مانند تونل یا جنگل، استفاده کنید. از 'across' برای حرکت از یک طرف یک سطح به طرف دیگر، مانند خیابان یا مزرعه، استفاده کنید.","ex":[{"e":"We drove through the tunnel.","p":"ما از داخل تونل رانندگی کردیم."},{"e":"She walked across the bridge.","p":"او از روی پل پیاده عبور کرد."}]}],"tip":"Remember that 'to' is about direction, while 'into' implies entering. 'Through' suggests being surrounded by the space, whereas 'across' suggests crossing a surface.","tipf":"به یاد داشته باشید که 'to' درباره جهت است، در حالی که 'into' مفهوم ورود را می‌رساند. 'Through' نشان‌دهنده قرار گرفتن در میان فضا است، در حالی که 'across' عبور از یک سطح را نشان می‌دهد.","bad":[{"b":"I went into the library to study.","g":"I went to the library to study.","w":"If you just mean visiting the place, use 'to'. 'Into' implies entering the building itself, which might be true, but 'to' is more common for general movement towards a destination.","wf":"اگر منظور شما صرفاً رفتن به آن مکان است، از 'to' استفاده کنید. کلمه 'into' ورود فیزیکی به داخل ساختمان را برجسته می‌کند، اما 'to' برای حرکت کلی به سمت مقصد رایج‌تر است."},{"b":"He walked across the forest.","g":"He walked through the forest.","w":"'Across' is used for flat surfaces like streets or fields. A forest is a 3D space with trees all around, so 'through' is the correct preposition.","wf":"حرف اضافه 'across' برای سطوح مسطح مانند خیابان‌ها یا مزارع استفاده می‌شود. جنگل یک فضای سه‌بعدی است که درختان شما را احاطه کرده‌اند، بنابراین 'through' حرف اضافه صحیح است."}],"gold":[{"e":"Use 'to' for general direction towards a place.","f":"از 'to' برای نشان دادن جهت کلی به سمت یک مکان استفاده کنید."},{"e":"Use 'into' to show movement from outside to inside.","f":"از 'into' برای نشان دادن حرکت از بیرون به داخل استفاده کنید."},{"e":"Use 'through' for 3D spaces and 'across' for surfaces.","f":"از 'through' برای فضاهای سه‌بعدی و از 'across' برای سطوح استفاده کنید."}]}],"ex":[{"t":"gap","q":"The cat is ___ the table.","key":["on"],"why":"On is used for surfaces."},{"t":"gap","q":"I live ___ London.","key":["in"],"why":"In is used for cities and enclosed spaces."},{"t":"fix","q":"He is waiting at the bus stop.","key":["He is waiting at the bus stop."],"why":"At is correct for specific points or locations."},{"t":"gap","q":"She walked ___ the forest.","key":["through"],"why":"Through indicates movement from one side to the other inside something."},{"t":"gap","q":"The bird flew ___ the sky.","key":["across"],"why":"Across indicates movement from one side to the other over a surface."},{"t":"fix","q":"She put the book on the shelf.","key":["She put the book on the shelf."],"why":"On is correct for surfaces like shelves."},{"t":"gap","q":"We are going ___ the cinema tonight.","key":["to"],"why":"To indicates movement towards a destination."},{"t":"gap","q":"He jumped ___ the pool.","key":["into"],"why":"Into indicates movement entering an enclosed space."},{"t":"fa","q":"کتاب روی میز است.","key":["The book is on the table."],"why":"On is used for surfaces."},{"t":"fix","q":"She is in the room.","key":["She is in the room."],"why":"In is correct for enclosed spaces like rooms."}]},{"id":"t32","t":"Emphasis and Information Focus","tf":"تأکید و کانون اطلاعات","parts":[{"lv":"A","title":"Emphasis: whatever / wherever / fronting for focus","exp":[{"h":"Using 'whatever' for strong emphasis","b":"You can use 'whatever' to show that the specific thing does not matter. It adds a sense of determination or total acceptance to your statement. Try to use it when you want to stress that nothing else changes the outcome.","hf":"استفاده از 'whatever' برای تأکید قوی","bf":"شما می‌توانید از 'whatever' برای نشان دادن اینکه چیز خاصی مهم نیست استفاده کنید. این کلمه حس اراده یا پذیرش کامل را به جمله شما می‌دهد. سعی کنید زمانی از آن استفاده کنید که می‌خواهید تأکید کنید که هیچ چیز دیگری نتیجه را تغییر نمی‌دهد.","ex":[{"e":"Whatever happens, I will support you.","p":"هر اتفاقی بیفتد، من از تو حمایت خواهم کرد."},{"e":"Do whatever you want with the money.","p":"با پول هر کاری که می‌خواهی بکن."}]},{"h":"Using 'wherever' for place emphasis","b":"Use 'wherever' to emphasize that the location is not important or is unknown. It means 'in any place at all'. This is useful when you want to stress that the place does not change the action.","hf":"استفاده از 'wherever' برای تأکید بر مکان","bf":"از 'wherever' برای تأکید بر این استفاده کنید که مکان مهم نیست یا ناشناخته است. این به معنی «در هر مکانی» است. این زمانی مفید است که می‌خواهید تأکید کنید که مکان، عمل را تغییر نمی‌دهد.","ex":[{"e":"Wherever you go, I will follow.","p":"هر جا که بروی، دنبالت خواهم کرد."},{"e":"She can sit wherever she likes.","p":"او می‌تواند هر جا که دوست دارد بنشیند."}]},{"h":"Fronting for focus","b":"Fronting means moving a part of the sentence to the beginning to give it more importance. This changes the normal word order to highlight a specific element. It makes the sentence more dramatic or emphatic.","hf":"جابه‌جایی به آغاز جمله برای تمرکز","bf":"جلو آوردن یعنی بردن بخشی از جمله به ابتدای آن برای دادن اهمیت بیشتر. این کار ترتیب عادی کلمات را تغییر می‌دهد تا یک عنصر خاص را برجسته کند و جمله را دراماتیک‌تر یا تأکیدی‌تر سازد.","ex":[{"e":"Hardly had I arrived when the phone rang.","p":"به سختی رسیده بودم که تلفن زنگ خورد."},{"e":"Never have I seen such a beautiful view.","p":"هرگز چنین منظره زیبایی را ندیده‌ام."}]}],"tip":"Remember that fronting often requires inversion of the subject and auxiliary verb.","tipf":"به یاد داشته باشید که جلو آوردن کلمات اغلب مستلزم جابه‌جایی فاعل و فعل کمکی است.","bad":[{"b":"I will support you whatever happens it.","g":"I will support you whatever happens.","w":"We do not need 'it' after 'whatever' in this structure.","wf":"ما در این ساختار بعد از 'whatever' به کلمه 'it' نیاز نداریم."},{"b":"Wherever you go, I will follow you there.","g":"Wherever you go, I will follow you.","w":"Using 'there' is redundant because 'wherever' already indicates the place.","wf":"استفاده از 'there' حشو است زیرا 'wherever' از قبل مکان را نشان می‌دهد."},{"b":"Never I have seen such a view.","g":"Never have I seen such a view.","w":"After fronting 'Never', we need inversion (auxiliary verb before subject).","wf":"پس از آوردن 'Never' به اول جمله، به وارونگی (آوردن فعل کمکی قبل از فاعل) نیاز داریم."}],"gold":[{"e":"Whatever + clause, main clause.","f":"هرچه + جمله، جمله اصلی."},{"e":"Wherever + clause, main clause.","f":"هرجا که + جمله، جمله اصلی."},{"e":"Fronted element + auxiliary + subject + main verb.","f":"عنصر جلوآمده + فعل کمکی + فاعل + فعل اصلی."}]},{"lv":"A","title":"End-focus and end-weight: information structure","exp":[{"h":"The Principle of End-Focus","b":"In English, we naturally place the most important new information at the end of the sentence. This helps your listener know exactly what is new and significant. Think of the end of the sentence as the spotlight for your main point.","hf":"اصل کانون انتهایی","bf":"در انگلیسی، ما به طور طبیعی مهم‌ترین اطلاعات جدید را در انتهای جمله قرار می‌دهیم. این کار به شنونده کمک می‌کند تا دقیقاً بداند چه چیزی جدید و مهم است. انتهای جمله را مانند نورافکنی برای نکته اصلی خود در نظر بگیرید.","ex":[{"e":"I bought a new car yesterday.","p":"من دیروز یک ماشین جدید خریدم."},{"e":"She is reading a book in the garden.","p":"او در حال خواندن یک کتاب در باغ است."}]},{"h":"The Principle of End-Weight","b":"Longer, more complex phrases should come at the end of the sentence to keep it balanced. If you put a long phrase in the middle, the sentence feels heavy and awkward. This makes your speech flow more naturally.","hf":"اصل وزن انتهایی","bf":"عبارات طولانی‌تر و پیچیده‌تر باید در انتهای جمله بیایند تا تعادل جمله حفظ شود. اگر عبارت طولانی را در وسط قرار دهید، جمله سنگین و ناهموار به نظر می‌رسد. این کار باعث می‌شود گفتار شما طبیعی‌تر جریان یابد.","ex":[{"e":"He gave a speech about climate change.","p":"او سخنرانی درباره تغییرات اقلیمی انجام داد."},{"e":"They arrived late because of the traffic.","p":"آن‌ها به دلیل ترافیک دیر رسیدند."}]},{"h":"Balancing Given and New Information","b":"Start with information the listener already knows (given), and end with what is new. This structure connects your sentences smoothly. It creates a logical flow from old to new ideas.","hf":"تعادل بین اطلاعات شناخته‌شده و جدید","bf":"با اطلاعاتی که شنونده از قبل می‌داند (شناخته‌شده) شروع کنید و با اطلاعات جدید تمام کنید. این ساختار جملات شما را به نرمی به هم متصل می‌کند. این کار جریان منطقی از ایده‌های قدیمی به جدید ایجاد می‌کند.","ex":[{"e":"The book, which I bought last week, is very interesting.","p":"کتابی که هفته گذشته خریدم، بسیار جالب است."},{"e":"My brother, who lives in London, is visiting us.","p":"برادرم که در لندن زندگی می‌کند، ما را بازدید می‌کند."}]}],"tip":"Try to move long phrases to the end of your sentences to make them sound more natural.","tipf":"سعی کنید عبارات طولانی را به انتهای جملات خود منتقل کنید تا طبیعی‌تر به نظر برسند.","bad":[{"b":"I bought yesterday a new car.","g":"I bought a new car yesterday.","w":"In English, the time expression usually comes at the end, not between the verb and object.","wf":"در انگلیسی، قید زمان معمولاً در انتها می‌آید، نه بین فعل و مفعول."},{"b":"She is reading in the garden a book.","g":"She is reading a book in the garden.","w":"The object 'a book' is shorter than the prepositional phrase, so it should come first for better balance.","wf":"مفعول 'یک کتاب' کوتاه‌تر از عبارت حرف اضافه‌ای است، بنابراین برای تعادل بهتر باید اول بیاید."},{"b":"He gave about climate change a speech.","g":"He gave a speech about climate change.","w":"The prepositional phrase is longer, so it belongs at the end to follow the end-weight principle.","wf":"عبارت حرف اضافه‌ای طولانی‌تر است، بنابراین برای پیروی از اصل وزن انتهایی باید در انتها باشد."}],"gold":[{"e":"Place the most important new information at the end of the sentence.","f":"مهم‌ترین اطلاعات جدید را در انتهای جمله قرار دهید."},{"e":"Put longer phrases at the end to maintain sentence balance.","f":"عبارات طولانی‌تر را در انتها قرار دهید تا تعادل جمله حفظ شود."},{"e":"Start with known information and end with new information.","f":"با اطلاعات شناخته‌شده شروع کنید و با اطلاعات جدید تمام کنید."}]}],"ex":[{"t":"gap","q":"___ I looked, I couldn't find my keys.","key":["Wherever"],"why":"Using 'wherever' for place emphasis to mean 'in any place that'."},{"t":"gap","q":"___ he said, I didn't believe him.","key":["Whatever"],"why":"Using 'whatever' for strong emphasis to mean 'anything that'."},{"t":"gap","q":"___ the noise was, I couldn't sleep.","key":["However"],"why":"Using 'however' (similar to whatever/wherever structure) for emphasis on degree."},{"t":"fix","q":"The book I bought yesterday was interesting.","key":["The book that I bought yesterday was interesting."],"why":"Fronting for focus often requires a relative pronoun or clear structure to emphasize the fronted element."},{"t":"gap","q":"___ I tried, I couldn't open the jar.","key":["Whatever"],"why":"Using 'whatever' for emphasis on the extent of the action."},{"t":"fix","q":"In the garden we planted roses.","key":["In the garden we planted roses."],"why":"Fronting the prepositional phrase 'In the garden' for focus is grammatically correct here."},{"t":"gap","q":"___ you go, I will follow you.","key":["Wherever"],"why":"Using 'wherever' for place emphasis."},{"t":"fa","q":"هر کجا که بروی، من همراه تو هستم.","key":["Wherever you go, I am with you."],"why":"Translating place emphasis using 'wherever'."},{"t":"gap","q":"___ the weather was, we went out.","key":["However"],"why":"Using 'however' for emphasis on the state of the weather."},{"t":"fix","q":"My friend John called me yesterday.","key":["My friend John called me yesterday."],"why":"End-focus principle: new information 'called me yesterday' is at the end."},{"t":"gap","q":"___ advice he gave, I ignored it.","key":["Whatever"],"why":"Using 'whatever' for strong emphasis on the noun 'advice'."},{"t":"fa","q":"هر چه که گفت، درست بود.","key":["Whatever he said was correct."],"why":"Translating emphasis using 'whatever' for 'anything that'."},{"t":"fix","q":"Yesterday I bought a new car.","key":["Yesterday I bought a new car."],"why":"End-weight principle: the heavier/newer information 'a new car' is at the end."},{"t":"gap","q":"___ place we visited, we loved it.","key":["Wherever"],"why":"Using 'wherever' for place emphasis."},{"t":"fa","q":"هر کاری که کردی، برای خوب بود.","key":["Whatever you did was for the good."],"why":"Translating emphasis using 'whatever' for 'anything that'."},{"t":"gap","q":"___ hard he tried, he failed.","key":["However"],"why":"Using 'however' for emphasis on the adverb 'hard'."},{"t":"fix","q":"The man who lives next door is a doctor.","key":["The man who lives next door is a doctor."],"why":"End-focus: 'is a doctor' is the new information at the end."},{"t":"gap","q":"___ time I see him, he looks tired.","key":["Whenever"],"why":"Using 'whenever' for time emphasis (similar structure to wherever/whatever)."},{"t":"fa","q":"هر جا که نگاه کردم، هیچکس نبود.","key":["Wherever I looked, there was no one."],"why":"Translating place emphasis using 'wherever'."},{"t":"fix","q":"In the box were the toys.","key":["In the box were the toys."],"why":"Fronting for focus: 'In the box' is emphasized, and end-weight is maintained with 'the toys'."}]},{"id":"t33","t":"Inversion","tf":"وارونگی","parts":[{"lv":"A","title":"Inversion","exp":[{"h":"Main Rule: Inversion with Negative Adverbs","b":"When a sentence starts with negative adverbs like never or rarely, the word order changes to add emphasis. The auxiliary verb moves before the subject, creating a structure common in formal and literary English that conveys seriousness and weight.","hf":"قانون اصلی: وارونه‌سازی با قیود منفی","bf":"وقتی جمله با قیودی مانند never یا rarely شروع می‌شود، برای تأکید بیشتر، ساختار جمله تغییر می‌کند و فعل کمکی قبل از فاعد می‌آید. این ساختار در انگلیسی رسمی و ادبی بسیار رایج است و حس جدیت و تأکید را منتقل می‌کند.","ex":[{"e":"Never have I seen such a beautiful sunset.","p":"من هرگز غروب آفتاب این‌قدر زیبا را ندیده‌ام."},{"e":"Rarely does he arrive on time.","p":"او به ندرت سر وقت می‌رسد."}]},{"h":"Structure: No sooner... than","b":"This phrase is used to show two consecutive events, meaning one happened immediately after the other. Inversion occurs here as well, and the word than appears at the end of the second part of the sentence.","hf":"ساختار No sooner... than","bf":"این عبارت برای بیان دو رویداد متوالی استفاده می‌شود؛ یعنی به محض وقوع رویداد اول، رویداد دوم رخ می‌دهد. در این ساختار نیز وارونه‌سازی رخ می‌دهد و کلمه than در انتهای جمله دوم می‌آید.","ex":[{"e":"No sooner had I sat down than the phone rang.","p":"به محض اینکه نشستم، تلفن زنگ خورد."},{"e":"No sooner did she leave than it started raining.","p":"به محض اینکه او رفت، باران شروع به باریدن کرد."}]},{"h":"Structure: Not only... but also","b":"When Not only begins the sentence, it emphasizes the first of two features or events and is usually paired with but also. In this case, the auxiliary verb also comes before the subject to maintain the inverted structure.","hf":"ساختار Not only... but also","bf":"وقتی Not only در ابتدای جمله می‌آید، برای تأکید بر اولین بخش از دو ویژگی یا رویداد استفاده می‌شود و معمولاً با but also همراه است. در این حالت نیز فعل کمکی قبل از فاعد قرار می‌گیرد.","ex":[{"e":"Not only did he forget the keys, but he also lost his wallet.","p":"او نه تنها کلیدها را فراموش کرد، بلکه کیف پولش را هم گم کرد."},{"e":"Not only is she smart, but she is also hardworking.","p":"او نه تنها باهوش است، بلکه سخت‌کوش هم هست."}]}],"tip":"Remember that after these adverbs, the subject and auxiliary verb swap places, and the main verb returns to its base or past perfect form.","tipf":"به یاد داشته باشید که پس از این قیود، فاعد و فعل کمکی جابجا می‌شوند و فعل اصلی به حالت ساده یا گذشته کامل برمی‌گردد.","bad":[{"b":"Never I have seen this movie.","g":"Never have I seen this movie.","w":"Here, the auxiliary verb (have) must come before the subject (I).","wf":"در اینجا باید فعل کمکی (have) قبل از فاعد (I) بیاید."},{"b":"No sooner I arrived than the meeting started.","g":"No sooner had I arrived than the meeting started.","w":"The correct structure requires inversion and the use of the appropriate auxiliary verb.","wf":"ساختار صحیح نیاز به وارونه‌سازی و استفاده از فعل کمکی مناسب دارد."},{"b":"Not only he is late, but also he is rude.","g":"Not only is he late, but also he is rude.","w":"After Not only at the start of the sentence, the verb (is) must come before the subject (he).","wf":"بعد از Not only در ابتدای جمله، فعل (is) باید قبل از فاعد (he) بیاید."}],"gold":[{"e":"Always invert the subject and auxiliary verb after negative adverbs at the start of a sentence.","f":"همیشه بعد از قیود منفی در ابتدای جمله، فاعد و فعل کمکی را جابجا کنید."},{"e":"Use the past perfect tense with no sooner to show the first event happened just before the second.","f":"برای نشان دادن اینکه رویداد اول درست قبل از رویداد دوم رخ داده، از زمان گذشته کامل با no sooner استفاده کنید."},{"e":"Ensure the verb agrees with the subject immediately following the inverted auxiliary.","f":"مطم��ن شوید که فعل با فاعدی که بلافاصله بعد از فعل کمکی وارونه شده آمده، مطابقت دارد."}]},{"lv":"A","title":"Negative inversion: never have I / no sooner had …","exp":[{"h":"Understanding Negative Inversion","b":"In English, we can put a negative adverb at the beginning of a sentence to add emphasis. When we do this, the subject and auxiliary verb swap places, creating an inverted structure. This is common in formal writing and speech to highlight a strong feeling or situation.","hf":"درک وارونگی منفی","bf":"در انگلیسی، می‌توانیم یک قید منفی را در ابتدای جمله قرار دهیم تا تأکید بیشتری ایجاد کنیم. وقتی این کار را می‌کنیم، فاعل و فعل کمکی جایشان را عوض می‌کنند و ساختاری وارونه می‌سازند. این ساختار در نوشتار و گفتار رسمی رایج است تا یک احساس یا وضعیت قوی را برجسته کند.","ex":[{"e":"Never have I seen such a beautiful sunset.","p":"من هرگز غروب آفتابی به این زیبایی ندیده‌ام."},{"e":"Rarely does he arrive on time.","p":"او به ندرت سر وقت می‌رسد."}]},{"h":"Using 'No Sooner... Than'","b":"The phrase 'no sooner' is used to show that one event happened immediately after another. It is always followed by 'than' and requires inversion. Remember to use the past perfect tense with 'had' after 'no sooner'.","hf":"استفاده از 'no sooner... than'","bf":"عبارت 'no sooner' برای نشان دادن این استفاده می‌شود که یک رویداد بلافاصله پس از رویداد دیگری رخ داده است. این عبارت همیشه با 'than' دنبال می‌شود و نیاز به وارونگی دارد. به یاد داشته باشید که بعد از 'no sooner' باید از زمان گذشته کامل با 'had' استفاده کنید.","ex":[{"e":"No sooner had she left than it started raining.","p":"به محض اینکه او رفت، باران شروع به باریدن کرد."},{"e":"No sooner had we sat down than the phone rang.","p":"به محض اینکه نشستیم، تلفن زنگ خورد."}]},{"h":"Common Negative Adverbs for Inversion","b":"Besides 'never' and 'no sooner', other adverbs like 'seldom', 'hardly', and 'not only' can trigger inversion. These structures make your English sound more sophisticated and native-like. Practice using them to vary your sentence structure.","hf":"قیدهای منفی رایج برای وارونگی","bf":"علاوه بر 'never' و 'no sooner'، قیدهای دیگری مانند 'seldom'، 'hardly' و 'not only' می‌توانند وارونگی را ایجاد کنند. این ساختارها انگلیسی شما را پیشرفته‌تر و طبیعی‌تر نشان می‌دهند. با استفاده از آن‌ها برای تغییر ساختار جمله تمرین کنید.","ex":[{"e":"Seldom do we see such talent.","p":"ما به ندرت چنین استعدادی می‌بینیم."},{"e":"Not only did he forget, but he also lied.","p":"او نه تنها فراموش کرد، بلکه دروغ هم گفت."}]}],"tip":"Always check if the main verb needs an auxiliary verb (do/does/did/had/have) for inversion. If there is no auxiliary, add 'did' for past simple or 'do/does' for present simple.","tipf":"همیشه بررسی کنید که آیا فعل اصلی برای وارونگی به فعل کمکی (do/does/did/had/have) نیاز دارد یا خیر. اگر فعل کمکی وجود ندارد، برای گذشته ساده 'did' و برای حال ساده 'do/does' اضافه کنید.","bad":[{"b":"Never I have seen this movie.","g":"Never have I seen this movie.","w":"Inversion is required after the negative adverb. The subject 'I' and auxiliary 'have' must swap places.","wf":"پس از قید منفی وارونگی لازم است. فاعل 'I' و فعل کمکی 'have' باید جایشان را عوض کنند."},{"b":"No sooner I arrived than the meeting started.","g":"No sooner had I arrived than the meeting started.","w":"The structure 'no sooner' requires the past perfect tense ('had arrived') and inversion of the subject and auxiliary verb.","wf":"ساختار 'no sooner' نیاز به زمان گذشته کامل ('had arrived') و وارونگی فاعل و فعل کمکی دارد."},{"b":"Rarely he goes to the gym.","g":"Rarely does he go to the gym.","w":"When starting with 'rarely', you need to add the auxiliary 'does' and invert it with the subject for present simple tense.","wf":"وقتی با 'rarely' شروع می‌کنید، باید فعل کمکی 'does' را اضافه کنید و آن را با فاعل برای زمان حال ساده وارونه کنید."}],"gold":[{"e":"Negative inversion places the negative adverb first, followed by the auxiliary verb and then the subject.","f":"وارونگی منفی قید منفی را در ابتدا قرار می‌دهد، سپس فعل کمکی و در نهایت فاعل."},{"e":"Use 'no sooner... than' to link two past events where the second happened immediately after the first.","f":"از 'no sooner... than' برای پیوند دادن دو رویداد گذشته استفاده کنید که رویداد دوم بلافاصله پس از اولی رخ داده است."},{"e":"Ensure the verb tense matches the context: use past perfect with 'no sooner' and appropriate auxiliaries with other negative adverbs.","f":"مطمئن شوید که زمان فعل با زمینه مطابقت دارد: با 'no sooner' از گذشته کامل و با سایر قیدهای منفی از افعال کمکی مناسب استفاده کنید."}]}],"ex":[{"t":"gap","q":"___ had I arrived home than the phone rang.","key":["No"],"why":"The structure 'No sooner' is used to show that one event happened immediately after another."},{"t":"gap","q":"Not only ___ she sing, but she also dances well.","key":["did"],"why":"Inversion is required after 'Not only' when it begins the clause, using auxiliary 'did' for past simple."},{"t":"fix","q":"Never I have seen such a beautiful sunset.","key":["Never have I seen such a beautiful sunset."],"why":"Negative adverbs like 'Never' at the start of a sentence trigger subject-auxiliary inversion."},{"t":"gap","q":"Seldom ___ we see such talented actors.","key":["do"],"why":"'Seldom' is a negative adverb requiring inversion with the auxiliary 'do' in the present simple."},{"t":"fa","q":"او نه تنها باهوش است، بلکه بسیار مهربان نیز هست.","key":["Not only is he intelligent, but he is also very kind."],"why":"This uses the 'Not only... but also' structure with inversion in the first clause."},{"t":"gap","q":"Hardly ___ she finished her speech when the audience started applauding.","key":["had"],"why":"The structure 'Hardly... when' requires the past perfect 'had' in the inverted clause."},{"t":"fix","q":"Little did he know that he was being watched.","key":["Little did he know that he was being watched."],"why":"The sentence is already correct; 'Little' at the start triggers inversion with 'did'."},{"t":"gap","q":"Under the tree ___ sat a old man.","key":["there"],"why":"Inversion is used after place adverbials like 'Under the tree' for stylistic effect."},{"t":"fa","q":"او هرگز در زندگی‌اش چنین چیزی را ندیده بود.","key":["Never had he seen such a thing in his life."],"why":"'Never' at the beginning triggers inversion, and the past perfect 'had seen' is used for the past context."},{"t":"gap","q":"Not only ___ he fail the exam, but he also lost his job.","key":["did"],"why":"Inversion is needed after 'Not only' in the past simple tense using the auxiliary 'did'."},{"t":"fix","q":"No sooner did he leave than it started raining.","key":["No sooner did he leave than it started raining."],"why":"The sentence is correct; 'No sooner' is followed by inversion and 'than' connects the clauses."},{"t":"fa","q":"او نه تنها خواند، بلکه نوشت نیز.","key":["Not only did he read, but he also wrote."],"why":"This combines 'Not only... but also' with inversion in the first clause using 'did'."},{"t":"gap","q":"Not only ___ he arrive late, but he also forgot his keys.","key":["did"],"why":"Negative inversion with 'Not only' requires auxiliary 'did' for past simple."},{"t":"gap","q":"Never ___ I seen such a magnificent view.","key":["have"],"why":"Inversion with 'Never' requires the auxiliary 'have' for present perfect."},{"t":"fix","q":"Rarely we visit the museum on weekends.","key":["Rarely do we visit the museum on weekends."],"why":"Fronting a negative adve
